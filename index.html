<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Denizalp Aybak — Photography</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;

    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    cursor: pointer;
}


/* =========================
   LEFT INFORMATION
   ========================= */

.info {
    position: fixed;

    top: 32px;
    left: 48px;

    z-index: 10;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;
}


/* =========================
   LOGO
   ========================= */

.logo {
    position: relative;
    display: block;

    width: 190px;
    height: 52px;

    margin: 0;
    padding: 0;

    color: inherit;
    text-decoration: none;

    cursor: pointer;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    font-size: 15px;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    font-size: 15px;

    white-space: nowrap;
}

.logo-aybak span {
    display: inline;
}


/* =========================
   CONTACT / SOCIAL
   ========================= */

.contact {
    margin: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =========================
   SECTION SWITCH
   ========================= */

.section-switch {
    position: fixed;

    top: 32px;
    right: 48px;

    z-index: 20;

    color: #000;
    text-decoration: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    line-height: 1.15;

    white-space: nowrap;
}


/* =========================
   SLIDESHOW
   ========================= */

#slideshow {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.slide {
    position: absolute;

    width: auto;
    height: auto;

    max-width: 70vw;
    max-height: 80vh;

    object-fit: contain;

    opacity: 0;
}

.slide.active {
    opacity: 1;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-name {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;

        font-size: 13px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }

    #slideshow {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }

    .slide {
        max-width: 84vw;
        max-height: calc(100% - 8px);
    }

}


/* =========================
   SHORT LANDSCAPE
   ========================= */

@media
    (orientation: landscape)
    and (max-height: 700px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-name,
    .logo-aybak {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }

    #slideshow {
        inset: 0;

        left: 190px;

        width:
            calc(
                100vw -
                214px
            );

        height: 100vh;
    }

    .slide {
        max-width: 66vw;
        max-height: 68vh;
    }

}

</style>

</head>


<body>


<div
    class="info"
    id="info"
>

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span
            class="logo-name"
            id="logo-name"
        >
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<a
    class="section-switch"
    id="section-switch"
    href="https://film.denizalpaybak.com/"
>
    <span id="section-switch-text">film</span>
</a>


<div id="slideshow"></div>


<script>


/* =====================================================
   GLOBAL WORD TIMING
   ===================================================== */

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   SETTINGS
   ===================================================== */

const GITHUB_USERNAME =
    "denizalpaybak";

const GITHUB_REPOSITORY =
    "aybak-photography";

const GITHUB_BRANCH =
    "main";

const GITHUB_FOLDER =
    "";


/* =====================================================
   ELEMENTS / STATE
   ===================================================== */

const slideshow =
    document.getElementById(
        "slideshow"
    );

const info =
    document.getElementById(
        "info"
    );

let slides =
    [];

let current =
    0;

let manualMode =
    false;


/* =====================================================
   LOAD PHOTOS
   ===================================================== */

async function loadPhotos() {

    try {

        const apiUrl =
            `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPOSITORY}/contents/${GITHUB_FOLDER}`;


        const response =
            await fetch(
                apiUrl
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "GitHub repository could not be accessed."
            );

        }


        const files =
            await response.json();


        const photos =
            files
            .filter(
                file =>
                    file.type ===
                    "file" &&
                    /^\d+\.jpg$/i
                        .test(
                            file.name
                        )
            )
            .sort(
                (a, b) => {

                    const numberA =
                        parseInt(
                            a.name.replace(
                                /\.jpg$/i,
                                ""
                            ),
                            10
                        );

                    const numberB =
                        parseInt(
                            b.name.replace(
                                /\.jpg$/i,
                                ""
                            ),
                            10
                        );

                    return (
                        numberB -
                        numberA
                    );

                }
            );


        photos.forEach(
            (file, index) => {

                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "slide";


                img.src =
                    `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPOSITORY}/${GITHUB_BRANCH}/${file.name}`;


                img.alt =
                    "";


                if (
                    index ===
                    0
                ) {

                    img.classList
                        .add(
                            "active"
                        );

                }


                slideshow
                    .appendChild(
                        img
                    );

            }
        );


        slides =
            document
                .querySelectorAll(
                    ".slide"
                );


        current =
            0;


        updateMobileSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


loadPhotos();


/* =====================================================
   NEXT / PREVIOUS
   ===================================================== */

function nextSlide() {

    if (
        slides.length <=
        1
    ) {

        return;

    }


    slides[current]
        .classList
        .remove(
            "active"
        );


    current =
        (
            current + 1
        ) %
        slides.length;


    slides[current]
        .classList
        .add(
            "active"
        );

}


function previousSlide() {

    if (
        slides.length <=
        1
    ) {

        return;

    }


    slides[current]
        .classList
        .remove(
            "active"
        );


    current =
        (
            current - 1 +
            slides.length
        ) %
        slides.length;


    slides[current]
        .classList
        .add(
            "active"
        );

}


/* =====================================================
   AUTO
   ===================================================== */

setInterval(
    () => {

        if (
            !manualMode
        ) {

            nextSlide();

        }

    },
    3000
);


/* =====================================================
   CLICK NAVIGATION
   ===================================================== */

document.body
    .addEventListener(
        "click",
        event => {

            if (
                event.target.closest(
                    "a"
                )
            ) {

                return;

            }


            if (
                !manualMode
            ) {

                manualMode =
                    true;

                return;

            }


            const percentage =
                event.clientX /
                window.innerWidth;


            if (
                percentage <
                0.25
            ) {

                previousSlide();

            }

            else {

                nextSlide();

            }

        }
    );


/* =====================================================
   MOBILE POSITION
   ===================================================== */

function updateMobileSlideshow() {

    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";

        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";

        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const gapAfterInfo =
        24;

    const bottomGap =
        20;


    let viewportTop =
        0;

    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;

        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    const stageHeight =
        Math.max(
            120,
            stageBottom -
            stageTop
        );


    slideshow.style.top =
        `${stageTop}px`;

    slideshow.style.height =
        `${stageHeight}px`;

    slideshow.style.bottom =
        "auto";

}


window.addEventListener(
    "resize",
    updateMobileSlideshow
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updateMobileSlideshow,
            150
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            updateMobileSlideshow
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileSlideshow
        );

}


window.addEventListener(
    "load",
    () => {

        updateMobileSlideshow();


        setTimeout(
            updateMobileSlideshow,
            100
        );


        setTimeout(
            updateMobileSlideshow,
            400
        );


        setTimeout(
            updateMobileSlideshow,
            1000
        );

    }
);


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );

const logoName =
    document.getElementById(
        "logo-name"
    );

const letters = [
    document.getElementById("letter-a"),
    document.getElementById("letter-y"),
    document.getElementById("letter-b"),
    document.getElementById("letter-a2"),
    document.getElementById("letter-k")
];

const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];

const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];

let logoState =
    0;

let logoTarget =
    0;

let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        letters[i]
            .textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;

        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                0
            );

        }

    }
);


/* =========================
   MOBILE LOGO
   ========================= */

function mobileLogoCycle() {

    setTimeout(
        () => {

            animateTo(
                5
            );


            setTimeout(
                () => {

                    animateTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   SECTION SWITCH
   Exact 600ms full transition
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );

const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );

const switchWord =
    "film";

let switchState =
    0;

let switchAnimationFrame =
    null;


/* =========================
   RENDER SWITCH
   ========================= */

function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i < switchWord.length;
        i++
    ) {

        result +=
            i < upperCount
                ? switchWord[i]
                    .toUpperCase()
                : switchWord[i]
                    .toLowerCase();

    }


    sectionSwitchText.textContent =
        result;

}


/* =========================
   MORPH SWITCH
   ========================= */

function morphSwitchTo(
    target
) {

    if (
        switchAnimationFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchAnimationFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const startTime =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    startTime
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchAnimationFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchAnimationFrame =
                null;

        }

    }


    switchAnimationFrame =
        requestAnimationFrame(
            frame
        );

}


/* =========================
   DESKTOP SWITCH
   ========================= */

sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


renderSwitch(
    0
);


updateMobileSlideshow();

</script>

</body>
</html>
