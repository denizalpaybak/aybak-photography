<html lang="en">
<head>

<title>Denizalp Aybak — Photography</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;

    /*
        Desktop image may use considerably
        more screen space than before.
    */
    --image-max-width: 64vw;
    --image-max-height: 74vh;

    /*
        This zone determines metadata Y.

        Actual photograph may be shorter,
        but metadata Y NEVER follows it.
    */
    --visual-height: 74vh;

    --meta-top-gap: 9px;

    --index-content-top: 130px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   FILM
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT STAGE
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}


/* =====================================================
   PROJECT BLOCK

   Full stage dimensions.

   This lets metadata use an absolute,
   fixed Y while its X can follow the
   actual photograph.
   ===================================================== */

#project-block {
    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =====================================================
   VISUAL ZONE
   ===================================================== */

#visual-zone {
    position: absolute;

    top: 50%;
    left: 0;

    width: 100%;
    height: var(--visual-height);

    transform: translateY(-50%);

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   SINGLE IMAGE
   ===================================================== */

#spread {
    display: flex;

    align-items: center;
    justify-content: center;

    width: auto;
    height: auto;

    pointer-events: none;
}

.image-cell {
    display: flex;

    align-items: center;
    justify-content: center;

    width: auto;
    height: auto;

    pointer-events: none;
}

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: var(--image-max-width);
    max-height: var(--image-max-height);

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PROJECT META

   TOP NEVER changes in JS.

   JS changes only:
   left
   width

   based on actual rendered photograph.
   ===================================================== */

#project-meta {
    position: absolute;

    top:
        calc(
            50% +
            var(--visual-height) / 2 +
            var(--meta-top-gap)
        );

    left: 50%;

    width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}


/* =====================================================
   META LEFT
   ===================================================== */

#project-title {
    grid-column: 1;
    grid-row: 1;

    text-align: left;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    text-align: left;

    white-space: nowrap;
}


/* =====================================================
   COUNTER
   ===================================================== */

#project-counter {
    grid-column: 2;
    grid-row: 1;

    display: flex;

    justify-content: flex-end;
    align-items: baseline;

    padding-left: 28px;

    text-align: right;

    white-space: nowrap;
}


/*
    Character spans are inline.

    Digits use a fixed two-character region
    so counter width never jumps.
*/

.counter-current {
    display: inline-flex;

    justify-content: flex-end;

    min-width: 2ch;
}

.counter-separator,
.counter-total {
    display: inline-block;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    font: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/*
    In VIEW ALL mode the same button
    occupies the upper-right slot.
*/

body.project-all-mode
#view-all-button {
    grid-column: 2;
    grid-row: 1;
}


/* =====================================================
   PROJECT ALL VIEW
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    pointer-events: auto;

    overflow: hidden;
}

body.project-all-mode
#project-all-view {
    display: block;
}


/* =====================================================
   HIDE SINGLE IMAGE IN VIEW ALL
   ===================================================== */

body.project-all-mode
#spread {
    visibility: hidden;
}


/* =====================================================
   PROJECT ALL GRID
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 10px;
}


/* =====================================================
   VIEW ALL THUMB
   ===================================================== */

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform: translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font: inherit;

    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   HORIZONTAL INDEX
   ===================================================== */

#index-scroller {
    position: absolute;

    top: var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            52px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    cursor: grab;

    user-select: none;

    outline: none;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: flex-start;

    gap: 44px;

    width: max-content;

    padding-left: var(--side);
    padding-right: var(--side);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex:
        0
        0
        210px;

    display: flex;
    flex-direction: column;

    width: 210px;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    font: inherit;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX IMAGE — NO CROP
   ===================================================== */

.card-image-wrap {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 280px;
}

.project-card img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    width: 100%;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode
#project-stage {
    visibility: hidden;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 18px;

        --meta-gap: 5px;

        /*
            EXACT alignment:

            left image edge = Denizalp left
            right image edge = film right
        */
        --image-max-width:
            calc(
                100vw -
                var(--side) * 2
            );

        --image-max-height: none;

        --visual-height:
            calc(
                100% -
                48px
            );

        --meta-top-gap: 7px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-aybak {
        top: 15px;
    }


    /* =================================================
       MOBILE STAGE
       ================================================= */

    #project-stage {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }


    #visual-zone {
        top: 0;

        height:
            calc(
                100% -
                48px
            );

        transform: none;
    }


    /*
        Force exact desired mobile width.
    */

    .spread-image {
        width:
            calc(
                100vw -
                var(--side) * 2
            );

        max-width:
            calc(
                100vw -
                var(--side) * 2
            );

        height: auto;

        max-height: none;
    }


    /*
        Fixed metadata Y.
        X is still synced to actual image.
    */

    #project-meta {
        top:
            calc(
                100% -
                48px +
                var(--meta-top-gap)
            );
    }


    #project-counter {
        padding-left: 18px;
    }


    /* =================================================
       VIEW ALL
       ================================================= */

    #project-all-grid {
        gap: 6px;
    }


    /* =================================================
       INDEX
       ================================================= */

    #index-scroller {
        bottom:
            calc(
                50px +
                env(safe-area-inset-bottom)
            );
    }


    #index-grid {
        gap: 30px;
    }


    .project-card {
        flex:
            0
            0
            48vw;

        width: 48vw;
    }


    .card-image-wrap {
        height: 56vw;
    }

}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (max-width: 1100px)
    and (min-width: 601px) {

    :root {

        --image-max-width: 66vw;
        --image-max-height: 72vh;

    }

}


/* =====================================================
   SHORT LANDSCAPE
   ===================================================== */

@media
    (orientation: landscape)
    and (max-height: 700px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 16px;

        --meta-gap: 5px;

        --image-max-width: 62vw;
        --image-max-height: 66vh;

        --visual-height: 66vh;

        --meta-top-gap: 7px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-aybak {
        top: 15px;
    }

}

<script>


/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";


const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;


/*
    Character morph.
*/

const CHARACTER_MORPH_DURATION =
    260;


/*
    Case morph.
*/

const CASE_MORPH_DURATION =
    390;


/*
    Navigation.
*/

const INDEX_TRANSITION_DURATION =
    400;


const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   INDEX CONTROLS
   ===================================================== */

const INDEX_WHEEL_MULTIPLIER =
    1;


const INDEX_KEY_STEP =
    240;


/* =====================================================
   ELEMENTS
   ===================================================== */

const body =
    document.body;


const info =
    document.getElementById(
        "info"
    );


const projectStage =
    document.getElementById(
        "project-stage"
    );


const projectBlock =
    document.getElementById(
        "project-block"
    );


const visualZone =
    document.getElementById(
        "visual-zone"
    );


const spread =
    document.getElementById(
        "spread"
    );


const projectMeta =
    document.getElementById(
        "project-meta"
    );


const projectTitle =
    document.getElementById(
        "project-title"
    );


const projectDate =
    document.getElementById(
        "project-date"
    );


const counterCurrent =
    document.getElementById(
        "counter-current"
    );


const counterTotal =
    document.getElementById(
        "counter-total"
    );


const viewAllButton =
    document.getElementById(
        "view-all-button"
    );


const projectAllView =
    document.getElementById(
        "project-all-view"
    );


const projectAllGrid =
    document.getElementById(
        "project-all-grid"
    );


const indexButton =
    document.getElementById(
        "index-button"
    );


const indexView =
    document.getElementById(
        "index-view"
    );


const indexScroller =
    document.getElementById(
        "index-scroller"
    );


const indexGrid =
    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];


let projectIndex =
    0;


let frameIndex =
    0;


let renderedProjectIndex =
    null;


let manualMode =
    false;


let indexMode =
    false;


let projectAllMode =
    false;


let slideTimer =
    null;


let interfaceAnimating =
    false;


let navigationAnimating =
    false;


let projectViewAnimating =
    false;


let autoplayBeforeIndex =
    false;


let autoplayBeforeProjectAll =
    false;


let savedIndexScrollLeft =
    0;


/*
    View all hover state.
*/

let viewAllHovered =
    false;


/* =====================================================
   INDEX DRAG
   ===================================================== */

let indexDragging =
    false;


let indexDragStartX =
    0;


let indexDragStartScroll =
    0;


let indexDragMoved =
    false;


/* =====================================================
   SLIDE TOUCH
   ===================================================== */

let touchStartX =
    null;


let touchStartY =
    null;


let suppressClickUntil =
    0;


/* =====================================================
   CACHE
   ===================================================== */

const imageCache =
    new Map();


/* =====================================================
   URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   PRELOAD
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   COUNTER TEXT
   ===================================================== */

function getCurrentText(
    index
) {

    return String(
        index + 1
    ).padStart(
        2,
        "0"
    );

}


function getTotalText(
    total
) {

    return String(
        total
    ).padStart(
        2,
        "0"
    );

}


/* =====================================================
   HEADER MEASUREMENT
   ===================================================== */

function updateIndexContentTop() {

    const rect =
        info.getBoundingClientRect();


    const gap =
        window.innerWidth <= 600
            ? 30
            : 34;


    document
        .documentElement
        .style
        .setProperty(
            "--index-content-top",
            `${Math.ceil(
                rect.bottom +
                gap
            )}px`
        );

}


/* =====================================================
   CHARACTER-LEVEL MORPH

   IMPORTANT:

   old: 01
   new: 02

   position 0:
   0 === 0
   -> untouched

   position 1:
   1 !== 2
   -> only this character changes

   Same principle for project title/date.
   ===================================================== */

function morphCharacters(
    element,
    nextText,
    duration =
        CHARACTER_MORPH_DURATION
) {

    const oldText =
        element.textContent;


    if (
        oldText ===
        nextText
    ) {

        return Promise.resolve();

    }


    /*
        Keep element width stable for duration
        so neighbouring UI does not jitter.
    */

    const oldWidth =
        element.getBoundingClientRect().width;


    if (
        oldWidth > 0
    ) {

        element.style.minWidth =
            `${oldWidth}px`;

    }


    const maxLength =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText.padEnd(
            maxLength,
            " "
        ).split(
            ""
        );


    const to =
        nextText.padEnd(
            maxLength,
            " "
        ).split(
            ""
        );


    const changingPositions =
        [];


    for (
        let i = 0;
        i < maxLength;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changingPositions.push(
                i
            );

        }

    }


    if (
        changingPositions.length === 0
    ) {

        element.textContent =
            nextText;


        element.style.minWidth =
            "";


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const current =
                    from.slice();


                /*
                    Different positions transform
                    at slightly staggered moments.

                    Identical positions never change.
                */

                changingPositions
                    .forEach(
                        (
                            position,
                            order
                        ) => {

                            const localDelay =
                                (
                                    order /
                                    Math.max(
                                        1,
                                        changingPositions.length
                                    )
                                ) *
                                0.28;


                            const localProgress =
                                Math.max(
                                    0,
                                    Math.min(
                                        1,
                                        (
                                            progress -
                                            localDelay
                                        ) /
                                        (
                                            1 -
                                            localDelay
                                        )
                                    )
                                );


                            if (
                                localProgress <
                                0.5
                            ) {

                                current[
                                    position
                                ] =
                                    from[
                                        position
                                    ];

                            }

                            else {

                                current[
                                    position
                                ] =
                                    to[
                                        position
                                    ];

                            }

                        }
                    );


                element.textContent =
                    current
                        .join(
                            ""
                        )
                        .replace(
                            /\s+$/,
                            ""
                        );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        nextText;


                    element.style.minWidth =
                        "";


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   CASE MORPH

   view all:
   vogue -> VOGUE

   No deletion.
   Only capitalization changes.
   ===================================================== */

function morphCase(
    element,
    targetUpper
) {

    const source =
        element.textContent;


    const base =
        source.toLowerCase();


    const target =
        targetUpper
            ? source.toUpperCase()
            : source.toLowerCase();


    if (
        source ===
        target
    ) {

        return Promise.resolve();

    }


    const positions =
        [];


    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        if (
            source[i] !==
            target[i]
        ) {

            positions.push(
                i
            );

        }

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        CASE_MORPH_DURATION
                    );


                const count =
                    Math.round(
                        positions.length *
                        progress
                    );


                const chars =
                    source.split(
                        ""
                    );


                for (
                    let i = 0;
                    i < count;
                    i++
                ) {

                    const position =
                        positions[
                            targetUpper
                                ? i
                                : positions.length -
                                    1 -
                                    i
                        ];


                    chars[
                        position
                    ] =
                        target[
                            position
                        ];

                }


                element.textContent =
                    chars.join(
                        ""
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        target;


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

/* =====================================================
   PROJECT META UPDATE
   ===================================================== */

async function updateMetadata(
    targetProjectIndex,
    targetFrameIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    const animations =
        [];


    /*
        CURRENT:
        always compare character-by-character.
    */

    animations.push(

        morphCharacters(
            counterCurrent,
            getCurrentText(
                targetFrameIndex
            )
        )

    );


    /*
        TOTAL:
        only project change can alter it.
    */

    if (
        projectChanged
    ) {

        animations.push(

            morphCharacters(
                counterTotal,
                getTotalText(
                    project.images.length
                )
            )

        );


        /*
            Project title/date also morph
            by position.

            Identical characters stay untouched.
        */

        animations.push(

            morphCharacters(
                projectTitle,
                project.title.toLowerCase()
            ),

            morphCharacters(
                projectDate,
                (
                    project.date ||
                    ""
                ).toLowerCase()
            )

        );

    }


    await Promise.all(
        animations
    );


    renderedProjectIndex =
        targetProjectIndex;

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    if (
        projects.length === 0
    ) {

        return;

    }


    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            frameIndex +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex +
                1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW FRAME
   ===================================================== */

async function showFrame(
    targetProjectIndex,
    targetFrameIndex
) {

    if (
        navigationAnimating
    ) {

        return false;

    }


    navigationAnimating =
        true;


    const normalizedProject =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalizedProject
        ];


    const normalizedFrame =
        Math.max(
            0,
            Math.min(
                targetFrameIndex,
                project.images.length -
                1
            )
        );


    try {

        const loadedImage =
            await preloadImage(
                project.images[
                    normalizedFrame
                ]
            );


        /*
            Update state first.
        */

        projectIndex =
            normalizedProject;


        frameIndex =
            normalizedFrame;


        renderImage(
            loadedImage
        );


        /*
            Actual image width may change.
        */

        syncMetadataAfterRender();


        await updateMetadata(
            normalizedProject,
            normalizedFrame
        );


        preloadAhead();


        navigationAnimating =
            false;


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        navigationAnimating =
            false;


        return false;

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    if (
        frameIndex <
        project.images.length -
        1
    ) {

        return showFrame(
            projectIndex,
            frameIndex +
            1
        );

    }


    return showFrame(
        projectIndex +
        1,
        0
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    if (
        frameIndex >
        0
    ) {

        return showFrame(
            projectIndex,
            frameIndex -
            1
        );

    }


    const previousProjectIndex =
        normalizeProjectIndex(
            projectIndex -
            1
        );


    const previousProject =
        projects[
            previousProjectIndex
        ];


    return showFrame(
        previousProjectIndex,
        previousProject.images.length -
        1
    );

}

/* =====================================================
   VIEW ALL BOUNDS

   Horizontal:
   Denizalp left -> film right.

   Vertical:
   below info
   ->
   safely ABOVE project metadata.
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 24;


    const topGap =
        window.innerWidth <= 600
            ? 24
            : 28;


    const bottomGap =
        window.innerWidth <= 600
            ? 18
            : 24;


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.max(
            top +
            80,
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL GRID LAYOUT
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const gap =
        window.innerWidth <= 600
            ? 6
            : 10;


    let best =
        {

            columns:
                1,

            rows:
                count,

            score:
                0

        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns -
                1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows -
                1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        /*
            Reward layouts that create large,
            reasonably balanced cells.
        */

        const score =
            Math.min(
                cellWidth,
                cellHeight *
                1.2
            );


        if (
            score >
            best.score
        ) {

            best =
                {

                    columns,
                    rows,
                    score

                };

        }

    }


    return best;

}


/* =====================================================
   APPLY VIEW ALL GRID
   ===================================================== */

function layoutProjectAllGrid() {

    if (
        !projectAllMode
    ) {

        return;

    }


    syncProjectAllBounds();


    const project =
        currentProject();


    const layout =
        calculateProjectAllLayout(
            project.images.length
        );


    projectAllGrid.style.gridTemplateColumns =
        `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style.gridTemplateRows =
        `repeat(${layout.rows}, minmax(0, 1fr))`;

}

/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,
                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                if (
                    dateA >
                    dateB
                ) {

                    return -1;

                }


                if (
                    dateA <
                    dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}

/* =====================================================
   GENERIC CASE WORD
   ===================================================== */

function renderWordCase(
    word,
    upperCount
) {

    let result =
        "";


    for (
        let i = 0;
        i <
        word.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? word[i].toUpperCase()
                : word[i];

    }


    return result;

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(
    upperCount
) {

    indexWordState =
        upperCount;


    indexButton.textContent =
        renderWordCase(
            indexWord,
            upperCount
        );

}


function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance === 0
    ) {

        return Promise.resolve();

    }


    const duration =
        INDEX_TRANSITION_DURATION *
        (
            distance /
            indexWord.length
        );


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const value =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    value
                );


                if (
                    progress <
                    1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


/* =====================================================
   INDEX HOVER
   ===================================================== */

indexButton.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth <= 600
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? 0
                : indexWord.length
        );

    }
);


indexButton.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth <= 600
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? indexWord.length
                : 0
        );

    }
);


/* =====================================================
   INDEX POSITION
   ===================================================== */

function saveIndexPosition() {

    savedIndexScrollLeft =
        indexScroller.scrollLeft;

}


function restoreIndexPosition() {

    requestAnimationFrame(
        () => {

            indexScroller.scrollLeft =
                savedIndexScrollLeft;

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating ||
        projectAllMode
    ) {

        return;

    }


    interfaceAnimating =
        true;


    autoplayBeforeIndex =
        !manualMode;


    clearTimeout(
        slideTimer
    );


    updateIndexContentTop();


    indexMode =
        true;


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    restoreIndexPosition();


    await morphIndexTo(
        indexWord.length
    );


    indexScroller.focus(
        {
            preventScroll:
                true
        }
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   RETURN INDEX
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    updateMobileStage();


    syncMetadataAfterRender();


    if (
        autoplayBeforeIndex
    ) {

        manualMode =
            false;


        scheduleNextSlide();

    }

    else {

        manualMode =
            true;

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    await showFrame(
        targetProjectIndex,
        0
    );


    updateMobileStage();


    syncMetadataAfterRender();


    manualMode =
        false;


    scheduleNextSlide();


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX CLICK
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();


        if (
            interfaceAnimating ||
            projectAllMode
        ) {

            return;

        }


        if (
            window.innerWidth >
            600 &&
            indexMode &&
            indexWordState !==
            0
        ) {

            return;

        }


        if (
            indexMode
        ) {

            await returnFromIndex();

        }

        else {

            await enterIndex();

        }

    }
);


/* =====================================================
   INDEX WHEEL
   ===================================================== */

indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode
        ) {

            return;

        }


        event.preventDefault();


        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=
            movement *
            INDEX_WHEEL_MULTIPLIER;

    },
    {
        passive: false
    }
);


/* =====================================================
   INDEX KEYBOARD
   ===================================================== */

indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {

                    left:
                        INDEX_KEY_STEP,

                    behavior:
                        "smooth"

                }
            );

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {

                    left:
                        -INDEX_KEY_STEP,

                    behavior:
                        "smooth"

                }
            );

        }

    }
);


/* =====================================================
   INDEX SCROLL SAVE
   ===================================================== */

indexScroller.addEventListener(
    "scroll",
    () => {

        if (
            indexMode
        ) {

            savedIndexScrollLeft =
                indexScroller.scrollLeft;

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   INDEX MOUSE DRAG
   ===================================================== */

indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !==
            0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );


        event.preventDefault();

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        if (
            Math.abs(
                delta
            ) >
            4
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


function endIndexDrag() {

    if (
        !indexDragging
    ) {

        return;

    }


    indexDragging =
        false;


    indexScroller.classList.remove(
        "dragging"
    );


    saveIndexPosition();


    if (
        indexDragMoved
    ) {

        setTimeout(
            () => {

                indexDragMoved =
                    false;

            },
            0
        );

    }

}


window.addEventListener(
    "mouseup",
    endIndexDrag
);


window.addEventListener(
    "blur",
    endIndexDrag
);


/* =====================================================
   SLIDESHOW CLICK
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #index-button, #view-all-button"
            )
        ) {

            return;

        }


        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        if (
            position <
            0.25
        ) {

            await previousFrame();

        }

        else {

            await nextFrame();

        }

    }
);


/* =====================================================
   GLOBAL KEYBOARD

   Desktop SPACE behaves like
   clicking the slideshow.
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await returnFromIndex();

            }


            return;

        }


        if (
            projectAllMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await exitProjectAll();

            }


            return;

        }


        if (
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        /*
            SPACE = main click behaviour.
        */

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            await performPrimarySlideAction();


            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousFrame();

        }


        else if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextFrame();

        }

    }
);


/* =====================================================
   MOBILE TOUCH
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating ||
            touchStartX === null ||
            touchStartY === null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) <
            45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX <
            0
        ) {

            await nextFrame();

        }

        else {

            await previousFrame();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   MOBILE STAGE
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";


        projectStage.style.height =
            "";


        projectStage.style.bottom =
            "";


        syncMetadataAfterRender();


        if (
            projectAllMode
        ) {

            layoutProjectAllGrid();

        }


        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const gapAfterInfo =
        30;


    const bottomGap =
        68;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            160,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";


    syncMetadataAfterRender();


    if (
        projectAllMode
    ) {

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    layoutProjectAllGrid
                );

            }
        );

    }

}


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters =
    [

        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )

    ];


const lowercase =
    [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


const uppercase =
    [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i <
        letters.length;
        i++
    ) {

        letters[
            i
        ].textContent =
            i <
            state
                ? uppercase[
                    i
                ]
                : lowercase[
                    i
                ];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


function mobileLogoCycle() {

    setTimeout(
        () => {

            animateLogoTo(
                5
            );


            setTimeout(
                () => {

                    animateLogoTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   FILM SWITCH
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchFrame =
    null;


function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    sectionSwitchText.textContent =
        renderWordCase(
            switchWord,
            upperCount
        );

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);

   RESIZE

window.addEventListener(

        updateIndexContentTop();


        updateMobileStage();

        ) {

                    );

            );

        }

    }
);

        setTimeout(
            () => {

                updateIndexContentTop();


                updateMobileStage();


                syncMetadataAfterRender();


                if (
                    projectAllMode
                ) {

                    layoutProjectAllGrid();

                }

            },
            250
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(

            () => {

                updateIndexContentTop();


                updateMobileStage();

            }
        );


    window
        .visualViewport
        .addEventListener(

        );

}


/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        const firstImage =
            await preloadImage(
                projects[
                    0
                ].images[
                    0
                ]
            );


        projectIndex =
            0;


        frameIndex =
            0;


        renderedProjectIndex =
            0;


        renderImage(
            firstImage
        );


        projectTitle.textContent =
            projects[
                0
            ].title.toLowerCase();


        projectDate.textContent =
            (
                projects[
                    0
                ].date ||
                ""
            ).toLowerCase();


        counterCurrent.textContent =
            getCurrentText(
                0
            );


        counterTotal.textContent =
            getTotalText(
                projects[
                    0
                ].images.length
            );


        viewAllButton.textContent =
            "view all";


        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        preloadAhead();


        updateIndexContentTop();


        updateMobileStage();


        syncMetadataAfterRender();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexWord(
    0
);


loadProjects();

</script>
