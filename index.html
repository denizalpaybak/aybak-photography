<!DOCTYPE html>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;
    overflow: hidden;

   CONTACT / SOCIAL
   ========================= */

    display: flex;
    flex-direction: column;
    gap: 0;

}

    text-decoration: underline;
}


/* =========================
   SECTION SWITCH
   ========================= */

.section-switch {
    position: fixed;

    top: 32px;
    right: 48px;

    z-index: 20;

    color: #000;
    text-decoration: none;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    white-space: nowrap;
}


/* =========================
   SLIDESHOW
   ========================= */

#slideshow {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

#current-photo {
    display: block;

    width: auto;
    height: auto;

    max-width: 70vw;
    max-height: 80vh;

    object-fit: contain;

    opacity: 1;

    pointer-events: none;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-name {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;

        font-size: 13px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }

    #slideshow {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }

    #current-photo {
        max-width: 84vw;
        max-height: calc(100% - 8px);
    }

}


/* =========================
   SHORT LANDSCAPE
   ========================= */

@media
    (orientation: landscape)
    and (max-height: 700px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-name,
    .logo-aybak {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }

    #slideshow {
        inset: 0;

        left: 190px;

        width: calc(100vw - 214px);
        height: 100vh;
    }

    #current-photo {
        max-width: 66vw;
        max-height: 68vh;
    }

}

</style>

</head>


<body>


<div
    class="info"
    id="info"
>

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span
            class="logo-name"
            id="logo-name"
        >
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<a
    class="section-switch"
    id="section-switch"
    href="https://film.denizalpaybak.com/"
>
    <span id="section-switch-text">film</span>
</a>


<div id="slideshow">

    <img
        id="current-photo"
        alt=""
    >

</div>


<script>


/* =====================================================
   R2 / PHOTOS.JSON
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";

const PHOTOS_JSON =
    "./photos.json";


/* =====================================================
   SLIDESHOW SETTINGS
   ===================================================== */

const SLIDE_DURATION =
    3000;

const PRELOAD_BEHIND =
    1;

const PRELOAD_AHEAD =
    3;


/* =====================================================
   GLOBAL WORD TIMING
   ===================================================== */

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS / STATE
   ===================================================== */

const slideshow =
    document.getElementById(
        "slideshow"
    );

const currentPhoto =
    document.getElementById(
        "current-photo"
    );

const info =
    document.getElementById(
        "info"
    );


let photos =
    [];

let current =
    0;

let manualMode =
    false;

let slideTimer =
    null;


/*
    Stores preload promises.
*/

const preloadCache =
    new Map();


/* =====================================================
   R2 URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   NORMALIZE INDEX
   ===================================================== */

function normalizeIndex(
    index
) {

    if (
        photos.length ===
        0
    ) {

        return 0;

    }


    return (
        (
            index %
            photos.length
        ) +
        photos.length
    ) %
    photos.length;

}


/* =====================================================
   PRELOAD ONE IMAGE
   ===================================================== */

function preloadPhoto(
    index
) {

    index =
        normalizeIndex(
            index
        );


    if (
        preloadCache.has(
            index
        )
    ) {

        return preloadCache.get(
            index
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const image =
                    new Image();


                image.decoding =
                    "async";


                image.onload =
                    () => {

                        if (
                            image.decode
                        ) {

                            image
                                .decode()
                                .catch(
                                    () => {}
                                )
                                .finally(
                                    () => {

                                        resolve(
                                            image
                                        );

                                    }
                                );

                        }

                        else {

                            resolve(
                                image
                            );

                        }

                    };


                image.onerror =
                    () => {

                        preloadCache.delete(
                            index
                        );


                        reject(
                            new Error(
                                `Could not load ${photos[index]}`
                            )
                        );

                    };


                image.src =
                    getPhotoUrl(
                        photos[index]
                    );

            }
        );


    preloadCache.set(
        index,
        promise
    );


    return promise;

}


/* =====================================================
   PRELOAD WINDOW
   ===================================================== */

function preloadAround(
    index
) {

    for (
        let offset = 1;
        offset <= PRELOAD_AHEAD;
        offset++
    ) {

        preloadPhoto(
            index +
            offset
        ).catch(
            () => {}
        );

    }


    for (
        let offset = 1;
        offset <= PRELOAD_BEHIND;
        offset++
    ) {

        preloadPhoto(
            index -
            offset
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   CLEAN PRELOAD CACHE
   ===================================================== */

function trimPreloadCache(
    centerIndex
) {

    const keep =
        new Set();


    for (
        let offset = -2;
        offset <= 5;
        offset++
    ) {

        keep.add(
            normalizeIndex(
                centerIndex +
                offset
            )
        );

    }


    for (
        const index of
        preloadCache.keys()
    ) {

        if (
            !keep.has(
                index
            )
        ) {

            preloadCache.delete(
                index
            );

        }

    }

}


/* =====================================================
   DISPLAY A VALID PHOTO
   ===================================================== */

async function displayPhoto(
    targetIndex
) {

    const image =
        await preloadPhoto(
            targetIndex
        );


    current =
        targetIndex;


    currentPhoto.src =
        image.src;


    preloadAround(
        current
    );


    trimPreloadCache(
        current
    );


    updateMobileSlideshow();

}


/* =====================================================
   SHOW PHOTO
   ===================================================== */

async function showPhoto(
    index
) {

    if (
        photos.length ===
        0
    ) {

        return false;

    }


    const targetIndex =
        normalizeIndex(
            index
        );


    try {

        await displayPhoto(
            targetIndex
        );


        return true;

    }

    catch (error) {

        console.warn(
            `Photo skipped: ${photos[targetIndex]}`
        );


        return false;

    }

}


/* =====================================================
   NEXT
   FAIL-SAFE
   ===================================================== */

async function nextSlide() {

    if (
        photos.length <=
        1
    ) {

        return;

    }


    /*
        Try each following image until
        one loads successfully.

        One bad filename can never
        freeze the slideshow.
    */

    for (
        let offset = 1;
        offset <
        photos.length;
        offset++
    ) {

        const targetIndex =
            normalizeIndex(
                current +
                offset
            );


        const success =
            await showPhoto(
                targetIndex
            );


        if (
            success
        ) {

            return;

        }

    }

}


/* =====================================================
   PREVIOUS
   FAIL-SAFE
   ===================================================== */

async function previousSlide() {

    if (
        photos.length <=
        1
    ) {

        return;

    }


    for (
        let offset = 1;
        offset <
        photos.length;
        offset++
    ) {

        const targetIndex =
            normalizeIndex(
                current -
                offset
            );


        const success =
            await showPhoto(
                targetIndex
            );


        if (
            success
        ) {

            return;

        }

    }

}


/* =====================================================
   LOAD PHOTOS.JSON
   ===================================================== */

async function loadPhotos() {

    try {

        const response =
            await fetch(
                PHOTOS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "photos.json could not be loaded."
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(
                data
            )
        ) {

            throw new Error(
                "photos.json must contain an array."
            );

        }


        photos =
            data.filter(
                item =>
                    typeof item ===
                    "string" &&
                    item.trim() !==
                    ""
            );


        if (
            photos.length ===
            0
        ) {

            throw new Error(
                "photos.json contains no valid photos."
            );

        }


        /*
            Find the first valid image.

            Even if the first JSON entry
            is broken, the site still opens.
        */

        let loaded =
            false;


        for (
            let i = 0;
            i <
            photos.length;
            i++
        ) {

            loaded =
                await showPhoto(
                    i
                );


            if (
                loaded
            ) {

                break;

            }

        }


        if (
            !loaded
        ) {

            throw new Error(
                "No valid R2 photos could be loaded."
            );

        }


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            "Photography could not be loaded:",
            error
        );

    }

}


/* =====================================================
   AUTO SLIDESHOW
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextSlide();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   CLICK NAVIGATION
   ===================================================== */

document.body.addEventListener(
    "click",
    async event => {

        if (
            event.target.closest(
                "a"
            )
        ) {

            return;

        }


        /*
            First click:
            stop autoplay only.
        */

        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        /*
            Later clicks:

            LEFT 25% = previous
            RIGHT 75% = next
        */

        const percentage =
            event.clientX /
            window.innerWidth;


        if (
            percentage <
            0.25
        ) {

            await previousSlide();

        }

        else {

            await nextSlide();

        }

    }
);


/* =====================================================
   MOBILE / INSTAGRAM POSITION
   ===================================================== */

function updateMobileSlideshow() {

    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";


        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const gapAfterInfo =
        24;


    const bottomGap =
        20;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    const stageHeight =
        Math.max(
            120,
            stageBottom -
            stageTop
        );


    slideshow.style.top =
        `${stageTop}px`;


    slideshow.style.height =
        `${stageHeight}px`;


    slideshow.style.bottom =
        "auto";

}


/* =====================================================
   VIEWPORT UPDATES
   ===================================================== */

window.addEventListener(
    "resize",
    updateMobileSlideshow
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updateMobileSlideshow,
            150
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            updateMobileSlideshow
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileSlideshow
        );

}


window.addEventListener(
    "load",
    () => {

        updateMobileSlideshow();


        setTimeout(
            updateMobileSlideshow,
            100
        );


        setTimeout(
            updateMobileSlideshow,
            400
        );


        setTimeout(
            updateMobileSlideshow,
            1000
        );

    }
);


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters = [
    document.getElementById("letter-a"),
    document.getElementById("letter-y"),
    document.getElementById("letter-b"),
    document.getElementById("letter-a2"),
    document.getElementById("letter-k")
];


const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];


const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


/* =====================================================
   LOGO STATE
   ===================================================== */

function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state ===
        0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i <
        letters.length;
        i++
    ) {

        letters[i]
            .textContent =
            i <
            state
                ? uppercase[i]
                : lowercase[i];

    }

}


/* =====================================================
   MOVE LOGO
   ===================================================== */

function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


/* =====================================================
   ANIMATE LOGO
   ===================================================== */

function animateTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


/* =====================================================
   DESKTOP LOGO
   ===================================================== */

logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                0
            );

        }

    }
);


/* =====================================================
   MOBILE LOGO
   ===================================================== */

function mobileLogoCycle() {

    setTimeout(
        () => {

            animateTo(
                5
            );


            setTimeout(
                () => {

                    animateTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   SECTION SWITCH
   FILM — exact 600ms
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchAnimationFrame =
    null;


/* =====================================================
   RENDER SWITCH
   ===================================================== */

function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i <
        switchWord.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? switchWord[i]
                    .toUpperCase()
                : switchWord[i]
                    .toLowerCase();

    }


    sectionSwitchText.textContent =
        result;

}


/* =====================================================
   MORPH SWITCH
   ===================================================== */

function morphSwitchTo(
    target
) {

    if (
        switchAnimationFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchAnimationFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const startTime =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    startTime
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchAnimationFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchAnimationFrame =
                null;

        }

    }


    switchAnimationFrame =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   DESKTOP SECTION SWITCH
   ===================================================== */

sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


updateMobileSlideshow();


loadPhotos();

</script>
