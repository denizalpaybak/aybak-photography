<script>


/* =====================================================
   R2
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";

const PHOTOS_JSON =
    "./photos.json";


/* =====================================================
   SLIDESHOW SETTINGS
   ===================================================== */

const SLIDE_DURATION =
    3000;


/*
    Fast local window.
*/

const PRELOAD_AHEAD =
    6;

const PRELOAD_BEHIND =
    2;


/*
    How long to wait for the exact requested
    frame before skipping to another ready one.
*/

const MANUAL_WAIT =
    250;

const AUTO_WAIT =
    900;


/*
    Background portfolio warming.

    Remaining images are loaded progressively,
    not all at once.
*/

const BACKGROUND_PRELOAD_DELAY =
    250;


/* =====================================================
   WORD TIMING
   ===================================================== */

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS
   ===================================================== */

const slideshow =
    document.getElementById(
        "slideshow"
    );

const currentPhoto =
    document.getElementById(
        "current-photo"
    );

const info =
    document.getElementById(
        "info"
    );


/* =====================================================
   STATE
   ===================================================== */

let photos =
    [];

let current =
    0;

let manualMode =
    false;

let slideTimer =
    null;


/*
    Each item:

    {
        image,
        status,
        promise
    }

    status:
    idle / loading / loaded / error
*/

const imageCache =
    new Map();


/* =====================================================
   URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   INDEX
   ===================================================== */

function normalizeIndex(
    index
) {

    if (
        photos.length === 0
    ) {

        return 0;

    }


    return (
        (
            index %
            photos.length
        ) +
        photos.length
    ) %
    photos.length;

}


/* =====================================================
   CACHE ENTRY
   ===================================================== */

function getCacheEntry(
    index
) {

    index =
        normalizeIndex(
            index
        );


    if (
        imageCache.has(
            index
        )
    ) {

        return imageCache.get(
            index
        );

    }


    const entry = {

        image:
            null,

        status:
            "idle",

        promise:
            null

    };


    imageCache.set(
        index,
        entry
    );


    return entry;

}


/* =====================================================
   START IMAGE LOAD
   ===================================================== */

function preloadPhoto(
    index
) {

    index =
        normalizeIndex(
            index
        );


    const entry =
        getCacheEntry(
            index
        );


    if (
        entry.status ===
        "loaded"
    ) {

        return Promise.resolve(
            entry.image
        );

    }


    if (
        entry.status ===
        "loading"
    ) {

        return entry.promise;

    }


    entry.status =
        "loading";


    entry.promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const image =
                    new Image();


                image.decoding =
                    "async";


                image.onload =
                    async () => {

                        try {

                            if (
                                image.decode
                            ) {

                                await image.decode();

                            }

                        }

                        catch (error) {

                            /*
                                Image already loaded.
                                Decode failure does not
                                mean the asset is unusable.
                            */

                        }


                        entry.image =
                            image;


                        entry.status =
                            "loaded";


                        resolve(
                            image
                        );

                    };


                image.onerror =
                    () => {

                        entry.status =
                            "error";


                        reject(
                            new Error(
                                `Could not load: ${photos[index]}`
                            )
                        );

                    };


                image.src =
                    getPhotoUrl(
                        photos[index]
                    );

            }
        );


    return entry.promise;

}


/* =====================================================
   STATUS
   ===================================================== */

function isPhotoLoaded(
    index
) {

    const entry =
        imageCache.get(
            normalizeIndex(
                index
            )
        );


    return (
        entry &&
        entry.status ===
        "loaded"
    );

}


/* =====================================================
   WAIT WITH TIMEOUT
   ===================================================== */

function waitForPhoto(
    index,
    timeout
) {

    return Promise.race(
        [

            preloadPhoto(
                index
            ),


            new Promise(
                (
                    resolve,
                    reject
                ) => {

                    setTimeout(
                        () => {

                            reject(
                                new Error(
                                    "timeout"
                                )
                            );

                        },
                        timeout
                    );

                }
            )

        ]
    );

}


/* =====================================================
   PRELOAD NEAR CURRENT
   ===================================================== */

function preloadAround(
    index
) {

    /*
        Forward first because forward
        navigation is used most.
    */

    for (
        let offset = 1;
        offset <= PRELOAD_AHEAD;
        offset++
    ) {

        preloadPhoto(
            index +
            offset
        ).catch(
            () => {}
        );

    }


    for (
        let offset = 1;
        offset <= PRELOAD_BEHIND;
        offset++
    ) {

        preloadPhoto(
            index -
            offset
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   BACKGROUND WARMING
   ===================================================== */

function startBackgroundPreloading() {

    let offset =
        PRELOAD_AHEAD +
        1;


    function loadNext() {

        if (
            photos.length === 0 ||
            offset >=
            photos.length
        ) {

            return;

        }


        const index =
            normalizeIndex(
                current +
                offset
            );


        preloadPhoto(
            index
        )
        .catch(
            () => {}
        )
        .finally(
            () => {

                offset++;


                setTimeout(
                    loadNext,
                    BACKGROUND_PRELOAD_DELAY
                );

            }
        );

    }


    setTimeout(
        loadNext,
        500
    );

}


/* =====================================================
   DISPLAY
   ===================================================== */

function displayLoadedPhoto(
    index
) {

    index =
        normalizeIndex(
            index
        );


    const entry =
        getCacheEntry(
            index
        );


    if (
        entry.status !==
        "loaded"
    ) {

        return false;

    }


    current =
        index;


    currentPhoto.src =
        entry.image.src;


    preloadAround(
        current
    );


    updateMobileSlideshow();


    return true;

}


/* =====================================================
   FIND READY PHOTO
   ===================================================== */

function findLoadedPhoto(
    startIndex,
    direction
) {

    for (
        let offset = 0;
        offset <
        photos.length;
        offset++
    ) {

        const index =
            normalizeIndex(
                startIndex +
                (
                    offset *
                    direction
                )
            );


        if (
            isPhotoLoaded(
                index
            )
        ) {

            return index;

        }

    }


    return null;

}


/* =====================================================
   FIND NEXT USABLE PHOTO
   ===================================================== */

async function move(
    direction,
    waitTime
) {

    if (
        photos.length <= 1
    ) {

        return false;

    }


    const exactTarget =
        normalizeIndex(
            current +
            direction
        );


    /*
        Start requested image immediately.
    */

    preloadPhoto(
        exactTarget
    ).catch(
        () => {}
    );


    /*
        If already loaded, switch instantly.
    */

    if (
        isPhotoLoaded(
            exactTarget
        )
    ) {

        return displayLoadedPhoto(
            exactTarget
        );

    }


    /*
        Give exact requested frame a short
        opportunity to finish.
    */

    try {

        await waitForPhoto(
            exactTarget,
            waitTime
        );


        if (
            isPhotoLoaded(
                exactTarget
            )
        ) {

            return displayLoadedPhoto(
                exactTarget
            );

        }

    }

    catch (error) {

        /*
            Timeout/error:
            immediately look for another
            already prepared image.
        */

    }


    /*
        Do NOT leave the interface feeling dead.

        Find the nearest READY frame in the
        requested direction and jump to it.
    */

    const readyIndex =
        findLoadedPhoto(
            exactTarget +
            direction,
            direction
        );


    if (
        readyIndex !== null &&
        readyIndex !== current
    ) {

        return displayLoadedPhoto(
            readyIndex
        );

    }


    /*
        None is ready yet.

        Race the next few candidates.
        Whichever loads first wins.
    */

    const candidates =
        [];


    for (
        let offset = 1;
        offset <= 6;
        offset++
    ) {

        const index =
            normalizeIndex(
                current +
                (
                    offset *
                    direction
                )
            );


        const entry =
            getCacheEntry(
                index
            );


        /*
            Ignore permanent errors.
        */

        if (
            entry.status ===
            "error"
        ) {

            continue;

        }


        const candidate =
            preloadPhoto(
                index
            )
            .then(
                () => index
            )
            .catch(
                () => null
            );


        candidates.push(
            candidate
        );

    }


    if (
        candidates.length ===
        0
    ) {

        return false;

    }


    /*
        Resolve as each promise completes until
        we get a valid index.
    */

    const wrapped =
        candidates.map(
            promise =>
                promise.then(
                    value => ({
                        value,
                        promise
                    })
                )
        );


    const pending =
        [...wrapped];


    while (
        pending.length >
        0
    ) {

        const result =
            await Promise.race(
                pending
            );


        const removeIndex =
            pending.indexOf(
                result.promise
            );


        if (
            removeIndex >=
            0
        ) {

            pending.splice(
                removeIndex,
                1
            );

        }


        if (
            result.value !==
            null
        ) {

            return displayLoadedPhoto(
                result.value
            );

        }

    }


    return false;

}


/* =====================================================
   NEXT / PREVIOUS
   ===================================================== */

function nextSlide(
    manual = false
) {

    return move(
        1,
        manual
            ? MANUAL_WAIT
            : AUTO_WAIT
    );

}


function previousSlide() {

    return move(
        -1,
        MANUAL_WAIT
    );

}


/* =====================================================
   LOAD JSON
   ===================================================== */

async function loadPhotos() {

    try {

        const response =
            await fetch(
                PHOTOS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "photos.json could not be loaded."
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(
                data
            )
        ) {

            throw new Error(
                "photos.json must contain an array."
            );

        }


        photos =
            data.filter(
                item =>
                    typeof item ===
                    "string" &&
                    item.trim() !==
                    ""
            );


        if (
            photos.length ===
            0
        ) {

            return;

        }


        /*
            Load first valid photo.
        */

        for (
            let index = 0;
            index <
            photos.length;
            index++
        ) {

            try {

                await preloadPhoto(
                    index
                );


                if (
                    displayLoadedPhoto(
                        index
                    )
                ) {

                    break;

                }

            }

            catch (error) {

                console.warn(
                    `Skipping: ${photos[index]}`
                );

            }

        }


        /*
            Immediately prepare nearby frames.
        */

        preloadAround(
            current
        );


        /*
            Slowly warm the rest of the portfolio.
        */

        startBackgroundPreloading();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   AUTO
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextSlide(
                    false
                );


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   CLICK
   ===================================================== */

document.body.addEventListener(
    "click",
    async event => {

        if (
            event.target.closest(
                "a"
            )
        ) {

            return;

        }


        /*
            First click only stops autoplay.
        */

        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const percentage =
            event.clientX /
            window.innerWidth;


        if (
            percentage <
            0.25
        ) {

            await previousSlide();

        }

        else {

            await nextSlide(
                true
            );

        }

    }
);


/* =====================================================
   MOBILE / INSTAGRAM POSITION
   ===================================================== */

function updateMobileSlideshow() {

    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";


        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const gapAfterInfo =
        24;


    const bottomGap =
        20;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    const stageHeight =
        Math.max(
            120,
            stageBottom -
            stageTop
        );


    slideshow.style.top =
        `${stageTop}px`;


    slideshow.style.height =
        `${stageHeight}px`;


    slideshow.style.bottom =
        "auto";

}


/* =====================================================
   VIEWPORT
   ===================================================== */

window.addEventListener(
    "resize",
    updateMobileSlideshow
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updateMobileSlideshow,
            150
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            updateMobileSlideshow
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileSlideshow
        );

}


window.addEventListener(
    "load",
    () => {

        updateMobileSlideshow();


        setTimeout(
            updateMobileSlideshow,
            100
        );


        setTimeout(
            updateMobileSlideshow,
            400
        );


        setTimeout(
            updateMobileSlideshow,
            1000
        );

    }
);


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters = [
    document.getElementById("letter-a"),
    document.getElementById("letter-y"),
    document.getElementById("letter-b"),
    document.getElementById("letter-a2"),
    document.getElementById("letter-k")
];


const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];


const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i <
        letters.length;
        i++
    ) {

        letters[i]
            .textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                0
            );

        }

    }
);


function mobileLogoCycle() {

    setTimeout(
        () => {

            animateTo(
                5
            );


            setTimeout(
                () => {

                    animateTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   SECTION SWITCH
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchAnimationFrame =
    null;


function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i <
        switchWord.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? switchWord[i]
                    .toUpperCase()
                : switchWord[i]
                    .toLowerCase();

    }


    sectionSwitchText.textContent =
        result;

}


function morphSwitchTo(
    target
) {

    if (
        switchAnimationFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchAnimationFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const startTime =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    startTime
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchAnimationFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchAnimationFrame =
                null;

        }

    }


    switchAnimationFrame =
        requestAnimationFrame(
            frame
        );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


updateMobileSlideshow();


loadPhotos();

</script>
