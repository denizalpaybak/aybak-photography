/* =====================================================
   PROJECT META HORIZONTAL
   ===================================================== */

function syncMetadataHorizontal() {

    if (
        isPhoneLayout()
    ) {

        const style =
            getComputedStyle(
                document.documentElement
            );


        const side =
            parseFloat(
                style.getPropertyValue(
                    "--side"
                )
            ) || 24;


        projectMeta.style.left =
            `${side}px`;


        projectMeta.style.width =
            `calc(100vw - ${side * 2}px)`;


        return;

    }


    if (
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    const image =
        spread.querySelector(
            ".spread-image"
        );


    if (
        !image
    ) {

        return;

    }


    const imageRect =
        image.getBoundingClientRect();


    const blockRect =
        projectBlock.getBoundingClientRect();


    if (
        imageRect.width <= 0
    ) {

        return;

    }


    projectMeta.style.left =
        `${
            imageRect.left -
            blockRect.left
        }px`;


    projectMeta.style.width =
        `${imageRect.width}px`;

}


function syncMetadataAfterRender() {

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                syncMetadataHorizontal
            );

        }
    );

}


/* =====================================================
   UPDATE METADATA
   ===================================================== */

async function updateMetadata(
    targetProjectIndex,
    targetFrameIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    renderBaseTypography(



        projectCounter,



        getCounterText(
            targetFrameIndex,
            project.images.length
        )



    );


    projectCounter.dataset.rawText =
        projectCounter.textContent;


    if (
        projectChanged
    ) {

        await Promise.all(
            [

                morphSequential(
                    projectTitle,
                    project.title.toLowerCase(),
                    TEXT_MORPH_DURATION
                ),

                morphSequential(
                    projectDate,
                    (
                        project.date ||
                        ""
                    ).toLowerCase(),
                    TEXT_MORPH_DURATION
                )

            ]
        );

    }


    renderedProjectIndex =
        targetProjectIndex;

}


/* =====================================================
   PROJECT ROTATION HELPERS
   ===================================================== */

function shuffledCopy(
    values
) {

    const copy =
        values.slice();


    for (
        let i =
            copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


function getSeenFrameSet(
    targetProjectIndex
) {

    const normalized =
        normalizeProjectIndex(
            targetProjectIndex
        );


    if (
        !seenFramesByProject.has(
            normalized
        )
    ) {

        seenFramesByProject.set(
            normalized,
            new Set()
        );

    }


    return seenFramesByProject.get(
        normalized
    );

}


function markFrameSeen(
    targetProjectIndex,
    targetFrameIndex
) {

    getSeenFrameSet(
        targetProjectIndex
    ).add(
        targetFrameIndex
    );

}


function buildNormalProjectSequence(
    targetProjectIndex,
    {
        includeFrame =
            null
    } = {}
) {

    const normalized =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalized
        ];


    const total =
        project.images.length;


    const limit =
        Math.min(
            NORMAL_PROJECT_FRAME_LIMIT,
            total
        );


    const seen =
        getSeenFrameSet(
            normalized
        );


    const selected =
        [];


    if (
        Number.isInteger(
            includeFrame
        ) &&
        includeFrame >= 0 &&
        includeFrame < total
    ) {

        selected.push(
            includeFrame
        );

    }


    const allFrames =
        Array.from(
            {
                length:
                    total
            },
            (
                _,
                index
            ) => index
        );


    /*
        First priority: frames this visitor has not seen yet.
        This guarantees that a leftover unseen frame is included
        on the next pass before any repeat is used.
    */
    const unseen =
        shuffledCopy(
            allFrames.filter(
                index =>
                    !seen.has(
                        index
                    ) &&
                    !selected.includes(
                        index
                    )
            )
        );


    while (
        selected.length < limit &&
        unseen.length
    ) {

        selected.push(
            unseen.shift()
        );

    }


    /*
        If fewer than 3 unseen frames remain, complete the pass with
        random repeats, without duplicating a frame inside one pass.
    */
    if (
        selected.length < limit
    ) {

        const repeats =
            shuffledCopy(
                allFrames.filter(
                    index =>
                        !selected.includes(
                            index
                        )
                )
            );


        while (
            selected.length < limit &&
            repeats.length
        ) {

            selected.push(
                repeats.shift()
            );

        }

    }


    /*
        The chosen frames are random, but their playback order follows
        the project's own frame order.

        Example:
            randomly chosen: 05, 07, 02
            playback:        02, 05, 07
    */
    selected.sort(
        (
            a,
            b
        ) =>
            a - b
    );


    normalSequenceProjectIndex =
        normalized;


    normalSequenceFrames =
        selected;


    normalSequencePosition =
        includeFrame !== null
            ? normalSequenceFrames.indexOf(
                includeFrame
            )
            : -1;


    return normalSequenceFrames;

}


function clearNormalSequence() {

    normalSequenceProjectIndex =
        null;


    normalSequenceFrames =
        [];


    normalSequencePosition =
        -1;

}


function enterFocusedProjectMode(
    targetProjectIndex
) {

    focusedProjectMode =
        true;


    focusedProjectIndex =
        normalizeProjectIndex(
            targetProjectIndex
        );


    clearNormalSequence();

}


function leaveFocusedProjectMode() {

    focusedProjectMode =
        false;


    focusedProjectIndex =
        null;


    clearNormalSequence();

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    if (
        projects.length === 0
    ) {

        return;

    }


    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            frameIndex +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex + 1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW FRAME
   ===================================================== */

async function showFrame(
    targetProjectIndex,
    targetFrameIndex,
    urlMode =
        "push"
) {

    if (
        navigationAnimating
    ) {

        return false;

    }


    navigationAnimating =
        true;


    const normalizedProject =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalizedProject
        ];


    const normalizedFrame =
        Math.max(
            0,
            Math.min(
                targetFrameIndex,
                project.images.length - 1
            )
        );


    try {

        const loadedImage =
            await preloadImage(
                project.images[
                    normalizedFrame
                ]
            );


        projectIndex =
            normalizedProject;


        frameIndex =
            normalizedFrame;


        markFrameSeen(
            normalizedProject,
            normalizedFrame
        );


        syncProjectUrl(
            urlMode
        );


        renderImage(
            loadedImage
        );


        if (
            isPhoneLandscape()
        ) {

            updateLandscapeGeometry();

        }


        syncMetadataAfterRender();


        await updateMetadata(
            normalizedProject,
            normalizedFrame
        );


        preloadAhead();


        navigationAnimating =
            false;


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        navigationAnimating =
            false;


        return false;

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextFrame(
    urlMode =
        "push"
) {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    /*
        INDEX / VIEW ALL focused mode:
        continue through every remaining frame in this project.
    */
    if (
        focusedProjectMode &&
        focusedProjectIndex ===
            projectIndex
    ) {

        if (
            frameIndex <
            project.images.length - 1
        ) {

            return showFrame(
                projectIndex,
                frameIndex + 1,
                urlMode
            );

        }


        /*
            The complete requested project is finished.
            The following project returns to normal max-3 rotation.
        */
        leaveFocusedProjectMode();


        const nextProjectIndex =
            normalizeProjectIndex(
                projectIndex + 1
            );


        const sequence =
            buildNormalProjectSequence(
                nextProjectIndex
            );


        normalSequencePosition =
            0;


        return showFrame(
            nextProjectIndex,
            sequence[0],
            urlMode
        );

    }


    /*
        Normal mode. If this is the first movement in the current
        project, build this pass around the frame already on screen.
    */
    if (
        normalSequenceProjectIndex !==
            projectIndex ||
        !normalSequenceFrames.includes(
            frameIndex
        )
    ) {

        buildNormalProjectSequence(
            projectIndex,
            {
                includeFrame:
                    frameIndex
            }
        );

    }


    normalSequencePosition =
        normalSequenceFrames.indexOf(
            frameIndex
        );


    if (
        normalSequencePosition >= 0 &&
        normalSequencePosition <
            normalSequenceFrames.length - 1
    ) {

        normalSequencePosition++;


        return showFrame(
            projectIndex,
            normalSequenceFrames[
                normalSequencePosition
            ],
            urlMode
        );

    }


    /*
        This project's maximum-three pass is complete.
        Build a fresh pass for the next project.
    */
    const nextProjectIndex =
        normalizeProjectIndex(
            projectIndex + 1
        );


    const nextSequence =
        buildNormalProjectSequence(
            nextProjectIndex
        );


    normalSequencePosition =
        0;


    return showFrame(
        nextProjectIndex,
        nextSequence[0],
        urlMode
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousFrame(
    urlMode =
        "push"
) {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    /*
        While a project was explicitly opened from INDEX / VIEW ALL,
        backwards navigation stays inside its full sequential run.
    */
    if (
        focusedProjectMode &&
        focusedProjectIndex ===
            projectIndex
    ) {

        if (
            frameIndex > 0
        ) {

            return showFrame(
                projectIndex,
                frameIndex - 1,
                urlMode
            );

        }


        leaveFocusedProjectMode();

    }


    if (
        normalSequenceProjectIndex ===
            projectIndex
    ) {

        const position =
            normalSequenceFrames.indexOf(
                frameIndex
            );


        if (
            position > 0
        ) {

            normalSequencePosition =
                position - 1;


            return showFrame(
                projectIndex,
                normalSequenceFrames[
                    normalSequencePosition
                ],
                urlMode
            );

        }

    }


    /*
        Crossing backwards into another project creates a normal
        max-3 pass there and lands on its last selected frame.
    */
    const previousProjectIndex =
        normalizeProjectIndex(
            projectIndex - 1
        );


    const sequence =
        buildNormalProjectSequence(
            previousProjectIndex
        );


    normalSequencePosition =
        sequence.length - 1;


    return showFrame(
        previousProjectIndex,
        sequence[
            normalSequencePosition
        ],
        urlMode
    );

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        autoplayPermanentlyDisabled ||
        manualMode ||
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextFrame(
                    "replace"
                );


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    if (
        autoplayPermanentlyDisabled
    ) {

        manualMode =
            true;


        clearTimeout(
            slideTimer
        );


        return;

    }


    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    autoplayPermanentlyDisabled =
        true;


    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   PRIMARY ACTION
   ===================================================== */

async function performPrimarySlideAction() {

    if (
        indexMode ||
        projectAllMode ||
        interfaceAnimating ||
        navigationAnimating ||
        projectViewAnimating
    ) {

        return;

    }


    if (
        !manualMode
    ) {

        stopAutoSlideshow();


        return;

    }


    await nextFrame();

}


/* =====================================================
   VIEW ALL BOUNDS

   More aggressive use of the safe space.

   Still respects:
   - contact block
   - metadata
   - outer site margins
   ===================================================== */

function syncProjectAllBounds(
    force =
        false
) {

    if (
        !projectAllMode &&
        !force
    ) {

        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const side =
        parseFloat(
            rootStyle.getPropertyValue(
                "--side"
            )
        ) || 24;


    /*
        Smaller gaps than before.

        This gives the contact sheet substantially
        more usable area without allowing collisions.
    */

    let topGap =
        14;


    let bottomGap =
        14;


    if (
        isPhonePortrait()
    ) {

        topGap =
            10;


        bottomGap =
            10;

    }


    if (
        isPhoneLandscape()
    ) {

        /*
            Very short viewport:
            use almost the full safe window.
        */

        topGap =
            4;


        bottomGap =
            6;

    }


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    /*
        Also use the horizontal space slightly more
        aggressively.

        Still never crosses the site margins.
    */

    const horizontalInset =
        isPhoneLayout()
            ? 0
            : 0;


    projectAllView.style.left =
        `${side + horizontalInset}px`;


    projectAllView.style.right =
        `${side + horizontalInset}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom - top
        )}px`;

}


/* =====================================================
   VIEW ALL GRID LAYOUT

   Improved scoring:

   More emphasis on using available space.
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const gap =
        isPhoneLandscape()
            ? 4
            : (
                isPhonePortrait()
                    ? 5
                    : 7
            );


    let best =
        {
            columns: 1,
            rows: count,
            score: 0
        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns - 1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows - 1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        /*
            More neutral scoring than before.

            This tends to produce slightly larger
            thumbnails instead of overly cautious grids.
        */

        const score =
            Math.min(
                cellWidth,
                cellHeight * 1.28
            );


        if (
            score >
            best.score
        ) {

            best =
                {
                    columns,
                    rows,
                    score
                };

        }

    }


    return best;

}


function layoutProjectAllGrid(
    force =
        false
) {

    if (
        !projectAllMode &&
        !force
    ) {

        return;

    }


    syncProjectAllBounds(
        force
    );


    const layout =
        calculateProjectAllLayout(
            currentProject()
                .images
                .length
        );


    projectAllGrid.style.gridTemplateColumns =
        `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style.gridTemplateRows =
        `repeat(${layout.rows}, minmax(0, 1fr))`;

}


/* =====================================================
   BUILD VIEW ALL
   ===================================================== */

function buildProjectAllGrid() {

    const project =
        currentProject();


    projectAllGrid.innerHTML =
        "";


    project.images.forEach(
        (
            filename,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "project-all-thumb";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                getPhotoUrl(
                    filename
                );


            img.alt =
                "";


            img.loading =
                "eager";


            img.decoding =
                "async";


            /*
                The first few frames are usually already in
                imageCache because of preloadAhead(). Keep
                the remainder at normal priority so opening
                View All does not starve the UI thread.
            */
            img.fetchPriority =
                index < 4
                    ? "high"
                    : "auto";


            button.appendChild(
                img
            );


            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();


                    await exitProjectAllToFrame(
                        index
                    );

                }
            );


            projectAllGrid.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   PREPARE GRID
   ===================================================== */

function prepareProjectAllGrid() {

    buildProjectAllGrid();


    body.classList.add(
        "project-all-preparing"
    );


    projectAllView
        .getBoundingClientRect();


    syncProjectAllBounds(
        true
    );


    layoutProjectAllGrid(
        true
    );

}


/* =====================================================
   VIEW ALL HOVER
   ===================================================== */

viewAllButton.addEventListener(
    "mouseenter",
    async () => {

        if (
            !window.matchMedia(
                "(hover: hover)"
            ).matches ||
            projectViewAnimating
        ) {

            return;

        }


        viewButtonHovered =
            true;


        const base =
            projectAllMode
                ? "close"
                : "view all";


        await animateCase(
            viewAllButton,
            base,
            true
        );


        viewAllButton.dataset.rawText =
            viewAllButton.textContent;

    }
);


viewAllButton.addEventListener(
    "mouseleave",
    async () => {

        if (
            !window.matchMedia(
                "(hover: hover)"
            ).matches ||
            projectViewAnimating
        ) {

            return;

        }


        viewButtonHovered =
            false;


        const base =
            projectAllMode
                ? "close"
                : "view all";


        await animateCase(
            viewAllButton,
            base,
            false
        );


        viewAllButton.dataset.rawText =
            viewAllButton.textContent;

    }
);


/* =====================================================
   ENTER VIEW ALL
   ===================================================== */

async function enterProjectAll() {

    if (
        projectAllMode ||
        projectViewAnimating ||
        indexMode
    ) {

        return;

    }


    projectViewAnimating =
        true;


    /*
        VIEW ALL is an explicit interaction.
        From this point on the initial autoplay may never resume.
    */
    stopAutoSlideshow();


    prepareProjectAllGrid();


    const project =
        currentProject();


    viewAllButton.dataset.rawText =
        viewAllButton.textContent;


    projectCounter.dataset.rawText =
        projectCounter.textContent;


    projectAllMode =
        true;


    const targetButton =
        (
            window.matchMedia(
                "(hover: hover)"
            ).matches &&
            viewButtonHovered
        )
            ? "CLOSE"
            : "close";


    await Promise.all(
        [

            animateCase(
                projectTitle,
                project.title,
                true
            ),

            animateCase(
                projectDate,
                project.date || "",
                true
            ),

            morphSequential(
                projectCounter,
                getAllCounterText(
                    project.images.length
                ),
                STATE_MORPH_DURATION
            ),

            morphSequential(
                viewAllButton,
                targetButton,
                STATE_MORPH_DURATION
            )

        ]
    );


    body.classList.remove(
        "project-all-preparing"
    );


    body.classList.add(
        "project-all-mode"
    );


    projectViewAnimating =
        false;

}


/* =====================================================
   LEAVE VIEW ALL
   ===================================================== */

async function leaveProjectAll(
    {
        selectedIndex =
            null,

        resume =
            true
    } = {}
) {

    if (
        !projectAllMode ||
        projectViewAnimating
    ) {

        return;

    }


    projectViewAnimating =
        true;


    const project =
        currentProject();


    if (
        selectedIndex !== null
    ) {

        const loadedImage =
            await preloadImage(
                project.images[
                    selectedIndex
                ]
            );


        frameIndex =
            selectedIndex;


        markFrameSeen(
            projectIndex,
            selectedIndex
        );


        enterFocusedProjectMode(
            projectIndex
        );


        syncProjectUrl(
            "push"
        );


        renderImage(
            loadedImage
        );

    }


    viewAllButton.dataset.rawText =
        viewAllButton.textContent;


    projectCounter.dataset.rawText =
        projectCounter.textContent;


    const targetButton =
        (
            window.matchMedia(
                "(hover: hover)"
            ).matches &&
            viewButtonHovered
        )
            ? "VIEW ALL"
            : "view all";


    await Promise.all(
        [

            animateCase(
                projectTitle,
                project.title,
                false
            ),

            animateCase(
                projectDate,
                project.date || "",
                false
            ),

            morphSequential(
                projectCounter,
                getCounterText(
                    frameIndex,
                    project.images.length
                ),
                STATE_MORPH_DURATION
            ),

            morphSequential(
                viewAllButton,
                targetButton,
                STATE_MORPH_DURATION
            )

        ]
    );


    projectAllMode =
        false;


    body.classList.remove(
        "project-all-mode"
    );


    projectAllGrid.innerHTML =
        "";


    if (
        isPhoneLandscape()
    ) {

        updateLandscapeGeometry();

    }


    syncMetadataAfterRender();


    preloadAhead();


    /*
        Returning from VIEW ALL is always manual.
        Selecting a frame, closing VIEW ALL, or moving from VIEW ALL
        to INDEX must never restart the initial autoplay.
    */
    manualMode =
        true;


    clearTimeout(
        slideTimer
    );


    projectViewAnimating =
        false;

}


/* =====================================================
   CLOSE VIEW ALL
   ===================================================== */

async function exitProjectAll() {

    await leaveProjectAll(
        {
            resume: true
        }
    );

}


/* =====================================================
   THUMB -> FRAME
   ===================================================== */

async function exitProjectAllToFrame(

) {

        }
    );

}


/* =====================================================
   VIEW ALL CLICK
   ===================================================== */

viewAllButton.addEventListener(

        ) {

);


/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                if (
                    dateA > dateB
                ) {

                    return -1;

                }


                if (
                    dateA < dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   INDEX CARD CASE CONTROLLER
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    const base =
        String(
            baseText
        ).toLowerCase();


    const positions =
        getMorphPositions(
            base
        );


    const total =
        positions.length;


    let state =
        0;


    let frameId =
        null;


    function render() {

        const activePositions =
            new Set(
                positions.slice(
                    0,
                    state
                )
            );


        renderInteractiveTypography(
            element,
            renderCaseFromActivePositions(
                base,
                activePositions
            ),
            activePositions
        );

    }


    function animateTo(
        target
    ) {

        if (
            frameId !== null
        ) {

            cancelAnimationFrame(
                frameId
            );

        }


        const startState =
            state;


        if (
            startState === target
        ) {

            render();


            return;

        }


        const start =
            performance.now();


        function frame(
            now
        ) {

            const progress =
                Math.min(
                    1,
                    (
                        now -
                        start
                    ) /
                    CASE_DURATION
                );


            state =
                Math.round(
                    startState +
                    (
                        target -
                        startState
                    ) *
                    progress
                );


            render();


            if (
                progress < 1
            ) {

                frameId =
                    requestAnimationFrame(
                        frame
                    );

            }

            else {

                state =
                    target;


                render();


                frameId =
                    null;

            }

        }


        frameId =
            requestAnimationFrame(
                frame
            );

    }


    render();


    return {

        upper() {

            animateTo(
                total
            );

        },

        lower() {

            animateTo(
                0
            );

        }

    };

}


/* =====================================================
   INDEX GEOMETRY
   ===================================================== */

/*
    Same visual logic as the film index:

    - every project owns the same invisible media stage height
    - portrait images can use almost all of that height
    - landscape images are width-limited instead of becoming tiny
    - the actual image is vertically centered inside the common stage
    - title/date always begin after the common stage
*/

function clampNumber(
    value,
    min,
    max
) {

    return Math.min(
        max,
        Math.max(
            min,
            value
        )
    );

}


function getPhotoIndexGeometry() {

    if (
        isPhonePortrait()
    ) {

        return {

            mediaHeight:
                clampNumber(
                    window.innerHeight * 0.255,
                    205,
                    235
                ),

            maxLandscapeWidth:
                window.innerWidth * 0.47

        };

    }


    if (
        isPhoneLandscape()
    ) {

        /*
            IMPORTANT:
            Landscape already has a dedicated safe-area calculation
            in updateLandscapeGeometry().

            That function computes the exact image height that fits:
                info/contact block
                +
                thumbnail
                +
                two caption lines
                +
                INDEX button

            The previous index rewrite ignored that calculated value
            and introduced a second viewport-based height. On some
            landscape phones that second value was taller than the
            actual available space, so the whole card was vertically
            clipped by the index viewport. It looked like the JPEG
            itself was cropped, and the date disappeared below the
            viewport.

            Use the ONE authoritative landscape height here.
        */

        const computed =
            getComputedStyle(
                document.documentElement
            );


        const safeMediaHeight =
            parseFloat(
                computed.getPropertyValue(
                    "--landscape-index-image-height"
                )
            ) || 136;


        const safeCardWidth =
            parseFloat(
                computed.getPropertyValue(
                    "--landscape-index-card-width"
                )
            ) || 205;


        return {

            mediaHeight:
                safeMediaHeight,

            /*
                Keep landscape images broad enough to have the same
                visual weight as the film index, but NEVER wider than
                the safe card produced by updateLandscapeGeometry().
            */

            maxLandscapeWidth:
                Math.min(
                    safeCardWidth,
                    Math.max(
                        138,
                        safeMediaHeight * 1.05
                    )
                ),

            cardWidth:
                safeCardWidth

        };

    }


    return {

        mediaHeight:
            clampNumber(
                window.innerHeight * 0.34,
                280,
                365
            ),

        maxLandscapeWidth:
            Math.min(
                window.innerWidth * 0.29,
                480
            )

    };

}


function getPhotoIndexItemMetrics(
    ratio
) {

    const geometry =
        getPhotoIndexGeometry();


    let displayHeight =
        geometry.mediaHeight;


    let displayWidth =
        displayHeight *
        ratio;


    if (
        displayWidth >
        geometry.maxLandscapeWidth
    ) {

        displayWidth =
            geometry.maxLandscapeWidth;


        displayHeight =
            displayWidth /
            ratio;

    }


    return {

        mediaHeight:
            geometry.mediaHeight,

        displayWidth,

        displayHeight

    };

}


function syncPhotoIndexCardSize(
    img,
    button,
    wrap
) {

    if (
        !img.naturalWidth ||
        !img.naturalHeight
    ) {

        return;

    }


    const ratio =
        img.naturalWidth /
        img.naturalHeight;


    const metrics =
        getPhotoIndexItemMetrics(
            ratio
        );


    const width =
        Math.max(
            1,
            Math.round(
                metrics.displayWidth
            )
        );


    const height =
        Math.max(
            1,
            Math.round(
                metrics.displayHeight
            )
        );


    const mediaHeight =
        Math.max(
            height,
            Math.round(
                metrics.mediaHeight
            )
        );


    const geometry =
        getPhotoIndexGeometry();


    const cardWidth =
        isPhoneLandscape()
            ? Math.max(
                width,
                geometry.cardWidth ||
                    width
            )
            : width;


    button.style.width =
        `${cardWidth}px`;

    button.style.flex =
        `0 0 ${cardWidth}px`;

    button.style.minWidth =
        `${cardWidth}px`;

    button.style.maxWidth =
        `${cardWidth}px`;


    wrap.style.width =
        `${cardWidth}px`;

    wrap.style.height =
        `${mediaHeight}px`;

    wrap.style.flexBasis =
        `${mediaHeight}px`;


    /*
        IMPORTANT:
        Never force both pixel width AND pixel height on index images.

        Some portrait files can carry orientation / rendering metadata
        that makes an explicit width+height pair look visually cropped
        on mobile landscape.

        The wrapper already defines the exact available media area.
        Let the browser preserve the image's intrinsic aspect ratio and
        fit the whole frame inside that area.
    */

    img.style.width =
        "auto";

    img.style.height =
        "auto";

    img.style.maxWidth =
        "100%";

    img.style.maxHeight =
        "100%";

    img.style.objectFit =
        "contain";


    if (
        isPhoneLandscape()
    ) {

        const previewOffset =
            Math.max(
                0,
                (
                    cardWidth -
                    width
                ) / 2
            );


        button.style.setProperty(
            "--landscape-preview-offset",
            button ===
                indexGrid.firstElementChild
                    ? "0px"
                    : `${previewOffset}px`
        );

    }

    else {

        button.style.removeProperty(
            "--landscape-preview-offset"
        );

    }

}


function resizePhotoIndexCards() {

    document
        .querySelectorAll(
            ".project-card"
        )
        .forEach(
            card => {

                const img =
                    card.querySelector(
                        ".card-image-wrap img"
                    );


                const wrap =
                    card.querySelector(
                        ".card-image-wrap"
                    );


                if (
                    img &&
                    wrap &&
                    img.naturalWidth &&
                    img.naturalHeight
                ) {

                    syncPhotoIndexCardSize(
                        img,
                        card,
                        wrap
                    );

                }

            }
        );

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    getChronologicalProjects()
        .forEach(
            item => {

                const project =
                    item.project;


                const originalIndex =
                    item.originalIndex;


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "project-card";


                button.type =
                    "button";


                const geometry =
                    getPhotoIndexGeometry();


                const fallbackWidth =
                    Math.round(
                        geometry.mediaHeight *
                        0.72
                    );


                button.style.width =
                    `${fallbackWidth}px`;

                button.style.flex =
                    `0 0 ${fallbackWidth}px`;

                button.style.minWidth =
                    `${fallbackWidth}px`;


                const imageWrap =
                    document.createElement(
                        "span"
                    );


                imageWrap.className =
                    "card-image-wrap";


                imageWrap.style.width =
                    `${fallbackWidth}px`;

                imageWrap.style.height =
                    `${geometry.mediaHeight}px`;


                const img =
                    document.createElement(
                        "img"
                    );


                img.dataset.src =
                    getPhotoUrl(
                        project.cover
                    );


                img.alt =
                    "";


                img.loading =
                    "lazy";


                img.decoding =
                    "async";


                img.fetchPriority =
                    "low";


                img.addEventListener(
                    "load",
                    () => {

                        syncPhotoIndexCardSize(
                            img,
                            button,
                            imageWrap
                        );

                    }
                );


                if (
                    img.complete &&
                    img.naturalWidth
                ) {

                    syncPhotoIndexCardSize(
                        img,
                        button,
                        imageWrap
                    );

                }


                indexImageObserver.observe(
                    img
                );


                imageWrap.appendChild(
                    img
                );


                const copy =
                    document.createElement(
                        "span"
                    );


                copy.className =
                    "card-copy";


                const title =
                    document.createElement(
                        "span"
                    );


                title.className =
                    "card-title";


                const titleBase =
                    project.title
                        .toLowerCase();


                renderBaseTypography(
                    title,
                    titleBase
                );


                const date =
                    document.createElement(
                        "span"
                    );


                date.className =
                    "card-date";


                const dateBase =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();


                renderBaseTypography(
                    date,
                    dateBase
                );


                copy.append(
                    title,
                    date
                );


                button.append(
                    imageWrap,
                    copy
                );


                const titleCase =
                    createCaseController(
                        title,
                        titleBase
                    );


                const dateCase =
                    createCaseController(
                        date,
                        dateBase
                    );


                button.addEventListener(
                    "mouseenter",
                    () => {

                        if (
                            !window.matchMedia(
                                "(hover: hover)"
                            ).matches
                        ) {

                            return;

                        }


                        titleCase.upper();


                        dateCase.upper();

                    }
                );


                button.addEventListener(
                    "mouseleave",
                    () => {

                        if (
                            !window.matchMedia(
                                "(hover: hover)"
                            ).matches
                        ) {

                            return;

                        }


                        titleCase.lower();


                        dateCase.lower();

                    }
                );


                button.addEventListener(
                    "click",
                    event => {

                        if (
                            indexDragMoved
                        ) {

                            event.preventDefault();


                            event.stopPropagation();


                            return;

                        }


                        event.stopPropagation();


                        exitIndexToProject(
                            originalIndex
                        );

                    }
                );


                indexGrid.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   WORD CASE
   ===================================================== */

function renderWordCase(
    word,
    upperCount
) {

    let result =
        "";


    for (
        let i = 0;
        i < word.length;
        i++
    ) {

        result +=
            i < upperCount
                ? word[i].toUpperCase()
                : word[i].toLowerCase();

    }


    return result;

}


/* =====================================================
   INDEX WORD
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(
    state
) {

    indexWordState =
        state;


    renderInteractiveTypography(
        indexButton,
        renderWordCase(
            indexWord,
            state
        ),
        new Set(
            getLetterPositions(
                indexWord
            ).slice(
                0,
                state
            )
        )
    );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !== null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    if (
        startState === target
    ) {

        renderIndexWord(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress < 1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


/* =====================================================
   INDEX HOVER
   ===================================================== */

indexButton.addEventListener(
    "mouseenter",
    () => {

        if (
            isPhoneLayout()
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? 0
                : indexWord.length
        );

    }
);


indexButton.addEventListener(
    "mouseleave",
    () => {

        if (
            isPhoneLayout()
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? indexWord.length
                : 0
        );

    }
);


/* =====================================================
   INDEX POSITION
   ===================================================== */

function saveIndexPosition() {

    savedIndexScrollLeft =
        indexScroller.scrollLeft;

}


function restoreIndexPosition() {

    requestAnimationFrame(
        () => {

            indexScroller.scrollLeft =
                savedIndexScrollLeft;

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    /*
        INDEX is an explicit interaction.
        From this point on the initial autoplay may never resume.
    */
    stopAutoSlideshow();


    updateIndexContentTop();


    if (
        isPhoneLandscape()
    ) {

        updateLandscapeGeometry();

    }


    indexMode =
        true;


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    restoreIndexPosition();


    requestAnimationFrame(
        activateIndexImagesNearViewport
    );


    /* The INDEX word morph is cosmetic; unlock the grid immediately. */
    morphIndexTo(
        indexWord.length
    );


    indexScroller.focus(
        {
            preventScroll: true
        }
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   VIEW ALL -> INDEX
   ===================================================== */

async function enterIndexFromProjectAll() {

    if (
        projectViewAnimating ||
        interfaceAnimating
    ) {

        return;

    }


    await leaveProjectAll(
        {
            resume: false
        }
    );


    await enterIndex();

}


/* =====================================================
   RETURN FROM INDEX
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    updateResponsiveMode();


    syncMetadataAfterRender();


    /*
        Leaving INDEX always returns to a manual slideshow.
    */
    manualMode =
        true;


    clearTimeout(
        slideTimer
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    enterFocusedProjectMode(
        targetProjectIndex
    );


    await showFrame(
        targetProjectIndex,
        0
    );


    updateResponsiveMode();


    syncMetadataAfterRender();


    /*
        Opening a project from INDEX is a manual selection.
        Do not restart autoplay.
    */
    manualMode =
        true;


    clearTimeout(
        slideTimer
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX CLICK
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();


        if (
            interfaceAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            projectAllMode
        ) {

            await enterIndexFromProjectAll();


            return;

        }


        if (
            indexMode
        ) {

            await returnFromIndex();

        }

        else {

            await enterIndex();

        }

    }
);


/* =====================================================
   INDEX WHEEL
   ===================================================== */

indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode
        ) {

            return;

        }


        event.preventDefault();


        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=
            movement *
            INDEX_WHEEL_MULTIPLIER;

    },
    {
        passive: false
    }
);


/* =====================================================
   INDEX KEYBOARD
   ===================================================== */

indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        -INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }

    }
);


/* =====================================================
   INDEX SCROLL SAVE
   ===================================================== */

indexScroller.addEventListener(
    "scroll",
    () => {

        if (
            indexMode
        ) {

            savedIndexScrollLeft =
                indexScroller.scrollLeft;

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   INDEX DRAG
   ===================================================== */

indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );


        event.preventDefault();

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        if (
            Math.abs(
                delta
            ) > 10
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


function endIndexDrag() {

    if (
        !indexDragging
    ) {

        return;

    }


    indexDragging =
        false;


    indexScroller.classList.remove(
        "dragging"
    );


    saveIndexPosition();


    if (
        indexDragMoved
    ) {

        setTimeout(
            () => {

                indexDragMoved =
                    false;

            },
            0
        );

    }

}


window.addEventListener(
    "mouseup",
    endIndexDrag
);


window.addEventListener(
    "blur",
    endIndexDrag
);


/* =====================================================
   SLIDESHOW CLICK
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #index-button, #view-all-button"
            )
        ) {

            return;

        }


        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        if (
            position < 0.25
        ) {

            await previousFrame();

        }

        else {

            await nextFrame();

        }

    }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await returnFromIndex();

            }


            return;

        }


        if (
            projectAllMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await exitProjectAll();

            }


            return;

        }


        if (
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            await performPrimarySlideAction();


            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousFrame();

        }


        else if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextFrame();

        }

    }
);


/* =====================================================
   TOUCH
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating ||
            touchStartX === null ||
            touchStartY === null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) < 45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX < 0
        ) {

            await nextFrame();

        }

        else {

            await previousFrame();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters =
    [

        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )

    ];


const lowercase =
    [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


const uppercase =
    [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


let logoResolve =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        const isMorphUpper =
            i < state;


        letters[i].textContent =
            isMorphUpper
                ? uppercase[i]
                : lowercase[i];


        letters[i].style.fontFamily =
            isMorphUpper
                ? 'var(--morph-font)'
                : 'var(--sans-font)';


        letters[i].style.fontWeight =
            isMorphUpper
                ? 'var(--morph-weight)'
                : 'var(--sans-weight)';

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        if (
            logoResolve
        ) {

            const resolve =
                logoResolve;


            logoResolve =
                null;


            resolve();

        }


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            LOGO_STEP_DURATION
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !== null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    if (
        logoResolve
    ) {

        logoResolve();

        logoResolve =
            null;

    }


    return new Promise(
        resolve => {

            logoResolve =
                resolve;


            moveLogo();

        }
    );

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            !isPhoneLayout()
        ) {

            animateLogoTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            !isPhoneLayout()
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


/* =====================================================
   MOBILE LOGO TAP

   Mobile only:
   Denizalp / aybak
        ->
   denizalp / AYBAK
        -> short hold
        -> landing page

   No automatic logo animation.
   Desktop hover/click behaviour stays unchanged.
   ===================================================== */

logo.addEventListener(
    "click",
    async event => {

        if (
            !isPhoneLayout()
        ) {

            return;

        }


        event.preventDefault();


        await animateLogoTo(
            5
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    MOBILE_NAV_HOLD
                )
        );


        window.location.href =
