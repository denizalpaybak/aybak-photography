<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    color: #000;

}


/* =====================================================
   INFORMATION
   ===================================================== */

.info {
    position: fixed;
    top: 32px;
    left: 48px;
    z-index: 100;

    font-size: 15px;
    line-height: 1.15;
}

.logo {
    position: relative;
    display: block;

    width: 190px;
    height: 52px;

    text-decoration: none;
}

.logo-name {
    position: absolute;
    top: 0;
    left: 0;
    white-space: nowrap;
}

.logo-aybak {
    position: absolute;
    top: 17px;

    white-space: nowrap;
}

.contact,

    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;

}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   SECTION SWITCH
   ===================================================== */

.section-switch {
    position: fixed;
    top: 32px;
    right: 48px;

    color: #000;
    text-decoration: none;

    font-size: 15px;
    line-height: 1.15;
}


/* =====================================================
   PROJECT VIEW
   ===================================================== */

#project-stage {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

#project-block {

    flex-direction: column;
    align-items: center;

}

#current-photo {

    height: auto;

    max-width: 70vw;
    max-height: 72vh;

    object-fit: contain;

    pointer-events: none;

/* =====================================================
   METADATA
   ===================================================== */

#project-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;

    width: auto;

    margin-top: 9px;

    font-size: 15px;
    line-height: 1.15;

    white-space: nowrap;

    pointer-events: none;
}

#project-counter {
    text-align: right;
}


/* =====================================================
   TOOLBAR
   ===================================================== */

#controls {
    display: grid;

    grid-template-columns:
        1.45fr
        1fr
        auto
        1fr
        1.45fr;

    align-items: center;

    width: auto;

    margin-top: 3px;

    white-space: nowrap;

}

.control-slot {
    min-width: 0;
}

.slot-prev-work {
    text-align: left;
}

.slot-prev {
    text-align: center;
}

.slot-index {
    text-align: center;
}

.slot-next {
    text-align: center;
}

.slot-next-work {
    text-align: right;
}

.control-button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;

    color: #000;

    font: inherit;

    cursor: pointer;

    text-decoration: none;

    -webkit-tap-highlight-color: transparent;
}

.control-button:hover,
.control-button:focus,
.control-button:active {
    text-decoration: none;
    outline: 0;
}

#index-button.index-active {
    cursor: default;
    pointer-events: none;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    display: none;

    width: 100%;

    padding:
        138px
        48px
        70px;

    background: #fff;
}

#index-view.visible {
    display: block;
}

#index-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap:
        48px
        32px;

    width: 100%;
}

.project-card {
    appearance: none;
    -webkit-appearance: none;

    display: block;

    width: 100%;

    margin: 0;
    padding: 0;

    border: 0;
    background: transparent;

    color: #000;

    font: inherit;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.project-card img {
    display: block;

    width: 100%;
    height: auto;

    margin: 0 0 8px 0;

    object-fit: contain;
}

.card-title,
.card-date {
    display: block;

    font-size: 15px;
    line-height: 1.15;
}

.card-date:empty {
    display: none;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

html.index-mode,
body.index-mode {
    height: auto;
    min-height: 100%;

    overflow-y: auto;
}

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================

<script>


/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";

const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;

const TOOLBAR_ANIMATION_DURATION =
    400;

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS
   ===================================================== */

const html =
    document.documentElement;

const body =
    document.body;

const info =
    document.getElementById(
        "info"
    );

const projectStage =
    document.getElementById(
        "project-stage"
    );

const currentPhoto =
    document.getElementById(
        "current-photo"
    );

const projectMeta =
    document.getElementById(
        "project-meta"
    );

const projectLabel =
    document.getElementById(
        "project-label"
    );

const projectCounter =
    document.getElementById(
        "project-counter"
    );

const controls =
    document.getElementById(
        "controls"
    );

const previousWorkButton =
    document.getElementById(
        "previous-work-button"
    );

const previousButton =
    document.getElementById(
        "previous-button"
    );

const indexButton =
    document.getElementById(
        "index-button"
    );

const nextButton =
    document.getElementById(
        "next-button"
    );

const nextWorkButton =
    document.getElementById(
        "next-work-button"
    );

const indexView =
    document.getElementById(
        "index-view"
    );

const indexGrid =
    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];

let projectIndex =
    0;

let imageIndex =
    0;

let manualMode =
    false;

let indexMode =
    false;

let slideTimer =
    null;

let interfaceAnimating =
    false;


/* =====================================================
   IMAGE CACHE
   ===================================================== */

const imageCache =
    new Map();


function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   PROJECT HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   PRELOAD NEARBY
   ===================================================== */

function preloadAroundCurrent() {

    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const index =
            imageIndex +
            offset;


        if (
            index <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    index
                ]
            ).catch(
                () => {}
            );

        }

    }


    if (
        imageIndex >
        0
    ) {

        preloadImage(
            project.images[
                imageIndex -
                1
            ]
        ).catch(
            () => {}
        );

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex +
                1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   PRELOAD INDEX COVERS
   ===================================================== */

function preloadCovers() {

    projects.forEach(
        project => {

            preloadImage(
                project.cover
            ).catch(
                () => {}
            );

        }
    );

}


/* =====================================================
   WIDTH SYNC
   ===================================================== */

function syncProjectWidths() {

    if (
        indexMode
    ) {

        return;

    }


    const width =
        currentPhoto
            .getBoundingClientRect()
            .width;


    if (
        width >
        0
    ) {

        projectMeta.style.width =
            `${width}px`;

        controls.style.width =
            `${width}px`;

    }

}


/* =====================================================
   METADATA
   ===================================================== */

function updateMetadata() {

    const project =
        currentProject();


    projectLabel.textContent =
        project.date
            ? `${project.title} — ${project.date}`
            : project.title;


    const currentNumber =
        String(
            imageIndex +
            1
        ).padStart(
            2,
            "0"
        );


    const totalNumber =
        String(
            project.images.length
        ).padStart(
            2,
            "0"
        );


    projectCounter.textContent =
        `${currentNumber}/${totalNumber}`;

}


/* =====================================================
   GENERIC TEXT DELETE / REVEAL
   ===================================================== */

const textAnimations =
    new WeakMap();


function cancelTextAnimation(
    element
) {

    if (
        textAnimations.has(
            element
        )
    ) {

        cancelAnimationFrame(
            textAnimations.get(
                element
            )
        );


        textAnimations.delete(
            element
        );

    }

}


function animateTextLength(
    element,
    fullText,
    show,
    duration =
        TOOLBAR_ANIMATION_DURATION
) {

    cancelTextAnimation(
        element
    );


    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const length =
                    show
                        ? Math.round(
                            progress *
                            fullText.length
                        )
                        : Math.round(
                            (
                                1 -
                                progress
                            ) *
                            fullText.length
                        );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress <
                    1
                ) {

                    const id =
                        requestAnimationFrame(
                            frame
                        );


                    textAnimations.set(
                        element,
                        id
                    );

                }

                else {

                    element.textContent =
                        show
                            ? fullText
                            : "";


                    textAnimations.delete(
                        element
                    );


                    resolve();

                }

            }


            const id =
                requestAnimationFrame(
                    frame
                );


            textAnimations.set(
                element,
                id
            );

        }
    );

}


/* =====================================================
   INDEX CASE ANIMATION
   ===================================================== */

function renderIndexCase(
    upperCount
) {

    const word =
        "index";


    let result =
        "";


    for (
        let i = 0;
        i <
        word.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? word[i]
                    .toUpperCase()
                : word[i];

    }


    indexButton.textContent =
        result;

}


function animateIndexCase(
    toUpper
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        TOOLBAR_ANIMATION_DURATION
                    );


                const upperCount =
                    toUpper
                        ? Math.round(
                            progress *
                            5
                        )
                        : Math.round(
                            (
                                1 -
                                progress
                            ) *
                            5
                        );


                renderIndexCase(
                    upperCount
                );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderIndexCase(
                        toUpper
                            ? 5
                            : 0
                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   FIRST / LAST FRAME CONTROL STATES
   ===================================================== */

let previousVisible =
    false;

let nextVisible =
    true;


function updateFrameControls(
    animate =
        true
) {

    const project =
        currentProject();


    const shouldShowPrevious =
        imageIndex >
        0;


    const shouldShowNext =
        imageIndex <
        project.images.length -
        1;


    if (
        shouldShowPrevious !==
        previousVisible
    ) {

        previousVisible =
            shouldShowPrevious;


        if (
            animate
        ) {

            animateTextLength(
                previousButton,
                "previous",
                shouldShowPrevious
            );

        }

        else {

            previousButton.textContent =
                shouldShowPrevious
                    ? "previous"
                    : "";

        }


        previousButton.disabled =
            !shouldShowPrevious;

    }


    if (
        shouldShowNext !==
        nextVisible
    ) {

        nextVisible =
            shouldShowNext;


        if (
            animate
        ) {

            animateTextLength(
                nextButton,
                "next",
                shouldShowNext
            );

        }

        else {

            nextButton.textContent =
                shouldShowNext
                    ? "next"
                    : "";

        }


        nextButton.disabled =
            !shouldShowNext;

    }

}


/* =====================================================
   SHOW IMAGE
   ===================================================== */

async function showImage(
    newProjectIndex,
    newImageIndex,
    animateControls =
        true
) {

    const targetProjectIndex =
        normalizeProjectIndex(
            newProjectIndex
        );


    const project =
        projects[
            targetProjectIndex
        ];


    const boundedImageIndex =
        Math.max(
            0,
            Math.min(
                newImageIndex,
                project.images.length -
                1
            )
        );


    const filename =
        project.images[
            boundedImageIndex
        ];


    try {

        const img =
            await preloadImage(
                filename
            );


        projectIndex =
            targetProjectIndex;

        imageIndex =
            boundedImageIndex;


        currentPhoto.src =
            img.src;


        updateMetadata();


        updateFrameControls(
            animateControls
        );


        preloadAroundCurrent();


        requestAnimationFrame(
            syncProjectWidths
        );


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        return false;

    }

}


/* =====================================================
   PROJECT NAVIGATION
   ===================================================== */

async function goPreviousWork() {

    stopAutoSlideshow();


    const target =
        normalizeProjectIndex(
            projectIndex -
            1
        );


    await showImage(
        target,
        0
    );

}


async function goNextWork() {

    stopAutoSlideshow();


    const target =
        normalizeProjectIndex(
            projectIndex +
            1
        );


    await showImage(
        target,
        0
    );

}


/* =====================================================
   FRAME NAVIGATION
   ===================================================== */

async function goPreviousFrame() {

    if (
        imageIndex <=
        0
    ) {

        return;

    }


    stopAutoSlideshow();


    await showImage(
        projectIndex,
        imageIndex -
        1
    );

}


async function goNextFrame() {

    const project =
        currentProject();


    if (
        imageIndex >=
        project.images.length -
        1
    ) {

        return;

    }


    stopAutoSlideshow();


    await showImage(
        projectIndex,
        imageIndex +
        1
    );

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                const project =
                    currentProject();


                if (
                    imageIndex <
                    project.images.length -
                    1
                ) {

                    await showImage(
                        projectIndex,
                        imageIndex +
                        1
                    );

                }

                else {

                    await showImage(
                        projectIndex +
                        1,
                        0
                    );

                }


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    projects.forEach(
        (
            project,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "project-card";


            button.type =
                "button";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                getPhotoUrl(
                    project.cover
                );


            img.alt =
                "";


            img.loading =
                "lazy";


            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "card-title";


            title.textContent =
                project.title;


            const date =
                document.createElement(
                    "span"
                );


            date.className =
                "card-date";


            date.textContent =
                project.date ||
                "";


            button.append(
                img,
                title,
                date
            );


            button.addEventListener(
                "click",
                () => {

                    exitIndexToProject(
                        index
                    );

                }
            );


            indexGrid.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    stopAutoSlideshow();


    indexButton.classList.add(
        "index-active"
    );


    const animations =
        [

            animateTextLength(
                previousWorkButton,
                "previous work",
                false
            ),

            animateTextLength(
                previousButton,
                "previous",
                false
            ),

            animateIndexCase(
                true
            ),

            animateTextLength(
                nextButton,
                "next",
                false
            ),

            animateTextLength(
                nextWorkButton,
                "next work",
                false
            )

        ];


    /*
        Grid appears midway through
        the toolbar transformation.
    */

    setTimeout(
        () => {

            indexMode =
                true;


            html.classList.add(
                "index-mode"
            );


            body.classList.add(
                "index-mode"
            );


            indexView.classList.add(
                "visible"
            );


            window.scrollTo(
                0,
                0
            );

        },
        TOOLBAR_ANIMATION_DURATION /
        2
    );


    await Promise.all(
        animations
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   EXIT INDEX THROUGH THUMBNAIL
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    /*
        Start loading chosen work immediately.
    */

    const targetProject =
        projects[
            targetProjectIndex
        ];


    const imagePromise =
        preloadImage(
            targetProject.images[
                0
            ]
        );


    /*
        Remove grid as reverse toolbar
        transformation begins.
    */

    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    html.classList.remove(
        "index-mode"
    );


    body.classList.remove(
        "index-mode"
    );


    const showPreviousAfter =
        false;


    const showNextAfter =
        targetProject.images.length >
        1;


    const animations =
        [

            animateTextLength(
                previousWorkButton,
                "previous work",
                true
            ),

            animateTextLength(
                previousButton,
                "previous",
                showPreviousAfter
            ),

            animateIndexCase(
                false
            ),

            animateTextLength(
                nextButton,
                "next",
                showNextAfter
            ),

            animateTextLength(
                nextWorkButton,
                "next work",
                true
            )

        ];


    await imagePromise
        .catch(
            () => {}
        );


    await showImage(
        targetProjectIndex,
        0,
        false
    );


    previousVisible =
        false;


    nextVisible =
        showNextAfter;


    await Promise.all(
        animations
    );


    indexButton.classList.remove(
        "index-active"
    );


    interfaceAnimating =
        false;


    startAutoSlideshow();

}

/* =====================================================
   MOBILE / INSTAGRAM POSITION
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const gapAfterInfo =
        24;


    const bottomGap =
        18;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window.visualViewport.offsetTop;


        viewportHeight =
            window.visualViewport.height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            120,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";

}


/* =====================================================
   LOGO ANIMATION
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );

const logoName =
    document.getElementById(
        "logo-name"
    );

const letters =
    [
        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )
    ];


const lowercase =
    [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


const uppercase =
    [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


let logoState =
    0;

let logoTarget =
    0;

let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state ===
        0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i <
        letters.length;
        i++
    ) {

        letters[i].textContent =
            i <
            state
                ? uppercase[
                    i
                ]
                : lowercase[
                    i
                ];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


function mobileLogoCycle() {

    setTimeout(
        () => {

            animateLogoTo(
                5
            );


            setTimeout(
                () => {

                    animateLogoTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   FILM SWITCH
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );

const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );

const switchWord =
    "film";

let switchState =
    0;

let switchFrame =
    null;


function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i <
        switchWord.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? switchWord[
                    i
                ].toUpperCase()
                : switchWord[
                    i
                ];

    }


    sectionSwitchText.textContent =
        result;

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);

/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        await showImage(
            0,
            0,
            false
        );


        previousVisible =
            false;


        nextVisible =
            currentProject()
                .images
                .length >
            1;


        previousButton.textContent =
            "";


        previousButton.disabled =
            true;


        nextButton.textContent =
            nextVisible
                ? "next"
                : "";


        nextButton.disabled =
            !nextVisible;


        preloadCovers();


        updateMobileStage();


        syncProjectWidths();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexCase(
    0
);


loadProjects();

</script>
