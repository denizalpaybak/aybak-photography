<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFORMATION
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 100;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    margin: 0;
    padding: 0;

    color: inherit;
    text-decoration: none;

    cursor: pointer;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT / SOCIAL
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   SECTION SWITCH
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 100;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);

    white-space: nowrap;
}


/* =====================================================
   PROJECT STAGE
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   PROJECT BLOCK
   ===================================================== */

#project-block {
    display: flex;
    flex-direction: column;
    align-items: center;

    width: auto;
    height: auto;

    pointer-events: none;
}


/* =====================================================
   SPREAD
   ===================================================== */

#spread {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    width: auto;
    height: auto;

    max-width: 70vw;

    pointer-events: none;
}


/* =====================================================
   SPREAD IMAGE
   ===================================================== */

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: 70vw;
    max-height: 68vh;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PAIR
   ===================================================== */

#spread.pair .spread-image {
    max-width:
        calc(
            (
                70vw -
                8px
            )
            /
            2
        );

    max-height: 66vh;
}


/* =====================================================
   SINGLE
   ===================================================== */

#spread.single .spread-image {
    max-width: 70vw;
    max-height: 68vh;
}


/* =====================================================
   PROJECT METADATA
   title left / date right
   ===================================================== */

#project-meta {
    display: flex;

    justify-content: space-between;
    align-items: baseline;

    width: auto;

    margin-top: 9px;

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    white-space: nowrap;

    pointer-events: none;
}

#project-title {
    text-align: left;
}

#project-date {
    text-align: right;
}


/* =====================================================
   FRAME ARROWS
   ===================================================== */

#frame-navigation {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    width: 92px;

    margin-top: 4px;
    margin-bottom: 2px;

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: auto;
}

.frame-slot-left {
    text-align: left;
}

.frame-slot-right {
    text-align: right;
}

.frame-button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-family: inherit;
    font-size: var(--font-size);
    line-height: var(--line-height);

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.frame-button.hidden {
    visibility: hidden;
    pointer-events: none;
}

.frame-button:hover,
.frame-button:focus,
.frame-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   WORK NAVIGATION
   ===================================================== */

#work-controls {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    width: auto;

    margin-top: 0;

    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    pointer-events: auto;
}

.work-control-left {
    text-align: left;
}

.work-control-center {
    min-width: 72px;

    text-align: center;
}

.work-control-right {
    text-align: right;
}


/* =====================================================
   BUTTON
   ===================================================== */

.control-button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font: inherit;

    cursor: pointer;

    text-decoration: none;

    -webkit-tap-highlight-color: transparent;
}

.control-button:hover,
.control-button:focus,
.control-button:focus-visible,
.control-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   GLOBAL INDEX
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 150;

    transform: translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-family: inherit;
    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

#index-button:hover,
#index-button:focus,
#index-button:active {
    outline: 0;
    text-decoration: none;
}

#index-button.index-active {
    pointer-events: none;
    cursor: default;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    padding:
        108px
        56px
        62px;

    background: #fff;

    overflow: hidden;

    cursor: default;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   INDEX GRID — DESKTOP
   ===================================================== */

#index-grid {
    display: grid;

    grid-template-columns:
        repeat(
            5,
            minmax(
                0,
                1fr
            )
        );

    grid-template-rows:
        repeat(
            3,
            minmax(
                0,
                1fr
            )
        );

    gap:
        24px
        32px;

    width: 100%;
    height: 100%;

    align-items: center;
    justify-items: center;
}


/* =====================================================
   PROJECT CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    display: flex;
    flex-direction: column;

    width:
        min(
            100%,
            210px
        );

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    font: inherit;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   THUMB
   ===================================================== */

.card-image-wrap {
    display: block;

    width: 100%;

    aspect-ratio: 3 / 4;

    overflow: hidden;

    background: #fff;
}

.project-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;
}


/* =====================================================
   INDEX COPY

   title left / date right
   ===================================================== */

.card-copy {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    align-items: start;

    width: 100%;

    margin-top: 6px;

    column-gap: 10px;

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;
}

.card-title {
    min-width: 0;

    text-align: left;

    white-space: normal;

    overflow-wrap: normal;
    word-break: normal;
}

.card-date {
    text-align: right;

    white-space: nowrap;
}

.card-date:empty {
    display: none;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode {
    cursor: default;
}

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET PORTRAIT
   ===================================================== */

@media
    (max-width: 1100px)
    and (orientation: portrait) {

    #index-view {

            62px;
    }

                minmax(

        grid-template-rows:

    }

    .project-card {

    }

}


/* =====================================================
   MOBILE PORTRAIT
   ===================================================== */

@media (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

    }


    /* -------------------------
       STAGE
       ------------------------- */

        left: 0;

        height: auto;
    }


    /*
        Mobile portrait always
        shows one image.
    */

        gap: 0;

        max-width: 84vw;
    }

    #spread.pair {
        display: block;
    }

    #spread.pair
    .spread-image:nth-child(2) {
        display: none;
    }

    #spread.pair .spread-image,
    #spread.single .spread-image {
        max-width: 84vw;

        max-height:
            calc(
                100% -

    }


    /* -------------------------
       PROJECT INFO
       ------------------------- */

    #project-meta {
        margin-top: 8px;
    }

        margin-top: 4px;

        width: 76px;
    }

    #work-controls {
        margin-top: 0;
    }

    .work-control-center {
        min-width: 62px;
    }


    /* -------------------------
       INDEX
       ------------------------- */

    #index-view {
        overflow-y: auto;

        padding:
            118px
            20px
            72px;

        -webkit-overflow-scrolling:
            touch;
    }


    /*
        2 columns:
        enough width for real typography.
    */

    #index-grid {
        display: grid;

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );

        grid-template-rows:
            none;

        grid-auto-rows: auto;

        gap:
            30px
            18px;

        width: 100%;
        height: auto;

        align-items: start;
    }

    .project-card {
        width: 100%;
    }

    .card-copy {
        margin-top: 5px;

        column-gap: 6px;

        font-size:
            var(--font-size);
    }

}


/* =====================================================
   SHORT LANDSCAPE
   ===================================================== */

@media
    (orientation: landscape)

    :root {

    }

    .logo-aybak {

    }

                    0,

        grid-template-rows:

                    0,

    }

    .project-card {

/* =====================================================

@media

<script>


/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";


const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;


const TOOLBAR_ANIMATION_DURATION =
    400;


const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS
   ===================================================== */

const body =
    document.body;


const info =
    document.getElementById(
        "info"
    );


const projectStage =
    document.getElementById(
        "project-stage"
    );


const spread =
    document.getElementById(
        "spread"
    );


const projectMeta =
    document.getElementById(
        "project-meta"
    );


const projectTitle =
    document.getElementById(
        "project-title"
    );


const projectDate =
    document.getElementById(
        "project-date"
    );


const frameNavigation =
    document.getElementById(
        "frame-navigation"
    );


const previousFrameButton =
    document.getElementById(
        "previous-frame-button"
    );


const nextFrameButton =
    document.getElementById(
        "next-frame-button"
    );


const workControls =
    document.getElementById(
        "work-controls"
    );


const projectCounter =
    document.getElementById(
        "project-counter"
    );


const previousWorkButton =
    document.getElementById(
        "previous-work-button"
    );


const nextWorkButton =
    document.getElementById(
        "next-work-button"
    );


const indexButton =
    document.getElementById(
        "index-button"
    );


const indexView =
    document.getElementById(
        "index-view"
    );


const indexGrid =
    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];


let projectIndex =
    0;


let spreadStart =
    0;


let spreadEnd =
    0;


let manualMode =
    false;


let indexMode =
    false;


let slideTimer =
    null;


let interfaceAnimating =
    false;


/* =====================================================
   TOUCH
   ===================================================== */

let touchStartX =
    null;


let touchStartY =
    null;


/*
    Prevent the synthetic click after
    a completed swipe.
*/

let suppressClickUntil =
    0;


/* =====================================================
   IMAGE CACHE
   ===================================================== */

const imageCache =
    new Map();


const spreadCache =
    new Map();


/* =====================================================
   URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   PRELOAD
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            {

                                img,

                                portrait:
                                    img.naturalHeight >
                                    img.naturalWidth

                            }
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   PROJECT HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   PAIR MODE
   ===================================================== */

function shouldUsePairLayout() {

    if (
        window.innerWidth <=
        600 &&
        window.innerHeight >
        window.innerWidth
    ) {

        return false;

    }


    return true;

}


/* =====================================================
   GET SPREAD
   ===================================================== */

async function getForwardSpread(
    targetProjectIndex,
    startIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const first =
        await preloadImage(
            project.images[
                startIndex
            ]
        );


    if (
        !shouldUsePairLayout()
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [
                    first
                ]

        };

    }


    if (
        !first.portrait
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [
                    first
                ]

        };

    }


    if (
        startIndex >=
        project.images.length -
        1
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [
                    first
                ]

        };

    }


    const second =
        await preloadImage(
            project.images[
                startIndex +
                1
            ]
        );


    if (
        second.portrait
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex +
                1,

            images:
                [
                    first,
                    second
                ]

        };

    }


    return {

        start:
            startIndex,

        end:
            startIndex,

        images:
            [
                first
            ]

    };

}


/* =====================================================
   BUILD SPREAD MAP
   ===================================================== */

async function buildProjectSpreads(
    targetProjectIndex
) {

    const mode =
        shouldUsePairLayout()
            ? "pair"
            : "single";


    const cacheKey =
        `${targetProjectIndex}:${mode}`;


    if (
        spreadCache.has(
            cacheKey
        )
    ) {

        return spreadCache.get(
            cacheKey
        );

    }


    const project =
        projects[
            targetProjectIndex
        ];


    const spreads =
        [];


    let index =
        0;


    while (
        index <
        project.images.length
    ) {

        const data =
            await getForwardSpread(
                targetProjectIndex,
                index
            );


        spreads.push(
            data
        );


        index =
            data.end +
            1;

    }


    spreadCache.set(
        cacheKey,
        spreads
    );


    return spreads;

}


/* =====================================================
   CURRENT SPREAD POSITION
   ===================================================== */

async function getCurrentSpreadPosition() {

    const spreads =
        await buildProjectSpreads(
            projectIndex
        );


    let position =
        0;


    for (
        let i = 0;
        i <
        spreads.length;
        i++
    ) {

        if (
            spreads[
                i
            ].start ===
            spreadStart
        ) {

            position =
                i;


            break;

        }

    }


    return {

        spreads,
        position

    };

}


/* =====================================================
   ARROW STATE

   First spread:
   no left arrow.

   Last spread:
   no right arrow.
   ===================================================== */

async function updateFrameArrows() {

    if (
        projects.length ===
        0
    ) {

        return;

    }


    try {

        const {
            spreads,
            position
        } =
            await getCurrentSpreadPosition();


        const atBeginning =
            position ===
            0;


        const atEnd =
            position ===
            spreads.length -
            1;


        previousFrameButton
            .classList
            .toggle(
                "hidden",
                atBeginning
            );


        nextFrameButton
            .classList
            .toggle(
                "hidden",
                atEnd
            );

    }

    catch (error) {}

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            spreadEnd +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex +
                1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   RENDER SPREAD
   ===================================================== */

function renderSpread(
    spreadData
) {

    spread.innerHTML =
        "";


    spread.classList.remove(
        "single",
        "pair"
    );


    spread.classList.add(
        spreadData.images.length >
        1
            ? "pair"
            : "single"
    );


    spreadData.images.forEach(
        data => {

            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "spread-image";


            img.src =
                data.img.src;


            img.alt =
                "";


            spread.appendChild(
                img
            );

        }
    );

}


/* =====================================================
   METADATA
   ===================================================== */

function updateMetadata() {

    const project =
        currentProject();


    projectTitle.textContent =
        project.title;


    projectDate.textContent =
        project.date ||
        "";


    const total =
        project.images.length;

    ) {

            ).padStart(

            )}/${String(

            ).padStart(

            )}`;

    }

            ).padStart(

/* =====================================================
   WIDTH SYNC
   ===================================================== */

function syncProjectWidths() {

    if (
        indexMode
    ) {

        return;

    }


    const width =
        spread
            .getBoundingClientRect()
            .width;


    if (
        width >

    ) {

    }

}


/* =====================================================
   SHOW SPREAD
   ===================================================== */

async function showSpread(
    targetProjectIndex,
    targetStartIndex
) {

    const normalized =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalized
        ];


    if (
        !project
    ) {

        return false;

    }


    const safeStart =
        Math.max(
            0,
            Math.min(
                targetStartIndex,
                project.images.length -
                1
            )
        );


    try {

        const data =
            await getForwardSpread(
                normalized,
                safeStart
            );


        projectIndex =
            normalized;


        spreadStart =
            data.start;


        spreadEnd =
            data.end;


        renderSpread(
            data
        );


        updateMetadata();


        preloadAhead();


        requestAnimationFrame(
            syncProjectWidths
        );


        buildProjectSpreads(
            projectIndex
        )
        .then(
            updateFrameArrows
        )
        .catch(
            () => {}
        );


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        return false;

    }

}


/* =====================================================
   NEXT — CROSSES WORK BOUNDARY
   ===================================================== */

async function nextSpread() {

    const project =
        currentProject();


    if (
        spreadEnd <
        project.images.length -
        1
    ) {

        return showSpread(
            projectIndex,
            spreadEnd +
            1
        );

    }


    return showSpread(
        projectIndex +
        1,
        0
    );

}


/* =====================================================
   PREVIOUS — CROSSES WORK BOUNDARY
   ===================================================== */

async function previousSpread() {

    if (
        spreadStart <=
        0
    ) {

        const previousProjectIndex =
            normalizeProjectIndex(
                projectIndex -
                1
            );


        const previousSpreads =
            await buildProjectSpreads(
                previousProjectIndex
            );


        if (
            previousSpreads.length ===
            0
        ) {

            return false;

        }


        const last =
            previousSpreads[
                previousSpreads.length -
                1
            ];


        return showSpread(
            previousProjectIndex,
            last.start
        );

    }


    const {
        spreads,
        position
    } =
        await getCurrentSpreadPosition();


    if (
        position >
        0
    ) {

        return showSpread(
            projectIndex,
            spreads[
                position -
                1
            ].start
        );

    }


    return false;

}


/* =====================================================
   FRAME-ONLY PREVIOUS

   Does NOT cross work.
   ===================================================== */

async function previousFrameOnly() {

    const {
        spreads,
        position
    } =
        await getCurrentSpreadPosition();


    if (
        position <=
        0
    ) {

        return;

    }


    stopAutoSlideshow();


    await showSpread(
        projectIndex,
        spreads[
            position -
            1
        ].start
    );

}


/* =====================================================
   FRAME-ONLY NEXT

   Does NOT cross work.
   ===================================================== */

async function nextFrameOnly() {

    const {
        spreads,
        position
    } =
        await getCurrentSpreadPosition();


    if (
        position >=
        spreads.length -
        1
    ) {

        return;

    }


    stopAutoSlideshow();


    await showSpread(
        projectIndex,
        spreads[
            position +
            1
        ].start
    );

}


/* =====================================================
   WORK NAVIGATION
   ===================================================== */

async function goNextWork() {

    stopAutoSlideshow();


    await showSpread(
        projectIndex +

    );

}


async function goPreviousWork() {

    );

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextSpread();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,
                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                if (
                    !dateA &&
                    !dateB
                ) {

                    return (
                        a.originalIndex -
                        b.originalIndex
                    );

                }


                if (
                    !dateA
                ) {

                    return 1;

                }


                if (
                    !dateB
                ) {

                    return -1;

                }


                if (
                    dateA >
                    dateB
                ) {

                    return -1;

                }


                if (
                    dateA <
                    dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    const chronological =
        getChronologicalProjects();


    chronological.forEach(
        item => {

            const project =
                item.project;


            const originalIndex =
                item.originalIndex;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "project-card";


            button.type =
                "button";


            const imageWrap =
                document.createElement(
                    "span"
                );


            imageWrap.className =
                "card-image-wrap";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                getPhotoUrl(
                    project.cover
                );


            img.alt =
                "";


            img.loading =
                "eager";


            imageWrap.appendChild(
                img
            );


            const copy =
                document.createElement(
                    "span"
                );


            copy.className =
                "card-copy";


            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "card-title";


            title.textContent =
                project.title;


            const date =
                document.createElement(
                    "span"
                );


            date.className =
                "card-date";


            date.textContent =
                project.date ||
                "";


            copy.append(
                title,
                date
            );


            button.append(
                imageWrap,
                copy
            );


            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    exitIndexToProject(
                        originalIndex
                    );

                }
            );


            indexGrid.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   TEXT ANIMATION
   ===================================================== */

function animateTextLength(
    element,
    fullText,
    show,
    duration =
        TOOLBAR_ANIMATION_DURATION
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const length =
                    show
                        ? Math.round(
                            progress *
                            fullText.length
                        )
                        : Math.round(
                            (
                                1 -
                                progress
                            ) *
                            fullText.length
                        );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        show
                            ? fullText
                            : "";


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   INDEX CASE
   ===================================================== */

function renderIndexCase(
    upperCount
) {

    const word =
        "index";


    let result =
        "";


    for (
        let i = 0;
        i <
        word.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? word[
                    i
                ].toUpperCase()
                : word[
                    i
                ];

    }


    indexButton.textContent =
        result;

}


function animateIndexCase(
    toUpper
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        TOOLBAR_ANIMATION_DURATION
                    );


                const count =
                    toUpper
                        ? Math.round(
                            progress *
                            5
                        )
                        : Math.round(
                            (
                                1 -
                                progress
                            ) *
                            5
                        );


                renderIndexCase(
                    count
                );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderIndexCase(
                        toUpper
                            ? 5
                            : 0
                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    stopAutoSlideshow();


    indexButton.classList.add(
        "index-active"
    );


    const animations =
        [

            animateTextLength(
                previousWorkButton,
                "previous work",
                false
            ),

            animateIndexCase(
                true
            ),

            animateTextLength(
                nextWorkButton,
                "next work",
                false
            )

        ];


    setTimeout(
        () => {

            indexMode =
                true;


            body.classList.add(
                "index-mode"
            );


            indexView.classList.add(
                "visible"
            );

        },
        TOOLBAR_ANIMATION_DURATION /
        2
    );


    await Promise.all(
        animations
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   EXIT INDEX
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    const animations =
        [

            animateTextLength(
                previousWorkButton,
                "previous work",
                true
            ),

            animateIndexCase(
                false
            ),

            animateTextLength(
                nextWorkButton,
                "next work",
                true
            )

        ];


    await showSpread(
        targetProjectIndex,
        0
    );


    await Promise.all(
        animations
    );


    indexButton.classList.remove(
        "index-active"
    );


    interfaceAnimating =
        false;


    startAutoSlideshow();

}

/* =====================================================
   GENERAL CLICK

   First click:
   stop.

   Afterwards:
   left 25% = previous
   right 75% = next.

   Crosses works.
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            indexMode ||
            interfaceAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #frame-navigation, #work-controls, #index-button"
            )
        ) {

            return;

        }


        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        if (
            position <
            0.25
        ) {

            await previousSpread();

        }

        else {

            await nextSpread();

        }

    }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode ||
            interfaceAnimating
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousSpread();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextSpread();

        }

    }
);


/* =====================================================
   TOUCH START
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive:
            true
    }
);


/* =====================================================
   TOUCH END
   ===================================================== */

document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            interfaceAnimating ||
            touchStartX ===
            null ||
            touchStartY ===
            null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) <
            45
        ) {

            return;

        }


        /*
            Prevent following synthetic click.
        */

        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX <
            0
        ) {

            await nextSpread();

        }

        else {

            await previousSpread();

        }

    },
    {
        passive:
            true
    }
);


/* =====================================================
   MOBILE / INSTAGRAM STAGE
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const gapAfterInfo =
        30;


    const bottomGap =
        58;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    /*
        Important:
        image can NEVER rise into the
        contact information block.
    */

    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            120,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";

}

function setLogoState(

) {

    logoName.textContent =
        state ===

            : "denizalp";


    for (
        let i = 0;
        i <

    ) {

                : lowercase[

                ];

    ) {

    setLogoState(
        logoState <
        logoTarget
            ? logoState +
                1
            : logoState -
                1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}

);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


function mobileLogoCycle() {

    setTimeout(
        () => {

            animateLogoTo(
                5
            );


            setTimeout(
                () => {

                    animateLogoTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   FILM SWITCH
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchFrame =
    null;


function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i <
        switchWord.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? switchWord[
                    i
                ].toUpperCase()
                : switchWord[
                    i
                ];

    }


    sectionSwitchText.textContent =
        result;

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   RESPONSIVE SPREAD REFRESH
   ===================================================== */

async function refreshResponsiveSpread() {

    if (
        projects.length ===
        0 ||
        indexMode
    ) {

        return;

    }


    spreadCache.clear();


    /*
        If changing from desktop pair to
        mobile single, preserve the first
        currently visible photo.
    */

    await showSpread(
        projectIndex,
        spreadStart
    );

}


/* =====================================================
   RESIZE
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        updateMobileStage();


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                async () => {

                    await refreshResponsiveSpread();


                    syncProjectWidths();

                },
                150
            );

    }
);


/* =====================================================
   ORIENTATION
   ===================================================== */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            async () => {

                updateMobileStage();


                await refreshResponsiveSpread();


                syncProjectWidths();

            },
            250
        );

    }
);


/* =====================================================
   VISUAL VIEWPORT
   ===================================================== */

if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            updateMobileStage
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileStage
        );

}


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        await showSpread(
            0,
            0
        );


        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        updateMobileStage();


        syncProjectWidths();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexCase(
    0
);


loadProjects();

</script>
