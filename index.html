<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<script>
/* Mobildeki Slide görünümü iptal edildi. Bütün cihazlar doğrudan View All ile açılır. */
(function () {
    document.documentElement.classList.add("desktop-viewall-boot");
})();
</script>

<title>Denizalp Aybak — Photography</title>
<link rel="stylesheet" href="https://use.typekit.net/rmn7qgm.css">
<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}

/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    /*
        NUMERAL ACTIVE STATE
        Digits cannot uppercase, so during the same morph state
        they gain a subtle amount of tracking instead.
    */
    --active-number-tracking: 0.055em;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;

    --image-max-width: 82vw;

    --visual-height: 84vh;

    --image-max-height:
        calc(
            var(--visual-height) -
            22px
        );

    --meta-top-gap: 10px;

    --index-content-top: 130px;

    --portrait-visual-top: 140px;


    /*
        PHONE LANDSCAPE —
        dynamically calculated by JS.
    */

    --landscape-safe-left: 300px;
    --landscape-safe-right: 120px;

    --landscape-index-top: 220px;

    --landscape-index-image-height: 220px;

    /*
        Wider than before.

        Long titles now have substantially more
        horizontal room underneath the image.
    */

    --landscape-index-card-width: 220px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: default;
}

/* Desktop opens in View All. Keep the temporary slide completely hidden
   until the View All grid has finished becoming the active view. */
html.desktop-viewall-boot #project-stage,
html.desktop-viewall-boot #project-all-view {
    visibility: hidden !important;
}

/* Explicit pointer states only for genuinely interactive elements. */
a,
button,
.project-card,
.project-all-thumb {
    cursor: pointer;
}

/* The slideshow itself remains clickable, without making empty page space look clickable. */
.spread-image {
    pointer-events: auto;
    cursor: pointer;
}


/* =====================================================
   INFO & LOGO (ORTALANMIŞ - LİNKSİZ)
   ===================================================== */

.info {
    position: fixed;
    top: var(--top);
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    font-size: var(--font-size);
    line-height: var(--line-height);
    text-align: center;
}

.logo {
    position: relative;
    display: inline-block;
    width: 190px;
    height: 52px;
    color: inherit;
    text-decoration: none;
    background: transparent;
    border: 0;
    outline: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
}

.logo-name {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
}

.logo-aybak {
    position: absolute;
    top: 17px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   INDEX VE INFO (SOL VE SAĞ ÜST)
   ===================================================== */

#index-button, #info-button {
    position: fixed;
    top: var(--top);
    z-index: 600;
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: inherit;
    font-size: var(--font-size);
    line-height: var(--line-height);
    white-space: nowrap;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
}

#index-button {
    left: var(--side);
}

#info-button {
    right: var(--side);
}

#index-button:hover, #info-button:hover {
    text-decoration: underline;
}


/* =====================================================
   PROJECT
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#project-block {
    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =====================================================
   VISUAL ZONE — DESKTOP / TABLET
   ===================================================== */

#visual-zone {
    position: absolute;

    top: 50%;
    left: 0;

    width: 100%;
    height: var(--visual-height);

    transform: translateY(-50%);

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   SLIDESHOW IMAGE
   ===================================================== */

#spread,
.image-cell {
    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: var(--image-max-width);
    max-height: var(--image-max-height);

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PROJECT META — DESKTOP / TABLET
   ===================================================== */

#project-meta {
    position: absolute;

    top:
        calc(
            50% +
            var(--visual-height) / 2 +
            var(--meta-top-gap)
        );

    left: 50%;

    width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}


/* =====================================================
   META LEFT
   ===================================================== */

#project-title {
    grid-column: 1;
    grid-row: 1;

    text-align: left;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    text-align: left;

    white-space: nowrap;
}


/* =====================================================
   META RIGHT
   ===================================================== */

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    text-align: right;

    white-space: nowrap;
}


/* =====================================================
   VIEW ALL / CLOSE
   ===================================================== */

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}

#view-all-button:hover,
#view-all-button:focus,
#view-all-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #spread {
    visibility: hidden;
}


/* =====================================================
   INVISIBLE GRID PREPARATION
   ===================================================== */

body.project-all-preparing #project-all-view {
    display: block;

    visibility: hidden;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;

    visibility: visible;
}


/* =====================================================
   VIEW ALL GRID

   Tighter gap = larger usable thumbnails.
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 7px;
}

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX VIEW (ESKI IPTAL EDILEN YAPI, HTML'I KORUNUYOR)
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    top: var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: center;

    gap: 54px;

    width: max-content;

    padding-left: var(--side);
    padding-right: var(--side);

    transform: translateY(-8px);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex:
        0
        0
        285px;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 285px;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX IMAGE
   ===================================================== */

.card-image-wrap {
    display: flex;

    flex: 0 0 auto;

    align-items: center;
    justify-content: flex-start;

    overflow: visible;

    pointer-events: none;
}

.card-image-wrap img {
    position: static;

    display: block;

    flex: 0 0 auto;

    margin: 0;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-align: left;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    margin: 0;
    padding: 0;

    max-width: 100%;

    text-align: left;

    white-space: nowrap;

    overflow: hidden;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (min-width: 601px)
    and (max-width: 1366px) {

    :root {

        --image-max-width: 80vw;

        --visual-height: 82vh;

        --image-max-height:
            calc(
                var(--visual-height) -
                22px
            );

    }

    .project-card {
        flex:
            0
            0
            250px;

        width: 250px;
    }

    #index-grid {
        gap: 46px;
    }

}


/* =====================================================
   PHONE BASE
   ===================================================== */

body.phone-portrait,
body.phone-landscape {

    --font-size: 13px;

    --side: 24px;
    --top: 20px;

    --index-bottom: 18px;

    --meta-gap: 5px;

}

body.phone-portrait .logo,
body.phone-landscape .logo {
    width: 160px;
    height: 45px;
}

body.phone-portrait .logo-aybak,
body.phone-landscape .logo-aybak {
    top: 15px;
}


/* =====================================================
   PHONE PORTRAIT
   ===================================================== */

body.phone-portrait #project-meta {
    top: auto;

    left: var(--side) !important;

    width:
        calc(
            100vw -
            var(--side) * 2
        ) !important;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            27px
        );
}

body.phone-portrait #project-counter {
    padding-left: 16px;
}

body.phone-portrait #visual-zone {
    top: var(--portrait-visual-top);

    left: var(--side);
    right: var(--side);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            72px
        );

    width: auto;
    height: auto;

    transform: none;

    padding: 4px 0;

    overflow: hidden;
}

body.phone-portrait #spread,
body.phone-portrait .image-cell {
    width: 100%;
    height: 100%;
}

body.phone-portrait .spread-image {
    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}


/* =====================================================
   PHONE PORTRAIT INDEX
   ===================================================== */

body.phone-portrait #index-scroller {
    bottom:
        calc(
            14px +
            env(safe-area-inset-bottom)
        );
}

body.phone-portrait #index-grid {
    gap: 30px;

    transform: translateY(-4px);
}

body.phone-portrait .project-card {
    flex:
        0
        0
        48vw;

    width: 48vw;
}


body.phone-portrait #project-all-grid {
    gap: 5px;
}


/* =====================================================
   PHONE LANDSCAPE
   ===================================================== */

body.phone-landscape {

    --side: 24px;
    --top: 18px;

    --index-bottom: 14px;

}


/* =====================================================
   LANDSCAPE META
   ===================================================== */

body.phone-landscape #project-meta {

    top: auto;

    left: var(--side) !important;

    width:
        calc(
            100vw -
            var(--side) * 2
        ) !important;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            24px
        );
}

body.phone-landscape #project-counter {
    padding-left: 16px;
}


/* =====================================================
   LANDSCAPE SLIDESHOW
   ===================================================== */

body.phone-landscape #visual-zone {

    top: 0;

    left: var(--landscape-safe-left);
    right: var(--landscape-safe-right);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            24px
        );

    width: auto;
    height: auto;

    transform: none;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    padding:
        18px
        0
        0;

    overflow: hidden;
}

body.phone-landscape #spread,
body.phone-landscape .image-cell {
    width: 100%;
    height: 100%;

    align-items: flex-end;
}

body.phone-landscape .spread-image {

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}


/* =====================================================
   LANDSCAPE INDEX
   ===================================================== */

body.phone-landscape #index-scroller {

    top: var(--landscape-index-top);

    bottom:
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;
}

body.phone-landscape #index-grid {

    gap: 26px;

    padding-left: var(--side);
    padding-right: var(--side);

    transform: none;
}

body.phone-landscape .project-card {

    flex:
        0
        0
        var(--landscape-index-card-width);

    width:
        var(--landscape-index-card-width);

    overflow: visible;
}

body.phone-landscape .card-image-wrap {
    align-items: center;
    justify-content: center;

    overflow: visible;
}

body.phone-landscape .card-image-wrap img {
    position: static;

    transform: none;

    width: auto !important;
    height: auto !important;

    max-width: 100% !important;
    max-height: 100% !important;

    object-fit: contain !important;
    object-position: center center !important;
}

body.phone-landscape .card-copy {
    margin-left:
        var(--landscape-preview-offset, 0px);
}

body.phone-landscape .project-card:first-child .card-image-wrap {
    justify-content: flex-start;
}

body.phone-landscape .project-card:first-child .card-copy {
    margin-left: 0;
}

body.phone-landscape .card-copy {

    width: 100%;
}


body.phone-landscape .card-title,
body.phone-landscape .card-date {

    max-width: none;

    overflow: visible;

    text-overflow: clip;

    white-space: nowrap;
}


body.phone-landscape #project-all-grid {
    gap: 4px;
}


/* =====================================================
   SLIDE META — GLOBAL EDGE ALIGNMENT
   ===================================================== */

#project-meta,
body.phone-portrait #project-meta,
body.phone-landscape #project-meta {
    top: auto !important;
    left: var(--side) !important;
    right: var(--side) !important;

    width: auto !important;

    bottom: var(--top) !important;
}

#project-title,
#project-date {
    justify-self: start;
    text-align: left;
}

#project-counter,
#view-all-button {
    justify-self: end;
    text-align: right;
}

/* =====================================================
   MOBILE INDEX SCROLL HINT
   ===================================================== */

#index-scroll-hint {
    position: fixed;
    left: var(--side);
    right: var(--side);
    top: auto;
    bottom: var(--top);
    z-index: 520;
    display: none;
    align-items: center;
    gap: 0.30em;
    width: auto;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #000;
    opacity: 1;
    pointer-events: none;
    white-space: nowrap;
}

body.phone-portrait.index-mode.index-needs-scroll:not(.index-scroll-hint-dismissed) #index-scroll-hint,
body.phone-landscape.index-mode.index-needs-scroll:not(.index-scroll-hint-dismissed) #index-scroll-hint {
    display: inline-flex;
}

.index-scroll-hint-host {
    position: relative !important;
}

.index-scroll-hint-clipped {
    visibility: hidden !important;
    pointer-events: none !important;
}

/* =====================================================
   AYBAK END CARD (GÜNCELLENMİŞ KÖŞE TASARIMLARI)
   ===================================================== */

#aybak-end-card {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-sizing: border-box;
    background: #000;
    color: #fff;
    visibility: hidden;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    opacity: 0;
    transition: opacity 300ms linear, visibility 0s linear 300ms;
}

body.aybak-end-card-active #aybak-end-card {
    visibility: visible;
    pointer-events: auto;
    opacity: 1;
    transition: opacity 300ms linear, visibility 0s linear 0s;
}

body.aybak-end-card-leaving, html.aybak-end-card-leaving {
    background: #fff !important;
}

body.aybak-end-card-leaving #aybak-end-card {
    visibility: visible;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms linear, visibility 0s linear 300ms;
}

#aybak-end-card-logo {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: max-content;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#aybak-end-card-name,
#aybak-end-card-aybak {
    display: block;
    height: calc(var(--font-size) * var(--line-height));
    white-space: nowrap;
}

.aybak-end-card-copy {
    position: absolute;
    z-index: 2;
    font-family: Arial, Helvetica, sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    opacity: 0;
    transition: opacity 170ms ease 0ms;
}

body.aybak-end-card-active .aybak-end-card-copy {
    opacity: 1;
    transition-delay: 0ms;
}

/* YENİ KÖŞE TASARIMLARI */
.aybak-end-card-left {
    left: var(--side);
    bottom: var(--index-bottom) !important;
    top: auto !important;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.aybak-end-card-right {
    right: var(--side);
    bottom: var(--index-bottom) !important;
    top: auto !important;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
}

.aybak-end-card-copy a {
    color: #fff;
    text-decoration: none;
}

.aybak-end-card-copy a:hover {
    text-decoration: underline;
}

#aybak-end-card .section-switch,
#aybak-end-card .section-switch:hover,
#aybak-end-card .section-switch:focus,
#aybak-end-card .section-switch:active,
#aybak-end-card .aybak-end-card-link,
#aybak-end-card .aybak-end-card-link:hover,
#aybak-end-card .aybak-end-card-link:focus,
#aybak-end-card .aybak-end-card-link:active {
    text-decoration: none !important;
    outline: 0;
}

#aybak-end-card .section-switch {
    position: static;
    top: auto;
    right: auto;
    z-index: auto;
    color: #fff;
}

#aybak-end-card-logo:focus,
#aybak-end-card-logo:active {
    outline: 0;
}

@media (prefers-reduced-motion: reduce) {
    #aybak-end-card,
    .aybak-end-card-copy {
        transition-duration: 0ms !important;
        transition-delay: 0ms !important;
    }
}

/* =====================================================
   CONSISTENT SITE ARROWS
   ===================================================== */
.site-arrow {
    display: inline-block;
    flex: 0 0 auto;
    width: 0.66em;
    height: 0.66em;
    overflow: visible;
    color: currentColor;
    pointer-events: none;
    vertical-align: -0.055em;
}

.site-arrow path {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.02;
    stroke-linecap: square;
    stroke-linejoin: miter;
}

.site-arrow--down,
.site-arrow--external {
    transform: none;
}


@media (prefers-reduced-motion: reduce) {

    #aybak-end-card,
    .aybak-end-card-copy {
        transition-duration: 0ms !important;
        transition-delay: 0ms !important;
    }

}



/* =====================================================
   TYPOGRAPHIC INDEX — V13
   ===================================================== */

#index-view {
    overflow: hidden;
}

#index-scroller {
    top: calc(var(--top) + 72px) !important;
    left: 0 !important;
    right: 0 !important;
    bottom: calc(var(--top) + 72px + env(safe-area-inset-bottom)) !important;

    display: block !important;

    overflow-x: hidden !important;
    overflow-y: auto !important;

    scrollbar-width: none;
    -ms-overflow-style: none;

    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;

    cursor: default !important;

    outline: none;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-grid {
    position: relative;

    display: flex !important;
    flex-direction: column !important;
    flex-wrap: nowrap !important;
    align-items: stretch !important;

    gap: 0 !important;

    width: 100% !important;
    min-height: 100%;

    padding: 0 !important;

    transform: none !important;
}

.index-project-row {
    position: relative;

    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: baseline;

    width: 100%;

    min-height: calc(var(--font-size) * var(--line-height) + 8px);

    padding: 4px var(--side);

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}

.index-project-title,
.index-project-date {
    appearance: none;
    -webkit-appearance: none;

    display: block;

    width: max-content;
    max-width: 100%;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font: inherit;
    line-height: inherit;

    white-space: nowrap;

    cursor: pointer;
    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}

.index-project-title {
    justify-self: start;
    text-align: left;
}

.index-project-date {
    justify-self: end;
    text-align: right;
}

.index-project-title:hover,
.index-project-title:focus,
.index-project-title:active,
.index-project-date:hover,
.index-project-date:focus,
.index-project-date:active {
    text-decoration: none;
    outline: 0;
}

#index-preview {
    position: fixed;
    left: 50%;
    top: 50%;

    z-index: 101;

    display: flex;
    align-items: center;
    justify-content: center;

    width: min(38vw, 560px);
    height: min(48vh, 590px);

    transform: translate(-50%, -50%);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity 140ms ease,
        visibility 0s linear 140ms;
}

#index-preview.visible {
    opacity: 1;
    visibility: visible;

    transition:
        opacity 140ms ease,
        visibility 0s linear 0s;
}

#index-preview-image {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    pointer-events: none;
}

#index-project-action {
    position: fixed;

    left: 50%;
    bottom: calc(var(--top) + env(safe-area-inset-bottom));

    z-index: 102;

    display: flex;
    flex-direction: column;
    align-items: center;

    transform: translateX(-50%);

    font-size: var(--font-size);
    line-height: var(--line-height);
    text-align: center;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity 140ms ease,
        visibility 0s linear 140ms;
}

#index-project-action.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;

    transition:
        opacity 140ms ease,
        visibility 0s linear 0s;
}

#index-project-view-all {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font: inherit;
    line-height: inherit;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

#index-project-view-all:hover,
#index-project-view-all:focus,
#index-project-view-all:active {
    text-decoration: none;
    outline: 0;
}

#index-project-count {
    display: block;
    margin: 0;
    padding: 0;
    pointer-events: none;
}

body.phone-portrait #index-scroller,
body.phone-landscape #index-scroller {
    top: calc(var(--top) + 58px) !important;
    bottom: calc(var(--top) + 62px + env(safe-area-inset-bottom)) !important;
}

body.phone-portrait .index-project-row,
body.phone-landscape .index-project-row {

    padding-top: 3.5px;

}

body.phone-landscape #index-preview {

}

body.phone-portrait #index-project-action,
body.phone-landscape #index-project-action {
    bottom: calc(var(--top) + env(safe-area-inset-bottom));
}

/* =====================================================
   INDEX SPACING / MOBILE RESERVED PREVIEW — V15
   ===================================================== */

#index-grid {
    --index-list-edge-gap: calc(var(--font-size) * var(--line-height));

    box-sizing: border-box !important;
    padding-top: var(--index-list-edge-gap) !important;
    padding-bottom: var(--index-list-edge-gap) !important;

    /* Extra room is distributed between the grid rows. */
    align-content: space-between !important;
}

/* Explicit row/column placement is calculated in JS. */
.index-project-row {
    align-self: start !important;
}

/*
   Desktop/tablet: the typographic field still uses the full index width,
   but it always begins with at least two project columns. The preview
   remains on the INDEX/FILM right axis.
*/
@media (hover: hover) and (pointer: fine) {
    #index-grid {
        column-gap: clamp(42px, 6vw, 118px) !important;
    }
}

/*
   Phones: reserve a real lower viewport zone for the preview so project
   names can never collide with the image. The upper zone is free to
   create as many text columns as required, without any internal scroll.
*/
body.phone-portrait #index-scroller {
    top: calc(var(--top) + 58px) !important;
    bottom: 44vh !important;
}

body.phone-portrait #index-grid {
    --index-list-edge-gap: calc(var(--font-size) * var(--line-height));
    column-gap: clamp(24px, 8vw, 52px) !important;
}

body.phone-portrait #index-preview {
    left: var(--side) !important;
    right: var(--side) !important;
    top: auto !important;
    bottom: calc(var(--top) + env(safe-area-inset-bottom)) !important;

    width: auto !important;
    height: calc(38vh - var(--top)) !important;
    max-height: none !important;

    transform: none !important;
    justify-content: flex-end !important;
    align-items: flex-end !important;
}

body.phone-portrait #index-preview-image {
    max-width: min(68vw, 380px) !important;
    max-height: 29vh !important;
}

body.phone-landscape #index-scroller {
    top: calc(var(--top) + 46px) !important;
    bottom: 48vh !important;
}

body.phone-landscape #index-grid {
    --index-list-edge-gap: calc(var(--font-size) * var(--line-height));
    column-gap: clamp(22px, 5vw, 48px) !important;
}

body.phone-landscape #index-preview {
    left: var(--side) !important;
    right: var(--side) !important;
    top: auto !important;
    bottom: calc(var(--top) + env(safe-area-inset-bottom)) !important;

    width: auto !important;
    height: calc(40vh - var(--top)) !important;
    max-height: none !important;

    transform: none !important;
    justify-content: flex-end !important;
    align-items: flex-end !important;
}

body.phone-landscape #index-preview-image {
    max-width: min(44vw, 360px) !important;
    max-height: 27vh !important;
}

body.phone-portrait #index-project-action,
body.phone-landscape #index-project-action {
    margin-top: calc(var(--font-size) * 0.7) !important;
}


/* =====================================================
   INDEX GRID / MOBILE PREVIEW — V16
   ===================================================== */

/*
   Grid rows are now real, fixed row positions. Extra vertical room is
   converted into one consistent row-gap, so a shorter final column fills
   from the top and simply leaves its unused rows empty at the bottom.
*/
#index-grid {
    align-content: start !important;
    grid-template-rows:
        repeat(
            var(--index-row-count, 1),
            calc(var(--font-size) * var(--line-height) * 2)
        ) !important;
    row-gap: var(--index-row-gap, calc(var(--font-size) * var(--line-height))) !important;
}

/* Phones get more room for type and a smaller, truly centered preview. */
body.phone-portrait #index-scroller {
    bottom: 33vh !important;
}

body.phone-landscape #index-scroller {
    bottom: 39vh !important;
}

body.phone-portrait #index-grid,
body.phone-landscape #index-grid {
    column-gap: clamp(12px, 3.5vw, 24px) !important;
}

body.phone-portrait #index-preview,
body.phone-landscape #index-preview {
    left: var(--side) !important;
    right: var(--side) !important;
    top: auto !important;
    transform: none !important;
    align-items: center !important;
    justify-content: flex-end !important;
}

body.phone-portrait #index-preview {
    bottom: calc(var(--top) + env(safe-area-inset-bottom)) !important;
    height: calc(27vh - var(--top)) !important;
}

body.phone-landscape #index-preview {
    bottom: calc(var(--top) + env(safe-area-inset-bottom)) !important;
    height: calc(31vh - var(--top)) !important;
}

}

body.phone-landscape #index-preview-image {

    align-self: center !important;
    align-items: flex-end !important;
    text-align: right !important;
}

body.phone-portrait .index-project-title,

    max-width: 100% !important;
}


/* =====================================================
   INDEX RESPONSIVE STRUCTURE — V18
   ===================================================== */

/* Index can scroll only when the calculated minimum spacing no longer fits. */
#index-scroller {
    overflow-x: hidden !important;
    overflow-y: auto !important;
    touch-action: pan-y !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;

    right: calc(var(--side) + min(36vw, 560px) + clamp(34px, 4vw, 76px)) !important;
    bottom: calc(var(--top) + env(safe-area-inset-bottom)) !important;

    column-gap: var(--index-column-gap, clamp(32px, 4vw, 72px)) !important;

    bottom: auto !important;

/* =====================================================
   INDEX PHONE SINGLE-COLUMN SYSTEM — V19
   ===================================================== */

/* Both phone orientations use the same simple hierarchy:
   project/client above date, one column only, with a right-
   aligned preview and action. The list itself owns the left
   field and scrolls only when one-line minimum gaps no longer fit. */
body.phone-portrait #index-scroller,
body.phone-landscape #index-scroller {

<script>

/* =====================================================
   AYBAK END CARD — TWO-STATE VERTICAL NAVIGATION
   ===================================================== */

const aybakEndCard = document.getElementById("ci-endcard-container");

let aybakEndCardActive = false;
let aybakTouchStartX = null;
let aybakTouchStartY = null;
let aybakTouchStartedInIndexScroller = false;
let aybakWheelAccumulator = 0;
let aybakWheelResetTimer = null;
const AYBAK_WHEEL_THRESHOLD = 48;
const AYBAK_SWIPE_THRESHOLD = 52;

/* =====================================================
   AYBAK END CARD — LOGO SYSTEM
   ===================================================== */

const aybakEndCardLogo = document.getElementById("ci-endcard-btn");
const aybakEndCardName = document.getElementById("aybak-end-card-name");
const aybakEndCardAybak = document.getElementById("aybak-end-card-aybak");

const aybakLogoLowercase = ["a", "y", "b", "a", "k"];
const aybakLogoUppercase = ["A", "Y", "B", "A", "K"];

let aybakLogoState = 0;
let aybakLogoTarget = 0;
let aybakLogoTimer = null;
let aybakLogoReturnTimer = null;
let aybakEndCardLeaving = false;

function canHover() { return window.matchMedia("(hover: hover) and (pointer: fine)").matches; }

function setAybakLogoState(state) {
    aybakLogoState = Math.max(0, Math.min(5, state));
    aybakEndCardName.textContent = aybakLogoState === 0 ? "Denizalp" : "denizalp";
    aybakEndCardAybak.textContent = aybakLogoLowercase.map((letter, index) => index < aybakLogoState ? aybakLogoUppercase[index] : letter).join("");
}

function animateAybakLogoTo(target, callback = null) {
    aybakLogoTarget = target;
    if (aybakLogoTimer !== null) { clearTimeout(aybakLogoTimer); aybakLogoTimer = null; }
    function step() {
        if (aybakLogoState === aybakLogoTarget) {
            aybakLogoTimer = null;
            if (typeof callback === "function") callback();
            return;
        }
        aybakLogoState += aybakLogoState < aybakLogoTarget ? 1 : -1;
        setAybakLogoState(aybakLogoState);
        aybakLogoTimer = setTimeout(step, LOGO_STEP_DURATION);
    }
    step();
}

function clearAybakLogoReturnTimer() {
    if (aybakLogoReturnTimer !== null) { clearTimeout(aybakLogoReturnTimer); aybakLogoReturnTimer = null; }
}

function returnAybakLogoAfterMobileHold() {
    clearAybakLogoReturnTimer();
    aybakLogoReturnTimer = setTimeout(() => { animateAybakLogoTo(0); aybakLogoReturnTimer = null; }, MOBILE_NAV_HOLD);
}

function setAybakEndCard(active) {
    const next = Boolean(active);
    if (next === aybakEndCardActive) return;

    if (next) {
        aybakEndCardLeaving = false;
        document.body.classList.remove("aybak-end-card-leaving");
        document.documentElement.classList.remove("aybak-end-card-leaving");
        clearAybakLogoReturnTimer();
        aybakEndCardActive = true;
        document.body.classList.add("aybak-end-card-active");
        document.documentElement.classList.add("aybak-end-card-active");
        aybakEndCard.setAttribute("aria-hidden", "false");
        setAybakLogoState(aybakLogoState);
        aybakWheelAccumulator = 0;
        return;
    }

    aybakEndCardActive = false;
    document.body.classList.remove("aybak-end-card-active");
    document.documentElement.classList.remove("aybak-end-card-active");
    aybakEndCard.setAttribute("aria-hidden", "true");
    clearAybakLogoReturnTimer();
    aybakWheelAccumulator = 0;
}

const AYBAK_END_CARD_FADE_DURATION = 300;
const AYBAK_END_CARD_CLICK_HOLD_DESKTOP = 100;
const AYBAK_END_CARD_CLICK_HOLD_MOBILE = 420;

function leaveAybakEndCard() {
    if (aybakEndCardLeaving) return;
    aybakEndCardLeaving = true;
    clearAybakLogoReturnTimer();

    document.body.classList.add("aybak-end-card-leaving");
    document.documentElement.classList.add("aybak-end-card-leaving");

    window.setTimeout(() => {
        setAybakEndCard(false);
        document.body.classList.remove("aybak-end-card-leaving");
        document.documentElement.classList.remove("aybak-end-card-leaving");
        aybakEndCardLeaving = false;
        animateAybakLogoTo(0);
    }, AYBAK_END_CARD_FADE_DURATION);
}

aybakEndCardLogo.addEventListener("mouseenter", () => {
    if (!canHover() || aybakEndCardLeaving) return;
    clearAybakLogoReturnTimer();
    animateAybakLogoTo(5);
});

aybakEndCardLogo.addEventListener("mouseleave", () => {
    if (!canHover() || aybakEndCardLeaving) return;
    animateAybakLogoTo(0);
});

aybakEndCardLogo.addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    if (aybakEndCardLeaving) return;
    clearAybakLogoReturnTimer();
    animateAybakLogoTo(5, () => {
        window.setTimeout(() => { leaveAybakEndCard(); }, canHover() ? AYBAK_END_CARD_CLICK_HOLD_DESKTOP : AYBAK_END_CARD_CLICK_HOLD_MOBILE);
    });
});

setAybakLogoState(0);


window.addEventListener("wheel", event => {
    if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
    if (!aybakEndCardActive && (interfaceAnimating || navigationAnimating || projectViewAnimating)) return;

    event.preventDefault();
    clearTimeout(aybakWheelResetTimer);
    aybakWheelAccumulator += event.deltaY;

    aybakWheelResetTimer = setTimeout(() => { aybakWheelAccumulator = 0; }, 140);

    if (!aybakEndCardActive && aybakWheelAccumulator >= AYBAK_WHEEL_THRESHOLD) {
        setAybakEndCard(true); return;
    }

    if (aybakEndCardActive && aybakWheelAccumulator <= -AYBAK_WHEEL_THRESHOLD) {
        leaveAybakEndCard();
    }
}, { passive: false });

function recordAybakTouchStart(event) {
    if (!event.changedTouches.length) return;
    const touch = event.changedTouches[0];
    aybakTouchStartX = touch.clientX;
    aybakTouchStartY = touch.clientY;
}

function handleAybakTouchEnd(event) {
    if (aybakTouchStartX === null || aybakTouchStartY === null || !event.changedTouches.length) return;

    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - aybakTouchStartX;
    const deltaY = touch.clientY - aybakTouchStartY;

    aybakTouchStartX = null;
    aybakTouchStartY = null;

    if (Math.abs(deltaY) <= Math.abs(deltaX) || Math.abs(deltaY) < AYBAK_SWIPE_THRESHOLD) { return; }

    if (!aybakEndCardActive && (interfaceAnimating || navigationAnimating || projectViewAnimating)) { return; }

    suppressClickUntil = Date.now() + 500;

    if (!aybakEndCardActive && deltaY < 0) { setAybakEndCard(true); return; }
    if (aybakEndCardActive && deltaY > 0) { leaveAybakEndCard(); }
}

window.addEventListener("touchstart", recordAybakTouchStart, { passive: true });
window.addEventListener("touchend", handleAybakTouchEnd, { passive: true });

function preloadImage(filename) {
    if (imageCache.has(filename)) { return imageCache.get(filename); }
    const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = async () => { try { if (img.decode) { await img.decode(); } } catch (error) {} resolve(img); };
        img.onerror = () => { imageCache.delete(filename); reject(new Error(`Could not load ${filename}`)); };
        img.src = getPhotoUrl(filename);
    });
    imageCache.set(filename, promise);
    return promise;
}

/* =====================================================
   TYPOGRAPHY
   ===================================================== */
function renderInteractiveTypography(element, text, activePositions = new Set()) {
    const fragment = document.createDocumentFragment();
    Array.from(String(text)).forEach((character, index) => {
        const span = document.createElement("span");
        span.textContent = character;
        const isDigit = /[0-9]/.test(character);
        const isActiveDigit = isDigit && activePositions.has(index);
        if (isActiveDigit) { span.style.letterSpacing = "var(--active-number-tracking)"; }
        fragment.appendChild(span);
    });
    element.replaceChildren(fragment);
}

function renderBaseTypography(element, text) { renderInteractiveTypography(element, text, new Set()); }

function getMorphPositions(text) {
    return Array.from(String(text)).map((character, index) => {
        const isLetter = character.toLowerCase() !== character.toUpperCase();
        const isDigit = /[0-9]/.test(character);
        return (isLetter || isDigit) ? index : -1;
    }).filter(index => index >= 0);
}

function renderCaseFromActivePositions(baseText, activePositions) {
    return String(baseText).split("").map((character, index) => {
        const isLetter = character.toLowerCase() !== character.toUpperCase();
        return (isLetter && activePositions.has(index)) ? character.toUpperCase() : character.toLowerCase();
    }).join("");
}

function morphSequential(element, nextText, duration = TEXT_MORPH_DURATION) {
    const oldText = element.dataset.rawText !== undefined ? element.dataset.rawText : element.textContent;
    if (oldText === nextText) {
        renderInteractiveTypography(element, nextText, new Set());
        element.dataset.rawText = nextText;
        return Promise.resolve();
    }
    const length = Math.max(oldText.length, nextText.length);
    const from = oldText.padEnd(length, " ").split("");
    const to = nextText.padEnd(length, " ").split("");
    const changedPositions = [];
    for (let i = 0; i < length; i++) { if (from[i] !== to[i]) { changedPositions.push(i); } }
    const originalWidth = element.getBoundingClientRect().width;
    if (originalWidth > 0) { element.style.minWidth = `${originalWidth}px`; }
    const start = performance.now();

    return new Promise(resolve => {
        function frame(now) {
            const progress = Math.min(1, (now - start) / duration);
            const completed = Math.floor(progress * (changedPositions.length + 1));
            const current = from.slice();
            for (let i = 0; i < completed; i++) {
                const position = changedPositions[i];
                if (position === undefined) { continue; }
                current[position] = to[position];
            }
            renderInteractiveTypography(element, current.join("").trimEnd(), new Set());
            if (progress < 1) { requestAnimationFrame(frame); } else { renderInteractiveTypography(element, nextText, new Set()); element.dataset.rawText = nextText; element.style.minWidth = ""; resolve(); }
        }
        requestAnimationFrame(frame);
    });
}

function getLetterPositions(text) {
    const result = [];
    for (let i = 0; i < text.length; i++) {
        const character = text[i];
        if (character.toLowerCase() !== character.toUpperCase()) { result.push(i); }
    }
    return result;
}


/* =====================================================
   CASE ANIMATION
   ===================================================== */
function animateCase(element, baseText, toUpper, duration = CASE_DURATION) {
    const base = String(baseText).toLowerCase();
    const positions = getMorphPositions(base);
    const total = positions.length;
    let currentState = 0;
    const children = Array.from(element.children);

    if (children.length === base.length) {
        for (let i = 0; i < positions.length; i++) {
            const position = positions[i]; const character = base[position]; const span = children[position];
            const isDigit = /[0-9]/.test(character); const isLetter = character.toLowerCase() !== character.toUpperCase();
            const active = isDigit ? (span && !!span.style.letterSpacing) : (isLetter && span && span.textContent === character.toUpperCase());
            if (active) { currentState++; } else { break; }
        }
    } else {
        const currentText = element.textContent;
        for (let i = 0; i < positions.length; i++) {
            const position = positions[i]; const character = base[position]; const isLetter = character.toLowerCase() !== character.toUpperCase();
            if (isLetter && currentText[position] === character.toUpperCase()) { currentState++; } else { break; }
        }
    }
    const target = toUpper ? total : 0;
    function renderState(state) {
        const activePositions = new Set(positions.slice(0, state));
        renderInteractiveTypography(element, renderCaseFromActivePositions(base, activePositions), activePositions);
    }
    if (currentState === target) { renderState(target); return Promise.resolve(); }
    const start = performance.now();
    return new Promise(resolve => {
        function frame(now) {
            const progress = Math.min(1, (now - start) / duration);
            const state = Math.round(currentState + (target - currentState) * progress);
            renderState(state);
            if (progress < 1) { requestAnimationFrame(frame); } else { renderState(target); resolve(); }
        }
        requestAnimationFrame(frame);
    });
}


/* =====================================================
   INDEX & INFO HOVER MORPH (NEW BEHAVIOR)
   ===================================================== */
function createCaseController(element, baseText) {
    const base = String(baseText).toLowerCase();
    const positions = getMorphPositions(base);
    const total = positions.length;
    let state = 0;
    let frameId = null;

    function render() {
        const activePositions = new Set(positions.slice(0, state));
        renderInteractiveTypography(element, renderCaseFromActivePositions(base, activePositions), activePositions);
    }

    function animateTo(target) {
        if (frameId !== null) { cancelAnimationFrame(frameId); }
        const startState = state;
        if (startState === target) { render(); return; }
        const start = performance.now();
        function frame(now) {
            const progress = Math.min(1, (now - start) / CASE_DURATION);
            state = Math.round(startState + (target - startState) * progress);
            render();
            if (progress < 1) { frameId = requestAnimationFrame(frame); } else { state = target; render(); frameId = null; }
        }
        frameId = requestAnimationFrame(frame);
    }
    render();
    return { upper() { animateTo(total); }, lower() { animateTo(0); } };
}

/* =====================================================
   PROJECT ROTATION HELPERS
   ===================================================== */
function shuffledCopy(values) {
    const copy = values.slice();
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function getSeenFrameSet(targetProjectIndex) {
    const normalized = normalizeProjectIndex(targetProjectIndex);
    if (!seenFramesByProject.has(normalized)) { seenFramesByProject.set(normalized, new Set()); }
    return seenFramesByProject.get(normalized);
}

function markFrameSeen(targetProjectIndex, targetFrameIndex) {
    getSeenFrameSet(targetProjectIndex).add(targetFrameIndex);
}

function buildNormalProjectSequence(targetProjectIndex, { includeFrame = null } = {}) {
    const normalized = normalizeProjectIndex(targetProjectIndex);
    const project = projects[normalized];
    const total = project.images.length;
    const limit = Math.min(NORMAL_PROJECT_FRAME_LIMIT, total);
    const seen = getSeenFrameSet(normalized);
    const selected = [];

    if (Number.isInteger(includeFrame) && includeFrame >= 0 && includeFrame < total) { selected.push(includeFrame); }
    const allFrames = Array.from({ length: total }, (_, index) => index);
    const unseen = shuffledCopy(allFrames.filter(index => !seen.has(index) && !selected.includes(index)));
    while (selected.length < limit && unseen.length) { selected.push(unseen.shift()); }
    if (selected.length < limit) {
        const repeats = shuffledCopy(allFrames.filter(index => !selected.includes(index)));
        while (selected.length < limit && repeats.length) { selected.push(repeats.shift()); }
    }
    selected.sort((a, b) => a - b);

    normalSequenceProjectIndex = normalized;
    normalSequenceFrames = selected;
    normalSequencePosition = includeFrame !== null ? normalSequenceFrames.indexOf(includeFrame) : -1;
    return normalSequenceFrames;
}

function clearNormalSequence() { normalSequenceProjectIndex = null; normalSequenceFrames = []; normalSequencePosition = -1; }

function enterFocusedProjectMode(targetProjectIndex) {
    focusedProjectMode = true;
    focusedProjectIndex = normalizeProjectIndex(targetProjectIndex);
    clearNormalSequence();
}

function leaveFocusedProjectMode() {
    focusedProjectMode = false;
    focusedProjectIndex = null;
    clearNormalSequence();
}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */
function preloadAhead() {
    if (projects.length === 0) { return; }
    const project = currentProject();
    for (let offset = 1; offset <= 4; offset++) {
        const target = frameIndex + offset;
        if (target < project.images.length) { preloadImage(project.images[target]).catch(() => {}); }
    }
    const nextProject = projects[normalizeProjectIndex(projectIndex + 1)];
    if (nextProject) { preloadImage(nextProject.images[0]).catch(() => {}); }
}


/* =====================================================
   SHOW FRAME
   ===================================================== */
let showFrame = async function(targetProjectIndex, targetFrameIndex, urlMode = "push") {
    if (navigationAnimating) { return false; }
    navigationAnimating = true;

    const normalizedProject = normalizeProjectIndex(targetProjectIndex);
    const project = projects[normalizedProject];
    const normalizedFrame = Math.max(0, Math.min(targetFrameIndex, project.images.length - 1));

    try {
        const loadedImage = await preloadImage(project.images[normalizedFrame]);
        projectIndex = normalizedProject;
        frameIndex = normalizedFrame;
        markFrameSeen(normalizedProject, normalizedFrame);
        syncProjectUrl(urlMode);
        renderImage(loadedImage);

        if (isPhoneLandscape()) { updateLandscapeGeometry(); }
        syncMetadataAfterRender();
        await updateMetadata(normalizedProject, normalizedFrame);
        preloadAhead();

        navigationAnimating = false;
        return true;
    } catch (error) {
        navigationAnimating = false;
        return false;
    }
};


/* =====================================================
   NEXT & PREVIOUS
   ===================================================== */
async function nextFrame(urlMode = "push") {
    if (navigationAnimating || projectAllMode) { return; }
    const project = currentProject();

    if (focusedProjectMode && focusedProjectIndex === projectIndex) {
        if (frameIndex < project.images.length - 1) { return showFrame(projectIndex, frameIndex + 1, urlMode); }
        leaveFocusedProjectMode();
        const nextProjectIndex = normalizeProjectIndex(projectIndex + 1);
        const sequence = buildNormalProjectSequence(nextProjectIndex);
        normalSequencePosition = 0;
        return showFrame(nextProjectIndex, sequence[0], urlMode);
    }

    if (normalSequenceProjectIndex !== projectIndex || !normalSequenceFrames.includes(frameIndex)) {
        buildNormalProjectSequence(projectIndex, { includeFrame: frameIndex });
    }
    normalSequencePosition = normalSequenceFrames.indexOf(frameIndex);

    if (normalSequencePosition >= 0 && normalSequencePosition < normalSequenceFrames.length - 1) {
        normalSequencePosition++;
        return showFrame(projectIndex, normalSequenceFrames[normalSequencePosition], urlMode);
    }

    const nextProjectIndex = normalizeProjectIndex(projectIndex + 1);
    const nextSequence = buildNormalProjectSequence(nextProjectIndex);
    normalSequencePosition = 0;
    return showFrame(nextProjectIndex, nextSequence[0], urlMode);
}

async function previousFrame(urlMode = "push") {
    if (navigationAnimating || projectAllMode) { return; }
    if (focusedProjectMode && focusedProjectIndex === projectIndex) {
        if (frameIndex > 0) { return showFrame(projectIndex, frameIndex - 1, urlMode); }
        leaveFocusedProjectMode();
    }
    if (normalSequenceProjectIndex === projectIndex) {
        const position = normalSequenceFrames.indexOf(frameIndex);
        if (position > 0) {
            normalSequencePosition = position - 1;
            return showFrame(projectIndex, normalSequenceFrames[normalSequencePosition], urlMode);
        }
    }

    const previousProjectIndex = normalizeProjectIndex(projectIndex - 1);
    const sequence = buildNormalProjectSequence(previousProjectIndex);
    normalSequencePosition = sequence.length - 1;
    return showFrame(previousProjectIndex, sequence[normalSequencePosition], urlMode);
}

    if (autoplayPermanentlyDisabled || manualMode || indexMode || projectAllMode) { return; }

}

function startAutoSlideshow() {
    if (autoplayPermanentlyDisabled) { manualMode = true; clearTimeout(slideTimer); return; }
    manualMode = false; scheduleNextSlide();
}

function stopAutoSlideshow() { autoplayPermanentlyDisabled = true; manualMode = true; clearTimeout(slideTimer); }

    if (indexMode || projectAllMode || interfaceAnimating || navigationAnimating || projectViewAnimating) { return; }
    if (!manualMode) { stopAutoSlideshow(); return; }
