<!DOCTYPE html>

<head>

<title>Denizalp Aybak — Photography</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;

    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;

body {
    cursor: pointer;
}


/* =========================
   LEFT INFORMATION
   ========================= */

.info {
    position: fixed;

    top: 32px;
    left: 48px;

    z-index: 10;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-weight: 400;
    line-height: 1.15;
}


/* =========================
   LOGO
   ========================= */

.logo {
    position: relative;
    display: block;

    width: 190px;
    height: 52px;

    margin: 0;
    padding: 0;

    color: inherit;
    text-decoration: none;

    cursor: pointer;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    letter-spacing: normal;

    white-space: nowrap;
}

.logo-aybak span {
    display: inline;
}


/* =========================
   CONTACT / SOCIAL
   ========================= */

.contact {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
    gap: 0;

    margin: 0;
    padding: 0;
}

.info a {
    color: inherit;
    text-decoration: none;
    font-weight: 400;
}

.info a:hover {
    text-decoration: underline;
}


/* =========================
   SECTION SWITCH
   ========================= */

.section-switch {
    position: fixed;

    top: 32px;
    right: 48px;

    z-index: 20;

    color: #000;
    text-decoration: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    white-space: nowrap;
}


/* =========================
   SLIDESHOW
   ========================= */

#slideshow {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.slide {
    position: absolute;

    width: auto;
    height: auto;

    max-width: 70vw;
    max-height: 80vh;

    object-fit: contain;

    opacity: 0;
}

.slide.active {
    opacity: 1;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-name {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;

        font-size: 13px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }

    #slideshow {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }

    .slide {
        max-width: 84vw;
        max-height: calc(100% - 8px);
    }

}


/* =========================
   SHORT LANDSCAPE
   ========================= */

@media
    (orientation: landscape)
    and (max-height: 700px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-name,
    .logo-aybak {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }

    #slideshow {
        inset: 0;

        left: 190px;

        width:
            calc(
                100vw -
                214px
            );

        height: 100vh;
    }

    .slide {
        max-width: 66vw;
        max-height: 68vh;
    }

}

</style>

</head>


<body>


<!-- =========================
     LEFT INFORMATION
     ========================= -->

<div
    class="info"
    id="info"
>

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span
            class="logo-name"
            id="logo-name"
        >
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<!-- =========================
     SECTION SWITCH
     ========================= -->

<a
    class="section-switch"
    id="section-switch"
    href="https://film.denizalpaybak.com/"
>
    <span id="section-switch-text">film</span>
</a>


<!-- =========================
     SLIDESHOW
     ========================= -->

<div id="slideshow"></div>


<script>


/* =====================================================
   R2 / PHOTOS.JSON
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";

const PHOTOS_JSON =
    "./photos.json";


/* =====================================================
   GLOBAL WORD TIMING
   ===================================================== */

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS / STATE
   ===================================================== */

const slideshow =
    document.getElementById(
        "slideshow"
    );

const info =
    document.getElementById(
        "info"
    );

let photos =
    [];

let slides =
    [];

let current =
    0;

let manualMode =
    false;


/* =====================================================
   R2 URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    /*
        encodeURIComponent handles spaces
        such as:
        "...0506 copy2.jpg"
    */

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   LOAD PHOTOS.JSON
   ===================================================== */

async function loadPhotos() {

    try {

        /*
            photos.json controls the complete
            slideshow order.

            no-store means edits to the JSON
            are reflected without relying on
            an old browser cache.
        */

        const response =
            await fetch(
                PHOTOS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "photos.json could not be loaded."
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(
                data
            )
        ) {

            throw new Error(
                "photos.json must contain an array."
            );

        }


        photos =
            data.filter(
                item =>
                    typeof item ===
                    "string" &&
                    item.trim() !==
                    ""
            );


        if (
            photos.length ===
            0
        ) {

            throw new Error(
                "photos.json contains no valid photos."
            );

        }


        /*
            Build slideshow in EXACTLY
            the order given by photos.json.
        */

        photos.forEach(
            (
                filename,
                index
            ) => {

                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "slide";


                img.src =
                    getPhotoUrl(
                        filename
                    );


                img.alt =
                    "";


                /*
                    First image is the only
                    eager/high-priority image.

                    The rest load normally.
                */

                if (
                    index ===
                    0
                ) {

                    img.classList.add(
                        "active"
                    );


                    img.loading =
                        "eager";


                    img.fetchPriority =
                        "high";

                }

                else {

                    img.loading =
                        "eager";

                }


                slideshow.appendChild(
                    img
                );

            }
        );


        slides =
            Array.from(
                document.querySelectorAll(
                    ".slide"
                )
            );


        current =
            0;


        updateMobileSlideshow();

    }

    catch (error) {

        console.error(
            "Photography could not be loaded:",
            error
        );

    }

}


/* =====================================================
   NEXT
   ===================================================== */

function nextSlide() {

    if (
        slides.length <=
        1
    ) {

        return;

    }


    slides[current]
        .classList
        .remove(
            "active"
        );


    current =
        (
            current +
            1
        ) %
        slides.length;


    slides[current]
        .classList
        .add(
            "active"
        );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

function previousSlide() {

    if (
        slides.length <=
        1
    ) {

        return;

    }


    slides[current]
        .classList
        .remove(
            "active"
        );


    current =
        (
            current -
            1 +
            slides.length
        ) %
        slides.length;


    slides[current]
        .classList
        .add(
            "active"
        );

}


/* =====================================================
   AUTO SLIDESHOW
   ===================================================== */

setInterval(
    () => {

        if (
            !manualMode
        ) {

            nextSlide();

        }

    },
    3000
);


/* =====================================================
   CLICK NAVIGATION
   ===================================================== */

document.body
    .addEventListener(
        "click",
        event => {

            /*
                Links behave normally.
            */

            if (
                event.target.closest(
                    "a"
                )
            ) {

                return;

            }


            /*
                FIRST CLICK

                Stop autoplay only.

                Do not change the
                currently visible photo.
            */

            if (
                !manualMode
            ) {

                manualMode =
                    true;


                return;

            }


            /*
                AFTER FIRST CLICK

                LEFT 25%:
                previous

                RIGHT 75%:
                next
            */

            const percentage =
                event.clientX /
                window.innerWidth;


            if (
                percentage <
                0.25
            ) {

                previousSlide();

            }

            else {

                nextSlide();

            }

        }
    );


/* =====================================================
   MOBILE / INSTAGRAM POSITION
   ===================================================== */

function updateMobileSlideshow() {

    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    /*
        Short landscape uses its own
        CSS layout.
    */

    if (
        shortLandscape
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";


        return;

    }


    /*
        Desktop uses regular
        viewport-centered layout.
    */

    if (
        window.innerWidth >
        600
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";


        return;

    }


    /*
        On portrait mobile, measure
        the actual bottom of the
        information block.

        This protects against Instagram's
        in-app browser viewport behavior.
    */

    const infoRect =
        info.getBoundingClientRect();


    const gapAfterInfo =
        24;


    const bottomGap =
        20;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    const stageHeight =
        Math.max(
            120,
            stageBottom -
            stageTop
        );


    slideshow.style.top =
        `${stageTop}px`;


    slideshow.style.height =
        `${stageHeight}px`;


    slideshow.style.bottom =
        "auto";

}


/* =====================================================
   VIEWPORT UPDATES
   ===================================================== */

window.addEventListener(
    "resize",
    updateMobileSlideshow
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updateMobileSlideshow,
            150
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            updateMobileSlideshow
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileSlideshow
        );

}


window.addEventListener(
    "load",
    () => {

        updateMobileSlideshow();


        /*
            Instagram may report its
            final viewport dimensions
            slightly after initial load.
        */

        setTimeout(
            updateMobileSlideshow,
            100
        );


        setTimeout(
            updateMobileSlideshow,
            400
        );


        setTimeout(
            updateMobileSlideshow,
            1000
        );

    }
);


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters = [

    document.getElementById(
        "letter-a"
    ),

    document.getElementById(
        "letter-y"
    ),

    document.getElementById(
        "letter-b"
    ),

    document.getElementById(
        "letter-a2"
    ),

    document.getElementById(
        "letter-k"
    )

];


const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];


const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


/* =====================================================
   LOGO STATE
   ===================================================== */

function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state ===
        0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        letters[i]
            .textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


/* =====================================================
   MOVE LOGO
   ===================================================== */

function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


/* =====================================================
   ANIMATE LOGO
   ===================================================== */

function animateTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


/* =====================================================
   DESKTOP LOGO
   ===================================================== */

logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                0
            );

        }

    }
);


/* =====================================================
   MOBILE LOGO
   ===================================================== */

function mobileLogoCycle() {

    setTimeout(
        () => {

            animateTo(
                5
            );


            setTimeout(
                () => {

                    animateTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   SECTION SWITCH
   FILM — exact 600ms transition
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchAnimationFrame =
    null;


/* =====================================================
   RENDER SWITCH
   ===================================================== */

function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i < switchWord.length;
        i++
    ) {

        result +=
            i < upperCount
                ? switchWord[i]
                    .toUpperCase()
                : switchWord[i]
                    .toLowerCase();

    }


    sectionSwitchText.textContent =
        result;

}


/* =====================================================
   MORPH SWITCH
   ===================================================== */

function morphSwitchTo(
    target
) {

    if (
        switchAnimationFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchAnimationFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const startTime =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    startTime
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchAnimationFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchAnimationFrame =
                null;

        }

    }


    switchAnimationFrame =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   DESKTOP SECTION SWITCH
   ===================================================== */

sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


updateMobileSlideshow();


loadPhotos();

</script>

</body>
</html>
