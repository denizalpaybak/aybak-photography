<head>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;

    --image-max-width: 76vw;

    --visual-height: 78vh;

    --image-max-height:
        calc(
            var(--visual-height) -
            22px
        );

    --meta-top-gap: 10px;

    --index-content-top: 130px;

    --portrait-visual-top: 140px;


    /*
        PHONE LANDSCAPE —
        dynamically calculated by JS.
    */

    --landscape-safe-left: 300px;
    --landscape-safe-right: 120px;

    --landscape-index-top: 220px;

    --landscape-index-image-height: 220px;

    /*
        Wider than before.

        Long titles now have substantially more
        horizontal room underneath the image.
    */

    --landscape-index-card-width: 220px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   FILM
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#project-block {
    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =====================================================
   VISUAL ZONE — DESKTOP / TABLET
   ===================================================== */

#visual-zone {
    position: absolute;

    top: 50%;
    left: 0;

    width: 100%;
    height: var(--visual-height);

    transform: translateY(-50%);

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   SLIDESHOW IMAGE
   ===================================================== */

#spread,
.image-cell {
    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: var(--image-max-width);
    max-height: var(--image-max-height);

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PROJECT META — DESKTOP / TABLET
   ===================================================== */

#project-meta {
    position: absolute;

    top:
        calc(
            50% +
            var(--visual-height) / 2 +
            var(--meta-top-gap)
        );

    left: 50%;

    width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}


/* =====================================================
   META LEFT
   ===================================================== */

#project-title {
    grid-column: 1;
    grid-row: 1;

    text-align: left;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    text-align: left;

    white-space: nowrap;
}


/* =====================================================
   META RIGHT
   ===================================================== */

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    text-align: right;

    white-space: nowrap;
}


/* =====================================================
   VIEW ALL / CLOSE
   ===================================================== */

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}

#view-all-button:hover,
#view-all-button:focus,
#view-all-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #spread {
    visibility: hidden;
}


/* =====================================================
   INVISIBLE GRID PREPARATION
   ===================================================== */

body.project-all-preparing #project-all-view {
    display: block;

    visibility: hidden;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;

    visibility: visible;
}


/* =====================================================
   VIEW ALL GRID

   Tighter gap = larger usable thumbnails.
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 7px;
}

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform: translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    top: var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            34px
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: center;

    gap: 54px;

    width: max-content;

    padding-left: var(--side);
    padding-right: var(--side);

    transform: translateY(-8px);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex:
        0
        0
        285px;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 285px;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX IMAGE
   ===================================================== */

.card-image-wrap {
    display: flex;

    align-items: center;
    justify-content: flex-start;

    width: 100%;
    height: 365px;
}

.project-card img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-align: left;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    margin: 0;
    padding: 0;

    max-width: 100%;

    text-align: left;

    white-space: nowrap;

    overflow: hidden;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (min-width: 601px)
    and (max-width: 1366px) {

    :root {

        --image-max-width: 74vw;

        --visual-height: 76vh;

        --image-max-height:
            calc(
                var(--visual-height) -
                22px
            );

    }

    .project-card {
        flex:
            0
            0
            250px;

        width: 250px;
    }

    .card-image-wrap {
        height: 325px;
    }

    #index-grid {
        gap: 46px;
    }

}


/* =====================================================
   PHONE BASE
   ===================================================== */

body.phone-portrait,
body.phone-landscape {

    --font-size: 13px;

    --side: 24px;
    --top: 20px;

    --index-bottom: 18px;

    --meta-gap: 5px;

}

body.phone-portrait .logo,
body.phone-landscape .logo {
    width: 160px;
    height: 45px;
}

body.phone-portrait .logo-aybak,
body.phone-landscape .logo-aybak {
    top: 15px;
}


/* =====================================================
   PHONE PORTRAIT
   ===================================================== */

body.phone-portrait #project-meta {
    top: auto;

    left: var(--side) !important;

    width:
        calc(
            100vw -
            var(--side) * 2
        ) !important;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            27px
        );
}

body.phone-portrait #project-counter {
    padding-left: 16px;
}

body.phone-portrait #visual-zone {
    top: var(--portrait-visual-top);

    left: var(--side);
    right: var(--side);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            72px
        );

    width: auto;
    height: auto;

    transform: none;

    padding: 4px 0;

    overflow: hidden;
}

body.phone-portrait #spread,
body.phone-portrait .image-cell {
    width: 100%;
    height: 100%;
}

body.phone-portrait .spread-image {
    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}


/* =====================================================
   PHONE PORTRAIT INDEX
   ===================================================== */

body.phone-portrait #index-scroller {
    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            32px
        );
}

body.phone-portrait #index-grid {
    gap: 30px;

    transform: translateY(-4px);
}

body.phone-portrait .project-card {
    flex:
        0
        0
        48vw;

    width: 48vw;
}

body.phone-portrait .card-image-wrap {
    height: 56vw;
}

body.phone-portrait #project-all-grid {
    gap: 5px;
}


/* =====================================================
   PHONE LANDSCAPE
   ===================================================== */

body.phone-landscape {

    --side: 24px;
    --top: 18px;

    --index-bottom: 14px;

}


/* =====================================================
   LANDSCAPE META
   ===================================================== */

body.phone-landscape #project-meta {

    top: auto;

    left: var(--side) !important;

    width:
        calc(
            100vw -
            var(--side) * 2
        ) !important;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            24px
        );
}

body.phone-landscape #project-counter {
    padding-left: 16px;
}


/* =====================================================
   LANDSCAPE SLIDESHOW
   ===================================================== */

body.phone-landscape #visual-zone {

    top: 0;

    left: var(--landscape-safe-left);
    right: var(--landscape-safe-right);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            24px
        );

    width: auto;
    height: auto;

    transform: none;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    padding:
        18px
        0
        0;

    overflow: hidden;
}

body.phone-landscape #spread,
body.phone-landscape .image-cell {
    width: 100%;
    height: 100%;

    align-items: flex-end;
}

body.phone-landscape .spread-image {

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}


/* =====================================================
   LANDSCAPE INDEX

   Cards are deliberately wider now.

   The image height still obeys the safe vertical
   area, while width gets extra room for long titles.
   ===================================================== */

body.phone-landscape #index-scroller {

    top: var(--landscape-index-top);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            32px
        );

    align-items: center;
}

body.phone-landscape #index-grid {

    /*
        Smaller gap than before.
        Bigger cards can therefore coexist without
        making the rail feel excessively sparse.
    */

    gap: 26px;

    padding-left: var(--side);
    padding-right: var(--side);

    transform: none;
}

body.phone-landscape .project-card {

    flex:
        0
        0
        var(--landscape-index-card-width);

    width:
        var(--landscape-index-card-width);
}

body.phone-landscape .card-image-wrap {

    width: 100%;

    height:
        var(--landscape-index-image-height);

    justify-content: flex-start;
}

body.phone-landscape .project-card img {

    max-width: 100%;
    max-height: 100%;
}

body.phone-landscape .card-copy {

    width: 100%;
}


/*
    Long title must remain inside the card width.

    With the wider card this should normally stay
    one line. On exceptionally long names it is
    clipped rather than visually escaping the card.
*/

body.phone-landscape .card-title,
body.phone-landscape .card-date {

    max-width: 100%;

    overflow: hidden;

    white-space: nowrap;
}


body.phone-landscape #project-all-grid {
    gap: 4px;
}

</style>

</head>

/* =====================================================

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";


const PROJECTS_JSON =
    "./projects.json";


/* =====================================================

const SLIDE_DURATION =
    3000;


const TEXT_MORPH_DURATION =

/* =====================================================

    );

    );

/* =====================================================
   RESPONSIVE HELPERS
   ===================================================== */

function isPhonePortrait() {

    return (
        window.innerWidth <= 600 &&
        window.innerHeight >=
        window.innerWidth
    );

}


function isPhoneLandscape() {

    return (
        window.innerHeight <= 600 &&
        window.innerWidth >
        window.innerHeight &&
        window.innerWidth <= 1000
    );

}


function isPhoneLayout() {

    return (
        isPhonePortrait() ||
        isPhoneLandscape()
    );

}


function getResponsiveMode() {

    if (
        isPhonePortrait()
    ) {

        return "phone-portrait";

    }


    if (
        isPhoneLandscape()
    ) {

        return "phone-landscape";

    }


    return "desktop";

}


/* =====================================================
   GENERAL HELPERS
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


function getCounterText(
    index,
    total
) {

    return (
        String(
            index + 1
        ).padStart(
            2,
            "0"
        ) +
        " / " +
        String(
            total
        ).padStart(
            2,
            "0"
        )
    );

}


function getAllCounterText(
    total
) {

    return (
        "all (" +
        String(
            total
        ).padStart(
            2,
            "0"
        ) +
        ")"
    );

}


/* =====================================================
   PRELOAD
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   LANDSCAPE GEOMETRY
   ===================================================== */

function updateLandscapeGeometry() {

    if (
        !isPhoneLandscape()
    ) {

        return;

    }


    const root =
        document.documentElement;


    const infoRect =
        info.getBoundingClientRect();


    const filmRect =
        sectionSwitch.getBoundingClientRect();


    const indexRect =
        indexButton.getBoundingClientRect();


    const computed =
        getComputedStyle(
            root
        );


    const fontSize =
        parseFloat(
            computed.getPropertyValue(
                "--font-size"
            )
        ) || 13;


    const lineHeightMultiplier =
        parseFloat(
            computed.getPropertyValue(
                "--line-height"
            )
        ) || 1.15;


    const lineHeight =
        fontSize *
        lineHeightMultiplier;


    /* =================================================
       SLIDE — HORIZONTAL SAFE AREA
       ================================================= */


    const slideLeftGap =
        24;


    const slideRightGap =
        32;


    const safeLeft =
        Math.ceil(
            infoRect.right +
            slideLeftGap
        );


    const safeRight =
        Math.max(
            24,
            Math.ceil(
                window.innerWidth -
                filmRect.left +
                slideRightGap
            )
        );


    root.style.setProperty(
        "--landscape-safe-left",
        `${safeLeft}px`
    );


    root.style.setProperty(
        "--landscape-safe-right",
        `${safeRight}px`
    );


    /* =================================================
       INDEX — SAFE VERTICAL AREA
       ================================================= */


    const indexTopGap =
        22;


    const indexBottomGap =
        20;


    const safeIndexTop =
        Math.ceil(
            infoRect.bottom +
            indexTopGap
        );


    const safeIndexBottom =
        Math.floor(
            indexRect.top -
            indexBottomGap
        );


    const availableHeight =
        Math.max(
            120,
            safeIndexBottom -
            safeIndexTop
        );


    const copyHeight =
        lineHeight *
        2;


    const copyGap =
        5;


    /*
        Reduced from previous value.

        We use more of the available vertical space
        while still leaving a safety buffer.
    */

    const innerSafety =
        3;


    const imageHeight =
        Math.max(
            80,
            Math.floor(
                availableHeight -
                copyHeight -
                copyGap -
                innerSafety
            )
        );


    /*
        KEY CHANGE:

        The card width no longer follows the image
        width so tightly.

        Give the text enough room for long titles,
        while keeping the image vertically constrained.

        A typical landscape phone will produce
        roughly 210–245px cards.
    */

    const cardWidth =
        Math.max(
            205,
            Math.min(
                250,
                Math.round(
                    imageHeight *
                    1.08
                )
            )
        );


    root.style.setProperty(
        "--landscape-index-top",
        `${safeIndexTop}px`
    );


    root.style.setProperty(
        "--landscape-index-image-height",
        `${imageHeight}px`
    );


    root.style.setProperty(
        "--landscape-index-card-width",
        `${cardWidth}px`
    );

}


/* =====================================================
   RESPONSIVE MODE
   ===================================================== */

function updateResponsiveMode() {

    const portrait =
        isPhonePortrait();


    const landscape =
        isPhoneLandscape();


    const newMode =

    const modeChanged =

    if (

    if (

            previousResponsiveMode ===

   INDEX TOP

function updateIndexContentTop() {

/* =====================================================
   SIMPLE SEQUENTIAL CHARACTER MORPH
   ===================================================== */

function morphSequential(
    element,
    nextText,
    duration =
        TEXT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        element.textContent =
            nextText;


        element.dataset.rawText =
            nextText;


        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const to =
        nextText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const changedPositions =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changedPositions.push(
                i
            );

        }

    }


    const originalWidth =
        element
            .getBoundingClientRect()
            .width;


    if (
        originalWidth > 0
    ) {

        element.style.minWidth =
            `${originalWidth}px`;

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const completed =
                    Math.floor(
                        progress *
                        (
                            changedPositions.length +
                            1
                        )
                    );


                const current =
                    from.slice();


                for (
                    let i = 0;
                    i < completed;
                    i++
                ) {

                    const position =
                        changedPositions[
                            i
                        ];


                    if (
                        position ===
                        undefined
                    ) {

                        continue;

                    }


                    current[
                        position
                    ] =
                        to[
                            position
                        ];

                }


                element.textContent =
                    current
                        .join(
                            ""
                        )
                        .trimEnd();


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        nextText;


                    element.dataset.rawText =
                        nextText;


                    element.style.minWidth =
                        "";


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   CASE HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const result =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            result.push(
                i
            );

        }

    }


    return result;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const upper =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                return upper.has(
                    index
                )
                    ? character.toUpperCase()
                    : character.toLowerCase();

            }
        )
        .join(
            ""
        );

}


/* =====================================================
   CASE ANIMATION
   ===================================================== */

function animateCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        baseText.toLowerCase();


    const positions =
        getLetterPositions(
            base
        );


    const total =
        positions.length;


    const currentText =
        element.textContent;


    let currentState =
        0;


    for (
        let i = 0;
        i < positions.length;
        i++
    ) {

        const position =
            positions[i];


        const character =
            currentText[
                position
            ];


        if (
            character &&
            character ===
            character.toUpperCase() &&
            character !==
            character.toLowerCase()
        ) {

            currentState++;

        }

        else {

            break;

        }

    }


    const target =
        toUpper
            ? total
            : 0;


    if (
        currentState === target
    ) {

        element.textContent =
            renderPrefixCase(
                base,
                target
            );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        currentState +
                        (
                            target -
                            currentState
                        ) *
                        progress
                    );


                element.textContent =
                    renderPrefixCase(
                        base,
                        state
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        renderPrefixCase(
                            base,
                            target
                        );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

   IMAGE

function renderImage(

/* =====================================================
   PROJECT META HORIZONTAL
   ===================================================== */

function syncMetadataHorizontal() {

    if (
        isPhoneLayout()
    ) {

        const style =
            getComputedStyle(
                document.documentElement
            );


        const side =
            parseFloat(
                style.getPropertyValue(
                    "--side"
                )
            ) || 24;


        projectMeta.style.left =
            `${side}px`;


        projectMeta.style.width =
            `calc(100vw - ${side * 2}px)`;


        return;

    }


    if (
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    const image =
        spread.querySelector(
            ".spread-image"
        );


    if (
        !image
    ) {

        return;

    }


    const imageRect =
        image.getBoundingClientRect();


    const blockRect =
        projectBlock.getBoundingClientRect();


    if (
        imageRect.width <= 0
    ) {

        return;

    }


    projectMeta.style.left =
        `${
            imageRect.left -
            blockRect.left
        }px`;


    projectMeta.style.width =
        `${imageRect.width}px`;

}


function syncMetadataAfterRender() {

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                syncMetadataHorizontal
            );

        }
    );

}


/* =====================================================
   UPDATE METADATA
   ===================================================== */

async function updateMetadata(
    targetProjectIndex,
    targetFrameIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    projectCounter.textContent =
        getCounterText(
            targetFrameIndex,
            project.images.length
        );


    projectCounter.dataset.rawText =
        projectCounter.textContent;


    if (
        projectChanged
    ) {

        await Promise.all(
            [

                morphSequential(
                    projectTitle,
                    project.title.toLowerCase(),
                    TEXT_MORPH_DURATION
                ),

                morphSequential(
                    projectDate,
                    (
                        project.date ||
                        ""
                    ).toLowerCase(),
                    TEXT_MORPH_DURATION
                )

            ]
        );

    }


    renderedProjectIndex =
        targetProjectIndex;

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    if (
        projects.length === 0
    ) {

        return;

    }


    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            frameIndex +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex + 1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW FRAME
   ===================================================== */

async function showFrame(
    targetProjectIndex,
    targetFrameIndex
) {

    if (
        navigationAnimating
    ) {

        return false;

    }


    navigationAnimating =
        true;


    const normalizedProject =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalizedProject
        ];


    const normalizedFrame =
        Math.max(
            0,
            Math.min(
                targetFrameIndex,
                project.images.length - 1
            )
        );


    try {

        const loadedImage =
            await preloadImage(
                project.images[
                    normalizedFrame
                ]
            );


        projectIndex =
            normalizedProject;


        frameIndex =
            normalizedFrame;


        renderImage(
            loadedImage
        );


        if (
            isPhoneLandscape()
        ) {

            updateLandscapeGeometry();

        }


        syncMetadataAfterRender();


        await updateMetadata(
            normalizedProject,
            normalizedFrame
        );


        preloadAhead();


        navigationAnimating =
            false;


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        navigationAnimating =
            false;


        return false;

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    if (
        frameIndex <
        project.images.length - 1
    ) {

        return showFrame(
            projectIndex,
            frameIndex + 1
        );

    }


    return showFrame(
        projectIndex + 1,
        0
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    if (
        frameIndex > 0
    ) {

        return showFrame(
            projectIndex,
            frameIndex - 1
        );

    }


    const previousProjectIndex =
        normalizeProjectIndex(
            projectIndex - 1
        );


    const previousProject =
        projects[
            previousProjectIndex
        ];


    return showFrame(
        previousProjectIndex,
        previousProject.images.length - 1
    );

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextFrame();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   PRIMARY ACTION
   ===================================================== */

async function performPrimarySlideAction() {

    if (
        indexMode ||
        projectAllMode ||
        interfaceAnimating ||
        navigationAnimating ||
        projectViewAnimating
    ) {

        return;

    }


    if (
        !manualMode
    ) {

        stopAutoSlideshow();


        return;

    }


    await nextFrame();

}


/* =====================================================
   VIEW ALL BOUNDS

   More aggressive use of the safe space.

   Still respects:
   - contact block
   - metadata
   - outer site margins
   ===================================================== */

function syncProjectAllBounds(
    force =
        false
) {

    if (
        !projectAllMode &&
        !force
    ) {

        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const side =
        parseFloat(
            rootStyle.getPropertyValue(
                "--side"
            )
        ) || 24;


    /*
        Smaller gaps than before.

        This gives the contact sheet substantially
        more usable area without allowing collisions.
    */

    let topGap =
        14;


    let bottomGap =
        14;


    if (
        isPhonePortrait()
    ) {

        topGap =
            10;


        bottomGap =
            10;

    }


    if (
        isPhoneLandscape()
    ) {

        /*
            Very short viewport:
            use almost the full safe window.
        */

        topGap =
            4;


        bottomGap =
            6;

    }


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    /*
        Also use the horizontal space slightly more
        aggressively.

        Still never crosses the site margins.
    */

    const horizontalInset =
        isPhoneLayout()
            ? 0
            : 0;


    projectAllView.style.left =
        `${side + horizontalInset}px`;


    projectAllView.style.right =
        `${side + horizontalInset}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom - top
        )}px`;

}


/* =====================================================
   VIEW ALL GRID LAYOUT

   Improved scoring:

   More emphasis on using available space.
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const gap =
        isPhoneLandscape()
            ? 4
            : (
                isPhonePortrait()
                    ? 5
                    : 7
            );


    let best =
        {
            columns: 1,
            rows: count,
            score: 0
        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns - 1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows - 1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        /*
            More neutral scoring than before.

            This tends to produce slightly larger
            thumbnails instead of overly cautious grids.
        */

        const score =
            Math.min(
                cellWidth,
                cellHeight * 1.28
            );


        if (
            score >
            best.score
        ) {

            best =
                {
                    columns,
                    rows,
                    score
                };

        }

    }


    return best;

}


function layoutProjectAllGrid(
    force =
        false
) {

    if (
        !projectAllMode &&
        !force
    ) {

        return;

    }


    syncProjectAllBounds(
        force
    );


    const layout =
        calculateProjectAllLayout(
            currentProject()
                .images
                .length
        );


    projectAllGrid.style.gridTemplateColumns =
        `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style.gridTemplateRows =
        `repeat(${layout.rows}, minmax(0, 1fr))`;

}


/* =====================================================
   BUILD VIEW ALL
   ===================================================== */

function buildProjectAllGrid() {

    const project =
        currentProject();


    projectAllGrid.innerHTML =
        "";


    project.images.forEach(
        (
            filename,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "project-all-thumb";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                getPhotoUrl(
                    filename
                );


            img.alt =
                "";


            img.loading =
                "eager";


            button.appendChild(
                img
            );


            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();


                    await exitProjectAllToFrame(
                        index
                    );

                }
            );


            projectAllGrid.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   PREPARE GRID
   ===================================================== */

function prepareProjectAllGrid() {

    buildProjectAllGrid();


    body.classList.add(
        "project-all-preparing"
    );


    projectAllView
        .getBoundingClientRect();


    syncProjectAllBounds(
        true
    );


    layoutProjectAllGrid(
        true
    );

}

/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                if (
                    dateA > dateB
                ) {

                    return -1;

                }


                if (
                    dateA < dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   INDEX CARD CASE CONTROLLER
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    const base =
        baseText.toLowerCase();


    const total =
        getLetterPositions(
            base
        ).length;


    let state =
        0;


    let frameId =
        null;


    function render() {

        element.textContent =
            renderPrefixCase(
                base,
                state
            );

    }


    function animateTo(
        target
    ) {

        if (
            frameId !== null
        ) {

            cancelAnimationFrame(
                frameId
            );

        }


        const startState =
            state;


        if (
            startState === target
        ) {

            render();


            return;

        }


        const start =
            performance.now();


        function frame(
            now
        ) {

            const progress =
                Math.min(
                    1,
                    (
                        now -
                        start
                    ) /
                    CASE_DURATION
                );


            state =
                Math.round(
                    startState +
                    (
                        target -
                        startState
                    ) *
                    progress
                );


            render();


            if (
                progress < 1
            ) {

                frameId =
                    requestAnimationFrame(
                        frame
                    );

            }

            else {

                state =
                    target;


                render();


                frameId =
                    null;

            }

        }


        frameId =
            requestAnimationFrame(
                frame
            );

    }


    render();


    return {

        upper() {

            animateTo(
                total
            );

        },

        lower() {

            animateTo(
                0
            );

        }

    };

}

/* =====================================================
   WORD CASE
   ===================================================== */

function renderWordCase(
    word,
    upperCount
) {

    let result =
        "";


    for (
        let i = 0;
        i < word.length;
        i++
    ) {

        result +=
            i < upperCount
                ? word[i].toUpperCase()
                : word[i].toLowerCase();

    }


    return result;

}


/* =====================================================
   INDEX WORD
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(
    state
) {

    indexWordState =
        state;


    indexButton.textContent =
        renderWordCase(
            indexWord,
            state
        );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !== null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    if (
        startState === target
    ) {

        renderIndexWord(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress < 1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

/* =====================================================
   INDEX DRAG
   ===================================================== */

indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );


        event.preventDefault();

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        if (
            Math.abs(
                delta
            ) > 4
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


function endIndexDrag() {

    if (
        !indexDragging
    ) {

        return;

    }


    indexDragging =
        false;


    indexScroller.classList.remove(
        "dragging"
    );


    saveIndexPosition();


    if (
        indexDragMoved
    ) {

        setTimeout(
            () => {

                indexDragMoved =
                    false;

            },
            0
        );

    }

}

   SLIDESHOW CLICK
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #index-button, #view-all-button"
            )
        ) {

            return;

        }


        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        if (
            position < 0.25
        ) {

            await previousFrame();

        }

        else {

            await nextFrame();

        }

    }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await returnFromIndex();

            }


            return;

        }


        if (
            projectAllMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await exitProjectAll();

            }


            return;

        }


        if (
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            await performPrimarySlideAction();


            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousFrame();

        }


        else if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextFrame();

        }

    }
);

   TOUCH
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating ||
            touchStartX === null ||
            touchStartY === null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) < 45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX < 0
        ) {

            await nextFrame();

        }

        else {

            await previousFrame();

        }

    },
    {
        passive: true
    }
);

        )

    ];


const lowercase =
    [

const uppercase =
    [

        "Y",
        "B",

    ];


let logoState =

let logoTarget =
    0;


let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        letters[i].textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            LOGO_STEP_DURATION
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !== null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}

function mobileLogoCycle() {

            setTimeout(
                () => {

                    animateLogoTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2200
                    );

                },
                2000
            );

        },
        1700
    );

}


/* =====================================================
   FILM
   ===================================================== */

const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchFrame =
    null;


function renderSwitch(
    state
) {

    switchState =
        state;


    sectionSwitchText.textContent =
        renderWordCase(
            switchWord,
            state
        );

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !== null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    if (
        startState === target
    ) {

        return;

    }


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                WORD_TRANSITION_DURATION
            );


        const state =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            state
        );


        if (
            progress < 1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            !isPhoneLayout()
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            !isPhoneLayout()
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   GEOMETRY CHANGE
   ===================================================== */

function handleGeometryChange() {

    updateResponsiveMode();


    updateIndexContentTop();


    if (
        isPhoneLandscape()
    ) {

        requestAnimationFrame(
            updateLandscapeGeometry
        );

    }


    syncMetadataAfterRender();


    if (
        projectAllMode
    ) {

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    layoutProjectAllGrid
                );

            }
        );

    }

}


window.addEventListener(
    "resize",
    handleGeometryChange
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            handleGeometryChange,
            100
        );


        setTimeout(
            handleGeometryChange,
            350
        );


        setTimeout(
            handleGeometryChange,
            700
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            handleGeometryChange
        );

}


/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length > 0
            );


        if (
            projects.length === 0
        ) {

            return;

        }


        updateResponsiveMode();


        buildIndex();


        const firstImage =
            await preloadImage(
                projects[
                    0
                ].images[
                    0
                ]
            );


        projectIndex =
            0;


        frameIndex =
            0;


        renderedProjectIndex =
            0;


        renderImage(
            firstImage
        );


        const title =
            projects[
                0
            ].title.toLowerCase();


        const date =
            (
                projects[
                    0
                ].date ||
                ""
            ).toLowerCase();


        projectTitle.textContent =
            title;


        projectTitle.dataset.rawText =
            title;


        projectDate.textContent =
            date;


        projectDate.dataset.rawText =
            date;


        projectCounter.textContent =
            getCounterText(
                0,
                projects[
                    0
                ].images.length
            );


        projectCounter.dataset.rawText =
            projectCounter.textContent;


        viewAllButton.textContent =
            "view all";


        viewAllButton.dataset.rawText =
            "view all";


        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        preloadAhead();


        updateIndexContentTop();


        if (
            isPhoneLandscape()
        ) {

            requestAnimationFrame(
                updateLandscapeGeometry
            );

        }


        syncMetadataAfterRender();


        startAutoSlideshow();


        mobileLogoCycle();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexWord(
    0
);


loadProjects();

</script>
