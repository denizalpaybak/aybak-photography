<!DOCTYPE html>

<head>

<title>Denizalp Aybak — Photography</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;

    /*
        Larger desktop slideshow.
    */

    --image-max-width: 76vw;

    /*
        Fixed visual zone.

        Image is always kept INSIDE this zone.
        Metadata starts below it, so overlap
        cannot happen.
    */

    --visual-height: 78vh;

    --image-max-height:
        calc(
            var(--visual-height) -
            18px
        );

    --meta-top-gap: 10px;

    --index-content-top: 130px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   FILM
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT STAGE
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#project-block {
    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =====================================================
   VISUAL ZONE
   ===================================================== */

#visual-zone {
    position: absolute;

    top: 50%;
    left: 0;

    width: 100%;
    height: var(--visual-height);

    transform: translateY(-50%);

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   SLIDESHOW
   ===================================================== */

#spread {
    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.image-cell {
    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: var(--image-max-width);
    max-height: var(--image-max-height);

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PROJECT META

   Y is fixed.

   JS changes ONLY:
   left
   width

   so metadata follows photograph horizontally.
   ===================================================== */

#project-meta {
    position: absolute;

    top:
        calc(
            50% +
            var(--visual-height) / 2 +
            var(--meta-top-gap)
        );

    left: 50%;

    width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}


/* =====================================================
   META LEFT
   ===================================================== */

#project-title {
    grid-column: 1;
    grid-row: 1;

    white-space: nowrap;

    text-align: left;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    white-space: nowrap;

    text-align: left;
}


/* =====================================================
   COUNTER
   ===================================================== */

#project-counter {
    grid-column: 2;
    grid-row: 1;

    display: inline-flex;

    justify-content: flex-end;
    align-items: baseline;

    padding-left: 28px;

    white-space: nowrap;

    text-align: right;
}

#counter-current,
#counter-total {
    display: inline-flex;

    white-space: pre;
}

.counter-digit {
    display: inline-block;

    min-width: 1ch;

    text-align: center;
}

#counter-separator {
    white-space: pre;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}

#view-all-button:hover,
#view-all-button:focus,
#view-all-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #spread {
    visibility: hidden;
}


/* =====================================================
   VIEW ALL PREPARATION

   Critical bug fix:

   grid is rendered INVISIBLY first,
   dimensions are calculated,
   and only then it is revealed.

   This prevents the first thumbnail
   flashing huge for one frame.
   ===================================================== */

body.project-all-preparing
#project-all-view {
    display: block;

    visibility: hidden;
}


/* =====================================================
   PROJECT ALL VIEW
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode
#project-all-view {
    display: block;

    visibility: visible;
}


/* =====================================================
   PROJECT ALL GRID
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 10px;
}


/* =====================================================
   PROJECT ALL THUMB
   ===================================================== */

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform: translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    top: var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            52px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: flex-start;

    gap: 54px;

    width: max-content;

    padding-left: var(--side);
    padding-right: var(--side);
}


/* =====================================================
   INDEX CARD

   Larger desktop thumbnails.
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex:
        0
        0
        285px;

    display: flex;
    flex-direction: column;

    width: 285px;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX IMAGE — NO CROP
   ===================================================== */

.card-image-wrap {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 365px;
}

.project-card img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    width: 100%;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (max-width: 1100px)
    and (min-width: 601px) {

    :root {

        --image-max-width: 74vw;

        --visual-height: 76vh;

        --image-max-height:
            calc(
                var(--visual-height) -
                18px

    }


    .project-card {
        flex:
            0
            0
            230px;

        width: 230px;
    }


    .card-image-wrap {
        height: 300px;
    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 18px;

        --meta-gap: 5px;

        /*
            Exact horizontal alignment:
            Denizalp left -> film right.
        */

        --image-max-width:
            calc(
                100vw -
                var(--side) * 2
            );

        /*
            Larger reserved metadata region.

            This fixes project title / counter
            touching the photograph.
        */

        --visual-height:
            calc(
                100% -
                72px
            );

        --image-max-height:
            calc(
                100% -
                16px
            );

        --meta-top-gap: 10px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-aybak {
        top: 15px;
    }


    /* =================================================
       MOBILE STAGE
       ================================================= */

    #project-stage {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }


    #visual-zone {
        top: 0;

        height:
            calc(
                100% -
                72px
            );

        transform: none;
    }


    .spread-image {
        width:
            calc(
                100vw -
                var(--side) * 2
            );

        height: auto;

        max-width:
            calc(
                100vw -
                var(--side) * 2
            );

        max-height:
            calc(
                100% -
                16px
            );

        object-fit: contain;
    }


    #project-meta {
        top:
            calc(
                100% -
                72px +
                var(--meta-top-gap)
            );
    }


    #project-counter {
        padding-left: 16px;
    }


    #project-all-grid {
        gap: 6px;
    }


    #index-scroller {
        bottom:
            calc(
                50px +
                env(safe-area-inset-bottom)
            );
    }


    #index-grid {
        gap: 30px;
    }


    .project-card {
        flex:
            0
            0
            48vw;

        width: 48vw;
    }


    .card-image-wrap {
        height: 56vw;
    }

}


/* =====================================================
   SHORT LANDSCAPE
   ===================================================== */

@media
    (orientation: landscape)
    and (max-height: 700px) {

    :root {

        --side: 24px;

        --index-bottom: 16px;

    }

        width: 160px;
        height: 45px;
    }

    .logo-aybak {
        top: 15px;
    }

}

<script>


/* =====================================================

   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";


const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;


/*
    Counter digit:
    old -> blank -> new.
*/

const DIGIT_OUT_DURATION =

    Project title/date positional morph.
*/

/*

    480;

    Navigation typography.
*/

const INDEX_TRANSITION_DURATION =

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================

const INDEX_WHEEL_MULTIPLIER =

/* =====================================================

const body =

const info =

const projectStage =

    );


const viewAllButton =

    );

    );


const projectAllGrid =
    document.getElementById(

    );

    );


const indexView =
    document.getElementById(

    document.getElementById(

    );

    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];


let projectIndex =
    0;


let frameIndex =
    0;


let renderedProjectIndex =
    null;


let manualMode =
    false;


let indexMode =
    false;


let projectAllMode =
    false;


let slideTimer =
    null;


let interfaceAnimating =
    false;


let navigationAnimating =
    false;


let projectViewAnimating =

let autoplayBeforeIndex =
    false;


let autoplayBeforeProjectAll =
    false;


let savedIndexScrollLeft =
    0;


/* =====================================================
   VIEW BUTTON

let viewButtonHovered =
    false;


let viewButtonFrame =
    null;


/* =====================================================
   INDEX DRAG
   ===================================================== */

let indexDragging =
    false;


let indexDragStartX =
    0;


let indexDragStartScroll =
    0;


let indexDragMoved =
    false;


/* =====================================================
   TOUCH
   ===================================================== */

let touchStartX =
    null;


let touchStartY =
    null;


let suppressClickUntil =

/* =====================================================
   CACHE
   ===================================================== */

const imageCache =
    new Map();


/* =====================================================
   PHOTO URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   PRELOAD
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


function getCurrentText(
    index
) {

    return String(
        index + 1
    ).padStart(
        2,
        "0"
    );

}


function getTotalText(
    total
) {

    return String(
        total
    ).padStart(
        2,
        "0"
    );

}


function wait(
    duration
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                duration
            )
    );

}


/* =====================================================
   INDEX CONTENT TOP
   ===================================================== */

function updateIndexContentTop() {

    const rect =
        info.getBoundingClientRect();


    const gap =
        window.innerWidth <= 600
            ? 30
            : 34;


    document
        .documentElement
        .style
        .setProperty(
            "--index-content-top",
            `${Math.ceil(
                rect.bottom +
                gap
            )}px`
        );

}


/* =====================================================
   COUNTER DIGITS
   ===================================================== */

function initialiseDigitSlots(
    element,
    text
) {

    element.innerHTML =
        "";


    for (
        const character
        of text
    ) {

        const span =
            document.createElement(
                "span"
            );


        span.className =
            "counter-digit";


        span.textContent =
            character;


        span.dataset.value =
            character;


        element.appendChild(
            span
        );

    }

}


/* =====================================================
   DIGIT MORPH

   Example:

   01 / 11
   0_ / 11
   02 / 11

   The first 0 is literally untouched.
   ===================================================== */

async function morphDigits(
    element,
    nextText
) {

    const slots =
        Array.from(
            element.querySelectorAll(
                ".counter-digit"
            )
        );


    if (
        slots.length !==
        nextText.length
    ) {

        initialiseDigitSlots(
            element,
            nextText
        );


        return;

    }


    const jobs =
        [];


    slots.forEach(
        (
            slot,
            index
        ) => {

            const oldCharacter =
                slot.dataset.value;


            const nextCharacter =
                nextText[index];


            if (
                oldCharacter ===
                nextCharacter
            ) {

                return;

            }


            jobs.push(
                (
                    async () => {

                        /*
                            Old character remains first,
                            then disappears.
                        */

                        await wait(
                            DIGIT_OUT_DURATION
                        );


                        slot.textContent =
                            "\u00a0";


                        await wait(
                            DIGIT_BLANK_DURATION
                        );


                        /*
                            New character appears.
                        */

                        slot.textContent =
                            nextCharacter;


                        slot.dataset.value =
                            nextCharacter;

                    }
                )()
            );

        }
    );


    await Promise.all(
        jobs
    );

}


/* =====================================================
   CHARACTER HELPERS
   ===================================================== */

function getCharacterWidth(
    character,
    reference
) {

    const probe =
        document.createElement(
            "span"
        );


    const style =
        getComputedStyle(
            reference
        );


    probe.style.position =
        "absolute";


    probe.style.visibility =
        "hidden";


    probe.style.whiteSpace =
        "pre";


    probe.style.fontFamily =
        style.fontFamily;


    probe.style.fontSize =
        style.fontSize;


    probe.style.fontWeight =
        style.fontWeight;


    probe.style.fontStyle =
        style.fontStyle;


    probe.textContent =
        character === " "
            ? "\u00a0"
            : character;


    document.body.appendChild(
        probe
    );


    const width =
        probe
            .getBoundingClientRect()
            .width;


    probe.remove();


    return width;

}


/* =====================================================
   PROJECT TITLE / DATE MORPH

   Same-position same characters are never touched.

   Different positions morph through blank.

   The whole animation always has the same
   overall duration, regardless of word length.
   ===================================================== */

function morphProjectText(
    element,
    nextText,
    duration =
        PROJECT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        element.dataset.rawText =
            nextText;


        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const oldChars =
        oldText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const newChars =
        nextText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const changed =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            oldChars[i] !==
            newChars[i]
        ) {

            changed.push(
                i
            );

        }

    }


    element.innerHTML =
        "";


    const slots =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        const span =
            document.createElement(
                "span"
            );


        span.style.display =
            "inline-block";


        span.style.whiteSpace =
            "pre";


        const width =
            Math.max(
                getCharacterWidth(
                    oldChars[i],
                    element
                ),
                getCharacterWidth(
                    newChars[i],
                    element
                )
            );


        span.style.width =
            `${width}px`;


        span.textContent =
            oldChars[i] === " "
                ? "\u00a0"
                : oldChars[i];


        element.appendChild(
            span
        );


        slots.push(
            span
        );

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                changed.forEach(
                    (
                        position,
                        order
                    ) => {

                        /*
                            Very small left-to-right staggering,
                            but still finishes at exactly
                            the same total duration.
                        */

                        const stagger =
                            changed.length <= 1
                                ? 0
                                : (
                                    order /
                                    (
                                        changed.length -
                                        1
                                    )
                                ) * 0.22;


                        const local =
                            Math.max(
                                0,
                                Math.min(
                                    1,
                                    (
                                        progress -
                                        stagger
                                    ) /
                                    (
                                        1 -
                                        stagger
                                    )
                                )
                            );


                        if (
                            local <
                            0.42
                        ) {

                            slots[
                                position
                            ].textContent =
                                oldChars[
                                    position
                                ] === " "
                                    ? "\u00a0"
                                    : oldChars[
                                        position
                                    ];

                        }

                        else if (
                            local <
                            0.58
                        ) {

                            slots[
                                position
                            ].textContent =
                                "\u00a0";

                        }

                        else {

                            slots[
                                position
                            ].textContent =
                                newChars[
                                    position
                                ] === " "
                                    ? "\u00a0"
                                    : newChars[
                                        position
                                    ];

                        }

                    }
                );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        nextText;


                    element.dataset.rawText =
                        nextText;


                    element.dataset.caseBase =
                        nextText.toLowerCase();


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   CASE HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const positions =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            positions.push(
                i
            );

        }

    }


    return positions;

}


/* =====================================================
   PREFIX CASE

   view all
   View all
   VIew all
   VIEw all
   VIEW all
   ...
   VIEW ALL
   ===================================================== */

function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const uppercasePositions =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                if (
                    uppercasePositions.has(
                        index
                    )
                ) {

                    return character
                        .toUpperCase();

                }


                return character
                    .toLowerCase();

            }
        )
        .join(
            ""
        );

}


/* =====================================================
   CASE CONTROLLER

   Fixed total duration regardless of word length.

   Photography, Film, Vogue Türkiye,
   March 2026 all finish together if started together.
   ===================================================== */

function createCaseController(
    element,
    baseText,
    duration =
        CASE_DURATION
) {

    const base =
        baseText.toLowerCase();


    const total =
        getLetterPositions(
            base
        ).length;


    let state =
        0;


    let frameId =
        null;


    function render() {

        element.textContent =
            renderPrefixCase(
                base,
                state
            );

    }


    function animateTo(
        target
    ) {

        if (
            frameId !==
            null
        ) {

            cancelAnimationFrame(
                frameId
            );

        }


        const startState =
            state;


        if (
            startState ===
            target
        ) {

            render();


            return;

        }


        const start =
            performance.now();


        function frame(
            now
        ) {

            const progress =
                Math.min(
                    1,
                    (
                        now -
                        start
                    ) /
                    duration
                );


            state =
                Math.round(
                    startState +
                    (
                        target -
                        startState
                    ) *
                    progress
                );


            render();


            if (
                progress < 1
            ) {

                frameId =
                    requestAnimationFrame(
                        frame
                    );

            }

            else {

                state =
                    target;


                render();


                frameId =
                    null;

            }

        }


        frameId =
            requestAnimationFrame(
                frame
            );

    }


    render();


    return {

        upper() {

            animateTo(
                total
            );

        },

        lower() {

            animateTo(
                0
            );

        },

        setUpperInstant() {

            if (
                frameId !== null
            ) {

                cancelAnimationFrame(
                    frameId
                );

            }


            state =
                total;


            render();

        },

        setLowerInstant() {

            if (
                frameId !== null
            ) {

                cancelAnimationFrame(
                    frameId
                );

            }


            state =
                0;


            render();

        }

    };

}


/* =====================================================
   ONE-OFF PROJECT CASE MORPH
   ===================================================== */

function animateProjectCase(
    element,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        (
            element.dataset.caseBase ||
            element.textContent
        ).toLowerCase();


    const positions =
        getLetterPositions(
            base
        );


    const total =
        positions.length;


    const from =
        toUpper
            ? 0
            : total;


    const to =
        toUpper
            ? total
            : 0;


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        from +
                        (
                            to -
                            from
                        ) *
                        progress
                    );


                element.textContent =
                    renderPrefixCase(
                        base,
                        state
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        renderPrefixCase(
                            base,
                            to
                        );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

   RENDER IMAGE

/* =====================================================
   META HORIZONTAL ALIGNMENT
   ===================================================== */

function syncMetadataHorizontal() {

    if (
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    const image =
        spread.querySelector(
            ".spread-image"
        );


    if (
        !image
    ) {

        return;

    }


    const imageRect =
        image.getBoundingClientRect();


    const blockRect =
        projectBlock.getBoundingClientRect();


    if (
        imageRect.width <= 0
    ) {

        return;

    }


    /*
        Only X geometry changes.
        TOP is never touched.
    */

    projectMeta.style.left =
        `${
            imageRect.left -
            blockRect.left
        }px`;


    projectMeta.style.width =
        `${imageRect.width}px`;

}


function syncMetadataAfterRender() {

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                syncMetadataHorizontal
            );

        }
    );

}


/* =====================================================
   UPDATE META
   ===================================================== */

async function updateMetadata(
    targetProjectIndex,
    targetFrameIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    const jobs =
        [];


    /*
        Current frame always checked digit-by-digit.
    */

    jobs.push(

        morphDigits(
            counterCurrent,
            getCurrentText(
                targetFrameIndex
            )
        )

    );


    if (
        projectChanged
    ) {

        /*
            Total also compares each digit.

            Example:
            11 -> 12
            first 1 stays untouched.
        */

        jobs.push(

            morphDigits(
                counterTotal,
                getTotalText(
                    project.images.length
                )
            )

        );


        /*
            Project name/date positional morph.

            Same-position equal characters
            remain completely static.
        */

        jobs.push(

            morphProjectText(
                projectTitle,
                project.title.toLowerCase()
            ),

            morphProjectText(
                projectDate,
                (
                    project.date ||
                    ""
                ).toLowerCase()
            )

        );

    }


    await Promise.all(
        jobs
    );


    renderedProjectIndex =
        targetProjectIndex;

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    if (
        projects.length === 0
    ) {

        return;

    }


    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            frameIndex +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex +
                1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW FRAME
   ===================================================== */

async function showFrame(
    targetProjectIndex,
    targetFrameIndex
) {

    if (
        navigationAnimating
    ) {

        return false;

    }


    navigationAnimating =
        true;


    const normalizedProject =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalizedProject
        ];


    const normalizedFrame =
        Math.max(
            0,
            Math.min(
                targetFrameIndex,
                project.images.length -
                1
            )
        );


    try {

        const loadedImage =
            await preloadImage(
                project.images[
                    normalizedFrame
                ]
            );


        projectIndex =
            normalizedProject;


        frameIndex =
            normalizedFrame;


        renderImage(
            loadedImage
        );


        syncMetadataAfterRender();


        await updateMetadata(
            normalizedProject,
            normalizedFrame
        );


        preloadAhead();


        navigationAnimating =
            false;


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        navigationAnimating =
            false;


        return false;

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    if (
        frameIndex <
        project.images.length -
        1
    ) {

        return showFrame(
            projectIndex,
            frameIndex +
            1
        );

    }


    return showFrame(
        projectIndex +
        1,
        0
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    if (
        frameIndex >
        0
    ) {

        return showFrame(
            projectIndex,
            frameIndex -
            1
        );

    }


    const previousProjectIndex =
        normalizeProjectIndex(
            projectIndex -
            1
        );


    const previousProject =
        projects[
            previousProjectIndex
        ];


    return showFrame(
        previousProjectIndex,
        previousProject.images.length -
        1
    );

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextFrame();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   PRIMARY SLIDE ACTION
   ===================================================== */

async function performPrimarySlideAction() {

    if (
        indexMode ||
        projectAllMode ||
        interfaceAnimating ||
        navigationAnimating ||
        projectViewAnimating
    ) {

    }


    /*

    */

    if (

    ) {

    await nextFrame();

}


/* =====================================================
   VIEW ALL BUTTON CASE
   ===================================================== */

function getViewButtonBase() {

    return projectAllMode
        ? "close"
        : "view all";

}


function morphViewButtonCase(
    toUpper
) {

    if (
        viewButtonFrame !==
        null
    ) {

        cancelAnimationFrame(
            viewButtonFrame
        );

    }


    const base =
        getViewButtonBase();


    const positions =
        getLetterPositions(
            base
        );


    const total =
        positions.length;


    /*
        Determine current uppercase prefix.
    */

    let current =
        0;


    positions.forEach(
        position => {

            const char =
                viewAllButton.textContent[
                    position
                ];


            if (
                char &&
                char ===
                char.toUpperCase() &&
                char !==
                char.toLowerCase()
            ) {

                current++;

            }

        }
    );


    const target =
        toUpper
            ? total
            : 0;


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                CASE_DURATION
            );


        const state =
            Math.round(
                current +
                (
                    target -
                    current
                ) *
                progress
            );


        viewAllButton.textContent =
            renderPrefixCase(
                base,
                state
            );


        if (
            progress < 1
        ) {

            viewButtonFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            viewAllButton.textContent =
                renderPrefixCase(
                    base,
                    target
                );


            viewButtonFrame =
                null;

        }

    }


    viewButtonFrame =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   VIEW ALL BASE MORPH

   VIEW ALL -> CLOSE
   close -> view all

   Uses positional character morph.
   ===================================================== */

async function morphViewButtonBase(
    nextBase
) {

    if (
        viewButtonFrame !==
        null
    ) {

        cancelAnimationFrame(
            viewButtonFrame
        );


        viewButtonFrame =
            null;

    }


    const shouldUppercase =
        (
            window.matchMedia(
                "(hover: hover)"
            ).matches &&
            viewButtonHovered
        );


    const targetText =
        shouldUppercase
            ? nextBase.toUpperCase()
            : nextBase.toLowerCase();


    await morphProjectText(
        viewAllButton,
        targetText,
        PROJECT_MORPH_DURATION
    );

}

/* =====================================================
   VIEW ALL BOUNDS

   Horizontal:
   Denizalp left -> film right.

   Vertical:
   below contact information
   ->
   safely above metadata.
   ===================================================== */

function syncProjectAllBounds(
    force =
        false
) {

    if (
        !projectAllMode &&
        !force
    ) {

        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const side =
        parseFloat(
            rootStyle.getPropertyValue(
                "--side"
            )
        ) || 24;


    const topGap =
        window.innerWidth <= 600
            ? 22
            : 30;


    /*
        More generous bottom spacing.

        Grid cannot reach metadata.
    */

    const bottomGap =
        window.innerWidth <= 600
            ? 24
            : 28;


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL GRID LAYOUT
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const gap =
        window.innerWidth <= 600
            ? 6
            : 10;


    let best =
        {

            columns:
                1,

            rows:
                count,

            score:
                0

        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns -
                1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows -
                1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        const score =
            Math.min(
                cellWidth,
                cellHeight *
                1.15
            );


        if (
            score >
            best.score
        ) {

            best =
                {

                    columns,
                    rows,
                    score

                };

        }

    }


    return best;

}


/* =====================================================
   APPLY GRID
   ===================================================== */

function layoutProjectAllGrid(
    force =
        false
) {

    if (
        !projectAllMode &&
        !force
    ) {

        return;

    }


    syncProjectAllBounds(
        force
    );


    const layout =
        calculateProjectAllLayout(
            currentProject()
                .images
                .length
        );


    projectAllGrid.style.gridTemplateColumns =
        `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style.gridTemplateRows =
        `repeat(${layout.rows}, minmax(0, 1fr))`;

}

/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,
                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                if (
                    dateA >
                    dateB
                ) {

                    return -1;

                }


                if (
                    dateA <
                    dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}

function buildIndex() {

    getChronologicalProjects()

                    item.project;


                const originalIndex =
                    item.originalIndex;

                    document.createElement(

                    );


                imageWrap.className =
                    "card-image-wrap";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    getPhotoUrl(
                        project.cover
                    );


                img.alt =
                    "";


                img.loading =
                    "eager";


                imageWrap.appendChild(
                    img
                );


                /* -------------------------------------
                   COPY
                   ------------------------------------- */

                const copy =
                    document.createElement(
                        "span"
                    );


                copy.className =
                    "card-copy";


                const title =
                    document.createElement(
                        "span"
                    );


                title.className =
                    "card-title";


                const titleBase =
                    project.title
                        .toLowerCase();


                title.textContent =
                    titleBase;


                const date =
                    document.createElement(
                        "span"
                    );


                date.className =
                    "card-date";


                const dateBase =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();


                date.textContent =
                    dateBase;


                copy.append(
                    title,
                    date
                );


                button.append(
                    imageWrap,
                    copy
                );


                /* -------------------------------------
                   TITLE + DATE CASE CONTROLLERS

                   SAME duration.
                   They start together.
                   They end together.
                   ------------------------------------- */

                const titleCase =
                    createCaseController(
                        title,
                        titleBase,
                        CASE_DURATION
                    );


                const dateCase =
                    createCaseController(
                        date,
                        dateBase,
                        CASE_DURATION
                    );


                button.addEventListener(
                    "mouseenter",
                    () => {

                        if (
                            !window.matchMedia(
                                "(hover: hover)"
                            ).matches
                        ) {

                            return;

                        }


                        titleCase.upper();


                        dateCase.upper();

                    }
                );


                button.addEventListener(
                    "mouseleave",
                    () => {

                        if (
                            !window.matchMedia(
                                "(hover: hover)"
                            ).matches
                        ) {

                            return;

                        }


                        titleCase.lower();


                        dateCase.lower();

                    }
                );


                button.addEventListener(
                    "click",
                    event => {

                        if (
                            indexDragMoved

                            event.stopPropagation();


                            return;

                        }


                        event.stopPropagation();


                        exitIndexToProject(
                            originalIndex
                        );

                    }
                );


                indexGrid.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   INDEX WORD
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


/* =====================================================
   BASIC WORD CASE
   ===================================================== */

function renderWordCase(
    word,
    upperCount
) {

    let result =
        "";


    for (
        let i = 0;
        i < word.length;
        i++
    ) {

        result +=
            i < upperCount
                ? word[i].toUpperCase()
                : word[i].toLowerCase();

    }


    return result;

}


/* =====================================================
   RENDER INDEX WORD
   ===================================================== */

function renderIndexWord(
    state
) {

    indexWordState =
        state;


    indexButton.textContent =
        renderWordCase(
            indexWord,
            state
        );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    if (
        startState ===
        target
    ) {

        renderIndexWord(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress < 1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=

    },
    {
        passive: false
    }
);

/* =====================================================
   INDEX MOUSE DRAG
   ===================================================== */

indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );


        event.preventDefault();

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        if (
            Math.abs(
                delta
            ) >
            4
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


function endIndexDrag() {

    if (
        !indexDragging
    ) {

        return;

    }


    indexDragging =
        false;


    indexScroller.classList.remove(
        "dragging"
    );


    saveIndexPosition();


    if (
        indexDragMoved
    ) {

        setTimeout(
            () => {

                indexDragMoved =
                    false;

            },
            0
        );

    }

}


window.addEventListener(

);


window.addEventListener(

);

body.addEventListener(

        ) {

            )
        ) {

        }


        if (

        ) {

        }

            window.innerWidth;


        if (

        ) {

            await previousFrame();

        }

        else {

            await nextFrame();

        }

    }
);

   KEYBOARD
   ===================================================== */

        if (
            indexMode
        ) {

            if (
                event.key ===

            ) {

        ) {

            }

            interfaceAnimating ||
            navigationAnimating ||

        ) {

        }


        /*

            exactly same behaviour as primary click.
        */

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            await performPrimarySlideAction();


            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousFrame();

        }


        else if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextFrame();

        }

    }
);


/* =====================================================
   TOUCH
   ===================================================== */

document.addEventListener(

        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating ||
            touchStartX === null ||
            touchStartY === null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) <
            45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX <
            0
        ) {

            await nextFrame();

        }

        else {

            await previousFrame();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   MOBILE STAGE

   Explicitly reserves a metadata region
   below the image.
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";


        projectStage.style.height =
            "";


        projectStage.style.bottom =
            "";


        syncMetadataAfterRender();


        if (
            projectAllMode
        ) {

            layoutProjectAllGrid();

        }


        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const gapAfterInfo =
        24;


    /*
        Extra room at bottom for:
        first meta row
        second meta row
        index
        safe-area
    */

    const bottomGap =
        60;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            8
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            220,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";


    syncMetadataAfterRender();


    if (
        projectAllMode
    ) {

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    layoutProjectAllGrid
                );

            }
        );

    }

}

        letters[i].textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


function mobileLogoCycle() {

    setTimeout(
        () => {

            animateLogoTo(
                5
            );


            setTimeout(
                () => {

                    animateLogoTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   FILM SWITCH
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchFrame =
    null;


function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    sectionSwitchText.textContent =
        renderWordCase(
            switchWord,
            upperCount
        );

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    if (
        startState ===
        target
    ) {

        return;

    }


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                WORD_TRANSITION_DURATION
            );


        const state =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            state
        );


        if (
            progress <
            1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);

/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        const firstImage =
            await preloadImage(
                projects[
                    0
                ].images[
                    0
                ]
            );


        projectIndex =
            0;


        frameIndex =
            0;


        renderedProjectIndex =
            0;


        renderImage(
            firstImage
        );


        const initialTitle =
            projects[
                0
            ].title.toLowerCase();


        const initialDate =
            (
                projects[
                    0
                ].date ||
                ""
            ).toLowerCase();


        projectTitle.textContent =
            initialTitle;


        projectTitle.dataset.rawText =
            initialTitle;


        projectTitle.dataset.caseBase =
            initialTitle;


        projectDate.textContent =
            initialDate;


        projectDate.dataset.rawText =
            initialDate;


        projectDate.dataset.caseBase =
            initialDate;


        initialiseDigitSlots(
            counterCurrent,
            getCurrentText(
                0
            )
        );


        initialiseDigitSlots(
            counterTotal,
            getTotalText(
                projects[
                    0
                ].images.length
            )
        );


        viewAllButton.textContent =
            "view all";


        viewAllButton.dataset.rawText =
            "view all";


        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        preloadAhead();


        updateIndexContentTop();


        updateMobileStage();


        syncMetadataAfterRender();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(

);


renderSwitch(

);

);


loadProjects();
