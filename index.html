<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;

    /*
        Desktop slideshow is intentionally large.
    */
    --image-max-width: 72vw;
    --image-max-height: 80vh;

    /*
        Fixed slideshow visual zone.
        Metadata Y is attached to this,
        never to image height.
    */
    --visual-height: 78vh;

    --meta-top-gap: 9px;

    --index-content-top: 130px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   FILM
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT STAGE
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#project-block {
    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =====================================================
   VISUAL ZONE
   ===================================================== */

#visual-zone {
    position: absolute;

    top: 50%;
    left: 0;

    width: 100%;
    height: var(--visual-height);

    transform: translateY(-50%);

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   SLIDESHOW IMAGE
   ===================================================== */

#spread {
    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.image-cell {
    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: var(--image-max-width);
    max-height: var(--image-max-height);

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PROJECT META

   Vertical position never changes.

   JS only changes:
   - left
   - width

   So metadata follows image horizontally only.
   ===================================================== */

#project-meta {
    position: absolute;

    top:
        calc(
            50% +
            var(--visual-height) / 2 +
            var(--meta-top-gap)
        );

    left: 50%;

    width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}


/* =====================================================
   META LEFT
   ===================================================== */

#project-title {
    grid-column: 1;
    grid-row: 1;

    white-space: nowrap;

    text-align: left;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    white-space: nowrap;

    text-align: left;
}


/* =====================================================
   META RIGHT
   ===================================================== */

#project-counter {
    grid-column: 2;
    grid-row: 1;

    display: inline-flex;

    align-items: baseline;
    justify-content: flex-end;

    padding-left: 28px;

    white-space: nowrap;

    text-align: right;
}

#counter-current,
#counter-total {
    display: inline-flex;
}

.counter-digit {
    display: inline-block;

    min-width: 1ch;

    text-align: center;
}

#counter-separator {
    white-space: pre;
}


/* =====================================================
   VIEW ALL BUTTON
   ===================================================== */

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}

#view-all-button:hover,
#view-all-button:focus,
#view-all-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #spread {
    visibility: hidden;
}


/* =====================================================
   PROJECT ALL VIEW
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;
}


/* =====================================================
   PROJECT ALL GRID
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 10px;
}


/* =====================================================
   PROJECT ALL THUMB
   ===================================================== */

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform: translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   HORIZONTAL INDEX
   ===================================================== */

#index-scroller {
    position: absolute;

    top: var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            52px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    cursor: grab;

    user-select: none;

    outline: none;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: flex-start;

    gap: 52px;

    width: max-content;

    padding-left: var(--side);
    padding-right: var(--side);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex:
        0
        0
        260px;

    display: flex;
    flex-direction: column;

    width: 260px;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX IMAGE — NO CROP
   ===================================================== */

.card-image-wrap {
    display: flex;

    align-items: center;
    justify-content: center;

    height: 340px;
}

.project-card img {

    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;

/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    width: 100%;

/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

        --top: 20px;

        --index-bottom: 18px;

        --meta-gap: 5px;

            Full available width:

        --image-max-width:
            calc(

        --visual-height:

    .logo-aybak {

       MOBILE STAGE
       ================================================= */

    #project-stage {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }


    #visual-zone {
        top: 0;

        height:
            calc(
                100% -
                58px
            );

        transform: none;
    }

        Preserve aspect ratio while using as much

    */

        width:

            );

        padding-left: 16px;
    }


    #project-all-grid {
        gap: 6px;
    }


    #index-scroller {
        bottom:
            calc(
                50px +
                env(safe-area-inset-bottom)
            );
    }


    #index-grid {
        gap: 30px;
    }

        flex:
            0
            0
            48vw;

        width: 48vw;
    }


    .card-image-wrap {
        height: 56vw;
    }

}


/* =====================================================
   SHORT LANDSCAPE

@media

}

/* =====================================================

const R2_BASE =

/* =====================================================

/* =====================================================

const imageCache =

/* =====================================================
   PHOTO URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   PRELOAD
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   HELPERS
   ===================================================== */

function currentProject() {

    ];

}


function normalizeProjectIndex(
    index
) {

    return (

            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


function getCurrentText(

) {

    return String(

    ).padStart(

}


function getTotalText(
    total
) {

/* =====================================================
   INDEX TOP
   ===================================================== */

function updateIndexContentTop() {

    const rect =
        info.getBoundingClientRect();


    const gap =
        window.innerWidth <= 600
            ? 30
            : 34;


    document
        .documentElement
        .style
        .setProperty(
            "--index-content-top",
            `${Math.ceil(
                rect.bottom +
                gap
            )}px`
        );

}


/* =====================================================
   WAIT
   ===================================================== */

function wait(
    milliseconds
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );

}


/* =====================================================
   CHARACTER SLOT WIDTH
   ===================================================== */

function measureCharacterWidth(
    character,
    element
) {

    const span =
        document.createElement(
            "span"
        );


    const computed =
        getComputedStyle(
            element
        );


    span.style.position =
        "absolute";


    span.style.visibility =
        "hidden";


    span.style.whiteSpace =
        "pre";


    span.style.fontFamily =
        computed.fontFamily;


    span.style.fontSize =
        computed.fontSize;


    span.style.fontWeight =
        computed.fontWeight;


    span.style.fontStyle =
        computed.fontStyle;


    span.textContent =
        character === " "
            ? "\u00a0"
            : character;


    document.body.appendChild(
        span
    );


    const width =
        span.getBoundingClientRect().width;


    span.remove();


    return width;

}


/* =====================================================
   POSITION-PRESERVING TEXT MORPH

   Same-position identical characters never move.

   Different character:
   OLD -> blank -> NEW

   Example:
   01
   0_
   02
   ===================================================== */

async function morphTextSlots(
    element,
    nextText
) {

    const oldText =
        element.dataset.rawText !== undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        element.dataset.rawText =
            nextText;


        return;

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const oldChars =
        oldText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const newChars =
        nextText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    element.innerHTML =
        "";


    const slots =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        const slot =
            document.createElement(
                "span"
            );


        slot.style.display =
            "inline-block";


        slot.style.whiteSpace =
            "pre";


        /*
            Fix each slot to the larger width of
            old/new character during animation.
        */

        const width =
            Math.max(
                measureCharacterWidth(
                    oldChars[i],
                    element
                ),
                measureCharacterWidth(
                    newChars[i],
                    element
                )
            );


        slot.style.width =
            `${width}px`;


        slot.textContent =
            oldChars[i] === " "
                ? "\u00a0"
                : oldChars[i];


        element.appendChild(
            slot
        );


        slots.push(
            slot
        );

    }


    /*
        Phase 1:
        only changed positions disappear.
    */

    await Promise.all(

        slots.map(
            async (
                slot,
                index
            ) => {

                if (
                    oldChars[index] ===
                    newChars[index]
                ) {

                    return;

                }


                await wait(
                    SLOT_OUT_DURATION
                );


                slot.textContent =
                    "\u00a0";

            }
        )

    );


    /*
        Phase 2:
        changed positions become new chars.
    */

    await Promise.all(

        slots.map(
            async (
                slot,
                index
            ) => {

                if (
                    oldChars[index] ===
                    newChars[index]
                ) {

                    return;

                }


                await wait(
                    SLOT_IN_DURATION
                );


                slot.textContent =
                    newChars[index] === " "
                        ? "\u00a0"
                        : newChars[index];

            }
        )

    );


    element.textContent =
        nextText;


    element.dataset.rawText =
        nextText;

}


/* =====================================================
   DIGIT SLOTS

   Counter keeps exact digit geometry.
   ===================================================== */

function initialiseDigitSlots(
    element,
    text
) {

    element.innerHTML =
        "";


    for (
        const character
        of text
    ) {

        const span =
            document.createElement(
                "span"
            );


        span.className =
            "counter-digit";


        span.textContent =
            character;


        span.dataset.value =
            character;


        element.appendChild(
            span
        );

    }

}


/* =====================================================
   DIGIT MORPH

   01 -> 02:

   first 0 untouched
   second 1 -> blank -> 2
   ===================================================== */

async function morphDigits(
    element,
    nextText
) {

    let slots =
        Array.from(
            element.querySelectorAll(
                ".counter-digit"
            )
        );


    if (
        slots.length !==
        nextText.length
    ) {

        initialiseDigitSlots(
            element,
            nextText
        );


        return;

    }


    const jobs =
        [];


    slots.forEach(
        (
            slot,
            index
        ) => {

            const oldCharacter =
                slot.dataset.value;


            const nextCharacter =
                nextText[index];


            if (
                oldCharacter ===
                nextCharacter
            ) {

                return;

            }


            jobs.push(
                (
                    async () => {

                        await wait(
                            SLOT_OUT_DURATION
                        );


                        slot.textContent =
                            "\u00a0";


                        await wait(
                            SLOT_IN_DURATION
                        );


                        slot.textContent =
                            nextCharacter;


                        slot.dataset.value =
                            nextCharacter;

                    }
                )()
            );

        }
    );


    await Promise.all(
        jobs
    );

}


/* =====================================================
   PREFIX CASE MORPH

   view all
   View all
   VIew all
   VIEw all
   VIEW all
   VIEW All
   ...
   VIEW ALL

   Total duration is always the same.
   ===================================================== */

function getLetterPositions(
    text
) {

    const positions =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        if (
            text[i].toLowerCase() !==
            text[i].toUpperCase()
        ) {

            positions.push(
                i
            );

        }

    }


    return positions;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const positionSet =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                if (
                    positionSet.has(
                        index
                    )
                ) {

                    return character
                        .toUpperCase();

                }


                return character
                    .toLowerCase();

            }
        )
        .join(
            ""
        );

}


/* =====================================================
   CASE MORPH CONTROLLER
   ===================================================== */

function animatePrefixCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const token =
        ++viewButtonAnimationToken;


    const positions =
        getLetterPositions(
            baseText
        );


    const total =
        positions.length;


    const currentText =
        element.textContent;


    let currentUpper =
        0;


    /*
        Estimate current state from text.
    */

    positions.forEach(
        position => {

            const char =
                currentText[
                    position
                ];


            if (
                char &&
                char ===
                char.toUpperCase() &&
                char !==
                char.toLowerCase()
            ) {

                currentUpper++;

            }

        }
    );


    const target =
        toUpper
            ? total
            : 0;


    if (
        currentUpper ===
        target
    ) {

        element.textContent =
            renderPrefixCase(
                baseText,
                target
            );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                if (
                    token !==
                    viewButtonAnimationToken
                ) {

                    resolve();


                    return;

                }


                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        currentUpper +
                        (
                            target -
                            currentUpper
                        ) *
                        progress
                    );


                element.textContent =
                    renderPrefixCase(
                        baseText,
                        state
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        renderPrefixCase(
                            baseText,
                            target
                        );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   GENERIC CASE MORPH FOR PROJECT TEXT
   ===================================================== */

function animateElementCase(
    element,
    toUpper,
    duration =
        CASE_DURATION
) {

    const baseText =
        element.dataset.caseBase ||
        element.textContent.toLowerCase();


    element.dataset.caseBase =
        baseText;


    const positions =
        getLetterPositions(
            baseText
        );


    const total =
        positions.length;


    const startCount =
        toUpper
            ? 0
            : total;


    const targetCount =
        toUpper
            ? total
            : 0;


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const count =
                    Math.round(
                        startCount +
                        (
                            targetCount -
                            startCount
                        ) *
                        progress
                    );


                element.textContent =
                    renderPrefixCase(
                        baseText,
                        count
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        renderPrefixCase(
                            baseText,
                            targetCount
                        );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

/* =====================================================
   META X SYNC
   ===================================================== */

function syncMetadataHorizontal() {

    if (
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    const image =
        spread.querySelector(
            ".spread-image"
        );


    if (

    ) {

    }

        image.getBoundingClientRect();

        projectBlock.getBoundingClientRect();


    if (
        imageRect.width <= 0
    ) {

        return;

    }


    projectMeta.style.left =

            imageRect.left -
            blockRect.left
        }px`;


    projectMeta.style.width =
        `${imageRect.width}px`;

}


/* =====================================================
   PAINT THEN SYNC
   ===================================================== */

function syncMetadataAfterRender() {

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                syncMetadataHorizontal
            );

        }
    );

}


/* =====================================================
   UPDATE META

   Same chars in same position never animate.
   ===================================================== */

async function updateMetadata(
    targetProjectIndex,
    targetFrameIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    const jobs =
        [

            morphDigits(
                counterCurrent,
                getCurrentText(
                    targetFrameIndex
                )
            )

        ];


    if (
        projectChanged
    ) {

        jobs.push(

            morphDigits(
                counterTotal,
                getTotalText(
                    project.images.length
                )
            ),

            morphTextSlots(
                projectTitle,
                project.title.toLowerCase()
            ),

            morphTextSlots(
                projectDate,
                (
                    project.date ||
                    ""
                ).toLowerCase()
            )

        );

    }


    await Promise.all(
        jobs
    );


    renderedProjectIndex =
        targetProjectIndex;

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    if (
        projects.length ===
        0
    ) {

        return;

    }


    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            frameIndex +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex +
                1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW FRAME
   ===================================================== */

async function showFrame(
    targetProjectIndex,
    targetFrameIndex
) {

    if (
        navigationAnimating
    ) {

        return false;

    }


    navigationAnimating =
        true;


    const normalizedProject =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalizedProject
        ];


    const normalizedFrame =
        Math.max(
            0,
            Math.min(
                targetFrameIndex,
                project.images.length -
                1
            )
        );


    try {

        const loadedImage =
            await preloadImage(
                project.images[
                    normalizedFrame
                ]
            );


        projectIndex =
            normalizedProject;


        frameIndex =
            normalizedFrame;


        renderImage(
            loadedImage
        );


        syncMetadataAfterRender();


        await updateMetadata(
            normalizedProject,
            normalizedFrame
        );


        preloadAhead();


        navigationAnimating =
            false;


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        navigationAnimating =
            false;


        return false;

    }

}


/* =====================================================
   NEXT / PREVIOUS
   ===================================================== */

async function nextFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    if (
        frameIndex <
        project.images.length -
        1
    ) {

        return showFrame(
            projectIndex,
            frameIndex +
            1
        );

    }


    return showFrame(
        projectIndex +
        1,
        0
    );

}


async function previousFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    if (
        frameIndex >
        0
    ) {

        return showFrame(
            projectIndex,
            frameIndex -
            1
        );

    }


    const previousProjectIndex =
        normalizeProjectIndex(
            projectIndex -
            1
        );


    const previousProject =
        projects[
            previousProjectIndex
        ];


    return showFrame(
        previousProjectIndex,
        previousProject.images.length -
        1
    );

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextFrame();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    );

}

   Same as clicking right 75%.

        interfaceAnimating ||

    if (

/* =====================================================
   VIEW ALL BOUNDS

   X:
   Denizalp left -> film right.

   Y:
   safely below info
   and safely above metadata.
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const side =
        parseFloat(
            rootStyle.getPropertyValue(
                "--side"
            )
        ) || 24;


    const topGap =
        window.innerWidth <= 600
            ? 22
            : 28;


    const bottomGap =
        window.innerWidth <= 600
            ? 16
            : 22;


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL GRID LAYOUT
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const gap =
        window.innerWidth <= 600
            ? 6
            : 10;


    let best =
        {

            columns: 1,
            rows: count,
            score: 0

        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns -
                1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows -
                1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        const score =
            Math.min(
                cellWidth,
                cellHeight *
                1.15
            );


        if (
            score >
            best.score
        ) {

            best =
                {

                    columns,
                    rows,
                    score

                };

        }

    }


    return best;

}


function layoutProjectAllGrid() {

    if (
        !projectAllMode
    ) {

        return;

    }


    syncProjectAllBounds();


    const layout =
        calculateProjectAllLayout(
            currentProject()
                .images
                .length
        );


    projectAllGrid.style.gridTemplateColumns =
        `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style.gridTemplateRows =
        `repeat(${layout.rows}, minmax(0, 1fr))`;

}


/* =====================================================
   BUILD VIEW ALL

        ) => {

                );

                );

            img.loading =

            );


            button.addEventListener(

                    );

            );

/* =====================================================
   ENTER VIEW ALL
   ===================================================== */

async function enterProjectAll() {

    if (
        projectAllMode ||
        projectViewAnimating ||
        indexMode
    ) {

        return;

    }


    projectViewAnimating =
        true;


    autoplayBeforeProjectAll =
        !manualMode;


    clearTimeout(
        slideTimer
    );


    buildProjectAllGrid();


    projectAllMode =
        true;


    body.classList.add(
        "project-all-mode"
    );


    /*
        Title/date become uppercase progressively.

        view all -> CLOSE if still hovered,
        otherwise close.

        current counter -> all
        total stays unchanged.
    */

    await Promise.all(
        [

            animateElementCase(
                projectTitle,
                true
            ),

            animateElementCase(
                projectDate,
                true
            ),

            enterAllCounter(),

            updateViewButtonCase()

        ]
    );


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                layoutProjectAllGrid
            );

        }
    );


    projectViewAnimating =
        false;

}


/* =====================================================
   LEAVE VIEW ALL INTERNAL

   resume:
   whether autoplay state should resume.
   ===================================================== */

async function leaveProjectAll(
    {
        selectedIndex =
            null,

        resume =
            true
    } = {}
) {

    if (
        !projectAllMode ||
        projectViewAnimating
    ) {

        return;

    }


    projectViewAnimating =
        true;


    const project =
        currentProject();


    if (
        selectedIndex !==
        null
    ) {

        const loadedImage =
            await preloadImage(
                project.images[
                    selectedIndex
                ]
            );


        frameIndex =
            selectedIndex;


        renderImage(
            loadedImage
        );

    }


    /*
        Switch base state before button animation:
        close -> view all.
    */

    projectAllMode =
        false;


    body.classList.remove(
        "project-all-mode"
    );


    /*
        Restore current digit slots.
    */

    restoreCounterSlots();


    await Promise.all(
        [

            animateElementCase(
                projectTitle,
                false
            ),

            animateElementCase(
                projectDate,
                false
            ),

            updateViewButtonCase()

        ]
    );


    projectAllGrid.innerHTML =
        "";


    syncMetadataAfterRender();


    preloadAhead();


    if (
        resume
    ) {

        if (
            selectedIndex !==
            null
        ) {

            /*
                Thumbnail selection resumes autoplay.
            */

            manualMode =
                false;


            scheduleNextSlide();

        }

        else if (
            autoplayBeforeProjectAll
        ) {

            manualMode =
                false;


            scheduleNextSlide();

        }

        else {

            manualMode =
                true;


            clearTimeout(
                slideTimer
            );

        }

    }

    else {

        clearTimeout(
            slideTimer
        );

    }


    projectViewAnimating =
        false;

}

   EXIT PROJECT ALL

/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,
                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                if (
                    dateA >
                    dateB
                ) {

                    return -1;

                }


                if (
                    dateA <
                    dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   INDEX CARD CASE ANIMATION
   ===================================================== */

function createCardCaseController(
    element,
    text
) {

    let frameId =
        null;


    let state =
        0;


    const positions =
        getLetterPositions(
            text
        );


    const total =
        positions.length;


    function render() {

        element.textContent =
            renderPrefixCase(
                text,
                state
            );

    }


    function animateTo(
        target
    ) {

        if (
            frameId !==
            null
        ) {

            cancelAnimationFrame(
                frameId
            );

        }


        const startState =
            state;


        const distance =
            Math.abs(
                target -
                startState
            );


        if (
            distance ===
            0
        ) {

            render();


            return;

        }


        /*
            Same overall duration logic as
            Film/Photography.
        */

        const duration =
            CASE_DURATION *
            (
                distance /
                Math.max(
                    1,
                    total
                )
            );


        const start =
            performance.now();


        function frame(
            now
        ) {

            const progress =
                Math.min(
                    1,
                    (
                        now -
                        start
                    ) /
                    duration
                );


            state =
                Math.round(
                    startState +
                    (
                        target -
                        startState
                    ) *
                    progress
                );


            render();


            if (
                progress < 1
            ) {

                frameId =
                    requestAnimationFrame(
                        frame
                    );

            }

            else {

                state =
                    target;


                render();


                frameId =
                    null;

            }

        }


        frameId =
            requestAnimationFrame(
                frame
            );

    }


    render();


    return {

        upper() {

            animateTo(
                total
            );

        },

        lower() {

            animateTo(
                0
            );

        }

    };

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    getChronologicalProjects()
        .forEach(
            item => {

                const project =
                    item.project;


                const originalIndex =
                    item.originalIndex;


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "project-card";


                button.type =
                    "button";


                const imageWrap =
                    document.createElement(
                        "span"
                    );


                imageWrap.className =
                    "card-image-wrap";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    getPhotoUrl(
                        project.cover
                    );


                img.alt =
                    "";


                img.loading =
                    "eager";


                imageWrap.appendChild(
                    img
                );


                const copy =
                    document.createElement(
                        "span"
                    );


                copy.className =
                    "card-copy";


                const title =
                    document.createElement(
                        "span"
                    );


                title.className =
                    "card-title";


                const titleBase =
                    project.title
                        .toLowerCase();


                title.textContent =
                    titleBase;


                const date =
                    document.createElement(
                        "span"
                    );


                date.className =
                    "card-date";


                date.textContent =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();


                copy.append(
                    title,
                    date
                );


                button.append(
                    imageWrap,
                    copy
                );


                /*
                    Desktop hover over thumbnail OR title
                    naturally means hover over card.
                */

                const titleCase =
                    createCardCaseController(
                        title,
                        titleBase
                    );


                button.addEventListener(
                    "mouseenter",
                    () => {

                        if (
                            window.matchMedia(
                                "(hover: hover)"
                            ).matches
                        ) {

                            titleCase.upper();

                        }

                    }
                );


                button.addEventListener(
                    "mouseleave",
                    () => {

                        if (
                            window.matchMedia(
                                "(hover: hover)"
                            ).matches
                        ) {

                            titleCase.lower();

                        }

                    }
                );


                button.addEventListener(
                    "click",
                    event => {

                        if (
                            indexDragMoved
                        ) {

                            event.preventDefault();


                            event.stopPropagation();


                            return;

                        }


                        event.stopPropagation();


                        exitIndexToProject(
                            originalIndex
                        );

                    }
                );


                indexGrid.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   GENERIC CASE WORD
   ===================================================== */

function renderWordCase(
    word,
    upperCount
) {

    let result =
        "";


    for (
        let i = 0;
        i <
        word.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? word[
                    i
                ].toUpperCase()
                : word[
                    i
                ];

    }


    return result;

}


/* =====================================================
   INDEX WORD
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(
    upperCount
) {

    indexWordState =
        upperCount;


    indexButton.textContent =
        renderWordCase(
            indexWord,
            upperCount
        );

}


function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return Promise.resolve();

    }


    const duration =
        INDEX_TRANSITION_DURATION *
        (
            distance /
            indexWord.length
        );


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress < 1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

function saveIndexPosition() {

}

/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    autoplayBeforeIndex =
        !manualMode;


    clearTimeout(
        slideTimer
    );


    updateIndexContentTop();


    indexMode =
        true;


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    restoreIndexPosition();


    await morphIndexTo(
        indexWord.length
    );


    indexScroller.focus(
        {
            preventScroll:
                true
        }
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX FROM VIEW ALL

   First restore slideshow metadata,
   but DO NOT resume autoplay,
   then enter INDEX.
   ===================================================== */

async function enterIndexFromProjectAll() {

    if (
        projectViewAnimating ||
        interfaceAnimating
    ) {

        return;

    }


    await leaveProjectAll(
        {
            resume: false
        }
    );


    await enterIndex();

}


/* =====================================================
   RETURN FROM INDEX
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    updateMobileStage();


    syncMetadataAfterRender();


    if (
        autoplayBeforeIndex
    ) {

        manualMode =
            false;


        scheduleNextSlide();

    }

    else {

        manualMode =
            true;


        clearTimeout(
            slideTimer
        );

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    await showFrame(
        targetProjectIndex,
        0
    );


    updateMobileStage();


    syncMetadataAfterRender();


    manualMode =
        false;


    scheduleNextSlide();


    interfaceAnimating =
        false;

}

        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=
            movement *

    },
    {

    }
);

/* =====================================================
   INDEX MOUSE DRAG
   ===================================================== */

indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );


        event.preventDefault();

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        if (
            Math.abs(
                delta
            ) >
            4
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


function endIndexDrag() {

    if (
        !indexDragging
    ) {

        return;

    }


    indexDragging =
        false;


    indexScroller.classList.remove(
        "dragging"
    );


    saveIndexPosition();


    if (
        indexDragMoved
    ) {

        setTimeout(
            () => {

                indexDragMoved =
                    false;

            },
            0
        );

    }

}


window.addEventListener(
    "mouseup",
    endIndexDrag
);


window.addEventListener(
    "blur",
    endIndexDrag
);


/* =====================================================
   SLIDESHOW CLICK
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #index-button, #view-all-button"
            )
        ) {

            return;

        }


        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        if (
            position <
            0.25
        ) {

            await previousFrame();

        }

        else {

            await nextFrame();

        }

    }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await returnFromIndex();

            }


            return;

        }


        if (
            projectAllMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await exitProjectAll();

            }


            return;

        }


        if (
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        /*
            SPACE = same as ordinary primary click.
        */

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            await performPrimarySlideAction();


            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousFrame();

        }


        else if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextFrame();

        }

    }
);


/* =====================================================
   TOUCH
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating ||
            touchStartX ===
            null ||
            touchStartY ===
            null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) <
            45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX <
            0
        ) {

            await nextFrame();

        }

        else {

            await previousFrame();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   MOBILE STAGE
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";


        projectStage.style.height =
            "";


        projectStage.style.bottom =
            "";


        syncMetadataAfterRender();


        if (
            projectAllMode
        ) {

            layoutProjectAllGrid();

        }


        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    /*
        Give the image as much vertical room as possible,
        while reserving a guaranteed metadata zone.
    */

    const gapAfterInfo =
        24;


    const bottomGap =
        54;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            8
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            220,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";


    syncMetadataAfterRender();


    if (
        projectAllMode
    ) {

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    layoutProjectAllGrid
                );

            }
        );

    }

}

const lowercase =

let logoTarget =

function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i <
        letters.length;
        i++
    ) {

        letters[
            i
        ].textContent =
            i <
            state
                ? uppercase[
                    i
                ]
                : lowercase[
                    i
                ];

    }

function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}

        else {

        );

}

        syncMetadataAfterRender();


        if (
            projectAllMode
        ) {

            requestAnimationFrame(
                () => {

                    requestAnimationFrame(
                        layoutProjectAllGrid
                    );

                }
            );

        }

    }
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            () => {

                updateIndexContentTop();


                updateMobileStage();


                syncMetadataAfterRender();


                if (
                    projectAllMode
                ) {

                    layoutProjectAllGrid();

                }

            },
            250
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            () => {

                updateIndexContentTop();


                updateMobileStage();

            }
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileStage
        );

}


/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        const firstImage =
            await preloadImage(
                projects[
                    0
                ].images[
                    0
                ]
            );


        projectIndex =
            0;


        frameIndex =
            0;


        renderedProjectIndex =
            0;


        renderImage(
            firstImage
        );


        const initialTitle =
            projects[
                0
            ].title.toLowerCase();


        const initialDate =
            (
                projects[
                    0
                ].date ||
                ""
            ).toLowerCase();


        projectTitle.textContent =
            initialTitle;


        projectTitle.dataset.rawText =
            initialTitle;


        projectTitle.dataset.caseBase =
            initialTitle;


        projectDate.textContent =
            initialDate;


        projectDate.dataset.rawText =
            initialDate;


        projectDate.dataset.caseBase =
            initialDate;


        initialiseDigitSlots(
            counterCurrent,
            getCurrentText(
                0
            )
        );


        initialiseDigitSlots(
            counterTotal,
            getTotalText(
                projects[
                    0
                ].images.length
            )
        );


        viewAllButton.textContent =
            "view all";


        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        preloadAhead();


        updateIndexContentTop();


        updateMobileStage();


        syncMetadataAfterRender();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexWord(
    0
);


loadProjects();

</script>
