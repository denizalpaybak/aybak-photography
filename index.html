<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Denizalp Aybak — Photography</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;
    color: #000;

    font-family: Arial, Helvetica, sans-serif;

    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    cursor: pointer;
}


/* =====================================================
   INFORMATION
   ===================================================== */

.info {
    position: fixed;

    top: 32px;
    left: 48px;

    z-index: 100;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;
}

.logo {
    position: relative;
    display: block;

    width: 190px;
    height: 52px;

    margin: 0;
    padding: 0;

    color: inherit;
    text-decoration: none;

    cursor: pointer;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}

.contact {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;

    margin: 0;
    padding: 0;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   SECTION SWITCH
   ===================================================== */

.section-switch {
    position: fixed;

    top: 32px;
    right: 48px;

    z-index: 100;

    color: #000;
    text-decoration: none;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    white-space: nowrap;
}


/* =====================================================
   PROJECT VIEW
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

#project-block {
    display: flex;
    flex-direction: column;
    align-items: center;

    width: auto;

    pointer-events: none;
}

#current-photo {
    display: block;

    width: auto;
    height: auto;

    max-width: 70vw;
    max-height: 72vh;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   METADATA
   ===================================================== */

#project-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;

    width: auto;

    margin-top: 9px;

    font-size: 15px;
    line-height: 1.15;

    white-space: nowrap;

    text-transform: lowercase;

    pointer-events: none;
}

#project-counter {
    text-align: right;
}


/* =====================================================
   TOOLBAR
   ===================================================== */

#controls {
    display: grid;

    grid-template-columns:
        1.45fr
        0.75fr
        auto
        0.75fr
        1.45fr;

    align-items: center;

    width: auto;

    margin-top: 4px;

    font-size: 15px;
    line-height: 1.15;

    white-space: nowrap;

    pointer-events: auto;
}

.control-slot {
    min-width: 0;
}

.slot-prev-work {
    text-align: left;
}

.slot-prev {
    text-align: center;
}

.slot-index {
    text-align: center;

    padding-left: 28px;
    padding-right: 28px;
}

.slot-next {
    text-align: center;
}

.slot-next-work {
    text-align: right;
}

.control-button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: none;

    background: transparent;

    color: #000;

    font: inherit;

    cursor: pointer;

    text-decoration: none;

    -webkit-tap-highlight-color: transparent;
}

.control-button:hover,
.control-button:focus,
.control-button:focus-visible,
.control-button:active {
    text-decoration: none;
    outline: none;
}

#index-button.index-active {
    pointer-events: none;
    cursor: default;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    padding:
        118px
        48px
        58px;

    background: #fff;

    overflow: hidden;

    cursor: default;
}

#index-view.visible {
    display: block;
}


/*
    Default desktop / large landscape:
    14 works = 7 columns x 2 rows.
*/

#index-grid {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    grid-template-rows:
        repeat(2, minmax(0, 1fr));

    gap:
        18px
        22px;

    width: 100%;
    height: 100%;

    align-items: stretch;
}

.project-card {
    appearance: none;
    -webkit-appearance: none;

    display: flex;
    flex-direction: column;

    min-width: 0;
    min-height: 0;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    font: inherit;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.card-image-wrap {
    display: flex;
    align-items: center;
    justify-content: center;

    flex: 1 1 auto;

    width: 100%;
    min-height: 0;

    overflow: hidden;
}

.project-card img {
    display: block;

    width: 100%;
    height: 100%;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}

.card-copy {
    flex: 0 0 auto;

    margin-top: 5px;

    text-transform: lowercase;
}

.card-title,
.card-date {
    display: block;

    font-size: 12px;
    line-height: 1.15;
}

.card-date:empty {
    display: none;
}


/* =====================================================
   INDEX STATE LABEL
   ===================================================== */

#index-mode-label {
    position: fixed;

    left: 50%;
    bottom: 24px;

    z-index: 110;

    display: none;

    transform: translateX(-50%);

    font-size: 15px;
    line-height: 1.15;

    white-space: nowrap;

    cursor: default;

    pointer-events: none;
}

#index-mode-label.visible {
    display: block;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode {
    cursor: default;
}

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET / MEDIUM PORTRAIT
   ===================================================== */

@media
    (max-width: 1000px)
    and (orientation: portrait) {

    #index-view {
        padding:
            110px
            32px
            54px;
    }

    #index-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));

        grid-template-rows:
            repeat(4, minmax(0, 1fr));

        gap:
            14px
            18px;
    }

    .card-title,
    .card-date {
        font-size: 11px;
    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-aybak {
        top: 15px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }


    #project-stage {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }

    #current-photo {
        max-width: 84vw;
        max-height: calc(100% - 68px);
    }

    #project-meta,
    #controls {
        font-size: 13px;
    }

    #project-meta {
        margin-top: 8px;
    }

    #controls {
        margin-top: 4px;

        grid-template-columns:
            1.4fr
            0.7fr
            auto
            0.7fr
            1.4fr;
    }

    .slot-index {
        padding-left: 18px;
        padding-right: 18px;
    }


    #index-view {
        padding:
            100px
            14px
            46px;
    }

    #index-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        grid-template-rows:
            repeat(5, minmax(0, 1fr));

        gap:
            8px
            10px;
    }

    .card-copy {
        margin-top: 3px;
    }

    .card-title,
    .card-date {
        font-size: 9px;
        line-height: 1.08;
    }

    #index-mode-label {
        bottom: 18px;

        font-size: 13px;
    }

}


/* =====================================================
   SHORT LANDSCAPE
   ===================================================== */

@media
    (orientation: landscape)
    and (max-height: 700px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-aybak {
        top: 15px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }


    #project-stage {
        inset: 0;

        left: 190px;

        width: calc(100vw - 214px);
        height: 100vh;
    }

    #current-photo {
        max-width: 62vw;
        max-height: 56vh;
    }

    #project-meta,
    #controls {
        font-size: 13px;
    }

    .slot-index {
        padding-left: 20px;
        padding-right: 20px;
    }


    /*
        Short landscape gets 5 columns x 3 rows.
        Everything fits vertically.
    */

    #index-view {
        padding:
            88px
            24px
            44px
            205px;
    }

    #index-grid {
        grid-template-columns:
            repeat(5, minmax(0, 1fr));

        grid-template-rows:
            repeat(3, minmax(0, 1fr));

        gap:
            9px
            14px;
    }

    .card-copy {
        margin-top: 3px;
    }

    .card-title,
    .card-date {
        font-size: 9px;
        line-height: 1.08;
    }

    #index-mode-label {
        bottom: 16px;

        font-size: 13px;
    }

}

</style>

<script>


/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";

const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;

const TOOLBAR_ANIMATION_DURATION =
    400;

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS
   ===================================================== */

const html =
    document.documentElement;

const body =
    document.body;

const info =
    document.getElementById(
        "info"
    );

const projectStage =
    document.getElementById(
        "project-stage"
    );

const currentPhoto =
    document.getElementById(
        "current-photo"
    );

const projectMeta =
    document.getElementById(
        "project-meta"
    );

const projectLabel =
    document.getElementById(
        "project-label"
    );

const projectCounter =
    document.getElementById(
        "project-counter"
    );

const controls =
    document.getElementById(
        "controls"
    );

const previousWorkButton =
    document.getElementById(
        "previous-work-button"
    );

const previousButton =
    document.getElementById(
        "previous-button"
    );

const indexButton =
    document.getElementById(
        "index-button"
    );

const nextButton =
    document.getElementById(
        "next-button"
    );

const nextWorkButton =
    document.getElementById(
        "next-work-button"
    );

const indexView =
    document.getElementById(
        "index-view"
    );

const indexGrid =
    document.getElementById(
        "index-grid"
    );

const indexModeLabel =
    document.getElementById(
        "index-mode-label"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];

let projectIndex =
    0;

let imageIndex =
    0;

let manualMode =
    false;

let indexMode =
    false;

let slideTimer =
    null;

let interfaceAnimating =
    false;


/* =====================================================
   IMAGE CACHE
   ===================================================== */

const imageCache =
    new Map();


function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   PROJECT HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   PRELOAD
   ===================================================== */

function preloadAroundCurrent() {

    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            imageIndex +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    if (
        imageIndex >
        0
    ) {

        preloadImage(
            project.images[
                imageIndex -
                1
            ]
        ).catch(
            () => {}
        );

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex +
                1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


function preloadCovers() {

    projects.forEach(
        project => {

            preloadImage(
                project.cover
            ).catch(
                () => {}
            );

        }
    );

}


/* =====================================================
   WIDTH SYNC
   ===================================================== */

function syncProjectWidths() {

    if (
        indexMode
    ) {

        return;

    }


    const width =
        currentPhoto
            .getBoundingClientRect()
            .width;


    if (
        width >
        0
    ) {

        projectMeta.style.width =
            `${width}px`;


        controls.style.width =
            `${width}px`;

    }

}


/* =====================================================
   METADATA
   ===================================================== */

function updateMetadata() {

    const project =
        currentProject();


    projectLabel.textContent =
        project.date
            ? `${project.title} — ${project.date}`
            : project.title;


    const currentNumber =
        String(
            imageIndex +
            1
        ).padStart(
            2,
            "0"
        );


    const totalNumber =
        String(
            project.images.length
        ).padStart(
            2,
            "0"
        );


    projectCounter.textContent =
        `${currentNumber}/${totalNumber}`;

}


/* =====================================================
   TEXT ANIMATION
   ===================================================== */

const textAnimations =
    new WeakMap();


function cancelTextAnimation(
    element
) {

    if (
        textAnimations.has(
            element
        )
    ) {

        cancelAnimationFrame(
            textAnimations.get(
                element
            )
        );


        textAnimations.delete(
            element
        );

    }

}


function animateTextLength(
    element,
    fullText,
    show,
    duration =
        TOOLBAR_ANIMATION_DURATION
) {

    cancelTextAnimation(
        element
    );


    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const length =
                    show
                        ? Math.round(
                            progress *
                            fullText.length
                        )
                        : Math.round(
                            (
                                1 -
                                progress
                            ) *
                            fullText.length
                        );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress <
                    1
                ) {

                    const id =
                        requestAnimationFrame(
                            frame
                        );


                    textAnimations.set(
                        element,
                        id
                    );

                }

                else {

                    element.textContent =
                        show
                            ? fullText
                            : "";


                    textAnimations.delete(
                        element
                    );


                    resolve();

                }

            }


            const id =
                requestAnimationFrame(
                    frame
                );


            textAnimations.set(
                element,
                id
            );

        }
    );

}


/* =====================================================
   INDEX CASE ANIMATION
   ===================================================== */

function renderIndexCase(
    upperCount
) {

    const word =
        "index";


    let result =
        "";


    for (
        let i = 0;
        i <
        word.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? word[
                    i
                ].toUpperCase()
                : word[
                    i
                ];

    }


    indexButton.textContent =
        result;

}


function animateIndexCase(
    toUpper
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        TOOLBAR_ANIMATION_DURATION
                    );


                const upperCount =
                    toUpper
                        ? Math.round(
                            progress *
                            5
                        )
                        : Math.round(
                            (
                                1 -
                                progress
                            ) *
                            5
                        );


                renderIndexCase(
                    upperCount
                );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderIndexCase(
                        toUpper
                            ? 5
                            : 0
                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   FRAME CONTROL STATES
   ===================================================== */

let previousVisible =
    false;

let nextVisible =
    true;


function updateFrameControls(
    animate =
        true
) {

    const project =
        currentProject();


    const shouldShowPrevious =
        imageIndex >
        0;


    const shouldShowNext =
        imageIndex <
        project.images.length -
        1;


    if (
        shouldShowPrevious !==
        previousVisible
    ) {

        previousVisible =
            shouldShowPrevious;


        if (
            animate
        ) {

            animateTextLength(
                previousButton,
                "previous",
                shouldShowPrevious
            );

        }

        else {

            previousButton.textContent =
                shouldShowPrevious
                    ? "previous"
                    : "";

        }


        previousButton.disabled =
            !shouldShowPrevious;

    }


    if (
        shouldShowNext !==
        nextVisible
    ) {

        nextVisible =
            shouldShowNext;


        if (
            animate
        ) {

            animateTextLength(
                nextButton,
                "next",
                shouldShowNext
            );

        }

        else {

            nextButton.textContent =
                shouldShowNext
                    ? "next"
                    : "";

        }


        nextButton.disabled =
            !shouldShowNext;

    }

}


/* =====================================================
   SHOW IMAGE
   ===================================================== */

async function showImage(
    newProjectIndex,
    newImageIndex,
    animateControls =
        true
) {

    const targetProjectIndex =
        normalizeProjectIndex(
            newProjectIndex
        );


    const project =
        projects[
            targetProjectIndex
        ];


    const targetImageIndex =
        Math.max(
            0,
            Math.min(
                newImageIndex,
                project.images.length -
                1
            )
        );


    const filename =
        project.images[
            targetImageIndex
        ];


    try {

        const img =
            await preloadImage(
                filename
            );


        projectIndex =
            targetProjectIndex;


        imageIndex =
            targetImageIndex;


        currentPhoto.src =
            img.src;


        updateMetadata();


        updateFrameControls(
            animateControls
        );


        preloadAroundCurrent();


        requestAnimationFrame(
            syncProjectWidths
        );


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        return false;

    }

}


/* =====================================================
   WORK NAVIGATION
   ===================================================== */

async function goPreviousWork() {

    stopAutoSlideshow();


    await showImage(
        projectIndex -
        1,
        0
    );

}


async function goNextWork() {

    stopAutoSlideshow();


    await showImage(
        projectIndex +
        1,
        0
    );

}


/* =====================================================
   FRAME NAVIGATION
   ===================================================== */

async function goPreviousFrame() {

    if (
        imageIndex <=
        0
    ) {

        return;

    }


    stopAutoSlideshow();


    await showImage(
        projectIndex,
        imageIndex -
        1
    );

}


async function goNextFrame() {

    const project =
        currentProject();


    if (
        imageIndex >=
        project.images.length -
        1
    ) {

        return;

    }


    stopAutoSlideshow();


    await showImage(
        projectIndex,
        imageIndex +
        1
    );

}


/* =====================================================
   GENERAL FORWARD NAVIGATION

   Used by:
   - autoplay
   - body click after autoplay is stopped

   It crosses the project boundary.
   ===================================================== */

async function advanceForward() {

    const project =
        currentProject();


    if (
        imageIndex <
        project.images.length -
        1
    ) {

        await showImage(
            projectIndex,
            imageIndex +
            1
        );

    }

    else {

        await showImage(
            projectIndex +
            1,
            0
        );

    }

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await advanceForward();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                /*
                    Undated works always last.
                */

                if (
                    !dateA &&
                    !dateB
                ) {

                    return (
                        a.originalIndex -
                        b.originalIndex
                    );

                }


                if (
                    !dateA
                ) {

                    return 1;

                }


                if (
                    !dateB
                ) {

                    return -1;

                }


                /*
                    YYYY-MM strings sort
                    chronologically.
                    Newest first.
                */

                if (
                    dateA >
                    dateB
                ) {

                    return -1;

                }


                if (
                    dateA <
                    dateB
                ) {

                    return 1;

                }


                /*
                    Preserve slideshow order
                    for identical dates.
                */

                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    const chronological =
        getChronologicalProjects();


    chronological.forEach(
        item => {

            const project =
                item.project;


            const originalIndex =
                item.originalIndex;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "project-card";


            button.type =
                "button";


            const imageWrap =
                document.createElement(
                    "span"
                );


            imageWrap.className =
                "card-image-wrap";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                getPhotoUrl(
                    project.cover
                );


            img.alt =
                "";


            img.loading =
                "eager";


            imageWrap.appendChild(
                img
            );


            const copy =
                document.createElement(
                    "span"
                );


            copy.className =
                "card-copy";


            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "card-title";


            title.textContent =
                project.title;


            const date =
                document.createElement(
                    "span"
                );


            date.className =
                "card-date";


            date.textContent =
                project.date ||
                "";


            copy.append(
                title,
                date
            );


            button.append(
                imageWrap,
                copy
            );


            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    exitIndexToProject(
                        originalIndex
                    );

                }
            );


            indexGrid.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    stopAutoSlideshow();


    indexButton.classList.add(
        "index-active"
    );


    const animations =
        [

            animateTextLength(
                previousWorkButton,
                "previous work",
                false
            ),

            animateTextLength(
                previousButton,
                "previous",
                false
            ),

            animateIndexCase(
                true
            ),

            animateTextLength(
                nextButton,
                "next",
                false
            ),

            animateTextLength(
                nextWorkButton,
                "next work",
                false
            )

        ];


    setTimeout(
        () => {

            indexMode =
                true;


            body.classList.add(
                "index-mode"
            );


            indexView.classList.add(
                "visible"
            );

        },
        TOOLBAR_ANIMATION_DURATION /
        2
    );


    await Promise.all(
        animations
    );


    /*
        The project toolbar is now hidden
        with the project stage, so a separate
        fixed INDEX state remains visible
        at the bottom.
    */

    indexModeLabel.classList.add(
        "visible"
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   EXIT INDEX
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    const targetProject =
        projects[
            targetProjectIndex
        ];


    const imagePromise =
        preloadImage(
            targetProject.images[
                0
            ]
        );


    /*
        INDEX state disappears first.
    */

    indexModeLabel.classList.remove(
        "visible"
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    const showPreviousAfter =
        false;


    const showNextAfter =
        targetProject.images.length >
        1;


    /*
        Reverse toolbar animation.
    */

    const animations =
        [

            animateTextLength(
                previousWorkButton,
                "previous work",
                true
            ),

            animateTextLength(
                previousButton,
                "previous",
                false
            ),

            animateIndexCase(
                false
            ),

            animateTextLength(
                nextButton,
                "next",
                showNextAfter
            ),

            animateTextLength(
                nextWorkButton,
                "next work",
                true
            )

        ];


    await imagePromise.catch(
        () => {}
    );


    await showImage(
        targetProjectIndex,
        0,
        false
    );


    previousVisible =
        false;


    nextVisible =
        showNextAfter;


    await Promise.all(
        animations
    );


    indexButton.classList.remove(
        "index-active"
    );


    interfaceAnimating =
        false;


    startAutoSlideshow();

}


/* =====================================================
   TOOLBAR EVENTS
   ===================================================== */

previousWorkButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        goPreviousWork();

    }
);


previousButton.addEventListener(

indexButton.addEventListener(

    }

nextButton.addEventListener(

nextWorkButton.addEventListener(

    }
);


/* =====================================================
   GENERAL SLIDESHOW CLICK

   First click:
   autoplay stops.

   Every later click:
   next frame / next work.

   No left/right zones.
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            indexMode ||
            interfaceAnimating
        ) {

            return;

        }


        /*
            Do not hijack actual interface links
            or toolbar controls.
        */

        if (
            event.target.closest(
                ".info, .section-switch, #controls"
            )
        ) {

            return;

        }


        /*
            First click only stops.
        */

        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        /*
            Every later click only moves
            forward, including across works.
        */

        await advanceForward();

    }
);


/* =====================================================
   MOBILE / INSTAGRAM POSITION
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const gapAfterInfo =
        24;


    const bottomGap =
        18;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window.visualViewport.offsetTop;


        viewportHeight =
            window.visualViewport.height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            120,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";

}


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );

const logoName =
    document.getElementById(
        "logo-name"
    );

const letters =
    [
        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )
    ];


const lowercase =
    [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


const uppercase =
    [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


let logoState =
    0;

let logoTarget =
    0;

let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state ===
        0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i <
        letters.length;
        i++
    ) {

        letters[i].textContent =
            i <
            state
                ? uppercase[
                    i
                ]
                : lowercase[
                    i
                ];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


function mobileLogoCycle() {

    setTimeout(
        () => {

            animateLogoTo(
                5
            );


            setTimeout(
                () => {

                    animateLogoTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   FILM SWITCH
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );

const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );

const switchWord =
    "film";

let switchState =
    0;

let switchFrame =
    null;


function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i <
        switchWord.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? switchWord[
                    i
                ].toUpperCase()
                : switchWord[
                    i
                ];

    }


    sectionSwitchText.textContent =
        result;

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
    "resize",
    () => {

        updateMobileStage();


        requestAnimationFrame(
            syncProjectWidths
        );

    }
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            () => {

                updateMobileStage();


                syncProjectWidths();

            },
            200
        );

    }
);


if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "resize",
        updateMobileStage
    );


    window.visualViewport.addEventListener(
        "scroll",
        updateMobileStage
    );

}


currentPhoto.addEventListener(
    "load",
    () => {

        requestAnimationFrame(
            () => {

                syncProjectWidths();


                updateMobileStage();

            }
        );

    }
);


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        await showImage(
            0,
            0,
            false
        );


        previousVisible =
            false;


        nextVisible =
            currentProject()
                .images
                .length >
            1;


        previousButton.textContent =
            "";


        previousButton.disabled =
            true;


        nextButton.textContent =
            nextVisible
                ? "next"
                : "";


        nextButton.disabled =
            !nextVisible;


        preloadCovers();


        updateMobileStage();


        syncProjectWidths();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexCase(
    0
);


loadProjects();

</script>
