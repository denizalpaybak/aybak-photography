<!DOCTYPE html>
<html lang="en">
<head>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFORMATION
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 100;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    margin: 0;
    padding: 0;

    color: inherit;
    text-decoration: none;

    cursor: pointer;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT / SOCIAL
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   SECTION SWITCH
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 100;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);

    white-space: nowrap;
}


/* =====================================================
   PROJECT STAGE
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   PROJECT BLOCK
   ===================================================== */

#project-block {
    display: flex;
    flex-direction: column;
    align-items: center;

    width: auto;
    height: auto;

    pointer-events: none;
}


/* =====================================================
   SPREAD
   ===================================================== */

#spread {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    width: auto;
    height: auto;

    max-width: 70vw;

    pointer-events: none;
}


/* =====================================================
   SPREAD IMAGE
   ===================================================== */

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: 70vw;
    max-height: 70vh;

    object-fit: contain;

    pointer-events: none;
}


/*
    Two portrait images form one spread.
*/

#spread.pair .spread-image {
    max-width:
        calc(
            (
                70vw -
                8px
            )
            /
            2
        );

    max-height: 68vh;
}


/*
    Landscape / single image.
*/

#spread.single .spread-image {
    max-width: 70vw;
    max-height: 70vh;
}


/* =====================================================
   METADATA
   ===================================================== */

#project-meta {
    display: flex;

    justify-content: space-between;
    align-items: baseline;

    width: auto;

    margin-top: 9px;

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    white-space: nowrap;

    pointer-events: none;
}


/* =====================================================
   SIMPLE WORK NAVIGATION
   ===================================================== */

#work-controls {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    width: auto;

    margin-top: 4px;

    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    pointer-events: auto;
}

.work-control-left {
    text-align: left;
}

.work-control-center {
    text-align: center;
}

.work-control-right {
    text-align: right;
}


/* =====================================================
   BUTTON
   ===================================================== */

.control-button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font: inherit;

    text-decoration: none;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.control-button:hover,
.control-button:focus,
.control-button:focus-visible,
.control-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   GLOBAL INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 150;

    transform:
        translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-family: inherit;
    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

#index-button:hover,
#index-button:focus,
#index-button:active {
    outline: 0;
    text-decoration: none;
}

#index-button.index-active {
    pointer-events: none;
    cursor: default;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    padding:
        108px
        64px
        62px;

    background: #fff;

    overflow: hidden;

    cursor: default;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   INDEX GRID
   ===================================================== */

#index-grid {
    display: grid;

    grid-template-columns:
        repeat(
            5,
            minmax(
                0,
                1fr
            )
        );

    grid-template-rows:
        repeat(
            3,
            minmax(
                0,
                1fr
            )
        );

    gap:
        22px
        36px;

    width: 100%;
    height: 100%;

    align-items: center;
    justify-items: center;
}


/* =====================================================
   PROJECT CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    display: flex;
    flex-direction: column;

    width:
        min(
            100%,
            215px
        );

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    font: inherit;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   THUMBNAIL
   ===================================================== */

.card-image-wrap {
    display: block;

    width: 100%;

    aspect-ratio: 3 / 4;

    overflow: hidden;

    background: #fff;
}

.project-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;
}


/* =====================================================
   CARD METADATA
   ===================================================== */

.card-copy {
    display: flex;

    justify-content: space-between;
    align-items: baseline;

    width: 100%;

    margin-top: 6px;

    gap: 10px;

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    white-space: nowrap;
}

.card-title {
    display: block;

    text-align: left;

    /*
        No ellipsis.
    */

    overflow: visible;
}

.card-date {
    display: block;

    flex: 0 0 auto;

    text-align: right;
}

.card-date:empty {
    display: none;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode {
    cursor: default;
}

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET PORTRAIT
   ===================================================== */

@media
    (max-width: 1100px)
    and (orientation: portrait) {

    #index-view {
        padding:
            104px
            32px
            60px;
    }

    #index-grid {
        grid-template-columns:
            repeat(
                4,
                minmax(
                    0,
                    1fr
                )
            );

        grid-template-rows:
            repeat(
                4,
                minmax(
                    0,
                    1fr
                )
            );

        gap:
            16px
            20px;
    }

    .project-card {
        width:
            min(
                100%,
                190px
            );
    }

}


/* =====================================================
   MOBILE PORTRAIT
   ===================================================== */

@media
    (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 18px;

    }


    /* -------------------------
       LOGO
       ------------------------- */

        width: 160px;
        height: 45px;
    }

    .logo-aybak {
        top: 15px;
    }


    /* -------------------------
       PROJECT
       ------------------------- */

    #project-stage {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }


    /*
        Mobile portrait:
        always single-image layout.
    */

    #spread {
        gap: 0;

        max-width: 84vw;
    }

    #spread.pair {
        display: block;
    }

    #spread.pair
    .spread-image:nth-child(2) {
        display: none;
    }

    #spread.pair .spread-image,
    #spread.single .spread-image {
        max-width: 84vw;
        max-height:
            calc(
                100% -
                72px
            );
    }


    #project-meta {
        margin-top: 8px;
    }

    #work-controls {
        margin-top: 4px;
    }


    /* -------------------------
       INDEX
       ------------------------- */

    #index-view {
        overflow-y: auto;

        padding:
            100px
            16px
            62px;

        -webkit-overflow-scrolling:
            touch;
    }


    /*
        Mobile prioritises useful image size
        instead of forcing all 14 works into
        one tiny screen.
    */

    #index-grid {
        display: grid;

        grid-template-columns:
            repeat(
                3,
                minmax(
                    0,
                    1fr
                )
            );

        grid-template-rows:
            none;

        grid-auto-rows: auto;

        gap:
            24px
            12px;

        height: auto;

        align-items: start;
    }

    .project-card {
        width: 100%;
    }

    .card-copy {
        gap: 4px;
        margin-top: 4px;

        font-size:
            var(--font-size);
    }

}

   LANDSCAPE / SHORT VIEWPORT

@media

            repeat(

/* =====================================================

@media

<script>


/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";


const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;


const TOOLBAR_ANIMATION_DURATION =
    400;


const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS
   ===================================================== */

const body =
    document.body;


const info =
    document.getElementById(
        "info"
    );


const projectStage =
    document.getElementById(
        "project-stage"
    );


const projectBlock =
    document.getElementById(
        "project-block"
    );


const spread =
    document.getElementById(
        "spread"
    );


const projectMeta =
    document.getElementById(
        "project-meta"
    );


const projectLabel =
    document.getElementById(
        "project-label"
    );


const workControls =
    document.getElementById(
        "work-controls"
    );


const projectCounter =
    document.getElementById(
        "project-counter"
    );


const previousWorkButton =
    document.getElementById(
        "previous-work-button"
    );


const nextWorkButton =
    document.getElementById(
        "next-work-button"
    );


const indexButton =
    document.getElementById(
        "index-button"
    );


const indexView =
    document.getElementById(
        "index-view"
    );


const indexGrid =
    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];


let projectIndex =
    0;


/*
    First image index of current spread.
*/

let spreadStart =
    0;


/*
    Last image index currently visible.
*/

let spreadEnd =
    0;


let manualMode =
    false;


let indexMode =
    false;


let slideTimer =
    null;


let interfaceAnimating =
    false;


/* =====================================================
   TOUCH STATE
   ===================================================== */

let touchStartX =
    null;


let touchStartY =
    null;


/* =====================================================
   IMAGE CACHE
   ===================================================== */

const imageCache =
    new Map();


/* =====================================================
   SPREAD CACHE
   ===================================================== */

/*
    Once a project's complete spread structure
    has been calculated, it is kept here.
*/

const spreadCache =
    new Map();


/* =====================================================
   URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   PRELOAD IMAGE
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            {
                                img,

                                portrait:
                                    img.naturalHeight >
                                    img.naturalWidth
                            }
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   PROJECT HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   SHOULD USE SPREAD
   ===================================================== */

function shouldUsePairLayout() {

    /*
        Mobile portrait always shows
        one frame at a time.
    */

    if (
        window.innerWidth <=
        600 &&
        window.innerHeight >
        window.innerWidth
    ) {

        return false;

    }


    return true;

}


/* =====================================================
   GET FORWARD SPREAD
   ===================================================== */

async function getForwardSpread(
    targetProjectIndex,
    startIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const first =
        await preloadImage(
            project.images[
                startIndex
            ]
        );


    /*
        Portrait pairing disabled:
        one frame only.
    */

    if (
        !shouldUsePairLayout()
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [
                    first
                ]

        };

    }


    /*
        Landscape is always single.
    */

    if (
        !first.portrait
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [
                    first
                ]

        };

    }


    /*
        No second image available.
    */

    if (
        startIndex >=
        project.images.length -
        1
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [
                    first
                ]

        };

    }


    const second =
        await preloadImage(
            project.images[
                startIndex +
                1
            ]
        );


    /*
        Two consecutive portrait images:
        show as editorial spread.
    */

    if (
        second.portrait
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex +
                1,

            images:
                [
                    first,
                    second
                ]

        };

    }


    /*
        Portrait followed by landscape:
        portrait stays single.
    */

    return {

        start:
            startIndex,

        end:
            startIndex,

        images:
            [
                first
            ]

    };

}


/* =====================================================
   BUILD PROJECT SPREAD MAP
   ===================================================== */

async function buildProjectSpreads(
    targetProjectIndex
) {

    /*
        Responsive mode matters.

        On mobile portrait pairing is disabled,
        therefore don't reuse a desktop map.
    */

    const mode =
        shouldUsePairLayout()
            ? "pair"
            : "single";


    const cacheKey =
        `${targetProjectIndex}:${mode}`;


    if (
        spreadCache.has(
            cacheKey
        )
    ) {

        return spreadCache.get(
            cacheKey
        );

    }


    const project =
        projects[
            targetProjectIndex
        ];


    const spreads =
        [];


    let index =
        0;


    while (
        index <
        project.images.length
    ) {

        const currentSpread =
            await getForwardSpread(
                targetProjectIndex,
                index
            );


        spreads.push(
            currentSpread
        );


        index =
            currentSpread.end +
            1;

    }


    spreadCache.set(
        cacheKey,
        spreads
    );


    return spreads;

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            spreadEnd +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex +
                1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================

   ===================================================== */

function renderSpread(
    spreadData
) {

    spread.innerHTML =
        "";


    spread.classList.remove(
        "single",

    );


    spread.classList.add(
        spreadData.images.length >

    );


    spreadData.images.forEach(

            const img =

                );


            img.className =
                "spread-image";


            img.src =
                data.img.src;


            img.alt =

            spread.appendChild(

            );

        }
    );

}


/* =====================================================

function updateMetadata() {

    projectLabel.textContent =

            : project.title;

/* =====================================================
   SHOW SPREAD
   ===================================================== */

async function showSpread(
    targetProjectIndex,
    targetStartIndex
) {

    const normalizedProjectIndex =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalizedProjectIndex
        ];


    if (
        !project
    ) {

        return false;

    }


    const safeStart =
        Math.max(
            0,
            Math.min(
                targetStartIndex,
                project.images.length -
                1
            )
        );


    try {

        const spreadData =
            await getForwardSpread(
                normalizedProjectIndex,
                safeStart
            );


        projectIndex =
            normalizedProjectIndex;


        spreadStart =
            spreadData.start;


        spreadEnd =
            spreadData.end;


        renderSpread(
            spreadData
        );


        updateMetadata();


        preloadAhead();


        requestAnimationFrame(
            syncProjectWidths
        );


        /*
            Build full current-project map
            quietly in background so previous
            navigation becomes immediate.
        */

        buildProjectSpreads(
            projectIndex
        ).catch(
            () => {}
        );


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        return false;

    }

}


/* =====================================================
   NEXT SPREAD
   ===================================================== */

async function nextSpread() {

    const project =
        currentProject();


    /*
        More images inside current work.
    */

    if (
        spreadEnd <
        project.images.length -
        1
    ) {

        return showSpread(
            projectIndex,
            spreadEnd +
            1
        );

    }


    /*
        End of work:
        next work.
    */

    return showSpread(
        projectIndex +
        1,
        0
    );

}


/* =====================================================
   PREVIOUS SPREAD
   ===================================================== */

async function previousSpread() {

    /*
        At beginning:
        move to LAST spread
        of previous work.
    */

    if (
        spreadStart <=
        0
    ) {

        const previousProjectIndex =
            normalizeProjectIndex(
                projectIndex -
                1
            );


        const previousSpreads =
            await buildProjectSpreads(
                previousProjectIndex
            );


        if (
            previousSpreads.length ===
            0
        ) {

            return false;

        }


        const lastSpread =
            previousSpreads[
                previousSpreads.length -
                1
            ];


        return showSpread(
            previousProjectIndex,
            lastSpread.start
        );

    }


    /*
        Find the previous spread in
        current project.
    */

    const spreads =
        await buildProjectSpreads(
            projectIndex
        );


    let previousStart =
        0;


    for (
        let i = 0;
        i <
        spreads.length;
        i++
    ) {

        if (
            spreads[
                i
            ].start ===
            spreadStart
        ) {

            if (
                i >
                0
            ) {

                previousStart =
                    spreads[
                        i -
                        1
                    ].start;

            }


            break;

        }

    }


    return showSpread(
        projectIndex,
        previousStart
    );

}


/* =====================================================
   NEXT / PREVIOUS WORK BUTTONS
   ===================================================== */

async function goNextWork() {

    stopAutoSlideshow();

/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextSpread();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =

    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;

}


/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                if (
                    !dateA &&
                    !dateB
                ) {

                    return (
                        a.originalIndex -
                        b.originalIndex
                    );

                }


                if (
                    !dateA
                ) {

                    return 1;

                }


                if (
                    !dateB
                ) {

                    return -1;

                }


                if (
                    dateA >
                    dateB
                ) {

                    return -1;

                }


                if (
                    dateA <
                    dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    const chronological =
        getChronologicalProjects();


    chronological.forEach(
        item => {

            const project =
                item.project;


            const originalIndex =
                item.originalIndex;

                document.createElement(

                );


            img.src =
                getPhotoUrl(
                    project.cover
                );


            img.alt =
                "";


            img.loading =
                "eager";


            imageWrap.appendChild(
                img
            );


            const copy =
                document.createElement(
                    "span"
                );


            copy.className =
                "card-copy";


            const title =
                document.createElement(

                );


            title.className =

            const date =

            );


            indexGrid.appendChild(

        }
    );

}


/* =====================================================
   TEXT ANIMATION
   ===================================================== */

const textAnimations =
    new WeakMap();


function animateTextLength(
    element,
    fullText,
    show,
    duration =
        TOOLBAR_ANIMATION_DURATION
) {

    if (
        textAnimations.has(
            element
        )
    ) {

        cancelAnimationFrame(
            textAnimations.get(
                element
            )
        );

    }


    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const length =
                    show
                        ? Math.round(
                            progress *
                            fullText.length
                        )
                        : Math.round(
                            (
                                1 -
                                progress
                            ) *
                            fullText.length
                        );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress <
                    1
                ) {

                    const id =
                        requestAnimationFrame(
                            frame
                        );


                    textAnimations.set(
                        element,
                        id
                    );

                }

                else {

                    element.textContent =
                        show
                            ? fullText
                            : "";


                    textAnimations.delete(
                        element
                    );


                    resolve();

                }

            }


            const id =
                requestAnimationFrame(
                    frame
                );


            textAnimations.set(
                element,
                id
            );

        }
    );

}


/* =====================================================
   INDEX CASE ANIMATION
   ===================================================== */

function renderIndexCase(
    upperCount
) {

    const word =
        "index";


    let result =
        "";


    for (
        let i = 0;
        i <
        word.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? word[
                    i
                ].toUpperCase()
                : word[
                    i
                ];

    }


    indexButton.textContent =
        result;

}


function animateIndexCase(
    toUpper
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        TOOLBAR_ANIMATION_DURATION
                    );


                const count =
                    toUpper
                        ? Math.round(
                            progress *
                            5
                        )
                        : Math.round(
                            (
                                1 -
                                progress
                            ) *
                            5
                        );


                renderIndexCase(
                    count
                );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderIndexCase(
                        toUpper
                            ? 5
                            : 0
                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    stopAutoSlideshow();


    indexButton.classList.add(
        "index-active"
    );


    const animations =
        [

            animateTextLength(
                previousWorkButton,
                "previous work",
                false
            ),

            animateIndexCase(
                true
            ),

            animateTextLength(
                nextWorkButton,
                "next work",
                false
            )

        ];


    setTimeout(
        () => {

            indexMode =
                true;


            body.classList.add(
                "index-mode"
            );


            indexView.classList.add(
                "visible"
            );

        },
        TOOLBAR_ANIMATION_DURATION /
        2
    );


    await Promise.all(
        animations
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   EXIT INDEX
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    /*
        Begin loading selected cover immediately.
    */

    const targetProject =
        projects[
            targetProjectIndex
        ];


    preloadImage(
        targetProject.images[
            0
        ]
    ).catch(
        () => {}
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    const animations =
        [

            animateTextLength(
                previousWorkButton,
                "previous work",
                true
            ),

            animateIndexCase(
                false
            ),

            animateTextLength(
                nextWorkButton,
                "next work",
                true
            )

        ];


    await showSpread(
        targetProjectIndex,
        0
    );


    await Promise.all(
        animations
    );


    indexButton.classList.remove(
        "index-active"
    );


    interfaceAnimating =
        false;


    startAutoSlideshow();

}

/* =====================================================
   CLICK NAVIGATION

   First click:
   stop autoplay.

   Later clicks:
   LEFT 25% = previous
   RIGHT 75% = next
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            indexMode ||
            interfaceAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #work-controls, #index-button"
            )
        ) {

            return;

        }


        /*
            First click only stops.
        */

        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        /*
            Left 25%.
        */

        if (
            position <
            0.25
        ) {

            await previousSpread();

        }

        /*
            Remaining 75%.
        */

        else {

            await nextSpread();

        }

    }
);


/* =====================================================
   KEYBOARD

   LEFT  = previous spread/work
   RIGHT = next spread/work
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode ||
            interfaceAnimating
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousSpread();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextSpread();

        }

    }
);


/* =====================================================
   TOUCH START
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive:
            true
    }
);


/* =====================================================
   TOUCH END / SWIPE

   swipe left  = next
   swipe right = previous

   Crosses work boundaries.
   ===================================================== */

document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            interfaceAnimating ||
            touchStartX ===
            null ||
            touchStartY ===
            null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        /*
            Ignore mostly vertical gesture.
        */

        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        /*
            Minimum swipe threshold.
        */

        if (
            Math.abs(
                deltaX
            ) <
            45
        ) {

            return;

        }


        stopAutoSlideshow();


        /*
            Swipe left.
        */

        if (
            deltaX <
            0
        ) {

            await nextSpread();

        }


        /*
            Swipe right.
        */

        else {

            await previousSpread();

        }

    },
    {
        passive:
            true
    }
);


/* =====================================================
   MOBILE / INSTAGRAM STAGE
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const gapAfterInfo =
        24;


    const bottomGap =
        52;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            120,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";

}

const sectionSwitch =

const switchWord =
    "film";


let switchState =

let switchFrame =
    null;


/* =====================================================
   RENDER FILM
   ===================================================== */

function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i <
        switchWord.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? switchWord[
                    i
                ].toUpperCase()
                : switchWord[
                    i
                ];

/* =====================================================
   FILM MORPH
   ===================================================== */

function morphSwitchTo(
    target
) {

    if (
        switchFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   FILM HOVER
   ===================================================== */

sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   RESPONSIVE UPDATE
   ===================================================== */

async function refreshResponsiveSpread() {

    if (
        projects.length ===
        0 ||
        indexMode
    ) {

        return;

    }


    /*
        Clear spread maps because portrait
        pairing may change between mobile
        portrait and wider layouts.
    */

    spreadCache.clear();


    await showSpread(
        projectIndex,
        spreadStart
    );

}


/* =====================================================
   RESIZE
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        updateMobileStage();


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    refreshResponsiveSpread();


                    syncProjectWidths();

                },
                150
            );

    }
);


/* =====================================================
   ORIENTATION CHANGE
   ===================================================== */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            async () => {

                updateMobileStage();


                await refreshResponsiveSpread();


                syncProjectWidths();

            },
            250
        );

    }
);


/* =====================================================
   VISUAL VIEWPORT
   ===================================================== */

if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            updateMobileStage
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileStage
        );

}


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        /*
            First spread.
        */

        await showSpread(
            0,
            0
        );


        /*
            Preload all index covers.
        */

        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        updateMobileStage();


        syncProjectWidths();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexCase(
    0
);


loadProjects();

</script>
