<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script>
(function () {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const phonePortrait = w <= 600 && h >= w;
    const phoneLandscape = h <= 600 && w > h && w <= 1000;

    if (!phonePortrait && !phoneLandscape) {
        document.documentElement.classList.add("desktop-viewall-boot");
    }
})();
</script>

<title>Denizalp Aybak — Photography</title>
<link rel="stylesheet" href="https://use.typekit.net/rmn7qgm.css">
<style>
/* =====================================================
   RESET & VARIABLES
   ===================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button { font: inherit; }

:root {
    --font-size: 15px;
    --line-height: 1.15;
    --active-number-tracking: 0.055em;
    --side: 48px;
    --top: 32px;
    --index-bottom: 24px;
    --meta-gap: 6px;
    --image-max-width: 82vw;
    --visual-height: 84vh;
    --image-max-height: calc(var(--visual-height) - 22px);
    --meta-top-gap: 10px;
    --portrait-visual-top: 140px;
    --landscape-safe-left: 300px;
    --landscape-safe-right: 120px;
}

body { cursor: default; }

html.desktop-viewall-boot #project-stage,
html.desktop-viewall-boot #project-all-view { visibility: hidden !important; }

a, button, .project-card, .project-all-thumb { cursor: pointer; }
.spread-image { pointer-events: auto; cursor: pointer; }

/* =====================================================
   NEW CLEAN TOPBAR & ENDCARD (LANDING INTEGRATION)
   ===================================================== */
#ci-ui-layer { position: fixed; inset: 0; z-index: 20005; mix-blend-mode: difference; color: #fff; pointer-events: none; }
.clean-index-topbar { position: absolute; top: var(--top); left: var(--side); right: var(--side); height: 30px; pointer-events: none; display: flex; justify-content: space-between; align-items: center; z-index: 9999; }
.clean-index-topbutton, .ci-logo-btn { appearance: none; border: 0; outline: 0; padding: 0; margin: 0; background: transparent; color: inherit; font: inherit; line-height: inherit; cursor: pointer; user-select: none; white-space: nowrap; text-decoration: none; pointer-events: auto; }
.clean-index-topbutton:hover { text-decoration: underline; }

#clean-index-button { position: absolute; left: 0; top: 50%; transform: translateY(-50%); pointer-events: auto; }
#clean-info-button { position: absolute; right: 0; top: 50%; transform: translateY(-50%); pointer-events: auto; }
#ci-white-logo-wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; }

.ci-logo-denizalp { display: block; text-align: center; }
.ci-logo-aybak { display: flex; gap: 0; justify-content: center; }
.ci-logo-aybak span { display: inline-block; white-space: pre; }

#ci-endcard-container { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 400ms ease, visibility 0s linear 400ms; pointer-events: none; z-index: 2147483647; color: #fff; background: #000; touch-action: none; }
#ci-endcard-btn { pointer-events: auto; color: #fff !important; mix-blend-mode: normal !important; }

body.landing-aybak-active #ci-endcard-container { opacity: 1; visibility: visible; transition-delay: 0s; pointer-events: auto; }
body.landing-aybak-active #project-stage,
body.landing-aybak-active #project-all-view { opacity: 0; pointer-events: none; }

/* =====================================================
   PROJECT (SLIDE MODE)
   ===================================================== */
#project-stage { position: fixed; inset: 0; z-index: 10; pointer-events: none; transition: opacity 300ms; }
#project-block { position: absolute; inset: 0; pointer-events: none; }
#visual-zone { position: absolute; top: 50%; left: 0; width: 100%; height: var(--visual-height); transform: translateY(-50%); display: flex; align-items: center; justify-content: center; pointer-events: none; }
#spread, .image-cell { display: flex; align-items: center; justify-content: center; pointer-events: none; }
.spread-image { display: block; width: auto; height: auto; max-width: var(--image-max-width); max-height: var(--image-max-height); object-fit: contain; pointer-events: none; }

#project-meta { position: absolute; top: calc(50% + var(--visual-height) / 2 + var(--meta-top-gap)); left: 50%; width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; font-size: var(--font-size); line-height: var(--line-height); pointer-events: none; }
#project-title { grid-column: 1; grid-row: 1; text-align: left; white-space: nowrap; pointer-events: auto; cursor: pointer; }
#project-date { grid-column: 1; grid-row: 2; text-align: left; white-space: nowrap; pointer-events: auto; cursor: pointer; }
#project-counter { grid-column: 2; grid-row: 1; justify-self: end; padding-left: 28px; text-align: right; white-space: nowrap; appearance: none; -webkit-appearance: none; margin: 0; border: 0; outline: 0; background: transparent; font: inherit; line-height: inherit; pointer-events: auto; cursor: pointer; }
#view-all-button { grid-column: 2; grid-row: 2; justify-self: end; appearance: none; -webkit-appearance: none; margin: 0; padding: 0; border: 0; outline: 0; background: transparent; color: inherit; line-height: inherit; text-align: right; white-space: nowrap; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
#view-all-button:hover, #view-all-button:focus, #view-all-button:active { outline: 0; text-decoration: none; }

body.project-all-mode #spread { visibility: hidden; }
body.project-all-preparing #project-all-view { display: block; visibility: hidden; }

/* =====================================================
   VIEW ALL (GRID MODE)
   ===================================================== */
#project-all-view { position: fixed; z-index: 30; display: none; overflow: hidden; pointer-events: auto; transition: opacity 300ms; }
body.project-all-mode #project-all-view { display: block; visibility: visible; }
#project-all-grid { display: grid; width: 100%; height: 100%; place-content: center; align-items: center; justify-items: center; gap: 7px; }
.project-all-thumb { appearance: none; -webkit-appearance: none; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; min-width: 0; min-height: 0; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.project-all-thumb img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; pointer-events: none; }

/* =====================================================
   RESPONSIVE OVERRIDES
   ===================================================== */
@media (min-width: 601px) and (max-width: 1366px) {
    :root { --image-max-width: 80vw; --visual-height: 82vh; --image-max-height: calc(var(--visual-height) - 22px); }
}

body.phone-portrait, body.phone-landscape { --font-size: 13px; --side: 24px; --top: 20px; --index-bottom: 18px; --meta-gap: 5px; }

body.phone-portrait #project-meta { top: auto; left: var(--side) !important; width: calc(100vw - var(--side) * 2) !important; bottom: calc(var(--index-bottom) + env(safe-area-inset-bottom) + 27px); }
body.phone-portrait #project-counter { padding-left: 16px; }
body.phone-portrait #visual-zone { top: var(--portrait-visual-top); left: var(--side); right: var(--side); bottom: calc(var(--index-bottom) + env(safe-area-inset-bottom) + 72px); width: auto; height: auto; transform: none; padding: 4px 0; overflow: hidden; }
body.phone-portrait #spread, body.phone-portrait .image-cell { width: 100%; height: 100%; }
body.phone-portrait .spread-image { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; }

body.phone-landscape { --side: 24px; --top: 18px; --index-bottom: 14px; }
body.phone-landscape #project-meta { top: auto; left: var(--side) !important; width: calc(100vw - var(--side) * 2) !important; bottom: calc(var(--index-bottom) + env(safe-area-inset-bottom) + 24px); }
body.phone-landscape #project-counter { padding-left: 16px; }
body.phone-landscape #visual-zone { top: 0; left: var(--landscape-safe-left); right: var(--landscape-safe-right); bottom: calc(var(--index-bottom) + env(safe-area-inset-bottom) + 24px); width: auto; height: auto; transform: none; display: flex; align-items: flex-end; justify-content: center; padding: 18px 0 0; overflow: hidden; }
body.phone-landscape #spread, body.phone-landscape .image-cell { width: 100%; height: 100%; align-items: flex-end; }
body.phone-landscape .spread-image { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; }

#project-meta, body.phone-portrait #project-meta, body.phone-landscape #project-meta { top: auto !important; left: var(--side) !important; right: var(--side) !important; width: auto !important; bottom: var(--top) !important; }
#project-title, #project-date { justify-self: start; text-align: left; }
#project-counter, #view-all-button { justify-self: end; text-align: right; }

body.project-all-mode #project-counter, body.project-all-preparing #project-counter { grid-column: 2 !important; grid-row: 1 !important; }
body.project-all-mode #view-all-button, body.project-all-preparing #view-all-button { grid-column: 2 !important; grid-row: 2 !important; }

/* THEME SYSTEM (Photography is always white, Endcard is always black) */
body, #project-stage, #project-all-view { transition: background-color 220ms ease, color 220ms ease; will-change: background-color, color; background: #fff !important; color: #000 !important; }
.clean-index-topbutton, .ci-logo-btn, #project-title, #project-date, #project-counter, #view-all-button { color: #000 !important; }
html.landing-aybak-active, body.landing-aybak-active { background: #000 !important; }
</style>
</head>
<body>

<!-- NEW TOP BAR -->
<div id="ci-ui-layer">
  <div class="clean-index-topbar">
    <a href="https://denizalpaybak.com/" id="clean-index-button" class="clean-index-topbutton" aria-label="Index">index</a>
    <div id="ci-white-logo-wrap">
      <button id="ci-white-logo-btn" class="ci-logo-btn" type="button" aria-label="Denizalp Aybak">

        <div id="ci-white-aybak" class="ci-logo-aybak">
          <span class="wl-letter">a</span><span class="wl-letter">y</span><span class="wl-letter">b</span><span class="wl-letter">a</span><span class="wl-letter">k</span>

<script>
(async () => {
"use strict";

/* =====================================================
   NEW TOPBAR & ENDCARD MORPHING SYSTEM
   ===================================================== */
const ecBtn = document.getElementById("ci-endcard-btn"), wlBtn = document.getElementById("ci-white-logo-btn");
let ciLogoState = 0, ciLogoTarget = 0, ciLogoTimer = null, ecFinishing = false;
const upperA = ["A", "Y", "B", "A", "K"], lowerA = ["a", "y", "b", "a", "k"];

function setCiLogoState(state) {
    const denizalps = document.querySelectorAll('.ci-logo-denizalp');
    const aybaks = [document.querySelectorAll('#ci-endcard-aybak .ec-letter'), document.querySelectorAll('#ci-white-aybak .wl-letter')];
    denizalps.forEach(d => { if(d) d.textContent = state === 0 ? "Denizalp" : "denizalp"; });
    aybaks.forEach(letters => {
        if(!letters.length) return;
        letters.forEach((l, i) => { l.textContent = (state - 1 > i) ? upperA[i] : lowerA[i]; });
    });
}

function animateCiLogo(target, callback) {
    ciLogoTarget = target;
    if (ciLogoTimer) clearTimeout(ciLogoTimer);
    const step = () => {
        if (ciLogoState === ciLogoTarget) { ciLogoTimer = null; if(callback) callback(); return; }
        ciLogoState += (ciLogoTarget > ciLogoState) ? 1 : -1;
        setCiLogoState(ciLogoState);
        ciLogoTimer = setTimeout(step, 80); 
    };
    step();
}

function openEndCard(show) { 
    if(show) {
        document.body.classList.add('landing-aybak-active');
        document.documentElement.classList.add('landing-aybak-active');
        ecFinishing = false;
        animateCiLogo(0);
    } else {
        if(ecFinishing) return;
        ecFinishing = true;
        document.body.classList.remove('landing-aybak-active');
        document.documentElement.classList.remove('landing-aybak-active');
        animateCiLogo(0, () => { setTimeout(() => { ecFinishing = false; }, 400); });
    }
}

[ecBtn, wlBtn].forEach(btn => {
    if(!btn) return;
    btn.addEventListener("mouseenter", () => { if(window.innerWidth > 900 && !ecFinishing) animateCiLogo(6); });
    btn.addEventListener("mouseleave", () => { if(window.innerWidth > 900 && !ecFinishing) animateCiLogo(0); });
    btn.addEventListener("click", () => {
        if(ecFinishing) return;
        if (window.innerWidth <= 900) {
            animateCiLogo(6, () => { setTimeout(() => { animateCiLogo(0); if(btn.id === "ci-endcard-btn") openEndCard(false); }, 400); });
        } else {
            if(btn.id === "ci-endcard-btn") openEndCard(false); 
        }
    });
});

const CI_MORPH_STATES = new WeakMap();
function ciLetters(text) { const out=[]; for(let i=0;i<text.length;i++) { const c=text[i]; if(c.toLowerCase() !== c.toUpperCase()) out.push(i); } return out; }
function ciInitCharSpans(el, rawText) {
    const text=String(rawText).toLowerCase(); const frag=document.createDocumentFragment();
    for(const ch of text) { const s=document.createElement("span"); s.className="clean-index-char"; s.textContent=ch; frag.appendChild(s); }
    el.replaceChildren(frag); el.__rawText=text;
    CI_MORPH_STATES.set(el, {state:0,target:0,frame:null,count:ciLetters(text).length});
}
function ciRenderMorph(el, state) {
    const st=CI_MORPH_STATES.get(el); if(!st) return;
    const text=el.__rawText, pos=ciLetters(text), active=new Set(pos.slice(0,state));
    Array.from(el.children).forEach((span,i)=>{ const c=text[i]; span.textContent=active.has(i) ? c.toUpperCase() : c.toLowerCase(); }); st.state=state;
}
function ciMorphElement(el, toUpper, duration=400) {
    const st=CI_MORPH_STATES.get(el); if(!st) return Promise.resolve();
    if(st.frame!==null) cancelAnimationFrame(st.frame);
    const target=toUpper ? st.count : 0, startState=st.state;
    if(startState===target) { ciRenderMorph(el,target); return Promise.resolve(); }
    const start=performance.now();
    return new Promise(resolve=>{
        const frame=now=>{
            const p=Math.min(1,(now-start)/duration); const eased=p < .5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
            ciRenderMorph(el,Math.round(startState+(target-startState)*eased));
            if(p<1) st.frame=requestAnimationFrame(frame); else { st.frame=null; ciRenderMorph(el,target); resolve(); }
        }; st.target=target; st.frame=requestAnimationFrame(frame);
    });
}

const cleanIndexButton = document.getElementById("clean-index-button");
const cleanInfoButton = document.getElementById("clean-info-button");
ciInitCharSpans(cleanIndexButton, "index");
ciInitCharSpans(cleanInfoButton, "info");
cleanIndexButton.addEventListener('mouseenter',()=>ciMorphElement(cleanIndexButton, true));
cleanIndexButton.addEventListener('mouseleave',()=>ciMorphElement(cleanIndexButton, false));
cleanInfoButton.addEventListener('mouseenter',()=>ciMorphElement(cleanInfoButton, true));
cleanInfoButton.addEventListener('mouseleave',()=>ciMorphElement(cleanInfoButton, false));

/* =====================================================
   ENDCARD WHEEL, KEYBOARD & SWIPE TRIGGERS
   ===================================================== */
let wheelAccumulator = 0, wheelResetTimer = null;
document.addEventListener('wheel', event => {
    const isBlackCard = document.body.classList.contains('landing-aybak-active');
    if (!isBlackCard) {
      if (event.deltaY <= 0) { wheelAccumulator = 0; return; }
    } else { 
      if (event.deltaY >= 0) { wheelAccumulator = 0; return; } 
    }
    wheelAccumulator += event.deltaY;
    clearTimeout(wheelResetTimer); wheelResetTimer = setTimeout(() => wheelAccumulator = 0, 140);
    if (!isBlackCard && wheelAccumulator >= 48) { event.preventDefault(); wheelAccumulator = 0; openEndCard(true); }
    else if (isBlackCard && wheelAccumulator <= -48) { event.preventDefault(); wheelAccumulator = 0; openEndCard(false); }
}, {passive: false});

let lastTouchY = null, lastTouchX = null;
document.addEventListener('touchstart',event=>{ 
    if(event.changedTouches[0]) { lastTouchY = event.changedTouches[0].clientY; lastTouchX = event.changedTouches[0].clientX; }
},{passive:true});

document.addEventListener('touchend',event=>{
    const isBlackCard = document.body.classList.contains('landing-aybak-active');
    if(lastTouchY===null || lastTouchX===null || !event.changedTouches[0]) return; 
    const dy = event.changedTouches[0].clientY - lastTouchY; const dx = event.changedTouches[0].clientX - lastTouchX; 
    lastTouchY = null; lastTouchX = null;
    
    if (Math.abs(dy) > 45 && Math.abs(dy) > Math.abs(dx)) {
        if (!isBlackCard && dy < -45) { openEndCard(true); } 
        else if (isBlackCard && dy > 45) { openEndCard(false); }
    }
},{passive:true});

document.addEventListener('keydown', event => {
    const isBlackCard = document.body.classList.contains('landing-aybak-active');
    if(!isBlackCard && (event.key==='ArrowDown' || event.key==='PageDown')) { event.preventDefault(); openEndCard(true); }
    if(isBlackCard && (event.key==='ArrowUp' || event.key==='PageUp' || event.key==='Escape')) { event.preventDefault(); openEndCard(false); }
});

/* =====================================================
   DATA & ORIGINAL VARIABLES
   ===================================================== */
const R2_BASE = "https://library.denizalpaybak.com/photos/";
const R2_THUMB_BASE = "https://library.denizalpaybak.com/photo-thumbnails/";
const PROJECTS_JSON = "./projects.json";
const SLIDE_DURATION = 5000;
const TEXT_MORPH_DURATION = 420;
const STATE_MORPH_DURATION = 400;
const CASE_DURATION = 400;

let projects = [];
let projectIndex = 0;
let frameIndex = 0;
let renderedProjectIndex = null;
let manualMode = false;
let autoplayPermanentlyDisabled = false;
let projectAllMode = false;
let slideTimer = null;
let interfaceAnimating = false;
let navigationAnimating = false;
let projectViewAnimating = false;
let viewButtonHovered = false;
let previousResponsiveMode = null;
let projectAllSwitching = false;
let projectTitleHovering = false;
let projectAllTouchX = null;
let projectAllTouchY = null;
let projectAutoplayTimer = null;
let projectAutoplayEnabled = true;

const NORMAL_PROJECT_FRAME_LIMIT = 3;
const seenFramesByProject = new Map();
let normalSequenceProjectIndex = null;
let normalSequenceFrames = [];
let normalSequencePosition = -1;
let focusedProjectMode = false;
let focusedProjectIndex = null;
let suppressClickUntil = 0;
const imageCache = new Map();

const body = document.body;
const projectBlock = document.getElementById("project-block");
const spread = document.getElementById("spread");
const projectMeta = document.getElementById("project-meta");
const projectTitle = document.getElementById("project-title");
const projectDate = document.getElementById("project-date");
const projectCounter = document.getElementById("project-counter");
const viewAllButton = document.getElementById("view-all-button");
const projectAllView = document.getElementById("project-all-view");
const projectAllGrid = document.getElementById("project-all-grid");

function isPhonePortrait() { return (window.innerWidth <= 600 && window.innerHeight >= window.innerWidth); }
function isPhoneLandscape() { return (window.innerHeight <= 600 && window.innerWidth > window.innerHeight && window.innerWidth <= 1000); }
function isPhoneLayout() { return (isPhonePortrait() || isPhoneLandscape()); }
function getResponsiveMode() { if (isPhonePortrait()) return "phone-portrait"; if (isPhoneLandscape()) return "phone-landscape"; return "desktop"; }
function getPhotoUrl(filename) { return (R2_BASE + encodeURIComponent(filename)); }
function getPhotoThumbnailUrl(filename) { const source = String(filename || ""); const dotIndex = source.lastIndexOf("."); const thumbnailFilename = dotIndex > 0 ? source.slice(0, dotIndex) + ".webp" : source + ".webp"; return (R2_THUMB_BASE + encodeURIComponent(thumbnailFilename)); }
function currentProject() { return projects[projectIndex]; }
function normalizeProjectIndex(index) { return ((index % projects.length) + projects.length) % projects.length; }

function rotateImagesFromIndex(images, startIndex) {
    if (images.length <= 1 || startIndex <= 0) return images.slice();
    return [...images.slice(startIndex), ...images.slice(0, startIndex)];
}

function prepareProject(project) {
    project = { ...project, title: String(project.title || "").replace(/q-p/gi, "q–p") };
    const originalImages = project.images.slice();
    let startIndex = 0;
    if (project.coverOverride) {
        const overrideIndex = originalImages.indexOf(project.coverOverride);
        if (overrideIndex >= 0) { startIndex = overrideIndex; }
        else { startIndex = Math.floor(Math.random() * originalImages.length); }
    } else {
        startIndex = Math.floor(Math.random() * originalImages.length);
    }
    const rotatedImages = rotateImagesFromIndex(originalImages, startIndex);
    return { ...project, originalImages: originalImages.slice(), images: rotatedImages, cover: rotatedImages[0] };
}

function getDeepLinkRequest() {
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("project");
    const rawImage = params.get("image");
    let imageNumber = null;
    if (rawImage !== null) { const parsed = Number.parseInt(rawImage, 10); if (Number.isFinite(parsed) && parsed >= 1) { imageNumber = parsed; } }
    const rawView = params.get("view");
    const viewAll = String(rawView || "").toLowerCase() === "all";
    return { projectId, imageNumber, viewAll };
}

function findProjectIndexById(projectId) {
    if (!projectId) return -1;
    return projects.findIndex(project => project.id === projectId);
}

function getOriginalImages(project) {
    if (!project) return [];
    return Array.isArray(project.originalImages) ? project.originalImages : project.images;
}

function getOriginalImageNumber(project, runtimeFrameIndex = frameIndex) {
    if (!project || !project.images.length) return 1;
    const filename = project.images[runtimeFrameIndex];
    const originalImages = getOriginalImages(project);
    const originalIndex = originalImages.indexOf(filename);
    return originalIndex >= 0 ? originalIndex + 1 : 1;
}

function getRuntimeFrameIndexFromOriginalNumber(project, imageNumber) {
    if (!project || !Number.isFinite(imageNumber)) return -1;
    const originalImages = getOriginalImages(project);
    const originalIndex = imageNumber - 1;
    if (originalIndex < 0 || originalIndex >= originalImages.length) return -1;
    const filename = originalImages[originalIndex];
    return project.images.indexOf(filename);
}

function syncProjectUrl(mode = "replace") {
    const project = currentProject();
    if (!project || !project.id) return;
    const imageNumber = getOriginalImageNumber(project, frameIndex);
    const url = new URL(window.location.href);
    url.searchParams.set("project", project.id);
    url.searchParams.set("image", String(imageNumber));
    const state = { projectId: project.id, imageNumber };
    if (mode === "push") { window.history.pushState(state, "", url); }
    else { window.history.replaceState(state, "", url); }
}

function getPhotoCountText(total) { return (String(total) + " " + (total === 1 ? "photo" : "photos")); }
function getProjectPhotoCountText(total) { return (getPhotoCountText(total) + " in this project"); }
function getViewVerbText(total) { return total === 1 ? "view" : "view all"; }
function getAllCounterText(total) { return ("all (" + getPhotoCountText(total) + ")"); }

function preloadImage(filename) {
    if (imageCache.has(filename)) return imageCache.get(filename);
    const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = async () => { try { if (img.decode) await img.decode(); } catch (error) {} resolve(img); };
        img.onerror = () => { imageCache.delete(filename); reject(new Error(`Could not load ${filename}`)); };
        img.src = getPhotoUrl(filename);
    });
    imageCache.set(filename, promise);
    return promise;
}

function updateLandscapeGeometry() {
    if (!isPhoneLandscape()) return;
    const root = document.documentElement;
    const rightControlRect = cleanIndexButton.getBoundingClientRect();
    const computed = getComputedStyle(root);
    const fontSize = parseFloat(computed.getPropertyValue("--font-size")) || 13;
    const lineHeightMultiplier = parseFloat(computed.getPropertyValue("--line-height")) || 1.15;
    const lineHeight = fontSize * lineHeightMultiplier;
    
    const slideLeftGap = 24; const slideRightGap = 32;
    const safeLeft = Math.ceil(0 + slideLeftGap);
    const safeRight = Math.max(24, Math.ceil(window.innerWidth - rightControlRect.left + slideRightGap));
    
    root.style.setProperty("--landscape-safe-left", `${safeLeft}px`);
    root.style.setProperty("--landscape-safe-right", `${safeRight}px`);
}

function updateResponsiveMode() {
    const portrait = isPhonePortrait();
    const landscape = isPhoneLandscape();
    const newMode = getResponsiveMode();
    const modeChanged = previousResponsiveMode !== null && previousResponsiveMode !== newMode;

    body.classList.toggle("phone-portrait", portrait);
    body.classList.toggle("phone-landscape", landscape);

    if (portrait) { document.documentElement.style.setProperty("--portrait-visual-top", `${Math.ceil(0 + 18)}px`); }
    if (landscape) { updateLandscapeGeometry(); }
    previousResponsiveMode = newMode;
}

function renderInteractiveTypography(element, text, activePositions = new Set()) {
    const fragment = document.createDocumentFragment();
    Array.from(String(text)).forEach((character, index) => {
        const span = document.createElement("span");
        span.textContent = character;
        const isDigit = /[0-9]/.test(character);
        const isActiveDigit = isDigit && activePositions.has(index);
        if (isActiveDigit) { span.style.letterSpacing = "var(--active-number-tracking)"; }
        fragment.appendChild(span);
    });
    element.replaceChildren(fragment);
}

function renderBaseTypography(element, text) { renderInteractiveTypography(element, text, new Set()); }

function getMorphPositions(text) {
    return Array.from(String(text)).map((character, index) => {
        const isLetter = character.toLowerCase() !== character.toUpperCase();
        const isDigit = /[0-9]/.test(character);
        return (isLetter || isDigit) ? index : -1;
    }).filter(index => index >= 0);
}

function renderCaseFromActivePositions(baseText, activePositions) {
    return String(baseText).split("").map((character, index) => {
        const isLetter = character.toLowerCase() !== character.toUpperCase();
        return (isLetter && activePositions.has(index)) ? character.toUpperCase() : character.toLowerCase();
    }).join("");
}

function morphSequential(element, nextText, duration = TEXT_MORPH_DURATION) {
    const oldText = element.dataset.rawText !== undefined ? element.dataset.rawText : element.textContent;
    if (oldText === nextText) {
        renderInteractiveTypography(element, nextText, new Set());
        element.dataset.rawText = nextText;
        return Promise.resolve();
    }

    const length = Math.max(oldText.length, nextText.length);
    const from = oldText.padEnd(length, " ").split("");
    const to = nextText.padEnd(length, " ").split("");
    const changedPositions = [];

    for (let i = 0; i < length; i++) { if (from[i] !== to[i]) { changedPositions.push(i); } }

    const originalWidth = element.getBoundingClientRect().width;
    if (originalWidth > 0) { element.style.minWidth = `${originalWidth}px`; }
    const start = performance.now();

    return new Promise(resolve => {
        function frame(now) {
            const progress = Math.min(1, (now - start) / duration);
            const completed = Math.floor(progress * (changedPositions.length + 1));
            const current = from.slice();

            for (let i = 0; i < completed; i++) {
                const position = changedPositions[i];
                if (position === undefined) continue;
                current[position] = to[position];
            }

            renderInteractiveTypography(element, current.join("").trimEnd(), new Set());

            if (progress < 1) { requestAnimationFrame(frame); }
            else {
                renderInteractiveTypography(element, nextText, new Set());
                element.dataset.rawText = nextText;
                element.style.minWidth = "";
                resolve();
            }
        }
        requestAnimationFrame(frame);
    });
}

function animateCase(element, baseText, toUpper, duration = CASE_DURATION) {
    const base = String(baseText).toLowerCase();
    const positions = getMorphPositions(base);
    const total = positions.length;
    let currentState = 0;
    const children = Array.from(element.children);

    if (children.length === base.length) {
        for (let i = 0; i < positions.length; i++) {
            const position = positions[i];
            const character = base[position];
            const span = children[position];
            const isDigit = /[0-9]/.test(character);
            const isLetter = character.toLowerCase() !== character.toUpperCase();
            const active = isDigit ? (span && !!span.style.letterSpacing) : (isLetter && span && span.textContent === character.toUpperCase());
            if (active) { currentState++; } else { break; }
        }
    } else {
        const currentText = element.textContent;
        for (let i = 0; i < positions.length; i++) {
            const position = positions[i];
            const character = base[position];
            const isLetter = character.toLowerCase() !== character.toUpperCase();
            if (isLetter && currentText[position] === character.toUpperCase()) { currentState++; } else { break; }
        }
    }

    const target = toUpper ? total : 0;

    function renderState(state) {
        const activePositions = new Set(positions.slice(0, state));
        renderInteractiveTypography(element, renderCaseFromActivePositions(base, activePositions), activePositions);
    }

    if (currentState === target) { renderState(target); return Promise.resolve(); }

    const start = performance.now();
    return new Promise(resolve => {
        function frame(now) {
            const progress = Math.min(1, (now - start) / duration);
            const state = Math.round(currentState + (target - currentState) * progress);
            renderState(state);

            if (progress < 1) { requestAnimationFrame(frame); }
            else { renderState(target); resolve(); }
        }
        requestAnimationFrame(frame);
    });
}

function renderImage(imageData) {
    spread.innerHTML = "";
    const cell = document.createElement("div");
    cell.className = "image-cell";
    const img = document.createElement("img");
    img.className = "spread-image";
    img.src = imageData.src;

}

async function updateMetadata(targetProjectIndex, targetFrameIndex) {
    const project = projects[targetProjectIndex];
    const projectChanged = renderedProjectIndex !== targetProjectIndex;

    renderBaseTypography(projectCounter, getProjectPhotoCountText(project.images.length));
    projectCounter.dataset.rawText = projectCounter.textContent;

    if (projectChanged) {
        await Promise.all([
            morphSequential(projectTitle, project.title.toLowerCase(), TEXT_MORPH_DURATION),
            morphSequential(projectDate, (project.date || "").toLowerCase(), TEXT_MORPH_DURATION)
        ]);
    }
    renderedProjectIndex = targetProjectIndex;
}

function shuffledCopy(values) {
    const copy = values.slice();
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function getSeenFrameSet(targetProjectIndex) {
    const normalized = normalizeProjectIndex(targetProjectIndex);
    if (!seenFramesByProject.has(normalized)) { seenFramesByProject.set(normalized, new Set()); }
    return seenFramesByProject.get(normalized);
}

function markFrameSeen(targetProjectIndex, targetFrameIndex) {
    getSeenFrameSet(targetProjectIndex).add(targetFrameIndex);
}

function buildNormalProjectSequence(targetProjectIndex, { includeFrame = null } = {}) {
    const normalized = normalizeProjectIndex(targetProjectIndex);
    const project = projects[normalized];
    const total = project.images.length;
    let selectedFrame;

    if (Number.isInteger(includeFrame) && includeFrame >= 0 && includeFrame < total) {
        selectedFrame = includeFrame;
    } else {
        selectedFrame = Math.floor(Math.random() * total);
    }

    normalSequenceProjectIndex = normalized;
    normalSequenceFrames = [selectedFrame];
    normalSequencePosition = 0;
    return normalSequenceFrames;
}

function clearNormalSequence() {
    normalSequenceProjectIndex = null;
    normalSequenceFrames = [];
    normalSequencePosition = -1;
}

function enterFocusedProjectMode(targetProjectIndex) {
    focusedProjectMode = true;
    focusedProjectIndex = normalizeProjectIndex(targetProjectIndex);
    clearNormalSequence();
}

function leaveFocusedProjectMode() {
    focusedProjectMode = false;
    focusedProjectIndex = null;
    clearNormalSequence();
}

function preloadAhead() {
    if (projects.length === 0) return;
    const project = currentProject();
    for (let offset = 1; offset <= 4; offset++) {
        const target = frameIndex + offset;
        if (target < project.images.length) { preloadImage(project.images[target]).catch(() => {}); }
    }
    const nextProject = projects[normalizeProjectIndex(projectIndex + 1)];
    if (nextProject) { preloadImage(nextProject.images[0]).catch(() => {}); }
}

async function showFrame(targetProjectIndex, targetFrameIndex, urlMode = "push") {
    if (navigationAnimating) return false;
    navigationAnimating = true;

    const normalizedProject = normalizeProjectIndex(targetProjectIndex);
    const project = projects[normalizedProject];
    const normalizedFrame = Math.max(0, Math.min(targetFrameIndex, project.images.length - 1));

    try {
        const loadedImage = await preloadImage(project.images[normalizedFrame]);
        projectIndex = normalizedProject;
        frameIndex = normalizedFrame;

        markFrameSeen(normalizedProject, normalizedFrame);
        syncProjectUrl(urlMode);
        renderImage(loadedImage);

        if (isPhoneLandscape()) { updateLandscapeGeometry(); }
        syncMetadataAfterRender();
        await updateMetadata(normalizedProject, normalizedFrame);
        preloadAhead();
        
        navigationAnimating = false;
        return true;
    } catch (error) {
        navigationAnimating = false;
        return false;
    }
}

async function nextFrame(urlMode = "push") {
    if (navigationAnimating || projectAllMode) return;
    const project = currentProject();

    if (focusedProjectMode && focusedProjectIndex === projectIndex) {
        if (frameIndex < project.images.length - 1) { return showFrame(projectIndex, frameIndex + 1, urlMode); }
        leaveFocusedProjectMode();
        const nextProjectIndex = normalizeProjectIndex(projectIndex + 1);
        const sequence = buildNormalProjectSequence(nextProjectIndex);
        normalSequencePosition = 0;
        return showFrame(nextProjectIndex, sequence[0], urlMode);
    }

    if (normalSequenceProjectIndex !== projectIndex || !normalSequenceFrames.includes(frameIndex)) {
        buildNormalProjectSequence(projectIndex, { includeFrame: frameIndex });
    }

    normalSequencePosition = normalSequenceFrames.indexOf(frameIndex);

    if (normalSequencePosition >= 0 && normalSequencePosition < normalSequenceFrames.length - 1) {
        normalSequencePosition++;
        return showFrame(projectIndex, normalSequenceFrames[normalSequencePosition], urlMode);
    }

    const nextProjectIndex = normalizeProjectIndex(projectIndex + 1);
    const nextSequence = buildNormalProjectSequence(nextProjectIndex);
    normalSequencePosition = 0;
    return showFrame(nextProjectIndex, nextSequence[0], urlMode);
}

async function previousFrame(urlMode = "push") {
    if (navigationAnimating || projectAllMode) return;

    if (focusedProjectMode && focusedProjectIndex === projectIndex) {
        if (frameIndex > 0) { return showFrame(projectIndex, frameIndex - 1, urlMode); }
        leaveFocusedProjectMode();
    }

    if (normalSequenceProjectIndex === projectIndex) {
        const position = normalSequenceFrames.indexOf(frameIndex);
        if (position > 0) {
            normalSequencePosition = position - 1;
            return showFrame(projectIndex, normalSequenceFrames[normalSequencePosition], urlMode);
        }
    }

    const previousProjectIndex = normalizeProjectIndex(projectIndex - 1);
    const sequence = buildNormalProjectSequence(previousProjectIndex);
    normalSequencePosition = sequence.length - 1;
    return showFrame(previousProjectIndex, sequence[normalSequencePosition], urlMode);
}

function scheduleNextSlide() {
    clearTimeout(slideTimer);
    if (autoplayPermanentlyDisabled || manualMode || projectAllMode) return;
    slideTimer = setTimeout(async () => { await nextFrame("replace"); scheduleNextSlide(); }, SLIDE_DURATION);
}

function startAutoSlideshow() {
    if (autoplayPermanentlyDisabled) { manualMode = true; clearTimeout(slideTimer); return; }
    manualMode = false; scheduleNextSlide();
}

function stopAutoSlideshow() {
    autoplayPermanentlyDisabled = true; manualMode = true; clearTimeout(slideTimer);
}

async function performPrimarySlideAction() {

}

function syncProjectAllBounds(force = false) {
    if (!projectAllMode && !force) return;
    const metaRect = projectMeta.getBoundingClientRect();
    const rootStyle = getComputedStyle(document.documentElement);
    const side = parseFloat(rootStyle.getPropertyValue("--side")) || 24;

    let topGap = 14; let bottomGap = 14;
    if (isPhonePortrait()) { topGap = 10; bottomGap = 10; }
    if (isPhoneLandscape()) { topGap = 4; bottomGap = 6; }

    const top = Math.ceil(0 + topGap);
    const bottom = Math.floor(metaRect.top - bottomGap);
    const horizontalInset = 0;

    projectAllView.style.left = `${side + horizontalInset}px`;
    projectAllView.style.right = `${side + horizontalInset}px`;
    projectAllView.style.top = `${top}px`;
    projectAllView.style.height = `${Math.max(80, bottom - top)}px`;
}

function calculateProjectAllLayout(count) {
    const rect = projectAllView.getBoundingClientRect();
    const gap = isPhoneLandscape() ? 4 : (isPhonePortrait() ? 5 : 7);

    const loadedRatios = Array.from(projectAllGrid.querySelectorAll("img")).slice(0, count).map(img => (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 0.8);

    let best = { columns: 1, rows: count, score: -Infinity };

    for (let columns = 1; columns <= count; columns++) {
        const rows = Math.ceil(count / columns);
        const usableWidth = rect.width - gap * (columns - 1);
        const usableHeight = rect.height - gap * (rows - 1);
        if (usableWidth <= 0 || usableHeight <= 0) continue;

        const cellWidth = usableWidth / columns;
        const cellHeight = usableHeight / rows;
        let visibleArea = 0;

        loadedRatios.forEach(ratio => {
            const displayWidth = Math.min(cellWidth, cellHeight * ratio);
            const displayHeight = displayWidth / ratio;
            visibleArea += displayWidth * displayHeight;
        });

        const emptyCells = rows * columns - count;
        const score = visibleArea * Math.pow(0.985, emptyCells);
        if (score > best.score) { best = { columns, rows, score }; }
    }
    return best;
}

function layoutProjectAllGrid(force = false) {
    if (!projectAllMode && !force) return;
    syncProjectAllBounds(force);
    const layout = calculateProjectAllLayout(currentProject().images.length);
    projectAllGrid.style.gridTemplateColumns = `repeat(${layout.columns}, minmax(0, 1fr))`;
    projectAllGrid.style.gridTemplateRows = `repeat(${layout.rows}, minmax(0, 1fr))`;
}

function buildProjectAllGrid() {
    const project = currentProject();

        img.alt = "";
        img.loading = "eager";
        img.decoding = "async";
        img.fetchPriority = index < 4 ? "high" : "auto";
        button.appendChild(img);
        button.addEventListener("click", async event => { event.stopPropagation(); await exitProjectAllToFrame(index); });
        projectAllGrid.appendChild(button);
    });
}

function prepareProjectAllGrid() {

function isSlideViewAllControlElement(node) {

function setProjectAllNavigationCopy() {

let enterProjectAll = async function() {
    if (projectAllMode || projectViewAnimating) return;
    projectViewAnimating = true;

    stopAutoSlideshow();
    prepareProjectAllGrid();
    const project = currentProject();
    viewAllButton.dataset.rawText = viewAllButton.textContent;
    projectCounter.dataset.rawText = projectCounter.textContent;

    const targetButton = (window.matchMedia("(hover: hover)").matches && viewButtonHovered) ? "CLOSE" : "close";

    await Promise.all([
        animateCase(projectTitle, project.title, true),

        morphSequential(projectCounter, getAllCounterText(project.images.length), STATE_MORPH_DURATION),
        morphSequential(viewAllButton, targetButton, STATE_MORPH_DURATION)
    ]);

    body.classList.remove("project-all-preparing");
    body.classList.add("project-all-mode");

};

async function leaveProjectAll({ selectedIndex = null, resume = true } = {}) {
    if (!projectAllMode || projectViewAnimating) return;
    projectViewAnimating = true;
    const project = currentProject();

    if (selectedIndex !== null) {
        const loadedImage = await preloadImage(project.images[selectedIndex]);
        frameIndex = selectedIndex;
        markFrameSeen(projectIndex, selectedIndex);
        enterFocusedProjectMode(projectIndex);
        syncProjectUrl("push");
        renderImage(loadedImage);
    }

    viewAllButton.dataset.rawText = viewAllButton.textContent;
    projectCounter.dataset.rawText = projectCounter.textContent;
    const slideViewVerb = getViewVerbText(project.images.length);
    const targetButton = (window.matchMedia("(hover: hover)").matches && viewButtonHovered) ? slideViewVerb.toUpperCase() : slideViewVerb;

    await Promise.all([
        animateCase(projectTitle, project.title, false),
        animateCase(projectDate, project.date || "", false),
        morphSequential(projectCounter, getProjectPhotoCountText(project.images.length), STATE_MORPH_DURATION),
        morphSequential(viewAllButton, targetButton, STATE_MORPH_DURATION)
    ]);

    projectAllMode = false;
    body.classList.remove("project-all-mode");
    projectAllGrid.innerHTML = "";

    if (isPhoneLandscape()) updateLandscapeGeometry();
    syncMetadataAfterRender();
    preloadAhead();

    manualMode = true;
    clearTimeout(slideTimer);
    projectViewAnimating = false;
}

async function exitProjectAll() {

}

async function exitProjectAllToFrame(selectedIndex) {

}

}

});

if (window.visualViewport) { window.visualViewport.addEventListener("resize", handleGeometryChange); }

window.addEventListener("popstate", async () => {
    if (!projects.length) return;
    const deepLink = getDeepLinkRequest();
    const requestedProjectIndex = findProjectIndexById(deepLink.projectId);
    const targetProjectIndex = requestedProjectIndex >= 0 ? requestedProjectIndex : 0;
    const targetProject = projects[targetProjectIndex];
    let targetFrameIndex = 0;

    if (requestedProjectIndex >= 0 && deepLink.imageNumber !== null) {
        const resolved = getRuntimeFrameIndexFromOriginalNumber(targetProject, deepLink.imageNumber);
        if (resolved >= 0) { targetFrameIndex = resolved; }
    }

    if (targetProjectIndex === projectIndex && targetFrameIndex === frameIndex && !projectAllMode) return;

    clearTimeout(slideTimer);
    leaveFocusedProjectMode();
    projectAllMode = false;
    body.classList.remove("project-all-mode", "project-all-preparing");
    projectAllGrid.innerHTML = "";

    await showFrame(targetProjectIndex, targetFrameIndex, "replace");
    manualMode = true;
    clearTimeout(slideTimer);
});

async function loadProjects() {
    try {
        const response = await fetch(PROJECTS_JSON, { cache: "no-store" });
        if (!response.ok) throw new Error("projects.json could not be loaded.");
        const data = await response.json();
        
        projects = data.filter(project => project && Array.isArray(project.images) && project.images.length > 0).map(prepareProject);
        if (projects.length === 0) return;

        updateResponsiveMode();
        
        const deepLink = getDeepLinkRequest();
        const requestedProjectIndex = findProjectIndexById(deepLink.projectId);
        projectIndex = requestedProjectIndex >= 0 ? requestedProjectIndex : 0;
        const requestedProject = currentProject();
        let requestedRuntimeFrameIndex = -1;

        if (requestedProjectIndex >= 0 && deepLink.imageNumber !== null) {
            requestedRuntimeFrameIndex = getRuntimeFrameIndexFromOriginalNumber(requestedProject, deepLink.imageNumber);
        }

        frameIndex = requestedRuntimeFrameIndex >= 0 ? requestedRuntimeFrameIndex : 0;

        if (deepLink.projectId && requestedProjectIndex < 0) {
            const cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete("project"); cleanUrl.searchParams.delete("image");
            window.history.replaceState({}, "", cleanUrl);
        } else if (requestedProjectIndex >= 0 && !deepLink.viewAll) {
            syncProjectUrl("replace");
        }

        const hasValidImageDeepLink = requestedProjectIndex >= 0 && requestedRuntimeFrameIndex >= 0 && !deepLink.viewAll;

        if (hasValidImageDeepLink) {
            frameIndex = requestedRuntimeFrameIndex;
            enterFocusedProjectMode(projectIndex);
            autoplayPermanentlyDisabled = true;
            manualMode = true;
            clearTimeout(slideTimer);
        } else {
            buildNormalProjectSequence(projectIndex);
            normalSequencePosition = 0;
            frameIndex = normalSequenceFrames[0];
        }

        const firstImage = await preloadImage(currentProject().images[frameIndex]);
        renderedProjectIndex = projectIndex;

        // FLASH BUG FIX: If we are going to boot directly into View All, do NOT render the image slide.
        const requestedViewAll = deepLink.viewAll || (!isPhoneLayout() && !hasValidImageDeepLink);
        if (!requestedViewAll) {
            renderImage(firstImage);
        }

        markFrameSeen(projectIndex, frameIndex);

        const title = currentProject().title.toLowerCase();
        const date = (currentProject().date || "").toLowerCase();
        renderBaseTypography(projectTitle, title); projectTitle.dataset.rawText = title;
        renderBaseTypography(projectDate, date); projectDate.dataset.rawText = date;
        renderBaseTypography(projectCounter, getProjectPhotoCountText(currentProject().images.length)); projectCounter.dataset.rawText = projectCounter.textContent;
        viewAllButton.textContent = "view all"; viewAllButton.dataset.rawText = "view all";

        preloadAhead();
        
        if ("requestIdleCallback" in window) {
            requestIdleCallback(() => { projects.slice(0, isPhoneLayout() ? 2 : 3).forEach(p => preloadImage(p.cover).catch(() => {})); }, { timeout: 1500 });
        } else {
            setTimeout(() => { projects.slice(0, isPhoneLayout() ? 2 : 3).forEach(p => preloadImage(p.cover).catch(() => {})); }, 500);
        }

        if (isPhoneLandscape()) { requestAnimationFrame(updateLandscapeGeometry); }
        syncMetadataAfterRender();

        if (hasValidImageDeepLink) { clearTimeout(slideTimer); manualMode = true; } 
        else { startAutoSlideshow(); }

    } catch (error) { console.error(error); }
}

async function switchProjectAll(direction) {
    if (!projectAllMode || projectAllSwitching || projectViewAnimating) return;
    projectAllSwitching = true;
    stopAutoSlideshow();

    const targetIndex = normalizeProjectIndex(projectIndex + direction);
    const targetProject = projects[targetIndex];

    projectIndex = targetIndex; frameIndex = 0; renderedProjectIndex = targetIndex;
    leaveFocusedProjectMode();
    syncProjectUrl("push");

    projectAllGrid.innerHTML = "";
    buildProjectAllGrid();
    syncProjectAllBounds(true);
    layoutProjectAllGrid(true);

    await Promise.all([
        morphSequential(projectTitle, targetProject.title.toUpperCase(), TEXT_MORPH_DURATION),
        morphSequential(projectDate, (targetProject.date || "").toUpperCase(), TEXT_MORPH_DURATION)
    ]);

    setProjectAllNavigationCopy();
    preloadAhead();
    projectAllSwitching = false;
}

async function animateProjectClientState(toAlternateState) {
    const project = currentProject();
    await Promise.all([
        animateCase(projectTitle, project.title, toAlternateState),
        animateCase(projectDate, project.date || "", toAlternateState)
    ]);
}

projectTitle.addEventListener("mouseenter", async () => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches || projectViewAnimating) return;
    projectTitleHovering = true; await animateProjectClientState(!projectAllMode);
});

projectTitle.addEventListener("mouseleave", async () => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches || projectViewAnimating) return;
    projectTitleHovering = false; await animateProjectClientState(projectAllMode);
});

projectTitle.addEventListener("click", async event => {
    event.preventDefault(); event.stopPropagation();
    if (projectViewAnimating || interfaceAnimating || navigationAnimating || projectAllSwitching) return;

    if (projectAllMode) {
        await animateProjectClientState(false);
        await exitProjectAll();
    } else {
        stopAutoSlideshow();
        await animateProjectClientState(true);
        await enterProjectAll();
    }
}, true);

projectCounter.addEventListener("mouseenter", async event => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    if (projectAllMode) { await animateCase(projectCounter, "next project", true); return; }
    if (isSlideViewAllControlElement(event.relatedTarget)) return;
    await animateSlideViewAllControl(true);
});

projectCounter.addEventListener("mouseleave", async event => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    if (projectAllMode) { await animateCase(projectCounter, "next project", false); return; }
    if (isSlideViewAllControlElement(event.relatedTarget)) return;
    await animateSlideViewAllControl(false);
});

projectCounter.addEventListener("click", async event => {
    event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation();
    if (projectViewAnimating || interfaceAnimating || navigationAnimating || projectAllSwitching) return;
    if (projectAllMode) { await animateCase(projectCounter, "next project", true); await switchProjectAll(1); return; }
    stopAutoSlideshow(); await animateSlideViewAllControl(true); await enterProjectAll();
}, true);

async function activateProjectAllDirection(direction) {
    if (!projectAllMode || projectAllSwitching || projectViewAnimating) return;
    const element = direction >= 0 ? projectCounter : viewAllButton;
    const text = direction >= 0 ? "next project" : "previous project";
    await animateCase(element, text, true);
    await new Promise(resolve => setTimeout(resolve, MOBILE_NAV_HOLD));
    await switchProjectAll(direction >= 0 ? 1 : -1);
}

document.addEventListener("keydown", async event => {
    stopProjectAutoplayFromInteraction();
    if (projectAllMode && !document.body.classList.contains('landing-aybak-active')) {
        if (event.key === "ArrowRight") { event.preventDefault(); event.stopImmediatePropagation(); await switchProjectAll(1); } 
        else if (event.key === "ArrowLeft") { event.preventDefault(); event.stopImmediatePropagation(); await switchProjectAll(-1); }
    }
}, true);

document.addEventListener("touchstart", event => {
    if (!projectAllMode || document.body.classList.contains('landing-aybak-active') || !event.changedTouches.length) return;
    projectAllTouchX = event.changedTouches[0].clientX;
    projectAllTouchY = event.changedTouches[0].clientY;
}, { passive: true, capture: true });

document.addEventListener("touchend", async event => {
    if (!projectAllMode || document.body.classList.contains('landing-aybak-active') || projectAllTouchX === null || projectAllTouchY === null || !event.changedTouches.length) return;
    const x = event.changedTouches[0].clientX; const y = event.changedTouches[0].clientY;
    const dx = x - projectAllTouchX; const dy = y - projectAllTouchY;
    projectAllTouchX = null; projectAllTouchY = null;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) >= 45) {
        suppressClickUntil = Date.now() + 500;
        await switchProjectAll(dx < 0 ? 1 : -1);
    }
}, { passive: true, capture: true });

function stopProjectAutoplayFromInteraction() {
    if (!projectAutoplayEnabled) return;
    projectAutoplayEnabled = false;
    clearTimeout(projectAutoplayTimer);
}

function scheduleProjectAutoplay() {
    clearTimeout(projectAutoplayTimer);
    if (!projectAutoplayEnabled || !projectAllMode || document.body.classList.contains('landing-aybak-active')) return;
    projectAutoplayTimer = setTimeout(async () => {
        if (!projectAutoplayEnabled || !projectAllMode || document.body.classList.contains('landing-aybak-active')) return;
        await switchProjectAll(1);
        scheduleProjectAutoplay();
    }, PROJECT_AUTOPLAY_DURATION);
}

["pointerdown", "wheel", "keydown", "touchstart"].forEach(type => {
    document.addEventListener(type, stopProjectAutoplayFromInteraction, { capture: true, passive: type === "wheel" || type === "touchstart" });
});

const AUTOPLAY_INTERACTIVE_SELECTOR = ["a", "button", ".project-all-thumb", "#project-title", "#project-date"].join(",");
document.addEventListener("pointerover", event => { if (event.target.closest?.(AUTOPLAY_INTERACTIVE_SELECTOR)) { stopProjectAutoplayFromInteraction(); } }, { capture: true, passive: true });
document.addEventListener("focusin", event => { if (event.target.closest?.(AUTOPLAY_INTERACTIVE_SELECTOR)) { stopProjectAutoplayFromInteraction(); } }, true);

async function waitForProjectAllImageDimensions() {
    const images = Array.from(projectAllGrid.querySelectorAll("img"));
    await Promise.all(images.map(img => {
        if (img.naturalWidth && img.naturalHeight) return Promise.resolve();
        return new Promise(resolve => { const done = () => resolve(); img.addEventListener("load", done, { once: true }); img.addEventListener("error", done, { once: true }); });
    }));
    layoutProjectAllGrid(true);
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

function syncSinglePhotoViewCopy() {
    if (projectAllMode || body.classList.contains("project-all-preparing") || !projects.length) return;
    const total = currentProject().images.length;
    renderBaseTypography(viewAllButton, getViewVerbText(total));
    renderBaseTypography(projectCounter, getProjectPhotoCountText(total));
    viewAllButton.dataset.rawText = viewAllButton.textContent;
    projectCounter.dataset.rawText = projectCounter.textContent;
}

viewAllButton.addEventListener("mouseenter", async event => {
    if (!window.matchMedia("(hover: hover)").matches || projectViewAnimating) return;
    viewButtonHovered = true;
    if (projectAllMode) { await animateCase(viewAllButton, "previous project", true); viewAllButton.dataset.rawText = viewAllButton.textContent; return; }
    if (isSlideViewAllControlElement(event.relatedTarget)) return;
    await animateSlideViewAllControl(true);
});

viewAllButton.addEventListener("mouseleave", async event => {
    if (!window.matchMedia("(hover: hover)").matches || projectViewAnimating) return;
    viewButtonHovered = false;
    if (projectAllMode) { await animateCase(viewAllButton, "previous project", false); viewAllButton.dataset.rawText = viewAllButton.textContent; return; }
    if (isSlideViewAllControlElement(event.relatedTarget)) return;
    await animateSlideViewAllControl(false);
});

viewAllButton.addEventListener("click", async event => {
    event.stopPropagation();
    if (projectViewAnimating) return;
    if (projectAllMode) { await switchProjectAll(-1); } 
    else { stopAutoSlideshow(); await animateSlideViewAllControl(true); await enterProjectAll(); }
});

body.addEventListener("click", async event => {
    if (Date.now() < suppressClickUntil) return;
    if (document.body.classList.contains('landing-aybak-active') || projectAllMode || interfaceAnimating || navigationAnimating || projectViewAnimating) return;
    if (event.target.closest(".clean-index-topbutton, .ci-logo-btn, #view-all-button, #project-counter, #project-title, #project-date")) return;
    if (!manualMode) { stopAutoSlideshow(); return; }
    const position = event.clientX / window.innerWidth;
    if (position < 0.25) { await previousFrame(); } else { await nextFrame(); }
});

(function openInitialProjectViewWhenReady() {
    const tryOpen = async () => {
        if (!projects.length || (!spread.firstChild && (isPhoneLayout() || getDeepLinkRequest().imageNumber !== null))) { requestAnimationFrame(tryOpen); return; }
        const requestedDeepLink = getDeepLinkRequest();
        const requestedDeepProjectIndex = findProjectIndexById(requestedDeepLink.projectId);
        const requestedDeepFrameIndex = requestedDeepProjectIndex >= 0 && requestedDeepLink.imageNumber !== null ? getRuntimeFrameIndexFromOriginalNumber(projects[requestedDeepProjectIndex], requestedDeepLink.imageNumber) : -1;
        const requestedViewAll = requestedDeepLink.viewAll || (!isPhoneLayout() && !(requestedDeepProjectIndex >= 0 && requestedDeepFrameIndex >= 0));

        if (requestedDeepProjectIndex >= 0 && requestedDeepFrameIndex >= 0 && !requestedDeepLink.viewAll) {
            document.documentElement.classList.remove("desktop-viewall-boot");
            stopProjectAutoplayFromInteraction(); stopAutoSlideshow(); return;
        }

        if (requestedViewAll) {
            if (!projectAllMode) {
                stopProjectAutoplayFromInteraction(); stopAutoSlideshow();
                await enterProjectAll();
                setProjectAllNavigationCopy();
                await waitForProjectAllImageDimensions();
            }
            document.documentElement.classList.remove("desktop-viewall-boot");
            if (!isPhoneLayout()) scheduleProjectAutoplay();
            return;
        }
        document.documentElement.classList.remove("desktop-viewall-boot");
    };
    requestAnimationFrame(tryOpen);
})();

if (isPhoneLayout()) { document.documentElement.classList.remove("desktop-viewall-boot"); }

projectAllGrid.addEventListener("load", event => {
    if ((projectAllMode || body.classList.contains("project-all-preparing")) && event.target instanceof HTMLImageElement) {
        requestAnimationFrame(() => { layoutProjectAllGrid(true); });
    }
}, true);

loadProjects();

})();
</script>

</body>
</html>
