/* =========================

@media (max-width: 600px) {

/* =========================

@media

        top: 20px;

    }

    #slideshow {
        inset: 0;

        left: 190px;

        width: calc(100vw - 214px);
        height: 100vh;
    }

    #current-photo {
        max-width: 66vw;
        max-height: 68vh;
    }

}

<body>


<!-- =========================
     LEFT INFORMATION
     ========================= -->

<div
    class="info"
    id="info"
>

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span
            class="logo-name"
            id="logo-name"
        >

        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

<a

>
    <span id="section-switch-text">film</span>
</a>


<!-- =========================
     SLIDESHOW
     ========================= -->

<div id="slideshow">

    <img
        id="current-photo"
        alt=""
    >

</div>


<script>


/* =====================================================
   R2 / PHOTOS.JSON
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";

const PHOTOS_JSON =
    "./photos.json";


/* =====================================================
   SLIDESHOW SETTINGS
   ===================================================== */

const SLIDE_DURATION =
    3000;


/*
    Instead of loading all 54 images:

    current
    previous 1
    next 3

    are kept ready.
*/

const PRELOAD_BEHIND =
    1;

const PRELOAD_AHEAD =
    3;


/* =====================================================
   GLOBAL WORD TIMING
   ===================================================== */

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS / STATE
   ===================================================== */

const slideshow =
    document.getElementById(
        "slideshow"
    );

const currentPhoto =
    document.getElementById(
        "current-photo"
    );

const info =
    document.getElementById(
        "info"
    );


let photos =
    [];

let current =
    0;

let manualMode =
    false;

let slideTimer =
    null;


/*
    Stores Image objects that are
    currently loaded or loading.

    key   = photo index
    value = Promise
*/

const preloadCache =
    new Map();


/* =====================================================
   R2 URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    /*
        encodeURIComponent is important
        for filenames containing spaces.
    */

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   NORMALIZE INDEX
   ===================================================== */

function normalizeIndex(
    index
) {

    if (
        photos.length ===
        0
    ) {

        return 0;

    }


    return (
        (
            index %
            photos.length
        ) +
        photos.length
    ) %
    photos.length;

}


/* =====================================================
   PRELOAD ONE IMAGE
   ===================================================== */

function preloadPhoto(
    index
) {

    index =
        normalizeIndex(
            index
        );


    /*
        Already loading / loaded:
        return existing promise.
    */

    if (
        preloadCache.has(
            index
        )
    ) {

        return preloadCache.get(
            index
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const image =
                    new Image();


                image.decoding =
                    "async";


                image.onload =
                    () => {

                        /*
                            decode() lets the browser
                            prepare the pixels before
                            we actually swap the src.
                        */

                        if (
                            image.decode
                        ) {

                            image
                                .decode()
                                .catch(
                                    () => {}
                                )
                                .finally(
                                    () => {

                                        resolve(
                                            image
                                        );

                                    }
                                );

                        }

                        else {

                            resolve(
                                image
                            );

                        }

                    };


                image.onerror =
                    () => {

                        /*
                            Remove failed item so a
                            later attempt can retry.
                        */

                        preloadCache.delete(
                            index
                        );


                        reject(
                            new Error(
                                `Could not load ${photos[index]}`
                            )
                        );

                    };


                image.src =
                    getPhotoUrl(
                        photos[index]
                    );

            }
        );


    preloadCache.set(
        index,
        promise
    );


    return promise;

}


/* =====================================================
   PRELOAD WINDOW
   ===================================================== */

function preloadAround(
    index
) {

    /*
        Most important:
        NEXT photo first.
    */

    for (
        let offset = 1;
        offset <= PRELOAD_AHEAD;
        offset++
    ) {

        preloadPhoto(
            index +
            offset
        ).catch(
            () => {}
        );

    }


    /*
        Keep one previous image ready
        for left-side navigation.
    */

    for (
        let offset = 1;
        offset <= PRELOAD_BEHIND;
        offset++
    ) {

        preloadPhoto(
            index -
            offset
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   CLEAN OLD PRELOADS
   ===================================================== */

function trimPreloadCache(
    centerIndex
) {

    /*
        Avoid eventually retaining all 54
        decoded images in memory.

        Keep only a small neighborhood.
    */

    const keep =
        new Set();


    for (
        let offset = -2;
        offset <= 5;
        offset++
    ) {

        keep.add(
            normalizeIndex(
                centerIndex +
                offset
            )
        );

    }


    for (
        const index of
        preloadCache.keys()
    ) {

        if (
            !keep.has(
                index
            )
        ) {

            preloadCache.delete(
                index
            );

        }

    }

}


/* =====================================================
   DISPLAY PHOTO
   ===================================================== */

async function showPhoto(
    index
) {

    if (
        photos.length ===
        0
    ) {

        return;

    }


    const targetIndex =
        normalizeIndex(
            index
        );


    try {

        /*
            Do not remove current photo while
            target is downloading.

            This avoids blank white frames.
        */

        const image =
            await preloadPhoto(
                targetIndex
            );


        current =
            targetIndex;


        currentPhoto.src =
            image.src;


        /*
            Start preparing surrounding
            images immediately.
        */

        preloadAround(
            current
        );


        /*
            Keep memory under control.
        */

        trimPreloadCache(
            current
        );


        /*
            Mobile / Instagram geometry can
            change slightly with image ratio.
        */

        updateMobileSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   LOAD PHOTOS.JSON
   ===================================================== */

async function loadPhotos() {

    try {

        const response =
            await fetch(
                PHOTOS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "photos.json could not be loaded."
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(
                data
            )
        ) {

            throw new Error(
                "photos.json must contain an array."
            );

        }


        photos =
            data.filter(
                item =>
                    typeof item ===
                    "string" &&
                    item.trim() !==
                    ""
            );


        if (
            photos.length ===
            0
        ) {

            throw new Error(
                "photos.json contains no valid photos."
            );

        }


        /*
            Highest priority:
            load photo 1 only.
        */

        current =
            0;


        await showPhoto(
            0
        );


        /*
            Start slideshow only after
            first image is actually visible.
        */

        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            "Photography could not be loaded:",
            error
        );

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextSlide() {

    await showPhoto(
        current +
        1
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousSlide() {

    await showPhoto(
        current -
        1
    );

}


/* =====================================================
   AUTO SLIDESHOW
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                /*
                    Wait for the next photo
                    if necessary.

                    The currently visible image
                    stays on screen while waiting.
                */

                await nextSlide();


                /*
                    Start a fresh 3-second dwell
                    AFTER the new image is visible.

                    This prevents slow network
                    loading from eating into the
                    display duration.
                */

                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   CLICK NAVIGATION
   ===================================================== */

document.body
    .addEventListener(
        "click",
        async event => {

            /*
                Links behave normally.
            */

            if (
                event.target.closest(
                    "a"
                )
            ) {

                return;

            }


            /*
                FIRST CLICK

                Stop autoplay only.
                Do not change photo.
            */

            if (
                !manualMode
            ) {

                stopAutoSlideshow();


                return;

            }


            /*
                AFTER FIRST CLICK

                LEFT 25%:
                previous

                RIGHT 75%:
                next
            */

            const percentage =
                event.clientX /
                window.innerWidth;


            if (
                percentage <
                0.25
            ) {

                await previousSlide();

            }

            else {

                await nextSlide();

            }

        }
    );


/* =====================================================
   MOBILE / INSTAGRAM POSITION
   ===================================================== */

function updateMobileSlideshow() {

    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    /*
        Landscape uses its own CSS.
    */

    if (
        shortLandscape
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";


        return;

    }


    /*
        Desktop uses normal full viewport.
    */

    if (
        window.innerWidth >
        600
    ) {

        slideshow.style.top =
            "";

        slideshow.style.bottom =
            "";

        slideshow.style.height =
            "";


        return;

    }


    /*
        Mobile portrait:
        measure the actual rendered info
        block so Instagram cannot place
        the image underneath the text.
    */

    const infoRect =
        info
            .getBoundingClientRect();


    const gapAfterInfo =
        24;


    const bottomGap =
        20;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    const stageHeight =
        Math.max(
            120,
            stageBottom -
            stageTop
        );


    slideshow.style.top =
        `${stageTop}px`;


    slideshow.style.height =
        `${stageHeight}px`;


    slideshow.style.bottom =
        "auto";

}


/* =====================================================
   VIEWPORT UPDATES
   ===================================================== */

window.addEventListener(
    "resize",
    updateMobileSlideshow
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            updateMobileSlideshow,
            150
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            updateMobileSlideshow
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileSlideshow
        );

}


window.addEventListener(
    "load",
    () => {

        updateMobileSlideshow();


        setTimeout(
            updateMobileSlideshow,
            100
        );


        setTimeout(
            updateMobileSlideshow,
            400
        );


        setTimeout(
            updateMobileSlideshow,
            1000
        );

    }
);


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters = [

    document.getElementById(
        "letter-a"
    ),

    document.getElementById(
        "letter-y"
    ),

    document.getElementById(
        "letter-b"
    ),

    document.getElementById(
        "letter-a2"
    ),

    document.getElementById(
        "letter-k"
    )

];


const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];


const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


/* =====================================================
   LOGO STATE
   ===================================================== */

function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state ===
        0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        letters[i]
            .textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


/* =====================================================
   MOVE LOGO
   ===================================================== */

function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


/* =====================================================
   ANIMATE LOGO
   ===================================================== */

function animateTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


/* =====================================================
   DESKTOP LOGO
   ===================================================== */

logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                0
            );

        }

    }
);


/* =====================================================
   MOBILE LOGO
   ===================================================== */

function mobileLogoCycle() {

    setTimeout(
        () => {

            animateTo(
                5
            );


            setTimeout(
                () => {

                    animateTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   SECTION SWITCH
   FILM — exact 600ms transition
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchAnimationFrame =
    null;


/* =====================================================
   RENDER SWITCH
   ===================================================== */

function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    let result =
        "";


    for (
        let i = 0;
        i < switchWord.length;
        i++
    ) {

        result +=
            i < upperCount
                ? switchWord[i]
                    .toUpperCase()
                : switchWord[i]
                    .toLowerCase();

    }


    sectionSwitchText.textContent =
        result;

}


/* =====================================================
   MORPH SWITCH
   ===================================================== */

function morphSwitchTo(
    target
) {

    if (
        switchAnimationFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchAnimationFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const startTime =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    startTime
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchAnimationFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchAnimationFrame =
                null;

        }

    }


    switchAnimationFrame =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   DESKTOP SECTION SWITCH
   ===================================================== */

sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


updateMobileSlideshow();


loadPhotos();

</script>
