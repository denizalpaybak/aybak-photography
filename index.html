<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    /*
       Same visual gap is used for:
       - title below image
       - date below image
       - rotated counter beside image
       - rotated index date beside thumbnail
    */

    --meta-gap: 6px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFORMATION
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 100;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   SECTION SWITCH
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 100;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT STAGE
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

#project-block {
    display: flex;
    flex-direction: column;
    align-items: center;

    pointer-events: none;
}


/* =====================================================
   SPREAD
   ===================================================== */

#spread {
    display: flex;

    align-items: flex-start;
    justify-content: center;

    gap: 8px;

    max-width: 70vw;

    pointer-events: none;
}


/* =====================================================
   IMAGE CELL
   ===================================================== */

.image-cell {
    position: relative;

    display: block;

    width: auto;

    pointer-events: none;
}

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: 70vw;
    max-height: 68vh;

    object-fit: contain;
}


/* =====================================================
   PAIR
   ===================================================== */

#spread.pair .image-cell {
    max-width:
        calc(
            (
                70vw -
                8px
            )
            /
            2
        );
}

#spread.pair .spread-image {
    max-width: 100%;
    max-height: 65vh;
}


/* =====================================================
   SINGLE
   ===================================================== */

#spread.single .image-cell {
    max-width: 70vw;
}

#spread.single .spread-image {
    max-width: 70vw;
    max-height: 68vh;
}


/* =====================================================
   ROTATED COUNTER

   IMPORTANT:

   .counter-anchor sits at:
   x = image right edge + gap
   y = image top edge

   The text itself starts at 0,0 inside that anchor
   and rotates CLOCKWISE by 90 degrees.

   Therefore the FIRST CHARACTER starts at the
   top-right level of the image and the word runs
   downward along the right edge.
   ===================================================== */

.counter-anchor {
    position: absolute;

    top: 0;
    left: calc(100% + var(--meta-gap));

    width: 0;
    height: 0;

    overflow: visible;

    pointer-events: none;
}

.image-counter {
    position: absolute;

    top: 0;
    left: 0;

    display: block;

    margin: 0;
    padding: 0;

    font-size: var(--font-size);
    line-height: 1;

    white-space: nowrap;

    transform-origin: 0 0;
    transform: rotate(90deg);

    pointer-events: none;
}


/* =====================================================
   PROJECT META

   title = left bottom
   date  = right bottom
   ===================================================== */

#project-meta {
    display: flex;

    justify-content: space-between;
    align-items: baseline;

    width: auto;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    white-space: nowrap;

    pointer-events: none;
}

#project-title {
    text-align: left;
}

#project-date {
    text-align: right;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 300;

    transform: translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-family: inherit;
    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

#index-button:hover,
#index-button:focus,
#index-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    background: #fff;

    cursor: default;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   INDEX SCROLLER

   There is NO visible footer.

   The bottom value simply stops scrollable content
   before it reaches the fixed index button.
   ===================================================== */

#index-scroller {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    bottom:
        calc(
            54px +
            env(safe-area-inset-bottom)
        );

    padding:
        108px
        56px
        20px;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;
}


/* =====================================================
   INDEX GRID
   ===================================================== */

#index-grid {
    display: grid;

    grid-template-columns:
        repeat(
            5,
            minmax(0, 1fr)
        );

    gap:
        36px
        34px;

    width: 100%;

    align-items: start;
    justify-items: center;
}


/* =====================================================
   PROJECT CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    display: flex;
    flex-direction: column;

    width:
        min(
            100%,
            210px
        );

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    font: inherit;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   THUMBNAIL
   ===================================================== */

.card-image-wrap {
    position: relative;

    display: block;

    width: 100%;

    aspect-ratio: 3 / 4;

    overflow: visible;

    background: #fff;
}

.card-image-crop {
    display: block;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

.project-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;
}


/* =====================================================
   INDEX ROTATED DATE

   Same anchor system as slideshow counter.

   First character begins level with thumbnail's
   top-right corner, then text runs downward.
   ===================================================== */

.card-date-anchor {
    position: absolute;

    top: 0;
    left: calc(100% + var(--meta-gap));

    width: 0;
    height: 0;

    overflow: visible;

    pointer-events: none;
}

.card-date {
    position: absolute;

    top: 0;
    left: 0;

    display: block;

    margin: 0;
    padding: 0;

    font-size: var(--font-size);
    line-height: 1;

    text-transform: lowercase;

    white-space: nowrap;

    transform-origin: 0 0;
    transform: rotate(90deg);

    pointer-events: none;
}


/* =====================================================
   CARD TITLE
   ===================================================== */

.card-title {
    display: block;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    white-space: normal;

    text-align: left;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode {
    cursor: default;
}

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET PORTRAIT
   ===================================================== */

@media
    (max-width: 1100px)
    and (orientation: portrait) {

    #index-scroller {
        padding:
            106px
            38px
            20px
            32px;
    }

    #index-grid {
        grid-template-columns:
            repeat(
                4,
                minmax(0, 1fr)
            );

        gap:
            30px
            30px;
    }

    .project-card {
        width:
            min(
                100%,
                190px

    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    :root {

        --font-size: 13px;

        --top: 20px;

        --index-bottom: 18px;

    }

    .logo-aybak {

    }


    /* -------------------------

       ------------------------- */

        inset: auto;

        left: 0;

    }

       Mobile portrait = one image.
    */

        gap: 0;

    }

    #spread.pair {
        display: block;
    }

    #spread.pair
    .image-cell:nth-child(2) {
        display: none;
    }

    #spread.pair .image-cell,
    #spread.single .image-cell {
        max-width: 78vw;
    }

    #spread.pair .spread-image,
    #spread.single .spread-image {
        max-width: 78vw;

        max-height:
            calc(
                100% -
                84px
            );
    }


    /* -------------------------
       MOBILE INDEX

       No footer.
       No bar.
       No visible container.

       We simply reserve enough invisible space
       between the last row and the fixed index button.
       ------------------------- */

    #index-scroller {
        bottom:
            calc(
                48px +
                env(safe-area-inset-bottom)
            );

        padding:
            112px
            30px
            18px
            20px;
    }

    #index-grid {
        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap:
            34px
            28px;

        width: 100%;
    }

    .project-card {
        width: 100%;
    }

}


/* =====================================================
   LANDSCAPE
   ===================================================== */

@media

    }

        bottom:
            calc(

                env(safe-area-inset-bottom)
            );

        padding:
            76px
            32px

            205px;
    }


    #index-grid {
        grid-template-columns:

    }

}


/* =====================================================
   VERY SHORT LANDSCAPE
   ===================================================== */

@media
    (orientation: landscape)

<script>


/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";


const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;


const COUNTER_ANIMATION_DURATION =
    220;


/*
   Same full-word duration system used
   for the other morphing words.
*/

const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   ELEMENTS
   ===================================================== */

const body =
    document.body;


const info =
    document.getElementById(
        "info"
    );


const projectStage =
    document.getElementById(
        "project-stage"
    );


const spread =
    document.getElementById(
        "spread"
    );


const projectMeta =
    document.getElementById(
        "project-meta"
    );


const projectTitle =
    document.getElementById(
        "project-title"
    );


const projectDate =
    document.getElementById(
        "project-date"
    );


const indexButton =
    document.getElementById(
        "index-button"
    );


const indexView =
    document.getElementById(
        "index-view"
    );


const indexGrid =
    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];


let projectIndex =
    0;


let spreadStart =
    0;


let spreadEnd =
    0;


let manualMode =
    false;


let indexMode =
    false;


let slideTimer =
    null;


let interfaceAnimating =
    false;


/*
   Was autoplay active before INDEX opened?
*/

let autoplayBeforeIndex =
    false;


/* =====================================================
   TOUCH
   ===================================================== */

let touchStartX =
    null;


let touchStartY =
    null;


let suppressClickUntil =
    0;


/* =====================================================
   CACHE
   ===================================================== */

const imageCache =
    new Map();


const spreadCache =
    new Map();


/* =====================================================
   URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   IMAGE PRELOAD
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            {

                                img,

                                portrait:
                                    img.naturalHeight >
                                    img.naturalWidth

                            }
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   PROJECT HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   PAIR MODE
   ===================================================== */

function shouldUsePairLayout() {

    if (
        window.innerWidth <= 600 &&
        window.innerHeight >
        window.innerWidth
    ) {

        return false;

    }


    return true;

}


/* =====================================================
   GET SPREAD
   ===================================================== */

async function getForwardSpread(
    targetProjectIndex,
    startIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const first =
        await preloadImage(
            project.images[
                startIndex
            ]
        );


    if (
        !shouldUsePairLayout()
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [first]

        };

    }


    /*
       Landscape = single.
    */

    if (
        !first.portrait
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [first]

        };

    }


    if (
        startIndex >=
        project.images.length - 1
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [first]

        };

    }


    const second =
        await preloadImage(
            project.images[
                startIndex + 1
            ]
        );


    /*
       Portrait + portrait = pair.
    */

    if (
        second.portrait
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex + 1,

            images:
                [
                    first,
                    second
                ]

        };

    }


    return {

        start:
            startIndex,

        end:
            startIndex,

        images:
            [first]

    };

}


/* =====================================================
   BUILD PROJECT SPREADS
   ===================================================== */

async function buildProjectSpreads(
    targetProjectIndex
) {

    const mode =
        shouldUsePairLayout()
            ? "pair"
            : "single";


    const cacheKey =
        `${targetProjectIndex}:${mode}`;


    if (
        spreadCache.has(
            cacheKey
        )
    ) {

        return spreadCache.get(
            cacheKey
        );

    }


    const project =
        projects[
            targetProjectIndex
        ];


    const spreads =
        [];


    let index =
        0;


    while (
        index <
        project.images.length
    ) {

        const data =
            await getForwardSpread(
                targetProjectIndex,
                index
            );


        spreads.push(
            data
        );


        index =
            data.end + 1;

    }


    spreadCache.set(
        cacheKey,
        spreads
    );


    return spreads;

}


/* =====================================================
   COUNTER TEXT
   ===================================================== */

function getCounterText(
    imageIndex,
    total
) {

    return (
        `${String(
            imageIndex + 1
        ).padStart(
            2,
            "0"
        )}/${String(
            total
        ).padStart(
            2,
            "0"
        )}`
    );

}


/* =====================================================
   COUNTER OUT
   ===================================================== */

function animateCounterOut(
    element
) {

    return new Promise(
        resolve => {

            const fullText =
                element.textContent;


            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now - start
                        ) /
                        COUNTER_ANIMATION_DURATION
                    );


                const length =
                    Math.round(
                        (
                            1 - progress
                        ) *
                        fullText.length
                    );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        "";


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   COUNTER IN
   ===================================================== */

function animateCounterIn(
    element,
    fullText
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now - start
                        ) /
                        COUNTER_ANIMATION_DURATION
                    );


                const length =
                    Math.round(
                        progress *
                        fullText.length
                    );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        fullText;


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   RENDER SPREAD
   ===================================================== */

async function renderSpread(
    data
) {

    /*
       Existing counters disappear first.
    */

    const oldCounters =
        Array.from(
            spread.querySelectorAll(
                ".image-counter"
            )
        );


    if (
        oldCounters.length > 0
    ) {

        await Promise.all(
            oldCounters.map(
                counter =>
                    animateCounterOut(
                        counter
                    )
            )
        );

    }


    spread.innerHTML =
        "";


    spread.classList.remove(
        "single",
        "pair"
    );


    spread.classList.add(
        data.images.length > 1
            ? "pair"
            : "single"
    );


    const project =
        currentProject();


    data.images.forEach(
        (
            imageData,
            localIndex
        ) => {

            const imageCell =
                document.createElement(
                    "div"
                );


            imageCell.className =
                "image-cell";


            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "spread-image";


            img.src =
                imageData.img.src;


            img.alt =
                "";


            /*
               Anchor = exact top-right reference
               point outside image.
            */

            const counterAnchor =
                document.createElement(
                    "div"
                );


            counterAnchor.className =
                "counter-anchor";


            const counter =
                document.createElement(
                    "div"
                );


            counter.className =
                "image-counter";


            counter.textContent =
                "";


            counterAnchor.appendChild(
                counter
            );


            imageCell.append(
                img,
                counterAnchor
            );


            spread.appendChild(
                imageCell
            );


            const absoluteIndex =
                data.start +
                localIndex;


            const counterText =
                getCounterText(
                    absoluteIndex,
                    project.images.length
                );


            animateCounterIn(
                counter,
                counterText
            );

        }
    );

}

/* =====================================================
   WIDTH SYNC
   ===================================================== */

function syncProjectWidths() {

    if (
        indexMode
    ) {

        return;

    }


    const width =
        spread
            .getBoundingClientRect()
            .width;


    if (
        width > 0
    ) {

        projectMeta.style.width =
            `${width}px`;

    }

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            spreadEnd +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex + 1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[0]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW SPREAD
   ===================================================== */

async function showSpread(
    targetProjectIndex,
    targetStartIndex
) {

    const normalized =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalized
        ];


    const safeStart =
        Math.max(
            0,
            Math.min(
                targetStartIndex,
                project.images.length - 1
            )
        );


    try {

        const data =
            await getForwardSpread(
                normalized,
                safeStart
            );


        projectIndex =
            normalized;


        spreadStart =
            data.start;


        spreadEnd =
            data.end;


        await renderSpread(
            data
        );


        updateMetadata();


        preloadAhead();


        requestAnimationFrame(
            syncProjectWidths
        );


        buildProjectSpreads(
            projectIndex
        ).catch(
            () => {}
        );


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        return false;

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextSpread() {

    const project =
        currentProject();


    if (
        spreadEnd <
        project.images.length - 1
    ) {

        return showSpread(
            projectIndex,
            spreadEnd + 1
        );

    }


    /*
       End of project:
       continue directly into next work.
    */

    return showSpread(
        projectIndex + 1,
        0
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousSpread() {

    if (
        spreadStart <= 0
    ) {

        /*
           Beginning of project:
           go to final spread of previous work.
        */

        const previousProjectIndex =
            normalizeProjectIndex(
                projectIndex - 1
            );


        const previousSpreads =
            await buildProjectSpreads(
                previousProjectIndex
            );


        if (
            previousSpreads.length === 0
        ) {

            return false;

        }


        const last =
            previousSpreads[
                previousSpreads.length - 1
            ];


        return showSpread(
            previousProjectIndex,
            last.start
        );

    }


    const spreads =
        await buildProjectSpreads(
            projectIndex
        );


    let position =
        0;


    for (
        let i = 0;
        i < spreads.length;
        i++
    ) {

        if (
            spreads[i].start ===
            spreadStart
        ) {

            position =
                i;


            break;

        }

    }


    if (
        position > 0
    ) {

        return showSpread(
            projectIndex,
            spreads[
                position - 1
            ].start
        );

    }


    return false;

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextSpread();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,
                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate || "";


                const dateB =
                    b.project.sortDate || "";


                if (
                    !dateA &&
                    !dateB
                ) {

                    return (
                        a.originalIndex -
                        b.originalIndex
                    );

                }


                if (
                    !dateA
                ) {

                    return 1;

                }


                if (
                    !dateB
                ) {

                    return -1;

                }


                if (
                    dateA > dateB
                ) {

                    return -1;

                }


                if (
                    dateA < dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}

/* =====================================================
   GENERIC WORD MORPH
   ===================================================== */

function renderWordCase(
    word,
    upperCount
) {

    let result =
        "";


    for (
        let i = 0;
        i < word.length;
        i++
    ) {

        result +=
            i < upperCount
                ? word[i].toUpperCase()
                : word[i];

    }


    return result;

}


/* =====================================================
   INDEX WORD MORPH
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(
    upperCount
) {

    indexWordState =
        upperCount;


    indexButton.textContent =
        renderWordCase(
            indexWord,
            upperCount
        );

}


function morphIndexTo(
    target
) {

    if (
        indexWordFrame !== null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance === 0
    ) {

        return Promise.resolve();

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            indexWord.length
        );


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now - start
                        ) /
                        duration
                    );


                const value =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    value
                );


                if (
                    progress < 1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    /*
       Remember whether autoplay was running.
    */

    autoplayBeforeIndex =
        !manualMode;


    clearTimeout(
        slideTimer
    );


    /*
       Open index immediately.
       No capitalization delay.
    */

    indexMode =
        true;


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    /*
       MOBILE:
       tap controls capitalization.
    */

    if (
        window.innerWidth <= 600
    ) {

        await morphIndexTo(
            indexWord.length
        );

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   RETURN FROM INDEX

   Returns to exact same:
   - project
   - spread
   - autoplay/manual state
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    /*
       Hide index immediately.
    */

    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    /*
       MOBILE:
       INDEX -> index on tap back.
    */

    if (
        window.innerWidth <= 600
    ) {

        await morphIndexTo(
            0
        );

    }


    updateMobileStage();


    syncProjectWidths();


    /*
       Restore previous playback state.
    */

    if (
        autoplayBeforeIndex
    ) {

        manualMode =
            false;


        scheduleNextSlide();

    }

    else {

        manualMode =
            true;


        clearTimeout(
            slideTimer
        );

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   EXIT INDEX TO SELECTED PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    /*
       On mobile reverse capitalization.
    */

    const mobileMorph =
        window.innerWidth <= 600
            ? morphIndexTo(0)
            : Promise.resolve();


    /*
       Selected project starts at frame 1.
    */

    await showSpread(
        targetProjectIndex,
        0
    );


    await mobileMorph;


    updateMobileStage();


    syncProjectWidths();


    /*
       Selecting a thumbnail resumes autoplay.
    */

    manualMode =
        false;


    scheduleNextSlide();


    interfaceAnimating =
        false;

}

indexButton.addEventListener(

        event.stopPropagation();


        if (
            interfaceAnimating
        ) {

            return;

        if (

        ) {

        }

);


/* =====================================================
   GENERAL CLICK

   First click:
   stop autoplay.

   Later:
   left 25% = previous
   right 75% = next
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            indexMode ||
            interfaceAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #index-button"
            )
        ) {

            return;

        }


        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        if (
            position < 0.25
        ) {

            await previousSpread();

        }

        else {

            await nextSpread();

        }

    }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode
        ) {

            if (
                event.key === "Escape"
            ) {

                event.preventDefault();


                await returnFromIndex();

            }


            return;

        }


        if (
            interfaceAnimating
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousSpread();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextSpread();

        }

    }
);


/* =====================================================
   TOUCH START
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


/* =====================================================
   TOUCH END
   ===================================================== */

document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            interfaceAnimating ||
            touchStartX === null ||
            touchStartY === null
        ) {

            return;

        }


        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(deltaX) <=
            Math.abs(deltaY)
        ) {

            return;

        }


        if (
            Math.abs(deltaX) < 45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() + 500;


        stopAutoSlideshow();


        if (
            deltaX < 0
        ) {

            await nextSpread();

        }

        else {

            await previousSpread();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   MOBILE STAGE
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    if (
        window.innerWidth > 600
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const gapAfterInfo =
        30;


    /*
       Enough room for project metadata
       and fixed index link.
    */

    const bottomGap =
        72;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            120,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";

}

function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !== null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}

/* =====================================================

function morphSwitchTo(

    ) {

    const distance =

        (

        );


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now - start
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress < 1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   FILM DESKTOP HOVER
   ===================================================== */

sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth > 600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth > 600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   RESPONSIVE REFRESH
   ===================================================== */

async function refreshResponsiveSpread() {

    if (
        projects.length === 0 ||
        indexMode
    ) {

        return;

    }


    spreadCache.clear();


    await showSpread(
        projectIndex,
        spreadStart
    );

}


/* =====================================================
   RESIZE
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        updateMobileStage();


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                async () => {

                    await refreshResponsiveSpread();


                    syncProjectWidths();

                },
                150
            );

    }
);


/* =====================================================
   ORIENTATION
   ===================================================== */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            async () => {

                updateMobileStage();


                await refreshResponsiveSpread();


                syncProjectWidths();

            },
            250
        );

    }
);


/* =====================================================
   VISUAL VIEWPORT
   ===================================================== */

if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            updateMobileStage
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileStage
        );

}


/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length > 0
            );


        if (
            projects.length === 0
        ) {

            return;

        }


        buildIndex();


        await showSpread(
            0,
            0
        );


        /*
           Preload index covers.
        */

        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        updateMobileStage();


        syncProjectWidths();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexWord(
    0
);


loadProjects();

</script>
