const CI_MORPH_STATES = new WeakMap();
function ciLetters(text) { const out=[]; for(let i=0;i<text.length;i++) { const c=text[i]; if(c.toLowerCase() !== c.toUpperCase()) out.push(i); } return out; }
function ciInitCharSpans(el, rawText) {
    const text=String(rawText).toLowerCase(); const frag=document.createDocumentFragment();
    for(const ch of text) { const s=document.createElement("span"); s.className="clean-index-char"; s.textContent=ch; frag.appendChild(s); }
    el.replaceChildren(frag); el.__rawText=text;
    CI_MORPH_STATES.set(el, {state:0,target:0,frame:null,count:ciLetters(text).length});
}
function ciRenderMorph(el, state) {
    const st=CI_MORPH_STATES.get(el); if(!st) return;
    const text=el.__rawText, pos=ciLetters(text), active=new Set(pos.slice(0,state));
    Array.from(el.children).forEach((span,i)=>{ const c=text[i]; span.textContent=active.has(i) ? c.toUpperCase() : c.toLowerCase(); }); st.state=state;
}
function ciMorphElement(el, toUpper, duration=400) {
    const st=CI_MORPH_STATES.get(el); if(!st) return Promise.resolve();
    if(st.frame!==null) cancelAnimationFrame(st.frame);
    const target=toUpper ? st.count : 0, startState=st.state;
    if(startState===target) { ciRenderMorph(el,target); return Promise.resolve(); }
    const start=performance.now();
    return new Promise(resolve=>{
        const frame=now=>{
            const p=Math.min(1,(now-start)/duration); const eased=p < .5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;

        }; st.target=target; st.frame=requestAnimationFrame(frame);
    });
}

function renderInteractiveTypography(element, text, activePositions = new Set()) {
    const fragment = document.createDocumentFragment();
    Array.from(String(text)).forEach((character, index) => {
        const span = document.createElement("span");
        span.textContent = character;
        const isDigit = /[0-9]/.test(character);
        const isActiveDigit = isDigit && activePositions.has(index);
        if (isActiveDigit) { span.style.letterSpacing = "var(--active-number-tracking)"; }
        fragment.appendChild(span);
    });
    element.replaceChildren(fragment);
}

function renderBaseTypography(element, text) { renderInteractiveTypography(element, text, new Set()); }

function getMorphPositions(text) {
    return Array.from(String(text)).map((character, index) => {
        const isLetter = character.toLowerCase() !== character.toUpperCase();
        const isDigit = /[0-9]/.test(character);
        return (isLetter || isDigit) ? index : -1;
    }).filter(index => index >= 0);
}

function renderCaseFromActivePositions(baseText, activePositions) {
    return String(baseText).split("").map((character, index) => {
        const isLetter = character.toLowerCase() !== character.toUpperCase();
        return (isLetter && activePositions.has(index)) ? character.toUpperCase() : character.toLowerCase();
    }).join("");
}

function morphSequential(element, nextText, duration = TEXT_MORPH_DURATION) {
    const oldText = element.dataset.rawText !== undefined ? element.dataset.rawText : element.textContent;
    if (oldText === nextText) {
        renderInteractiveTypography(element, nextText, new Set());
        element.dataset.rawText = nextText;
        return Promise.resolve();
    }

    const length = Math.max(oldText.length, nextText.length);
    const from = oldText.padEnd(length, " ").split("");
    const to = nextText.padEnd(length, " ").split("");
    const changedPositions = [];

    for (let i = 0; i < length; i++) { if (from[i] !== to[i]) { changedPositions.push(i); } }

    const originalWidth = element.getBoundingClientRect().width;
    if (originalWidth > 0) { element.style.minWidth = `${originalWidth}px`; }
    const start = performance.now();

    return new Promise(resolve => {
        function frame(now) {
            const progress = Math.min(1, (now - start) / duration);
            const completed = Math.floor(progress * (changedPositions.length + 1));
            const current = from.slice();

            for (let i = 0; i < completed; i++) {
                const position = changedPositions[i];
                if (position === undefined) continue;
                current[position] = to[position];
            }

            renderInteractiveTypography(element, current.join("").trimEnd(), new Set());

            if (progress < 1) { requestAnimationFrame(frame); }
            else {
                renderInteractiveTypography(element, nextText, new Set());
                element.dataset.rawText = nextText;
                element.style.minWidth = "";
                resolve();
            }
        }
        requestAnimationFrame(frame);
    });
}

function getLetterPositions(text) {
    const result = [];
    for (let i = 0; i < text.length; i++) {
        const character = text[i];
        if (character.toLowerCase() !== character.toUpperCase()) { result.push(i); }
    }
    return result;
}

function animateCase(element, baseText, toUpper, duration = CASE_DURATION) {
    const base = String(baseText).toLowerCase();
    const positions = getMorphPositions(base);
    const total = positions.length;
    let currentState = 0;
    const children = Array.from(element.children);

    if (children.length === base.length) {
        for (let i = 0; i < positions.length; i++) {
            const position = positions[i];
            const character = base[position];
            const span = children[position];
            const isDigit = /[0-9]/.test(character);
            const isLetter = character.toLowerCase() !== character.toUpperCase();
            const active = isDigit ? (span && !!span.style.letterSpacing) : (isLetter && span && span.textContent === character.toUpperCase());
            if (active) { currentState++; } else { break; }
        }
    } else {
        const currentText = element.textContent;
        for (let i = 0; i < positions.length; i++) {
            const position = positions[i];
            const character = base[position];
            const isLetter = character.toLowerCase() !== character.toUpperCase();
            if (isLetter && currentText[position] === character.toUpperCase()) { currentState++; } else { break; }
        }
    }

    const target = toUpper ? total : 0;

    function renderState(state) {
        const activePositions = new Set(positions.slice(0, state));
        renderInteractiveTypography(element, renderCaseFromActivePositions(base, activePositions), activePositions);
    }

    if (currentState === target) { renderState(target); return Promise.resolve(); }

    const start = performance.now();
    return new Promise(resolve => {
        function frame(now) {
            const progress = Math.min(1, (now - start) / duration);
            const state = Math.round(currentState + (target - currentState) * progress);
            renderState(state);

            if (progress < 1) { requestAnimationFrame(frame); }
            else { renderState(target); resolve(); }
        }
        requestAnimationFrame(frame);
    });
}

function buildNormalProjectSequence(targetProjectIndex, { includeFrame = null } = {}) {
    const normalized = normalizeProjectIndex(targetProjectIndex);
    const project = projects[normalized];
    const total = project.images.length;
    let selectedFrame;

    if (Number.isInteger(includeFrame) && includeFrame >= 0 && includeFrame < total) {
        selectedFrame = includeFrame;
    } else {
        selectedFrame = Math.floor(Math.random() * total);
    }

    normalSequenceProjectIndex = normalized;
    normalSequenceFrames = [selectedFrame];
    normalSequencePosition = 0;
    return normalSequenceFrames;
}

function clearNormalSequence() {
    normalSequenceProjectIndex = null;
    normalSequenceFrames = [];
    normalSequencePosition = -1;
}

function enterFocusedProjectMode(targetProjectIndex) {
    focusedProjectMode = true;
    focusedProjectIndex = normalizeProjectIndex(targetProjectIndex);
    clearNormalSequence();
}

function leaveFocusedProjectMode() {
    focusedProjectMode = false;
    focusedProjectIndex = null;
    clearNormalSequence();
}

function preloadAhead() {
    if (projects.length === 0) return;
    const project = currentProject();
    for (let offset = 1; offset <= 4; offset++) {
        const target = frameIndex + offset;
        if (target < project.images.length) { preloadImage(project.images[target]).catch(() => {}); }
    }
    const nextProject = projects[normalizeProjectIndex(projectIndex + 1)];
    if (nextProject) { preloadImage(nextProject.images[0]).catch(() => {}); }
}

let showFrame = async function(targetProjectIndex, targetFrameIndex, urlMode = "push") {
    if (navigationAnimating) return false;
    navigationAnimating = true;

    const normalizedProject = normalizeProjectIndex(targetProjectIndex);
    const project = projects[normalizedProject];
    const normalizedFrame = Math.max(0, Math.min(targetFrameIndex, project.images.length - 1));

    try {
        const loadedImage = await preloadImage(project.images[normalizedFrame]);
        projectIndex = normalizedProject;
        frameIndex = normalizedFrame;

        markFrameSeen(normalizedProject, normalizedFrame);
        syncProjectUrl(urlMode);
        renderImage(loadedImage);

        if (isPhoneLandscape()) { updateLandscapeGeometry(); }
        syncMetadataAfterRender();
        await updateMetadata(normalizedProject, normalizedFrame);
        preloadAhead();
        
        navigationAnimating = false;
        return true;
    } catch (error) {
        navigationAnimating = false;
        return false;
    }
};

async function nextFrame(urlMode = "push") {
    if (navigationAnimating || projectAllMode) return;
    const project = currentProject();

    if (focusedProjectMode && focusedProjectIndex === projectIndex) {
        if (frameIndex < project.images.length - 1) { return showFrame(projectIndex, frameIndex + 1, urlMode); }
        leaveFocusedProjectMode();
        const nextProjectIndex = normalizeProjectIndex(projectIndex + 1);
        const sequence = buildNormalProjectSequence(nextProjectIndex);
        normalSequencePosition = 0;
        return showFrame(nextProjectIndex, sequence[0], urlMode);
    }

    if (normalSequenceProjectIndex !== projectIndex || !normalSequenceFrames.includes(frameIndex)) {
        buildNormalProjectSequence(projectIndex, { includeFrame: frameIndex });
    }

    normalSequencePosition = normalSequenceFrames.indexOf(frameIndex);

    if (normalSequencePosition >= 0 && normalSequencePosition < normalSequenceFrames.length - 1) {
        normalSequencePosition++;
        return showFrame(projectIndex, normalSequenceFrames[normalSequencePosition], urlMode);
    }

    const nextProjectIndex = normalizeProjectIndex(projectIndex + 1);
    const nextSequence = buildNormalProjectSequence(nextProjectIndex);
    normalSequencePosition = 0;
    return showFrame(nextProjectIndex, nextSequence[0], urlMode);
}

async function previousFrame(urlMode = "push") {
    if (navigationAnimating || projectAllMode) return;

    if (focusedProjectMode && focusedProjectIndex === projectIndex) {
        if (frameIndex > 0) { return showFrame(projectIndex, frameIndex - 1, urlMode); }
        leaveFocusedProjectMode();
    }

    if (normalSequenceProjectIndex === projectIndex) {
        const position = normalSequenceFrames.indexOf(frameIndex);
        if (position > 0) {
            normalSequencePosition = position - 1;
            return showFrame(projectIndex, normalSequenceFrames[normalSequencePosition], urlMode);
        }
    }

    const previousProjectIndex = normalizeProjectIndex(projectIndex - 1);
    const sequence = buildNormalProjectSequence(previousProjectIndex);
    normalSequencePosition = sequence.length - 1;
    return showFrame(previousProjectIndex, sequence[normalSequencePosition], urlMode);
}

function scheduleNextSlide() {
    clearTimeout(slideTimer);
    if (autoplayPermanentlyDisabled || manualMode || indexMode || projectAllMode) return;
    slideTimer = setTimeout(async () => { await nextFrame("replace"); scheduleNextSlide(); }, SLIDE_DURATION);
}

function startAutoSlideshow() {
    if (autoplayPermanentlyDisabled) { manualMode = true; clearTimeout(slideTimer); return; }
    manualMode = false; scheduleNextSlide();
}

function stopAutoSlideshow() {
    autoplayPermanentlyDisabled = true; manualMode = true; clearTimeout(slideTimer);
}

async function performPrimarySlideAction() {
    if (indexMode || projectAllMode || interfaceAnimating || navigationAnimating || projectViewAnimating) return;
    if (!manualMode) { stopAutoSlideshow(); return; }
    await nextFrame();
}

function syncProjectAllBounds(force = false) {
    if (!projectAllMode && !force) return;
    const metaRect = projectMeta.getBoundingClientRect();
    const rootStyle = getComputedStyle(document.documentElement);
    const side = parseFloat(rootStyle.getPropertyValue("--side")) || 24;

    let topGap = 14; let bottomGap = 14;
    if (isPhonePortrait()) { topGap = 10; bottomGap = 10; }
    if (isPhoneLandscape()) { topGap = 4; bottomGap = 6; }

    const top = Math.ceil(0 + topGap);
    const bottom = Math.floor(metaRect.top - bottomGap);
    const horizontalInset = 0;

    projectAllView.style.left = `${side + horizontalInset}px`;
    projectAllView.style.right = `${side + horizontalInset}px`;
    projectAllView.style.top = `${top}px`;
    projectAllView.style.height = `${Math.max(80, bottom - top)}px`;
}

function calculateProjectAllLayout(count) {
    const rect = projectAllView.getBoundingClientRect();
    const gap = isPhoneLandscape() ? 4 : (isPhonePortrait() ? 5 : 7);

    const loadedRatios = Array.from(projectAllGrid.querySelectorAll("img")).slice(0, count).map(img => (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 0.8);

    let best = { columns: 1, rows: count, score: -Infinity };

    for (let columns = 1; columns <= count; columns++) {
        const rows = Math.ceil(count / columns);
        const usableWidth = rect.width - gap * (columns - 1);
        const usableHeight = rect.height - gap * (rows - 1);
        if (usableWidth <= 0 || usableHeight <= 0) continue;

        const cellWidth = usableWidth / columns;
        const cellHeight = usableHeight / rows;
        let visibleArea = 0;

        loadedRatios.forEach(ratio => {
            const displayWidth = Math.min(cellWidth, cellHeight * ratio);
            const displayHeight = displayWidth / ratio;
            visibleArea += displayWidth * displayHeight;
        });

        const emptyCells = rows * columns - count;
        const score = visibleArea * Math.pow(0.985, emptyCells);
        if (score > best.score) { best = { columns, rows, score }; }
    }
    return best;
}

function layoutProjectAllGrid(force = false) {
    if (!projectAllMode && !force) return;
    syncProjectAllBounds(force);
    const layout = calculateProjectAllLayout(currentProject().images.length);
    projectAllGrid.style.gridTemplateColumns = `repeat(${layout.columns}, minmax(0, 1fr))`;
    projectAllGrid.style.gridTemplateRows = `repeat(${layout.rows}, minmax(0, 1fr))`;
}

function buildProjectAllGrid() {
    const project = currentProject();

        img.src = getPhotoThumbnailUrl(filename);
        img.alt = "";
        img.loading = "eager";
        img.decoding = "async";
        img.fetchPriority = index < 4 ? "high" : "auto";
        button.appendChild(img);
        button.addEventListener("click", async event => { event.stopPropagation(); await exitProjectAllToFrame(index); });
        projectAllGrid.appendChild(button);
    });
}

function prepareProjectAllGrid() {

let enterProjectAll = async function() {

async function leaveProjectAll({ selectedIndex = null, resume = true } = {}) {

    if (selectedIndex !== null) {

async function exitProjectAll() {

async function exitProjectAllToFrame(selectedIndex) {

async function returnProjectAllToIndex() {

function getChronologicalProjects() {
    return projects.map((project, originalIndex) => ({ project, originalIndex })).sort((a, b) => {
        const dateA = a.project.sortDate || ""; const dateB = b.project.sortDate || "";
        if (dateA > dateB) return -1;
        if (dateA < dateB) return 1;
        return (a.originalIndex - b.originalIndex);
    });
}

function createCaseController(element, baseText) {
    const base = String(baseText).toLowerCase();
    const positions = getMorphPositions(base);
    const total = positions.length;
    let state = 0; let frameId = null;

    function render() {
        const activePositions = new Set(positions.slice(0, state));
        renderInteractiveTypography(element, renderCaseFromActivePositions(base, activePositions), activePositions);
    }

    function animateTo(target) {
        if (frameId !== null) cancelAnimationFrame(frameId);
        const startState = state;
        if (startState === target) { render(); return; }
        const start = performance.now();
        function frame(now) {
            const progress = Math.min(1, (now - start) / CASE_DURATION);
            state = Math.round(startState + (target - startState) * progress);
            render();
            if (progress < 1) { frameId = requestAnimationFrame(frame); }
            else { state = target; render(); frameId = null; }
        }
        frameId = requestAnimationFrame(frame);
    }
    render();
    return { upper() { animateTo(total); }, lower() { animateTo(0); } };
}

function clampNumber(value, min, max) { return Math.min(max, Math.max(min, value)); }

function getPhotoIndexGeometry() {
    if (isPhonePortrait()) { return { mediaHeight: clampNumber(window.innerHeight * 0.31, 230, 285), maxLandscapeWidth: window.innerWidth * 0.50 }; }
    if (isPhoneLandscape()) {
        const computed = getComputedStyle(document.documentElement);
        const safeMediaHeight = parseFloat(computed.getPropertyValue("--landscape-index-image-height")) || 136;
        const safeCardWidth = parseFloat(computed.getPropertyValue("--landscape-index-card-width")) || 205;
        return { mediaHeight: safeMediaHeight, maxLandscapeWidth: Math.min(safeCardWidth, Math.max(138, safeMediaHeight * 1.05)), cardWidth: safeCardWidth };
    }
    return { mediaHeight: clampNumber(window.innerHeight * 0.395, 320, 430), maxLandscapeWidth: Math.min(window.innerWidth * 0.33, 540) };
}

function getPhotoIndexItemMetrics(ratio) {
    const geometry = getPhotoIndexGeometry();
    let displayHeight = geometry.mediaHeight;
    let displayWidth = displayHeight * ratio;
    if (displayWidth > geometry.maxLandscapeWidth) { displayWidth = geometry.maxLandscapeWidth; displayHeight = displayWidth / ratio; }
    return { mediaHeight: geometry.mediaHeight, displayWidth, displayHeight };
}

function syncPhotoIndexCardSize(img, button, wrap) {
    if (!img.naturalWidth || !img.naturalHeight) return;
    const ratio = img.naturalWidth / img.naturalHeight;
    const metrics = getPhotoIndexItemMetrics(ratio);
    const width = Math.max(1, Math.round(metrics.displayWidth));
    const height = Math.max(1, Math.round(metrics.displayHeight));
    const mediaHeight = Math.max(height, Math.round(metrics.mediaHeight));
    const geometry = getPhotoIndexGeometry();
    const cardWidth = isPhoneLandscape() ? Math.max(width, geometry.cardWidth || width) : width;

    button.style.width = `${cardWidth}px`;
    button.style.flex = `0 0 ${cardWidth}px`;
    button.style.minWidth = `${cardWidth}px`;
    button.style.maxWidth = `${cardWidth}px`;

    wrap.style.width = `${cardWidth}px`;
    wrap.style.height = `${mediaHeight}px`;
    wrap.style.flexBasis = `${mediaHeight}px`;

    img.style.width = "auto"; img.style.height = "auto";
    img.style.maxWidth = "100%"; img.style.maxHeight = "100%";
    img.style.objectFit = "contain";

    if (isPhoneLandscape()) {
        const previewOffset = Math.max(0, (cardWidth - width) / 2);
        button.style.setProperty("--landscape-preview-offset", button === indexGrid.firstElementChild ? "0px" : `${previewOffset}px`);
    } else {
        button.style.removeProperty("--landscape-preview-offset");
    }
}

function resizePhotoIndexCards() {
    document.querySelectorAll(".project-card").forEach(card => {
        const img = card.querySelector(".card-image-wrap img");
        const wrap = card.querySelector(".card-image-wrap");
        if (img && wrap && img.naturalWidth && img.naturalHeight) { syncPhotoIndexCardSize(img, card, wrap); }
    });
}

function resetIndexSelection() {
    selectedIndexProject = null;
    indexProjectRows.forEach(rowState => { rowState.titleCase.lower(); rowState.dateCase.lower(); });
    indexPreview.classList.remove("visible");
    indexPreview.setAttribute("aria-hidden", "true");
    indexProjectAction.classList.remove("visible");
    indexProjectAction.setAttribute("aria-hidden", "true");
    indexPreviewImage.removeAttribute("src");
    indexProjectCount.textContent = "";
    indexProjectCount.dataset.rawText = "";
    if (indexViewAllCase) { indexViewAllCase.lower(); }
}

function layoutTypographicIndex() {
    if (!indexGrid || !indexScroller) return;
    const total = indexProjectRows.length;
    if (total === 0) return;

    const computed = getComputedStyle(document.documentElement);
    const fontSize = parseFloat(computed.getPropertyValue("--font-size")) || 13;
    const lineHeightMultiplier = parseFloat(computed.getPropertyValue("--line-height")) || 1.15;
    const lineHeight = fontSize * lineHeightMultiplier;
    const gridComputed = getComputedStyle(indexGrid);
    const edgeGap = parseFloat(gridComputed.getPropertyValue("--index-list-edge-gap")) || lineHeight;
    const minimumGap = lineHeight;

    body.classList.remove("index-needs-scroll");
    indexProjectRows.forEach(state => { state.row.style.removeProperty("grid-column"); state.row.style.removeProperty("grid-row"); });

    if (isPhoneLayout()) {
        indexGrid.style.removeProperty("--index-row-count");
        indexGrid.style.removeProperty("--index-column-count");
        const availableHeight = Math.max(1, indexScroller.clientHeight - edgeGap * 2);
        const rowHeights = indexProjectRows.map(state => Math.max(state.row.scrollHeight, lineHeight * 2));
        const occupiedHeight = rowHeights.reduce((sum, value) => sum + value, 0);
        const gapCount = Math.max(0, total - 1);
        const idealGap = gapCount ? (availableHeight - occupiedHeight) / gapCount : 0;
        const needsScroll = gapCount > 0 && idealGap < minimumGap;
        const rowGap = gapCount ? (needsScroll ? minimumGap : Math.max(minimumGap, idealGap)) : 0;

        indexGrid.style.setProperty("--index-portrait-gap", `${rowGap}px`);
        body.classList.toggle("index-needs-scroll", needsScroll);
        requestAnimationFrame(placeIndexScrollHintInLastVisibleSlot);
        return;
    }

    const usableWidth = Math.max(1, indexScroller.clientWidth);
    const widestProjectText = Math.max(1, ...indexProjectRows.map(state => Math.max(state.titleButton.scrollWidth, state.dateButton.scrollWidth)));
    const columnGap = Math.max(22, Math.min(72, usableWidth * 0.06));
    const preferredColumnWidth = widestProjectText + Math.max(18, fontSize * 1.25);
    const maxColumnsByWidth = Math.max(1, Math.floor((usableWidth + columnGap) / (preferredColumnWidth + columnGap)));
    const minimumColumns = total > 1 && maxColumnsByWidth >= 2 ? 2 : 1;
    const columnCount = Math.max(minimumColumns, Math.min(total, maxColumnsByWidth));
    const rowCount = Math.ceil(total / columnCount);
    const itemHeight = lineHeight * 2;
    const availableHeight = Math.max(1, indexScroller.clientHeight - edgeGap * 2);
    const occupiedHeight = rowCount * itemHeight;
    const gapCount = Math.max(0, rowCount - 1);
    const idealGap = gapCount ? (availableHeight - occupiedHeight) / gapCount : 0;
    const needsScroll = gapCount > 0 && idealGap < minimumGap;
    const rowGap = gapCount ? (needsScroll ? minimumGap : Math.max(minimumGap, idealGap)) : 0;

    indexGrid.style.setProperty("--index-row-count", String(rowCount));
    indexGrid.style.setProperty("--index-column-count", String(columnCount));
    indexGrid.style.setProperty("--index-column-gap", `${columnGap}px`);
    indexGrid.style.setProperty("--index-row-gap", `${rowGap}px`);

    body.classList.toggle("index-needs-scroll", needsScroll);

    indexProjectRows.forEach((state, itemIndex) => {
        const columnIndex = Math.floor(itemIndex / rowCount);
        const localRow = itemIndex % rowCount;
        state.row.style.gridColumn = String(columnIndex + 1);
        state.row.style.gridRow = String(localRow + 1);
    });
}

function selectIndexProject(rowState) {
    if (!rowState) return;
    const previousSelection = selectedIndexProject;
    selectedIndexProject = rowState;

    indexProjectRows.forEach(state => {
        if (state === rowState) { state.titleCase.upper(); state.dateCase.upper(); }
        else { state.titleCase.lower(); state.dateCase.lower(); }
    });

    const project = rowState.project;
    const previewUrl = getPhotoThumbnailUrl(project.cover || project.images[0]);

    if (indexPreviewImage.src !== previewUrl) { indexPreviewImage.src = previewUrl; }
    indexPreview.classList.add("visible");
    indexPreview.setAttribute("aria-hidden", "false");

    const photoCount = project.images.length;
    const nextViewText = getViewVerbText(photoCount);

    if (previousSelection && previousSelection !== rowState && indexProjectViewAll.textContent) {
        morphSequential(indexProjectViewAll, nextViewText, STATE_MORPH_DURATION).catch(() => {});
    } else {
        renderBaseTypography(indexProjectViewAll, nextViewText);
        indexProjectViewAll.dataset.rawText = nextViewText;
    }

    const nextCountText = getPhotoCountText(photoCount);

    if (previousSelection && previousSelection !== rowState && indexProjectCount.textContent) {
        morphSequential(indexProjectCount, nextCountText, STATE_MORPH_DURATION).catch(() => {});
    } else {
        renderBaseTypography(indexProjectCount, nextCountText);
        indexProjectCount.dataset.rawText = nextCountText;
    }

    indexProjectAction.classList.add("visible");
    indexProjectAction.setAttribute("aria-hidden", "false");
    if (indexViewAllCase) { indexViewAllCase.lower(); }
}

function buildIndex() {
    indexGrid.innerHTML = "";
    indexProjectRows = [];
    resetIndexSelection();

    getChronologicalProjects().forEach(item => {
        const project = item.project;
        const originalIndex = item.originalIndex;
        const row = document.createElement("div");
        row.className = "index-project-row";
        const titleButton = document.createElement("button");
        titleButton.type = "button";
        titleButton.className = "index-project-title";
        const titleBase = project.title.toLowerCase();
        renderBaseTypography(titleButton, titleBase);
        const dateButton = document.createElement("button");
        dateButton.type = "button";
        dateButton.className = "index-project-date";
        const dateBase = (project.date || "").toLowerCase();
        renderBaseTypography(dateButton, dateBase);

        const rowState = {
            row, project, originalIndex, titleButton, dateButton,
            titleCase: createCaseController(titleButton, titleBase),
            dateCase: createCaseController(dateButton, dateBase)
        };
        indexProjectRows.push(rowState);

        [titleButton, dateButton].forEach(button => {
            button.addEventListener("mouseenter", () => { if (!window.matchMedia("(hover: hover)").matches) return; selectIndexProject(rowState); });
            button.addEventListener("focus", () => { if (!window.matchMedia("(hover: hover)").matches) return; selectIndexProject(rowState); });
            button.addEventListener("click", async event => {
                event.stopPropagation();
                const mobileTwoTap = isPhoneLayout();
                if (!mobileTwoTap) {
                    selectIndexProject(rowState);
                    await new Promise(resolve => requestAnimationFrame(resolve));
                    await openSelectedIndexProjectAll();
                } else if (selectedIndexProject === rowState) {
                    await openSelectedIndexProjectAll();
                } else {
                    selectIndexProject(rowState);
                }
            });
        });
        row.append(titleButton, dateButton);
        indexGrid.appendChild(row);
    });

    requestAnimationFrame(layoutTypographicIndex);
}

function saveIndexPosition() { savedIndexScrollTop = 0; }
function restoreIndexPosition() { requestAnimationFrame(() => { indexScroller.scrollTop = 0; }); }

async function openSelectedIndexProjectAll() {
    if (!indexMode || !selectedIndexProject || interfaceAnimating || projectViewAnimating) return;
    interfaceAnimating = true;
    stopAutoSlideshow();
    saveIndexPosition();

    projectAllOpenedFromIndex = true;
    indexSelectionBeforeProjectAll = selectedIndexProject;

    const targetProjectIndex = selectedIndexProject.originalIndex;
    const targetProject = projects[normalizeProjectIndex(targetProjectIndex)];

    try {
        const loadedImage = await preloadImage(targetProject.images[0]);
        projectIndex = normalizeProjectIndex(targetProjectIndex);
        frameIndex = 0;
        enterFocusedProjectMode(projectIndex);
        markFrameSeen(projectIndex, 0);
        syncProjectUrl("push");

        // FLASH BUG FIX: Slide görüntüsünün render edilmesini pas geçiyoruz, doğrudan View All'a odaklanıyoruz.
        // renderImage(loadedImage);

        syncMetadataAfterRender();
        await updateMetadata(projectIndex, 0);
        prepareProjectAllGrid();

        viewAllButton.dataset.rawText = viewAllButton.textContent;
        projectCounter.dataset.rawText = projectCounter.textContent;

        indexView.classList.remove("visible");
        indexMode = false;
        body.classList.remove("index-mode");
        projectAllMode = true;
        body.classList.remove("project-all-preparing");
        body.classList.add("project-all-mode");

        const project = currentProject();

        await Promise.all([
            animateCase(projectTitle, project.title, true),
            animateCase(projectDate, project.date || "", true),
            morphSequential(projectCounter, getAllCounterText(project.images.length), STATE_MORPH_DURATION),
            morphSequential(viewAllButton, "close", STATE_MORPH_DURATION)
        ]);

        manualMode = true;
        clearTimeout(slideTimer);
        preloadAhead();
    } catch (error) { console.warn(error); }
    interfaceAnimating = false;
}

indexPreviewImage.addEventListener("load", () => {
    if (!indexProjectAction) return;
    const phoneLayout = body.classList.contains("phone-portrait") || body.classList.contains("phone-landscape");
    if (phoneLayout) {
        requestAnimationFrame(() => {
            const rect = indexPreviewImage.getBoundingClientRect();
            indexProjectAction.style.width = `${rect.width}px`;
        });
    } else {
        indexProjectAction.style.removeProperty("width");
    }
});

indexPreviewImage.addEventListener("click", async event => {
    event.stopPropagation();
    if (!selectedIndexProject) return;
    await openSelectedIndexProjectAll();
});

indexViewAllCase = createCaseController(indexProjectViewAll, "view all");

function getSelectedIndexPhotoCountText() {
    if (!selectedIndexProject || !selectedIndexProject.project) return "";
    return getPhotoCountText(selectedIndexProject.project.images.length);
}

async function animateIndexViewAllControl(toUpper) {
    if (!selectedIndexProject) return;
    const total = selectedIndexProject.project.images.length;
    await Promise.all([
        animateCase(indexProjectViewAll, getViewVerbText(total), toUpper),
        animateCase(indexProjectCount, getSelectedIndexPhotoCountText(), toUpper)
    ]);
    indexProjectViewAll.dataset.rawText = indexProjectViewAll.textContent;
    indexProjectCount.dataset.rawText = indexProjectCount.textContent;
}

indexProjectAction.addEventListener("mouseenter", async () => {
    if (!window.matchMedia("(hover: hover)").matches || !selectedIndexProject) return;
    await animateIndexViewAllControl(true);
});

indexProjectAction.addEventListener("mouseleave", async () => {
    if (!window.matchMedia("(hover: hover)").matches) return;
    await animateIndexViewAllControl(false);
});

indexProjectAction.addEventListener("click", async event => {
    event.stopPropagation();
    if (!selectedIndexProject) return;
    await animateIndexViewAllControl(true);
    await openSelectedIndexProjectAll();
});

window.addEventListener("resize", () => {
    if (indexMode) { requestAnimationFrame(layoutTypographicIndex); }
}, { passive: true });

function clearIndexScrollHintHost() {}
function placeIndexScrollHintInLastVisibleSlot() {}
function resetIndexScrollHint() { body.classList.remove("index-scroll-hint-dismissed"); }
function dismissIndexScrollHint() {
    if (!indexMode || !body.classList.contains("index-needs-scroll")) return;
    body.classList.add("index-scroll-hint-dismissed");
}

function indexCanScrollVertically() { return (indexScroller.scrollHeight - indexScroller.clientHeight) > 2; }
function indexIsAtBottom() { return (indexScroller.scrollTop + indexScroller.clientHeight) >= (indexScroller.scrollHeight - 2); }

indexScroller.addEventListener("scroll", () => {
    if (indexMode && indexScroller.scrollTop > 1) { clearIndexScrollHintHost(); }
    if (indexMode && indexIsAtBottom()) { dismissIndexScrollHint(); }
    else if (indexMode && body.classList.contains("index-needs-scroll")) { body.classList.remove("index-scroll-hint-dismissed"); }
    if (indexMode) { savedIndexScrollTop = indexScroller.scrollTop; }
}, { passive: true });

body.addEventListener("click", async event => {
    if (Date.now() < suppressClickUntil) return;
    if (document.body.classList.contains('landing-aybak-active') || indexMode || projectAllMode || interfaceAnimating || navigationAnimating || projectViewAnimating) return;
    if (event.target.closest(".clean-index-topbutton, .ci-logo-btn, #view-all-button")) return;
    if (!manualMode) { stopAutoSlideshow(); return; }
    const position = event.clientX / window.innerWidth;
    if (position < 0.25) { await previousFrame(); } else { await nextFrame(); }
});

document.addEventListener("keydown", async event => {
    if (document.body.classList.contains('landing-aybak-active')) return;
    if (indexMode) return;
    if (projectAllMode) {
        if (event.key === "Escape") { event.preventDefault(); await exitProjectAll(); }
        return;
    }
    if (interfaceAnimating || navigationAnimating || projectViewAnimating) return;
    if (event.code === "Space") { event.preventDefault(); await performPrimarySlideAction(); return; }
    if (event.key === "ArrowLeft") { event.preventDefault(); stopAutoSlideshow(); await previousFrame(); }
    else if (event.key === "ArrowRight") { event.preventDefault(); stopAutoSlideshow(); await nextFrame(); }
});

document.addEventListener("touchstart", event => {
    if (indexMode || projectAllMode) return;
    const touch = event.changedTouches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
}, { passive: true });

document.addEventListener("touchend", async event => {
    if (indexMode || projectAllMode || interfaceAnimating || navigationAnimating || projectViewAnimating || touchStartX === null || touchStartY === null) return;
    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;
    touchStartX = null; touchStartY = null;
    if (Math.abs(deltaX) <= Math.abs(deltaY) || Math.abs(deltaX) < 45) return;
    suppressClickUntil = Date.now() + 500;
    stopAutoSlideshow();
    if (deltaX < 0) { await nextFrame(); } else { await previousFrame(); }
}, { passive: true });

let photoIndexResizeFrame = null;
window.addEventListener("resize", () => {
    if (photoIndexResizeFrame) cancelAnimationFrame(photoIndexResizeFrame);
    photoIndexResizeFrame = requestAnimationFrame(() => { resizePhotoIndexCards(); photoIndexResizeFrame = null; });
}, { passive: true });

let projectAllSwitching = false;
let projectTitleHovering = false;
let projectAllTouchX = null;
let projectAllTouchY = null;
let projectAllSlideOrigin = null;

async function switchProjectAll(direction) {
    if (!projectAllMode || projectAllSwitching || projectViewAnimating) return;
    projectAllSwitching = true;
    stopAutoSlideshow();
    const targetIndex = normalizeProjectIndex(projectIndex + direction);
    const targetProject = projects[targetIndex];
    projectIndex = targetIndex;
    frameIndex = 0;
    renderedProjectIndex = targetIndex;

    leaveFocusedProjectMode();
    syncProjectUrl("push");

    projectAllGrid.innerHTML = "";
    buildProjectAllGrid();
    syncProjectAllBounds(true);
    layoutProjectAllGrid(true);

    await Promise.all([
        morphSequential(projectTitle, targetProject.title.toUpperCase(), TEXT_MORPH_DURATION),
        morphSequential(projectDate, (targetProject.date || "").toUpperCase(), TEXT_MORPH_DURATION)
    ]);

    setProjectAllNavigationCopy();
    preloadAhead();
    projectAllSwitching = false;
}

async function animateProjectClientState(toAlternateState) {
    const project = currentProject();
    await Promise.all([
        animateCase(projectTitle, project.title, toAlternateState),
        animateCase(projectDate, project.date || "", toAlternateState)
    ]);
}

projectTitle.addEventListener("mouseenter", async () => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches || projectViewAnimating) return;
    projectTitleHovering = true;
    await animateProjectClientState(!projectAllMode);
});

projectTitle.addEventListener("mouseleave", async () => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches || projectViewAnimating) return;
    projectTitleHovering = false;
    await animateProjectClientState(projectAllMode);
});

projectTitle.addEventListener("click", async event => {
    event.preventDefault();
    event.stopPropagation();
    if (projectViewAnimating || interfaceAnimating || navigationAnimating || projectAllSwitching) return;
    if (projectAllMode) {
        await animateProjectClientState(false);
        if (projectAllOpenedFromIndex) { await returnProjectAllToIndex(); } 
        else {
            const origin = projectAllSlideOrigin;
            await exitProjectAll();
            if (origin) {
                await showFrame(origin.projectIndex, origin.frameIndex, "replace");
                projectAllSlideOrigin = null;
            }
        }
    } else {
        stopAutoSlideshow();
        await animateProjectClientState(true);
        await enterProjectAll();
    }
}, true);

projectCounter.addEventListener("mouseenter", async event => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    if (projectAllMode) { await animateCase(projectCounter, "next project", true); return; }
    if (isSlideViewAllControlElement(event.relatedTarget)) return;
    await animateSlideViewAllControl(true);
});

projectCounter.addEventListener("mouseleave", async event => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    if (projectAllMode) { await animateCase(projectCounter, "next project", false); return; }
    if (isSlideViewAllControlElement(event.relatedTarget)) return;
    await animateSlideViewAllControl(false);
});

projectCounter.addEventListener("click", async event => {
    event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation();
    if (projectViewAnimating || interfaceAnimating || navigationAnimating || projectAllSwitching) return;
    if (projectAllMode) { await animateCase(projectCounter, "next project", true); await switchProjectAll(1); return; }
    stopAutoSlideshow();
    await animateSlideViewAllControl(true);
    await enterProjectAll();
}, true);

async function activateProjectAllDirection(direction) {
    if (!projectAllMode || projectAllSwitching || projectViewAnimating) return;
    const element = direction >= 0 ? projectCounter : viewAllButton;
    const text = direction >= 0 ? "next project" : "previous project";
    await animateCase(element, text, true);
    await new Promise(resolve => setTimeout(resolve, MOBILE_NAV_HOLD));
    await switchProjectAll(direction >= 0 ? 1 : -1);
}

document.addEventListener("keydown", async event => {
    stopProjectAutoplayFromInteraction();
    if (projectAllMode && !document.body.classList.contains('landing-aybak-active')) {
        if (event.key === "ArrowRight") { event.preventDefault(); event.stopImmediatePropagation(); await switchProjectAll(1); } 
        else if (event.key === "ArrowLeft") { event.preventDefault(); event.stopImmediatePropagation(); await switchProjectAll(-1); }
    }
}, true);

document.addEventListener("touchstart", event => {
    if (!projectAllMode || document.body.classList.contains('landing-aybak-active') || !event.changedTouches.length) return;
    projectAllTouchX = event.changedTouches[0].clientX;
    projectAllTouchY = event.changedTouches[0].clientY;
}, { passive: true, capture: true });

document.addEventListener("touchend", async event => {
    if (!projectAllMode || document.body.classList.contains('landing-aybak-active') || projectAllTouchX === null || projectAllTouchY === null || !event.changedTouches.length) return;
    const x = event.changedTouches[0].clientX; const y = event.changedTouches[0].clientY;
    const dx = x - projectAllTouchX; const dy = y - projectAllTouchY;
    projectAllTouchX = null; projectAllTouchY = null;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) >= 45) {
        suppressClickUntil = Date.now() + 500;
        await switchProjectAll(dx < 0 ? 1 : -1);
    }
}, { passive: true, capture: true });

const PROJECT_AUTOPLAY_DURATION = 4000;
let projectAutoplayTimer = null;
let projectAutoplayEnabled = true;

function stopProjectAutoplayFromInteraction() {
    if (!projectAutoplayEnabled) return;
    projectAutoplayEnabled = false;
    clearTimeout(projectAutoplayTimer);
}

function scheduleProjectAutoplay() {
    clearTimeout(projectAutoplayTimer);
    if (!projectAutoplayEnabled || !projectAllMode || indexMode || document.body.classList.contains('landing-aybak-active')) return;
    projectAutoplayTimer = setTimeout(async () => {
        if (!projectAutoplayEnabled || !projectAllMode || indexMode || document.body.classList.contains('landing-aybak-active')) return;
        await switchProjectAll(1);
        scheduleProjectAutoplay();
    }, PROJECT_AUTOPLAY_DURATION);
}

["pointerdown", "wheel", "keydown", "touchstart"].forEach(type => {
    document.addEventListener(type, stopProjectAutoplayFromInteraction, { capture: true, passive: type === "wheel" || type === "touchstart" });
});

const AUTOPLAY_INTERACTIVE_SELECTOR = ["a", "button", ".project-all-thumb", ".index-project-title", ".index-project-date", "#index-preview-image", "#project-title", "#project-date"].join(",");

document.addEventListener("pointerover", event => { if (event.target.closest?.(AUTOPLAY_INTERACTIVE_SELECTOR)) { stopProjectAutoplayFromInteraction(); } }, { capture: true, passive: true });
document.addEventListener("focusin", event => { if (event.target.closest?.(AUTOPLAY_INTERACTIVE_SELECTOR)) { stopProjectAutoplayFromInteraction(); } }, true);

async function waitForProjectAllImageDimensions() {
    const images = Array.from(projectAllGrid.querySelectorAll("img"));
    await Promise.all(images.map(img => {
        if (img.naturalWidth && img.naturalHeight) return Promise.resolve();
        return new Promise(resolve => { const done = () => resolve(); img.addEventListener("load", done, { once: true }); img.addEventListener("error", done, { once: true }); });
    }));
    layoutProjectAllGrid(true);
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

function syncSinglePhotoViewCopy() {
    if (projectAllMode || body.classList.contains("project-all-preparing") || !projects.length) return;
    const total = currentProject().images.length;
    renderBaseTypography(viewAllButton, getViewVerbText(total));
    renderBaseTypography(projectCounter, getProjectPhotoCountText(total));
    viewAllButton.dataset.rawText = viewAllButton.textContent;
    projectCounter.dataset.rawText = projectCounter.textContent;
}

const syncMetadataAfterRenderV24 = syncMetadataAfterRender;
syncMetadataAfterRender = function() {
    const result = syncMetadataAfterRenderV24.apply(this, arguments);
    syncSinglePhotoViewCopy();
    return result;
};

(function openInitialProjectViewWhenReady() {
    const tryOpen = async () => {
        if (!projects.length || !spread.firstChild) { requestAnimationFrame(tryOpen); return; }
        const requestedDeepLink = getDeepLinkRequest();
        const requestedDeepProjectIndex = findProjectIndexById(requestedDeepLink.projectId);
        const requestedDeepFrameIndex = requestedDeepProjectIndex >= 0 && requestedDeepLink.imageNumber !== null ? getRuntimeFrameIndexFromOriginalNumber(projects[requestedDeepProjectIndex], requestedDeepLink.imageNumber) : -1;
        const requestedViewAll = requestedDeepProjectIndex >= 0 && requestedDeepLink.viewAll;

        if (requestedDeepProjectIndex >= 0 && requestedDeepFrameIndex >= 0 && !requestedViewAll) {
            document.documentElement.classList.remove("desktop-viewall-boot");
            stopProjectAutoplayFromInteraction();
            stopAutoSlideshow();
            return;
        }

        if (requestedViewAll) {
            if (!projectAllMode && !indexMode) {
                stopProjectAutoplayFromInteraction();
                stopAutoSlideshow();
                await enterProjectAll();
                setProjectAllNavigationCopy();
                await waitForProjectAllImageDimensions();
            }
            document.documentElement.classList.remove("desktop-viewall-boot");
            if (!isPhoneLayout()) scheduleProjectAutoplay();
            return;
        }

        if (!isPhoneLayout() && !indexMode && !projectAllMode) {
            await enterProjectAll();
            setProjectAllNavigationCopy();
            await waitForProjectAllImageDimensions();
            document.documentElement.classList.remove("desktop-viewall-boot");
            scheduleProjectAutoplay();
        } else if (isPhoneLayout()) {
            document.documentElement.classList.remove("desktop-viewall-boot");
        }
    };
    requestAnimationFrame(tryOpen);
})();

if (isPhoneLayout()) { document.documentElement.classList.remove("desktop-viewall-boot"); }

projectAllGrid.addEventListener("load", event => {
    if ((projectAllMode || body.classList.contains("project-all-preparing")) && event.target instanceof HTMLImageElement) {
        requestAnimationFrame(() => { layoutProjectAllGrid(true); });
    }
}, true);

/* =====================================================
   STARTUP & EVENT OVERRIDES
   ===================================================== */
loadProjects();
})();
</script>
</body>
</html>
