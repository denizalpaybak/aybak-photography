<!DOCTYPE html>
<html lang="en">
<head>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;

    /*
        Larger desktop image than before.
    */

    --image-width:
        min(
            54vw,
            72vh
        );

    --visual-height: 72vh;

    --meta-top-gap: 9px;

    --index-content-top: 130px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   FILM
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT STAGE
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   PROJECT BLOCK
   ===================================================== */

#project-block {
    position: relative;

    width: var(--image-width);

    height:
        calc(
            var(--visual-height) +
            52px
        );

    pointer-events: none;
}


/* =====================================================
   VISUAL ZONE
   ===================================================== */

#visual-zone {
    position: absolute;

    top: 0;
    left: 0;

    width: var(--image-width);
    height: var(--visual-height);

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   SINGLE IMAGE
   ===================================================== */

#spread {
    display: block;

    width: var(--image-width);

    pointer-events: none;
}

.image-cell {
    display: block;

    width: var(--image-width);

    pointer-events: none;
}

.spread-image {
    display: block;

    width: var(--image-width);
    height: auto;

    max-height: var(--visual-height);

    margin: 0 auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PROJECT META
   ===================================================== */

#project-meta {
    position: absolute;

    top:
        calc(
            var(--visual-height) +
            var(--meta-top-gap)
        );

    left: 0;

    width: var(--image-width);

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: none;

    pointer-events: none;
}


/* =====================================================
   META LEFT
   ===================================================== */

#project-title {
    grid-column: 1;
    grid-row: 1;

    text-align: left;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    text-align: left;

    white-space: nowrap;
}


/* =====================================================
   COUNTER
   ===================================================== */

#project-counter {
    grid-column: 2;
    grid-row: 1;

    display: flex;

    justify-content: flex-end;
    align-items: baseline;

    min-width: 82px;

    padding-left: 28px;

    text-align: right;

    white-space: nowrap;
}


/*
    Current morphs independently.
*/

#counter-current {
    display: inline-block;

    min-width: 2ch;

    text-align: right;
}


/*
    Separator and total are stable inside the same project.
*/

#counter-static {
    display: inline-block;

    white-space: pre;
}


/* =====================================================
   VIEW ALL BUTTON
   ===================================================== */

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    font-family: inherit;
    font-size: inherit;
    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CLOSE MODE

   In project-all mode close moves to upper-right,
   where the counter normally lives.
   ===================================================== */

body.project-all-mode
#view-all-button {
    grid-column: 2;
    grid-row: 1;
}


/* =====================================================
   PROJECT ALL MODE
   ===================================================== */

body.project-all-mode #spread {
    visibility: hidden;
}


/* =====================================================
   PROJECT ALL VIEW

   IMPORTANT:
   This is NOT limited to image width.

   Desktop expands from left info alignment
   to right film alignment.
   ===================================================== */

#project-all-view {
    position: fixed;

    top: var(--index-content-top);

    left: var(--side);
    right: var(--side);

    bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );

    z-index: 20;

    display: none;

    pointer-events: auto;
}

body.project-all-mode
#project-all-view {
    display: block;
}


/* =====================================================
   PROJECT ALL GRID
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    align-items: center;
    justify-items: center;

    place-content: center;

    gap: 10px;
}


/* =====================================================
   PROJECT ALL THUMB
   ===================================================== */

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform:
        translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-family: inherit;
    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;

    cursor: default;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   HORIZONTAL INDEX
   ===================================================== */

#index-scroller {
    position: absolute;

    top: var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            52px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: flex-start;

    gap: 44px;

    width: max-content;

    padding-left: var(--side);
    padding-right: var(--side);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex:
        0
        0
        210px;

    display: flex;
    flex-direction: column;

    width: 210px;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    font: inherit;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX IMAGE AREA — NO CROP
   ===================================================== */

.card-image-wrap {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 280px;

    background: transparent;

    overflow: visible;

    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;

/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    text-align: left;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    width: 100%;

    margin: 0;
    padding: 0;

    text-align: left;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode #project-stage {
    visibility: hidden;
}

   TABLET
   ===================================================== */

@media

<script>


/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";


const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;


const CURRENT_OUT_DURATION =
    130;


const CURRENT_IN_DURATION =
    170;


const TOTAL_OUT_DURATION =
    150;


const TOTAL_IN_DURATION =
    190;


const PROJECT_TEXT_OUT_DURATION =
    160;


const PROJECT_TEXT_IN_DURATION =
    210;


const VIEW_BUTTON_OUT_DURATION =

const VIEW_BUTTON_IN_DURATION =
    210;


const CASE_MORPH_DURATION =
    420;


const INDEX_TRANSITION_DURATION =
    400;


const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   INDEX MANUAL SCROLL
   ===================================================== */

const INDEX_WHEEL_MULTIPLIER =
    1;


const INDEX_KEY_STEP =
    240;


/* =====================================================
   ELEMENTS
   ===================================================== */

const body =
    document.body;


const info =
    document.getElementById(
        "info"
    );


const projectStage =
    document.getElementById(
        "project-stage"
    );


const spread =
    document.getElementById(
        "spread"
    );


const projectAllView =
    document.getElementById(
        "project-all-view"
    );


const projectAllGrid =
    document.getElementById(
        "project-all-grid"
    );


const projectTitle =
    document.getElementById(
        "project-title"
    );


const projectDate =
    document.getElementById(
        "project-date"
    );


const counterCurrent =
    document.getElementById(
        "counter-current"
    );


const counterStatic =
    document.getElementById(
        "counter-static"
    );


const viewAllButton =
    document.getElementById(
        "view-all-button"
    );


const indexButton =
    document.getElementById(
        "index-button"
    );


const indexView =
    document.getElementById(
        "index-view"
    );


const indexScroller =
    document.getElementById(
        "index-scroller"
    );


const indexGrid =
    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];


let projectIndex =
    0;


let frameIndex =
    0;


let renderedProjectIndex =
    null;


let manualMode =
    false;


let indexMode =
    false;


let projectAllMode =
    false;


let slideTimer =
    null;


let interfaceAnimating =
    false;


let navigationAnimating =
    false;


let projectViewAnimating =
    false;


let autoplayBeforeIndex =
    false;


let autoplayBeforeProjectAll =
    false;


let savedIndexScrollLeft =
    0;


/* =====================================================
   INDEX DRAG
   ===================================================== */

let indexDragging =
    false;


let indexDragStartX =
    0;


let indexDragStartScroll =
    0;


let indexDragMoved =
    false;


/* =====================================================
   TOUCH
   ===================================================== */

let touchStartX =
    null;


let touchStartY =
    null;


let suppressClickUntil =
    0;


/* =====================================================
   CACHE
   ===================================================== */

const imageCache =
    new Map();


/* =====================================================
   URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   PRELOAD
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   INDEX TOP
   ===================================================== */

function updateIndexContentTop() {

    const rect =
        info.getBoundingClientRect();


    const gap =
        window.innerWidth <= 600
            ? 30
            : 34;


    const value =
        Math.ceil(
            rect.bottom +
            gap
        );


    document
        .documentElement
        .style
        .setProperty(
            "--index-content-top",
            `${value}px`
        );

}


/* =====================================================
   COUNTER HELPERS
   ===================================================== */

function getCurrentText(
    index
) {

    return String(
        index + 1
    ).padStart(
        2,
        "0"
    );

}


function getTotalText(
    total
) {

    return String(
        total
    ).padStart(
        2,
        "0"
    );

}


/* =====================================================
   GENERIC TEXT OUT
   ===================================================== */

function animateTextOut(
    element,
    duration
) {

    return new Promise(
        resolve => {

            const fullText =
                element.textContent;


            if (
                !fullText
            ) {

                resolve();


                return;

            }


            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const length =
                    Math.round(
                        (
                            1 -
                            progress
                        ) *
                        fullText.length
                    );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        "";


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   GENERIC TEXT IN
   ===================================================== */

function animateTextIn(
    element,
    fullText,
    duration
) {

    return new Promise(
        resolve => {

            if (
                !fullText
            ) {

                element.textContent =
                    "";


                resolve();


                return;

            }


            element.textContent =
                "";


            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const length =
                    Math.round(
                        progress *
                        fullText.length
                    );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        fullText;


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   TEXT MORPH
   ===================================================== */

async function morphText(
    element,
    nextText,
    outDuration,
    inDuration
) {

    if (
        element.textContent ===
        nextText
    ) {

        return;

    }


    await animateTextOut(
        element,
        outDuration
    );


    await animateTextIn(
        element,
        nextText,
        inDuration
    );

}


/* =====================================================
   CASE MORPH

   This does NOT delete/retype the word.

   It changes capitalization progressively,
   exactly like index -> INDEX.
   ===================================================== */

function getCaseStateText(
    text,
    upperCount
) {

    let result =
        "";


    let letterIndex =
        0;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        if (
            /[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(
                char
            )
        ) {

            result +=
                letterIndex < upperCount
                    ? char.toUpperCase()
                    : char.toLowerCase();


            letterIndex++;

        }

        else {

            result +=
                char;

        }

    }


    return result;

}


/* =====================================================
   COUNT LETTERS
   ===================================================== */

function countLetters(
    text
) {

    const match =
        text.match(
            /[a-zA-ZçğıöşüÇĞİÖŞÜ]/g
        );


    return match
        ? match.length
        : 0;

}


/* =====================================================
   MORPH CASE
   ===================================================== */

function morphCase(
    element,
    originalText,
    toUpper
) {

    const totalLetters =
        countLetters(
            originalText
        );


    if (
        totalLetters === 0
    ) {

        element.textContent =
            originalText;


        return Promise.resolve();

    }


    const startState =
        toUpper
            ? 0
            : totalLetters;


    const targetState =
        toUpper
            ? totalLetters
            : 0;


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        CASE_MORPH_DURATION
                    );


                const value =
                    Math.round(
                        startState +
                        (
                            targetState -
                            startState
                        ) *
                        progress
                    );


                element.textContent =
                    getCaseStateText(
                        originalText,
                        value
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        toUpper
                            ? originalText.toUpperCase()
                            : originalText.toLowerCase();


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

/* =====================================================
   COUNTER UPDATE

   SAME PROJECT:
   only CURRENT animates.

   PROJECT CHANGE:
   current + static total both update.
   ===================================================== */

async function updateCounter(
    targetProjectIndex,
    targetFrameIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    const nextCurrent =
        getCurrentText(
            targetFrameIndex
        );


    const nextStatic =
        ` / ${getTotalText(
            project.images.length
        )}`;


    if (
        projectChanged
    ) {

        await Promise.all(
            [

                morphText(
                    counterCurrent,
                    nextCurrent,
                    CURRENT_OUT_DURATION,
                    CURRENT_IN_DURATION
                ),

                morphText(
                    counterStatic,
                    nextStatic,
                    TOTAL_OUT_DURATION,
                    TOTAL_IN_DURATION
                )

            ]
        );

    }

    else {

        await morphText(
            counterCurrent,
            nextCurrent,
            CURRENT_OUT_DURATION,
            CURRENT_IN_DURATION
        );

    }

}


/* =====================================================
   UPDATE PROJECT META
   ===================================================== */

async function updateMetadata(
    targetProjectIndex,
    targetFrameIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    const animations =
        [

            updateCounter(
                targetProjectIndex,
                targetFrameIndex
            )

        ];


    if (
        projectChanged
    ) {

        animations.push(

            morphText(
                projectTitle,
                project.title.toLowerCase(),
                PROJECT_TEXT_OUT_DURATION,
                PROJECT_TEXT_IN_DURATION
            ),

            morphText(
                projectDate,
                (
                    project.date ||
                    ""
                ).toLowerCase(),
                PROJECT_TEXT_OUT_DURATION,
                PROJECT_TEXT_IN_DURATION
            )

        );

    }


    await Promise.all(
        animations
    );


    renderedProjectIndex =
        targetProjectIndex;

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    if (
        projects.length === 0
    ) {

        return;

    }


    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            frameIndex +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex + 1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[0]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW FRAME
   ===================================================== */

async function showFrame(
    targetProjectIndex,
    targetFrameIndex
) {

    if (
        navigationAnimating
    ) {

        return false;

    }


    navigationAnimating =
        true;


    const normalizedProject =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalizedProject
        ];


    const normalizedFrame =
        Math.max(
            0,
            Math.min(
                targetFrameIndex,
                project.images.length - 1
            )
        );


    try {

        const loadedImage =
            await preloadImage(
                project.images[
                    normalizedFrame
                ]
            );


        renderImage(
            loadedImage
        );


        await updateMetadata(
            normalizedProject,
            normalizedFrame
        );


        projectIndex =
            normalizedProject;


        frameIndex =
            normalizedFrame;


        preloadAhead();


        navigationAnimating =
            false;


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        navigationAnimating =
            false;


        return false;

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    if (
        frameIndex <
        project.images.length - 1
    ) {

        return showFrame(
            projectIndex,
            frameIndex + 1
        );

    }


    return showFrame(
        projectIndex + 1,
        0
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousFrame() {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    if (
        frameIndex > 0
    ) {

        return showFrame(
            projectIndex,
            frameIndex - 1
        );

    }


    const previousProjectIndex =
        normalizeProjectIndex(
            projectIndex - 1
        );


    const previousProject =
        projects[
            previousProjectIndex
        ];


    return showFrame(
        previousProjectIndex,
        previousProject.images.length - 1
    );

}

/* =====================================================
   VIEW ALL GRID LAYOUT
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const availableWidth =
        rect.width;


    const availableHeight =
        rect.height;


    const gap =
        window.innerWidth <= 600
            ? 6
            : 10;


    let best =
        {

            columns:
                1,

            rows:
                count,

            score:
                0

        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            availableWidth -
            gap *
            (
                columns -
                1
            );


        const usableHeight =
            availableHeight -
            gap *
            (
                rows -
                1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        const score =
            Math.min(
                cellWidth,
                cellHeight
            );


        if (
            score >
            best.score
        ) {

            best =
                {

                    columns,
                    rows,
                    score

                };

        }

    }


    return best;

}

/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,
                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate || "";


                const dateB =
                    b.project.sortDate || "";


                if (
                    !dateA &&
                    !dateB
                ) {

                    return (
                        a.originalIndex -
                        b.originalIndex
                    );

                }


                if (
                    !dateA
                ) {

                    return 1;

                }


                if (
                    !dateB
                ) {

                    return -1;

                }


                if (
                    dateA >
                    dateB
                ) {

                    return -1;

                }


                if (
                    dateA <
                    dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}

) {

        i++
    ) {

        result +=
            i < upperCount
                ? word[i].toUpperCase()

    }


    return result;

}


/* =====================================================
   INDEX WORD
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(

) {

/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !== null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance === 0
    ) {

        return Promise.resolve();

    }


    const duration =
        INDEX_TRANSITION_DURATION *
        (
            distance /
            indexWord.length
        );


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const value =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    value
                );


                if (
                    progress < 1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

    saveIndexPosition();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    updateMobileStage();


    if (
        autoplayBeforeIndex
    ) {

        manualMode =
            false;


        scheduleNextSlide();

    }

    else {

        manualMode =
            true;


        clearTimeout(
            slideTimer
        );

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    await showFrame(
        targetProjectIndex,
        0
    );


    updateMobileStage();


    manualMode =
        false;


    scheduleNextSlide();


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();


        if (
            interfaceAnimating ||
            projectViewAnimating ||
            projectAllMode
        ) {

            return;

        }


        if (
            window.innerWidth > 600 &&
            indexMode &&
            indexWordState !== 0
        ) {

            return;

        }


        if (
            indexMode
        ) {

            await returnFromIndex();

        }

        else {

            await enterIndex();

        }

    }
);


/* =====================================================
   INDEX WHEEL
   ===================================================== */

indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode
        ) {

            return;

        }


        event.preventDefault();


        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=
            movement *
            INDEX_WHEEL_MULTIPLIER;


        saveIndexPosition();

    },
    {
        passive: false
    }
);


/* =====================================================
   INDEX KEYBOARD
   ===================================================== */

indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            !indexMode
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {

                    left:
                        INDEX_KEY_STEP,

                    behavior:
                        "smooth"

                }
            );

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {

                    left:
                        -INDEX_KEY_STEP,

                    behavior:
                        "smooth"

                }
            );

        }

    }
);


/* =====================================================
   SAVE INDEX SCROLL
   ===================================================== */

indexScroller.addEventListener(
    "scroll",
    () => {

        if (
            indexMode
        ) {

            savedIndexScrollLeft =
                indexScroller.scrollLeft;

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   INDEX DRAG
   ===================================================== */

indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );


        event.preventDefault();

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        if (
            Math.abs(
                delta
            ) >
            4
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;


        savedIndexScrollLeft =
            indexScroller.scrollLeft;

    }
);


function endIndexDrag() {

    if (
        !indexDragging
    ) {

        return;

    }


    indexDragging =
        false;


    indexScroller.classList.remove(
        "dragging"
    );


    saveIndexPosition();


    if (
        indexDragMoved
    ) {

        setTimeout(
            () => {

                indexDragMoved =
                    false;

            },
            0
        );

    }

}


window.addEventListener(
    "mouseup",
    endIndexDrag
);


window.addEventListener(
    "blur",
    endIndexDrag
);


/* =====================================================
   SLIDESHOW CLICK
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #index-button, #view-all-button"
            )
        ) {

            return;

        }


        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        if (
            position < 0.25
        ) {

            await previousFrame();

        }

        else {

            await nextFrame();

        }

    }
);


/* =====================================================
   GLOBAL KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await returnFromIndex();

            }


            return;

        }


        if (
            projectAllMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await exitProjectAll();

            }


            return;

        }


        if (
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousFrame();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextFrame();

        }

    }
);


/* =====================================================
   TOUCH
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating ||
            touchStartX === null ||
            touchStartY === null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) <
            45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX < 0
        ) {

            await nextFrame();

        }

        else {

            await previousFrame();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   MOBILE STAGE
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        projectStage.style.top =
            "";


        projectStage.style.bottom =
            "";


        projectStage.style.height =
            "";


        if (
            projectAllMode
        ) {

            requestAnimationFrame(
                layoutProjectAllGrid
            );

        }


        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";


        projectStage.style.bottom =
            "";


        projectStage.style.height =
            "";


        if (
            projectAllMode
        ) {

            requestAnimationFrame(
                layoutProjectAllGrid
            );

        }


        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const gapAfterInfo =
        30;


    const bottomGap =
        68;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            160,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";


    if (
        projectAllMode
    ) {

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    layoutProjectAllGrid
                );

            }
        );

    }

}


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters =
    [

        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )

    ];


const lowercase =
    [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


const uppercase =
    [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        letters[i].textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


function mobileLogoCycle() {

    setTimeout(
        () => {

            animateLogoTo(
                5
            );


            setTimeout(
                () => {

                    animateLogoTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   FILM SWITCH
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchFrame =
    null;


function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    sectionSwitchText.textContent =
        renderWordCase(
            switchWord,
            upperCount
        );

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);

        ) {

                    requestAnimationFrame(

                    );

            );

        }

);

                updateIndexContentTop();


                updateMobileStage();


                if (

                ) {

                    layoutProjectAllGrid();

                }

            },
            250
        );

    }
);


if (

) {

    window.visualViewport
        .addEventListener(

            () => {

                updateIndexContentTop();


                updateMobileStage();

            }
        );


    window.visualViewport
        .addEventListener(

        );

}


/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        const firstImage =
            await preloadImage(
                projects[
                    0
                ].images[
                    0
                ]
            );


        projectIndex =
            0;


        frameIndex =
            0;


        renderedProjectIndex =
            0;


        renderImage(
            firstImage
        );


        projectTitle.textContent =
            projects[
                0
            ].title.toLowerCase();


        projectDate.textContent =
            (
                projects[
                    0
                ].date ||
                ""
            ).toLowerCase();


        counterCurrent.textContent =
            getCurrentText(
                0
            );


        counterStatic.textContent =
            ` / ${getTotalText(
                projects[
                    0
                ].images.length
            )}`;


        viewAllButton.textContent =
            "view all";


        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        preloadAhead();


        updateIndexContentTop();


        updateMobileStage();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexWord(
    0
);


loadProjects();
