<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Denizalp Aybak — Photography</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;

    --viewer-width: 70vw;

    /*
        Fixed desktop visual zone.

        Images can become taller / shorter inside this.
        Metadata Y never changes.
    */
    --visual-height: 66vh;

    /*
        Metadata sits at exactly this distance
        below visual zone.
    */
    --meta-top-gap: 10px;

    /*
        Dynamically measured from info block.
    */
    --index-content-top: 130px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: pointer;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 100;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT / SOCIAL
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   FILM
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 100;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT STAGE
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   PROJECT BLOCK

   Relative positioning is important:
   project-meta is absolutely anchored
   inside this block.
   ===================================================== */

#project-block {
    position: relative;

    width: 100%;
    height:
        calc(
            var(--visual-height) +
            54px
        );

    pointer-events: none;
}


/* =====================================================
   VISUAL ZONE

   Fixed Y geometry.
   ===================================================== */

#visual-zone {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: var(--visual-height);

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   SPREAD
   ===================================================== */

#spread {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    width: auto;
    max-width: var(--viewer-width);

    pointer-events: none;
}


/* =====================================================
   IMAGE CELL
   ===================================================== */

.image-cell {
    display: block;

    width: auto;
    height: auto;

    pointer-events: none;
}

.spread-image {
    display: block;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PAIR
   ===================================================== */

#spread.pair .image-cell {
    max-width:
        calc(
            (
                var(--viewer-width) -
                10px
            )
            /
            2
        );
}

#spread.pair .spread-image {
    max-width: 100%;
    max-height: var(--visual-height);
}


/* =====================================================
   SINGLE
   ===================================================== */

#spread.single {
    gap: 0;
}

#spread.single .image-cell {
    max-width: var(--viewer-width);
}

#spread.single .spread-image {
    max-width: var(--viewer-width);
    max-height: var(--visual-height);
}


/* =====================================================
   META

   CRITICAL:

   top is fixed relative to visual-zone.

   JS changes ONLY:
   - left
   - width

   Never top.
   Never transformY.

   Therefore Y is completely fixed.
   ===================================================== */

#project-meta {
    position: absolute;

    top:
        calc(
            var(--visual-height) +
            var(--meta-top-gap)
        );

    left: 50%;

    width: 0;

    transform: translateX(-50%);

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    pointer-events: none;
}


/* =====================================================
   META LEFT
   ===================================================== */

#project-title {
    grid-column: 1;
    grid-row: 1;

    text-align: left;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    text-align: left;

    white-space: nowrap;
}


/* =====================================================
   META RIGHT
   ===================================================== */

#project-current {
    grid-column: 2;
    grid-row: 1;

    padding-left: 28px;

    text-align: right;

    white-space: nowrap;
}

#project-total {
    grid-column: 2;
    grid-row: 2;

    text-align: right;

    white-space: nowrap;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 300;

    transform: translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-family: inherit;
    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

#index-button:hover,
#index-button:focus,
#index-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    background: #fff;

    cursor: default;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   DESKTOP INDEX
   ===================================================== */

#index-scroller {
    position: absolute;

    top: var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            52px +
            env(safe-area-inset-bottom)
        );

    padding:
        0
        64px
        20px;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;
}

#index-grid {
    display: grid;

    grid-template-columns:
        repeat(
            5,
            minmax(0, 1fr)
        );

    gap:
        34px
        46px;

    width: 100%;

    align-items: start;
    justify-items: center;
}


/* =====================================================
   PROJECT CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    display: flex;
    flex-direction: column;

    width:
        min(
            100%,
            210px
        );

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    font: inherit;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   THUMB
   ===================================================== */

.card-image-wrap {
    display: block;

    width: 100%;

    aspect-ratio: 3 / 4;

    overflow: hidden;

    background: #fff;
}

.project-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;
}


/* =====================================================
   CARD META
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-transform: lowercase;

    text-align: left;
}

.card-title,
.card-date {
    display: block;

    width: 100%;

    margin: 0;
    padding: 0;

    text-align: left;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode {
    cursor: default;
}

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET PORTRAIT
   ===================================================== */

@media
    (max-width: 1100px)
    and (min-width: 601px)
    and (orientation: portrait) {

    :root {

        --viewer-width: 72vw;
        --visual-height: 62vh;

    }


    #index-scroller {
        padding:
            0
            38px
            20px;
    }


    #index-grid {
        grid-template-columns:
            repeat(
                4,
                minmax(0, 1fr)
            );

        gap:
            30px
            38px;
    }


    .project-card {
        width:
            min(
                100%,
                190px
            );
    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 18px;

        --meta-gap: 5px;

        --viewer-width: 76vw;

        /*
            Stage height is calculated by JS.
            Visual zone is stage minus metadata area.
        */
        --visual-height: calc(100% - 48px);

        --meta-top-gap: 7px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-aybak {
        top: 15px;
    }


    /* =================================================
       MOBILE PROJECT
       ================================================= */

    #project-stage {
        inset: auto;

        left: 0;

        width: 100vw;
        height: auto;
    }


    #project-block {
        width: 100%;
        height: 100%;
    }


    #visual-zone {
        height:
            calc(
                100% -
                48px
            );
    }


    /*
        Metadata Y fixed in the mobile stage too.
    */

    #project-meta {
        top:
            calc(
                100% -
                48px +
                var(--meta-top-gap)
            );
    }


    /*
        Portrait mobile:
        one image.
    */

    #spread {
        display: block;

        gap: 0;

        max-width: var(--viewer-width);
    }


    #spread.pair
    .image-cell:nth-child(2) {
        display: none;
    }


    #spread.pair .image-cell,
    #spread.single .image-cell {
        max-width: var(--viewer-width);
    }


    #spread.pair .spread-image,
    #spread.single .spread-image {
        max-width: var(--viewer-width);

        max-height:
            calc(
                100% -
                2px
            );
    }


    #project-current {
        padding-left: 20px;
    }


    /* =================================================
       MOBILE INDEX
       ================================================= */

    #index-scroller {
        position: absolute;

        top: var(--index-content-top);

        left: 0;
        right: 0;

        bottom:
            calc(
                50px +
                env(safe-area-inset-bottom)
            );

        padding: 0;

        overflow-x: auto;
        overflow-y: hidden;

        display: flex;
        align-items: center;

        /*
            Disabled while automatic drift is active.
        */
        scroll-snap-type: none;

        -webkit-overflow-scrolling: touch;

        scrollbar-width: none;
    }


    #index-scroller::-webkit-scrollbar {
        display: none;
    }


    #index-grid {
        display: flex;

        flex-direction: row;
        flex-wrap: nowrap;

        align-items: flex-start;

        gap: 30px;

        width: max-content;
        height: auto;

        /*
            This is a REAL content margin.

            With scrollLeft = 0, first thumbnail
            begins exactly at --side.
        */
        padding-left: var(--side);
        padding-right: var(--side);
    }


    /*
        Manual mode:
        user controls snapping.
    */

    #index-scroller.manual {
        scroll-snap-type: x proximity;
    }


    .project-card {
        flex:
            0
            0
            48vw;

        width: 48vw;

        scroll-snap-align: start;
    }

}


/* =====================================================
   SHORT LANDSCAPE
   ===================================================== */

@media
    (orientation: landscape)
    and (max-height: 700px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 16px;

        --meta-gap: 5px;

        --viewer-width: 64vw;

        --visual-height: 54vh;

        --meta-top-gap: 7px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }


    .logo-aybak {
        top: 15px;
    }


    #project-stage {
        inset: 0;

        left: 190px;

        width:
            calc(
                100vw -
                214px
            );

        height: 100vh;
    }


    #index-scroller {
        left: 190px;

        top: var(--index-content-top);

        padding:
            0
            34px
            12px
            24px;
    }


    #index-grid {
        grid-template-columns:
            repeat(
                5,
                minmax(0, 1fr)
            );

        gap:
            16px
            30px;
    }


    .project-card {
        width:
            min(
                100%,
                145px
            );
    }

}


/* =====================================================
   PHONE LANDSCAPE INDEX
   ===================================================== */

@media
    (max-width: 900px)
    and (orientation: landscape)
    and (max-height: 500px) {

    #index-scroller {
        left: 0;
        right: 0;

        top: var(--index-content-top);

        bottom:
            calc(
                42px +
                env(safe-area-inset-bottom)
            );

        padding: 0;

        overflow-x: auto;
        overflow-y: hidden;

        display: flex;
        align-items: center;

        scroll-snap-type: none;

        scrollbar-width: none;
    }


    #index-scroller::-webkit-scrollbar {
        display: none;
    }


    #index-scroller.manual {
        scroll-snap-type: x proximity;
    }


    #index-grid {
        display: flex;

        flex-direction: row;
        flex-wrap: nowrap;

        gap: 28px;

        width: max-content;

        padding-left: var(--side);
        padding-right: var(--side);
    }


    .project-card {
        flex:
            0
            0
            25vw;

        width: 25vw;

        scroll-snap-align: start;
    }

}

</style>

<script>


/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/photos/";


const PROJECTS_JSON =
    "./projects.json";


/* =====================================================
   TIMING
   ===================================================== */

const SLIDE_DURATION =
    3000;


const COUNTER_TRANSITION_DURATION =
    190;


const PROJECT_TRANSITION_OUT_DURATION =
    170;


const PROJECT_TRANSITION_IN_DURATION =
    240;


/*
    Faster INDEX.
*/

const INDEX_TRANSITION_DURATION =
    400;


const WORD_TRANSITION_DURATION =
    600;


/* =====================================================
   MOBILE INDEX DRIFT

   32px/sec is still calm but clearly visible.
   ===================================================== */

const INDEX_DRIFT_SPEED =
    32;


/*
    Wait briefly so user sees correct initial alignment.
*/

const INDEX_DRIFT_DELAY =
    350;


/* =====================================================
   ELEMENTS
   ===================================================== */

const body =
    document.body;


const info =
    document.getElementById(
        "info"
    );


const projectStage =
    document.getElementById(
        "project-stage"
    );


const projectBlock =
    document.getElementById(
        "project-block"
    );


const visualZone =
    document.getElementById(
        "visual-zone"
    );


const spread =
    document.getElementById(
        "spread"
    );


const projectMeta =
    document.getElementById(
        "project-meta"
    );


const projectTitle =
    document.getElementById(
        "project-title"
    );


const projectCurrent =
    document.getElementById(
        "project-current"
    );


const projectDate =
    document.getElementById(
        "project-date"
    );


const projectTotal =
    document.getElementById(
        "project-total"
    );


const indexButton =
    document.getElementById(
        "index-button"
    );


const indexView =
    document.getElementById(
        "index-view"
    );


const indexScroller =
    document.getElementById(
        "index-scroller"
    );


const indexGrid =
    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];


let projectIndex =
    0;


let spreadStart =
    0;


let spreadEnd =
    0;


let renderedProjectIndex =
    null;


let manualMode =
    false;


let indexMode =
    false;


let slideTimer =
    null;


let interfaceAnimating =
    false;


let navigationAnimating =
    false;


let autoplayBeforeIndex =
    false;


/* =====================================================
   INDEX DRIFT STATE
   ===================================================== */

let indexDriftFrame =
    null;


let indexDriftTimer =
    null;


let indexDriftLastTime =
    null;


let indexDriftManual =
    false;


/*
    IMPORTANT:
    keep our own floating-point scroll position.

    This avoids mobile browsers rounding away
    tiny sub-pixel scrollLeft changes.
*/

let indexDriftPosition =
    0;


/* =====================================================
   TOUCH
   ===================================================== */

let touchStartX =
    null;


let touchStartY =
    null;


let suppressClickUntil =
    0;


/* =====================================================
   CACHE
   ===================================================== */

const imageCache =
    new Map();


const spreadCache =
    new Map();


/* =====================================================
   PHOTO URL
   ===================================================== */

function getPhotoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


/* =====================================================
   PRELOAD IMAGE
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            {

                                img,

                                portrait:
                                    img.naturalHeight >
                                    img.naturalWidth

                            }
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   HELPERS
   ===================================================== */

function currentProject() {

    return projects[
        projectIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   INDEX TOP
   ===================================================== */

function updateIndexContentTop() {

    const rect =
        info.getBoundingClientRect();


    const gap =
        window.innerWidth <= 600
            ? 30
            : 34;


    const top =
        Math.ceil(
            rect.bottom +
            gap
        );


    document
        .documentElement
        .style
        .setProperty(
            "--index-content-top",
            `${top}px`
        );

}


/* =====================================================
   PAIR MODE
   ===================================================== */

function shouldUsePairLayout() {

    if (
        window.innerWidth <= 600 &&
        window.innerHeight >
        window.innerWidth
    ) {

        return false;

    }


    return true;

}


/* =====================================================
   GET SPREAD
   ===================================================== */

async function getForwardSpread(
    targetProjectIndex,
    startIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const first =
        await preloadImage(
            project.images[
                startIndex
            ]
        );


    if (
        !shouldUsePairLayout()
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [first]

        };

    }


    /*
        Landscape:
        single.
    */

    if (
        !first.portrait
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [first]

        };

    }


    if (
        startIndex >=
        project.images.length - 1
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex,

            images:
                [first]

        };

    }


    const second =
        await preloadImage(
            project.images[
                startIndex + 1
            ]
        );


    if (
        second.portrait
    ) {

        return {

            start:
                startIndex,

            end:
                startIndex + 1,

            images:
                [
                    first,
                    second
                ]

        };

    }


    return {

        start:
            startIndex,

        end:
            startIndex,

        images:
            [first]

    };

}


/* =====================================================
   BUILD SPREADS
   ===================================================== */

async function buildProjectSpreads(
    targetProjectIndex
) {

    const mode =
        shouldUsePairLayout()
            ? "pair"
            : "single";


    const cacheKey =
        `${targetProjectIndex}:${mode}`;


    if (
        spreadCache.has(
            cacheKey
        )
    ) {

        return spreadCache.get(
            cacheKey
        );

    }


    const project =
        projects[
            targetProjectIndex
        ];


    const spreads =
        [];


    let index =
        0;


    while (
        index <
        project.images.length
    ) {

        const data =
            await getForwardSpread(
                targetProjectIndex,
                index
            );


        spreads.push(
            data
        );


        index =
            data.end + 1;

    }


    spreadCache.set(
        cacheKey,
        spreads
    );


    return spreads;

}


/* =====================================================
   COUNTER TEXT
   ===================================================== */

function getCurrentFrameText(
    start,
    end
) {

    const first =
        String(
            start + 1
        ).padStart(
            2,
            "0"
        );


    if (
        end > start
    ) {

        const second =
            String(
                end + 1
            ).padStart(
                2,
                "0"
            );


        return (
            `${first} — ${second}`
        );

    }


    return first;

}


/* =====================================================
   TOTAL
   ===================================================== */

function getTotalText(
    total
) {

    return String(
        total
    ).padStart(
        2,
        "0"
    );

}


/* =====================================================
   TEXT OUT
   ===================================================== */

function animateTextOut(
    element,
    duration
) {

    return new Promise(
        resolve => {

            const fullText =
                element.textContent;


            if (
                !fullText
            ) {

                resolve();


                return;

            }


            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const length =
                    Math.round(
                        (
                            1 -
                            progress
                        ) *
                        fullText.length
                    );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        "";


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   TEXT IN
   ===================================================== */

function animateTextIn(
    element,
    fullText,
    duration
) {

    return new Promise(
        resolve => {

            if (
                !fullText
            ) {

                element.textContent =
                    "";


                resolve();


                return;

            }


            element.textContent =
                "";


            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const length =
                    Math.round(
                        progress *
                        fullText.length
                    );


                element.textContent =
                    fullText.slice(
                        0,
                        length
                    );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        fullText;


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   MORPH TEXT
   ===================================================== */

async function morphText(
    element,
    nextText,
    outDuration,
    inDuration
) {

    if (
        element.textContent ===
        nextText
    ) {

        return;

    }


    await animateTextOut(
        element,
        outDuration
    );


    await animateTextIn(
        element,
        nextText,
        inDuration
    );

}


/* =====================================================
   RENDER IMAGES
   ===================================================== */

function renderImages(
    data
) {

    spread.innerHTML =
        "";


    spread.classList.remove(
        "single",
        "pair"
    );


    spread.classList.add(
        data.images.length > 1
            ? "pair"
            : "single"
    );


    data.images.forEach(
        imageData => {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "image-cell";


            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "spread-image";


            img.src =
                imageData.img.src;


            img.alt =
                "";


            cell.appendChild(
                img
            );


            spread.appendChild(
                cell
            );

        }
    );

}


/* =====================================================
   META X SYNC

   Metadata Y is fixed in CSS.

   We measure:
   spread left/right inside project block.

   Then only update:
   left
   width
   ===================================================== */

function syncMetadataHorizontal() {

    if (
        indexMode
    ) {

        return;

    }


    const spreadRect =
        spread.getBoundingClientRect();


    const blockRect =
        projectBlock.getBoundingClientRect();


    if (
        spreadRect.width <=
        0
    ) {

        return;

    }


    const relativeLeft =
        spreadRect.left -
        blockRect.left;


    projectMeta.style.transform =
        "none";


    projectMeta.style.left =
        `${relativeLeft}px`;


    projectMeta.style.width =
        `${spreadRect.width}px`;

}


/* =====================================================
   WAIT FOR RENDER
   ===================================================== */

function syncMetadataAfterRender() {

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                syncMetadataHorizontal
            );

        }
    );

}


/* =====================================================
   UPDATE META
   ===================================================== */

async function updateProjectMetadata(
    targetProjectIndex,
    targetStart,
    targetEnd
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    const currentText =
        getCurrentFrameText(
            targetStart,
            targetEnd
        );


    const currentAnimation =
        morphText(
            projectCurrent,
            currentText,
            COUNTER_TRANSITION_DURATION,
            COUNTER_TRANSITION_DURATION
        );


    if (
        projectChanged
    ) {

        await Promise.all(
            [

                currentAnimation,

                morphText(
                    projectTitle,
                    project.title,
                    PROJECT_TRANSITION_OUT_DURATION,
                    PROJECT_TRANSITION_IN_DURATION
                ),

                morphText(
                    projectDate,
                    project.date || "",
                    PROJECT_TRANSITION_OUT_DURATION,
                    PROJECT_TRANSITION_IN_DURATION
                ),

                morphText(
                    projectTotal,
                    getTotalText(
                        project.images.length
                    ),
                    PROJECT_TRANSITION_OUT_DURATION,
                    PROJECT_TRANSITION_IN_DURATION
                )

            ]
        );


        renderedProjectIndex =
            targetProjectIndex;

    }

    else {

        await currentAnimation;

    }

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            spreadEnd +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex + 1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[0]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW SPREAD
   ===================================================== */

async function showSpread(
    targetProjectIndex,
    targetStartIndex
) {

    if (
        navigationAnimating
    ) {

        return false;

    }


    navigationAnimating =
        true;


    const normalized =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalized
        ];


    const safeStart =
        Math.max(
            0,
            Math.min(
                targetStartIndex,
                project.images.length - 1
            )
        );


    try {

        const data =
            await getForwardSpread(
                normalized,
                safeStart
            );


        projectIndex =
            normalized;


        spreadStart =
            data.start;


        spreadEnd =
            data.end;


        renderImages(
            data
        );


        /*
            New spread may have different width.
            Update X only.
        */

        syncMetadataAfterRender();


        await updateProjectMetadata(
            normalized,
            data.start,
            data.end
        );


        preloadAhead();


        buildProjectSpreads(
            projectIndex
        ).catch(
            () => {}
        );


        navigationAnimating =
            false;


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        navigationAnimating =
            false;


        return false;

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextSpread() {

    if (
        navigationAnimating
    ) {

        return;

    }


    const project =
        currentProject();


    if (
        spreadEnd <
        project.images.length - 1
    ) {

        return showSpread(
            projectIndex,
            spreadEnd + 1
        );

    }


    return showSpread(
        projectIndex + 1,
        0
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousSpread() {

    if (
        navigationAnimating
    ) {

        return;

    }


    if (
        spreadStart <=
        0
    ) {

        const previousProjectIndex =
            normalizeProjectIndex(
                projectIndex - 1
            );


        const previousSpreads =
            await buildProjectSpreads(
                previousProjectIndex
            );


        if (
            previousSpreads.length ===
            0
        ) {

            return false;

        }


        const last =
            previousSpreads[
                previousSpreads.length - 1
            ];


        return showSpread(
            previousProjectIndex,
            last.start
        );

    }


    const spreads =
        await buildProjectSpreads(
            projectIndex
        );


    let position =
        0;


    for (
        let i = 0;
        i <
        spreads.length;
        i++
    ) {

        if (
            spreads[i].start ===
            spreadStart
        ) {

            position =
                i;


            break;

        }

    }


    if (
        position >
        0
    ) {

        return showSpread(
            projectIndex,
            spreads[
                position - 1
            ].start
        );

    }

}


/* =====================================================
   SLIDESHOW AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        manualMode ||
        indexMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextSpread();


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,
                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate || "";


                const dateB =
                    b.project.sortDate || "";


                if (
                    !dateA &&
                    !dateB
                ) {

                    return (
                        a.originalIndex -
                        b.originalIndex
                    );

                }


                if (
                    !dateA
                ) {

                    return 1;

                }


                if (
                    !dateB
                ) {

                    return -1;

                }


                if (
                    dateA >
                    dateB
                ) {

                    return -1;

                }


                if (
                    dateA <
                    dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   BUILD INDEX

function buildIndex() {

    indexGrid.innerHTML =

    getChronologicalProjects()

                    );


                img.src =
                    getPhotoUrl(
                        project.cover
                    );


                img.alt =
                    "";


                img.loading =
                    "eager";


                imageWrap.appendChild(

                );


                const copy =
                    document.createElement(

                    );


                copy.className =
                    "card-copy";


                const title =

                title.className =

}


/* =====================================================
   WORD CASE
   ===================================================== */

function renderWordCase(
    word,
    upperCount
) {

    let result =
        "";


    for (
        let i = 0;
        i <
        word.length;
        i++
    ) {

        result +=
            i <
            upperCount
                ? word[i].toUpperCase()
                : word[i];

    }


    return result;

}


/* =====================================================
   INDEX WORD
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(
    upperCount
) {

    indexWordState =
        upperCount;


    indexButton.textContent =
        renderWordCase(
            indexWord,
            upperCount
        );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return Promise.resolve();

    }


    const duration =
        INDEX_TRANSITION_DURATION *
        (
            distance /
            indexWord.length
        );


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const value =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    value
                );


                if (
                    progress <
                    1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

/* =====================================================
   STOP INDEX DRIFT
   ===================================================== */

function stopIndexDrift() {

    indexDriftManual =
        true;


    if (
        indexDriftTimer !==
        null
    ) {

        clearTimeout(
            indexDriftTimer
        );


        indexDriftTimer =
            null;

    }


    if (
        indexDriftFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexDriftFrame
        );


        indexDriftFrame =
            null;

    }


    indexDriftLastTime =
        null;


    /*
        Synchronise float position to
        browser's actual manual position.
    */

    indexDriftPosition =
        indexScroller.scrollLeft;


    indexScroller
        .classList
        .add(
            "manual"
        );

}


/* =====================================================
   DRIFT LOOP
   ===================================================== */

function runIndexDrift(
    now
) {

    if (
        !indexMode ||
        indexDriftManual ||
        window.innerWidth >
        600
    ) {

        indexDriftFrame =
            null;


        return;

    }


    if (
        indexDriftLastTime ===
        null
    ) {

        indexDriftLastTime =
            now;


        indexDriftFrame =
            requestAnimationFrame(
                runIndexDrift
            );


        return;

    }


    const dt =
        (
            now -
            indexDriftLastTime
        ) /
        1000;


    indexDriftLastTime =
        now;


    const maxScroll =
        Math.max(
            0,
            indexScroller.scrollWidth -
            indexScroller.clientWidth
        );


    if (
        maxScroll <=
        0
    ) {

        indexDriftFrame =
            requestAnimationFrame(
                runIndexDrift
            );


        return;

    }


    /*
        Floating-point accumulation.
    */

    indexDriftPosition +=
        INDEX_DRIFT_SPEED *
        dt;


    if (
        indexDriftPosition >=
        maxScroll
    ) {

        indexDriftPosition =
            maxScroll;


        indexScroller.scrollLeft =
            Math.round(
                indexDriftPosition
            );


        indexDriftFrame =
            null;


        return;

    }


    /*
        Browser receives integer position,
        but our accumulated position remains float.
    */

    indexScroller.scrollLeft =
        Math.round(
            indexDriftPosition
        );


    indexDriftFrame =
        requestAnimationFrame(
            runIndexDrift
        );

}


/* =====================================================
   START INDEX DRIFT
   ===================================================== */

function startIndexDrift() {

    if (
        window.innerWidth >
        600
    ) {

        return;

    }


    if (
        indexDriftTimer !==
        null
    ) {

        clearTimeout(
            indexDriftTimer
        );

    }


    if (
        indexDriftFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexDriftFrame
        );

    }


    indexDriftManual =
        false;


    indexDriftLastTime =
        null;


    indexDriftPosition =
        indexScroller.scrollLeft;


    indexScroller
        .classList
        .remove(
            "manual"
        );


    indexDriftTimer =
        setTimeout(
            () => {

                indexDriftTimer =
                    null;


                if (
                    indexMode &&
                    !indexDriftManual
                ) {

                    indexDriftPosition =
                        indexScroller.scrollLeft;


                    indexDriftFrame =
                        requestAnimationFrame(
                            runIndexDrift
                        );

                }

            },
            INDEX_DRIFT_DELAY
        );

}


/* =====================================================
   USER TAKES OVER INDEX
   ===================================================== */

function userTakesIndexControl() {

    if (
        indexMode &&
        window.innerWidth <=
        600
    ) {

        stopIndexDrift();

    }

}


/*
    pointerdown works on most modern mobile browsers.
*/

indexScroller.addEventListener(
    "pointerdown",
    userTakesIndexControl,
    {
        passive: true
    }
);


/*
    Explicit touchstart fallback for
    iOS / Instagram in-app browsers.
*/

indexScroller.addEventListener(
    "touchstart",
    userTakesIndexControl,
    {
        passive: true
    }
);


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    autoplayBeforeIndex =
        !manualMode;


    clearTimeout(
        slideTimer
    );


    updateIndexContentTop();


    indexMode =
        true;


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    await morphIndexTo(
        indexWord.length
    );


    if (
        window.innerWidth <=
        600
    ) {

        /*
            Exact first-card alignment.
        */

        indexScroller.scrollLeft =
            0;


        indexDriftPosition =
            0;


        startIndexDrift();

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   RETURN FROM INDEX
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    stopIndexDrift();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    updateMobileStage();


    syncMetadataAfterRender();


    if (
        autoplayBeforeIndex
    ) {

        manualMode =
            false;


        scheduleNextSlide();

    }

    else {

        manualMode =
            true;


        clearTimeout(
            slideTimer
        );

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    stopIndexDrift();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    await showSpread(
        targetProjectIndex,
        0
    );


    updateMobileStage();


    syncMetadataAfterRender();


    manualMode =
        false;


    scheduleNextSlide();


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX CLICK
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();


        if (
            interfaceAnimating
        ) {

            return;

        }


        /*
            Desktop:
            INDEX state itself does not close.
            Hover first makes it lowercase.
        */

        if (
            window.innerWidth >
            600 &&
            indexMode &&
            indexWordState !==
            0
        ) {

            return;

        }


        if (
            indexMode
        ) {

            await returnFromIndex();

        }

        else {

            await enterIndex();

        }

    }
);


/* =====================================================
   SLIDESHOW CLICK
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            indexMode ||
            interfaceAnimating ||
            navigationAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #index-button"
            )
        ) {

            return;

        }


        /*
            First click:
            stop autoplay only.
        */

        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        /*
            Left 25%.
        */

        if (
            position <
            0.25
        ) {

            await previousSpread();

        }

        /*
            Right 75%.
        */

        else {

            await nextSpread();

        }

    }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            indexMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await returnFromIndex();

            }


            return;

        }


        if (
            interfaceAnimating ||
            navigationAnimating
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousSpread();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextSpread();

        }

    }
);


/* =====================================================
   TOUCH START
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


/* =====================================================
   TOUCH END
   ===================================================== */

document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            interfaceAnimating ||
            navigationAnimating ||
            touchStartX ===
            null ||
            touchStartY ===
            null
        ) {

            return;

        }


        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) <
            45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX <
            0
        ) {

            await nextSpread();

        }

        else {

            await previousSpread();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   MOBILE STAGE
   ===================================================== */

function updateMobileStage() {

    if (
        indexMode
    ) {

        return;

    }


    const shortLandscape =
        window.matchMedia(
            "(orientation: landscape) and (max-height: 700px)"
        ).matches;


    if (
        shortLandscape
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    if (
        window.innerWidth >
        600
    ) {

        projectStage.style.top =
            "";

        projectStage.style.bottom =
            "";

        projectStage.style.height =
            "";


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const gapAfterInfo =
        30;


    const bottomGap =
        68;


    let viewportTop =
        0;


    let viewportHeight =
        window.innerHeight;


    if (
        window.visualViewport
    ) {

        viewportTop =
            window
                .visualViewport
                .offsetTop;


        viewportHeight =
            window
                .visualViewport
                .height;

    }


    const viewportBottom =
        viewportTop +
        viewportHeight;


    const stageTop =
        Math.max(
            infoRect.bottom +
            gapAfterInfo,
            viewportTop +
            10
        );


    const stageBottom =
        viewportBottom -
        bottomGap;


    projectStage.style.top =
        `${stageTop}px`;


    projectStage.style.height =
        `${Math.max(
            160,
            stageBottom -
            stageTop
        )}px`;


    projectStage.style.bottom =
        "auto";


    syncMetadataAfterRender();

}


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters =
    [

        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )

    ];


const lowercase =
    [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


const uppercase =
    [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state ===
        0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i <
        letters.length;
        i++
    ) {

        letters[i].textContent =
            i <
            state
                ? uppercase[i]
                : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


function mobileLogoCycle() {

    setTimeout(
        () => {

            animateLogoTo(
                5
            );


            setTimeout(
                () => {

                    animateLogoTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =====================================================
   FILM SWITCH
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );


const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchFrame =
    null;


function renderSwitch(
    upperCount
) {

    switchState =
        upperCount;


    sectionSwitchText.textContent =
        renderWordCase(
            switchWord,
            upperCount
        );

}


/* =====================================================
   FILM MORPH
   ===================================================== */

function morphSwitchTo(
    target
) {

    if (
        switchFrame !==
        null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    const distance =
        Math.abs(
            target -
            startState
        );


    if (
        distance ===
        0
    ) {

        return;

    }


    const duration =
        WORD_TRANSITION_DURATION *
        (
            distance /
            switchWord.length
        );


    const start =
        performance.now();


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                duration
            );


        const value =
            Math.round(
                startState +
                (
                    target -
                    startState
                ) *
                progress
            );


        renderSwitch(
            value
        );


        if (
            progress <
            1
        ) {

            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }

        else {

            renderSwitch(
                target
            );


            switchFrame =
                null;

        }

    }


    switchFrame =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   FILM HOVER
   ===================================================== */

sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   RESPONSIVE REFRESH
   ===================================================== */

async function refreshResponsiveSpread() {

    if (
        projects.length ===
        0 ||
        indexMode ||
        navigationAnimating
    ) {

        return;

    }


    spreadCache.clear();


    await showSpread(
        projectIndex,
        spreadStart
    );


    syncMetadataAfterRender();

}


/* =====================================================
   RESIZE
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        updateIndexContentTop();


        updateMobileStage();


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                async () => {

                    await refreshResponsiveSpread();


                    syncMetadataAfterRender();

                },
                150
            );

    }
);


/* =====================================================
   ORIENTATION
   ===================================================== */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            async () => {

                updateIndexContentTop();


                updateMobileStage();


                await refreshResponsiveSpread();


                syncMetadataAfterRender();

            },
            250
        );

    }
);


/* =====================================================
   VISUAL VIEWPORT
   ===================================================== */

if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            () => {

                updateIndexContentTop();


                updateMobileStage();


                syncMetadataAfterRender();

            }
        );


    window
        .visualViewport
        .addEventListener(
            "scroll",
            updateMobileStage
        );

}


/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    Array.isArray(
                        project.images
                    ) &&
                    project.images.length >
                    0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        /*
            Initial spread without
            blank -> text morph.
        */

        const firstData =
            await getForwardSpread(
                0,
                0
            );


        projectIndex =
            0;


        spreadStart =
            firstData.start;


        spreadEnd =
            firstData.end;


        renderedProjectIndex =
            0;


        renderImages(
            firstData
        );


        projectTitle.textContent =
            projects[0].title;


        projectDate.textContent =
            projects[0].date || "";


        projectCurrent.textContent =
            getCurrentFrameText(
                firstData.start,
                firstData.end
            );


        projectTotal.textContent =
            getTotalText(
                projects[0].images.length
            );


        /*
            Preload index covers.
        */

        projects.forEach(
            project => {

                preloadImage(
                    project.cover
                ).catch(
                    () => {}
                );

            }
        );


        preloadAhead();


        updateIndexContentTop();


        updateMobileStage();


        syncMetadataAfterRender();


        startAutoSlideshow();

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexWord(
    0
);


loadProjects();

</script>
