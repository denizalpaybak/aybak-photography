    }
);


/* =====================================================
   FILM
   ===================================================== */

const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


const switchWord =
    "film";


let switchState =
    0;


let switchFrame =
    null;


function renderSwitch(
    state
) {

    switchState =
        state;


    renderInteractiveTypography(
        sectionSwitchText,
        renderWordCase(
            switchWord,
            state
        ),
        new Set(
            getLetterPositions(
                switchWord
            ).slice(
                0,
                state
            )
        )
    );

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !== null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    if (
        startState === target
    ) {

        renderSwitch(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        WORD_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderSwitch(
                    state
                );


                if (
                    progress < 1
                ) {

                    switchFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderSwitch(
                        target
                    );


                    switchFrame =
                        null;


                    resolve();

                }

            }


            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            !isPhoneLayout()
        ) {

            morphSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            !isPhoneLayout()
        ) {

            morphSwitchTo(
                0
            );

        }

    }
);


/* =====================================================
   MOBILE FILM TAP

   Mobile only:
   film -> FILM -> short hold -> film site

   Desktop remains normal hover + immediate link.
   ===================================================== */

sectionSwitch.addEventListener(
    "click",
    async event => {

        if (
            !isPhoneLayout()
        ) {

            return;

        }


        event.preventDefault();


        await morphSwitchTo(
            switchWord.length
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    MOBILE_NAV_HOLD
                )
        );


        window.location.href =
            sectionSwitch.href;

    }
);


/* =====================================================
   GEOMETRY CHANGE
   ===================================================== */

function handleGeometryChange() {

    updateResponsiveMode();


    updateIndexContentTop();


    if (
        isPhoneLandscape()
    ) {

        requestAnimationFrame(
            updateLandscapeGeometry
        );

    }


    syncMetadataAfterRender();


    if (
        projectAllMode
    ) {

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    layoutProjectAllGrid
                );

            }
        );

    }

}


window.addEventListener(
    "resize",
    handleGeometryChange
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            handleGeometryChange,
            100
        );


        setTimeout(
            handleGeometryChange,
            350
        );


        setTimeout(
            handleGeometryChange,
            700
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            handleGeometryChange
        );

}


/* =====================================================
   BROWSER BACK / FORWARD
   ===================================================== */

window.addEventListener(
    "popstate",
    async () => {

        if (
            !projects.length
        ) {

            return;

        }


        const deepLink =
            getDeepLinkRequest();


        const requestedProjectIndex =
            findProjectIndexById(
                deepLink.projectId
            );


        const targetProjectIndex =
            requestedProjectIndex >= 0
                ? requestedProjectIndex
                : 0;


        const targetProject =
            projects[
                targetProjectIndex
            ];


        let targetFrameIndex =
            0;


        if (
            requestedProjectIndex >= 0 &&
            deepLink.imageNumber !==
                null
        ) {

            const resolved =
                getRuntimeFrameIndexFromOriginalNumber(
                    targetProject,
                    deepLink.imageNumber
                );


            if (
                resolved >= 0
            ) {

                targetFrameIndex =
                    resolved;

            }

        }


        if (
            targetProjectIndex ===
                projectIndex &&
            targetFrameIndex ===
                frameIndex &&
            !indexMode &&
            !projectAllMode
        ) {

            return;

        }


        clearTimeout(
            slideTimer
        );


        leaveFocusedProjectMode();


        indexMode =
            false;


        projectAllMode =
            false;


        body.classList.remove(
            "index-mode",
            "project-all-mode",
            "project-all-preparing"
        );


        indexView.classList.remove(
            "visible"
        );


        projectAllGrid.innerHTML =
            "";


        /*
            "replace" avoids creating a new history entry while
            the browser itself is restoring an existing one.
        */

        await showFrame(
            targetProjectIndex,
            targetFrameIndex,
            "replace"
        );


        manualMode =
            true;


        clearTimeout(
            slideTimer
        );

    }
);


/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data
                .filter(
                    project =>
                        project &&
                        Array.isArray(
                            project.images
                        ) &&
                        project.images.length > 0
                )
                .map(
                    prepareProject
                );


        if (
            projects.length === 0
        ) {

            return;

        }


        updateResponsiveMode();


        buildIndex();


        const deepLink =
            getDeepLinkRequest();


        const requestedProjectIndex =
            findProjectIndexById(
                deepLink.projectId
            );


        projectIndex =
            requestedProjectIndex >= 0
                ? requestedProjectIndex
                : 0;


        const requestedProject =
            currentProject();


        let requestedRuntimeFrameIndex =
            -1;


        if (
            requestedProjectIndex >= 0 &&
            deepLink.imageNumber !==
                null
        ) {

            requestedRuntimeFrameIndex =
                getRuntimeFrameIndexFromOriginalNumber(
                    requestedProject,
                    deepLink.imageNumber
                );

        }


        /*
            Project-only links keep the random opening-image
            behaviour.

            Valid project + image links open that exact original
            projects.json image.

            Invalid image numbers safely fall back to the current
            project's runtime first image.
        */

        frameIndex =
            requestedRuntimeFrameIndex >= 0
                ? requestedRuntimeFrameIndex
                : 0;


        if (
            deepLink.projectId &&
            requestedProjectIndex < 0
        ) {

            const cleanUrl =
                new URL(
                    window.location.href
                );


            cleanUrl.searchParams.delete(
                "project"
            );


            cleanUrl.searchParams.delete(
                "image"
            );


            window.history.replaceState(
                {},
                "",
                cleanUrl
            );

        }


        else if (
            requestedProjectIndex >= 0
        ) {

            /*
                Normalize project-only / invalid-image deep links
                to the exact stable original image number.
            */

            syncProjectUrl(
                "replace"
            );

        }


        const hasValidImageDeepLink =
            requestedProjectIndex >= 0 &&
            requestedRuntimeFrameIndex >= 0;


        if (
            hasValidImageDeepLink
        ) {

            /*
                An explicit project + image deep link (for example from
                the PDF portfolio) must stay on the exact requested image.

                Treat it like an INDEX / VIEW ALL project selection:
                show the complete selected project manually first, then
                return to the normal max-3 project rotation.

                Autoplay is permanently disabled for this page session.
            */

            frameIndex =
                requestedRuntimeFrameIndex;


            enterFocusedProjectMode(
                projectIndex
            );


            autoplayPermanentlyDisabled =
                true;


            manualMode =
                true;


            clearTimeout(
                slideTimer
            );

        }

        else {

            /*
                Ordinary site entry keeps the existing max-3 autoplay
                behaviour and ascending frame order within each pass.
            */

            buildNormalProjectSequence(
                projectIndex
            );


            normalSequencePosition =
                0;


            frameIndex =
                normalSequenceFrames[0];

        }


        const firstImage =
            await preloadImage(
                currentProject().images[
                    frameIndex
                ]
            );


        renderedProjectIndex =
            projectIndex;


        renderImage(
            firstImage
        );


        markFrameSeen(
            projectIndex,
            frameIndex
        );


        const title =
            currentProject()
                .title
                .toLowerCase();


        const date =
            (
                currentProject().date ||
                ""
            ).toLowerCase();


        renderBaseTypography(
            projectTitle,
            title
        );


        projectTitle.dataset.rawText =
            title;


        renderBaseTypography(
            projectDate,
            date
        );


        projectDate.dataset.rawText =
            date;


        renderBaseTypography(
            projectCounter,
            getCounterText(
                frameIndex,
                currentProject()
                    .images.length
            )
        );


        projectCounter.dataset.rawText =
            projectCounter.textContent;


        viewAllButton.textContent =
            "view all";


        viewAllButton.dataset.rawText =
            "view all";


        /*
            Do not preload every project cover at startup.

            That used to make the first page load much more
            expensive on mobile. The index now lazy-loads its
            covers, while only the next project is warmed by
            preloadAhead().
        */

        preloadAhead();


        const warmInitialIndexCovers =
            () => {

                projects
                    .slice(
                        0,
                        isPhoneLayout()
                            ? 2
                            : 3
                    )
                    .forEach(
                        project => {

                            preloadImage(
                                project.cover
                            ).catch(
                                () => {}
                            );

                        }
                    );

            };


        if (
            "requestIdleCallback" in window
        ) {

            requestIdleCallback(
                warmInitialIndexCovers,
                {
                    timeout:
                        1500
                }
            );

        }

        else {

            setTimeout(
                warmInitialIndexCovers,
                500
            );

        }


        updateIndexContentTop();


        if (
            isPhoneLandscape()
        ) {

            requestAnimationFrame(
                updateLandscapeGeometry
            );

        }


        syncMetadataAfterRender();


        if (
            hasValidImageDeepLink
        ) {

            clearTimeout(
                slideTimer
            );


            manualMode =
                true;

        }

        else {

            startAutoSlideshow();

        }


    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexWord(
    0
);


loadProjects();


/* =====================================================
   INDEX RESPONSIVE RESYNC
   ===================================================== */

let photoIndexResizeFrame =
    null;


window.addEventListener(
    "resize",
    () => {

        if (
            photoIndexResizeFrame
        ) {

            cancelAnimationFrame(
                photoIndexResizeFrame
            );

        }


        photoIndexResizeFrame =
            requestAnimationFrame(
                () => {

                    resizePhotoIndexCards();

                    photoIndexResizeFrame =
                        null;

                }
            );

    },
    {
        passive: true
    }
);


</script>
